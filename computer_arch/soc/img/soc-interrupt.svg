<svg role="img" viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Hai đường đi của ngắt: tín hiệu wire và MSI (ghi vào một địa chỉ), cùng tên interrupt controller theo kiến trúc</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="340" rx="8" fill="#ffffff"/>
  <text x="20" y="34" font-size="11.5" text-anchor="start" fill="#1d4278" font-weight="bold">Ngắt wire: thiết bị kéo một đường tín hiệu riêng</text>
  <rect x="20" y="48" width="120" height="48" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="80.0" y="76.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Thiết bị</text>
  <rect x="270" y="48" width="190" height="48" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="365.0" y="70.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Interrupt controller</text>
  <text x="365.0" y="85.0" font-size="9.5" text-anchor="middle" fill="#444">ưu tiên, mask, định tuyến</text>
  <rect x="560" y="48" width="80" height="48" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="600.0" y="76.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Core</text>
  <line x1="140" y1="72" x2="270" y2="72" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="205" y="64" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">IRQ (wire)</text>
  <line x1="460" y1="72" x2="560" y2="72" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="20" y="142" font-size="11.5" text-anchor="start" fill="#1d4278" font-weight="bold">MSI: thiết bị ghi một giá trị vào địa chỉ đặc biệt, không cần dây riêng</text>
  <rect x="20" y="156" width="120" height="48" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="80.0" y="184.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Thiết bị (PCIe)</text>
  <rect x="270" y="156" width="190" height="48" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="365.0" y="178.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Interrupt controller</text>
  <text x="365.0" y="193.0" font-size="9.5" text-anchor="middle" fill="#444">nhận ghi vào địa chỉ MSI</text>
  <rect x="560" y="156" width="80" height="48" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="600.0" y="184.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Core</text>
  <line x1="140" y1="180" x2="270" y2="180" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="205" y="172" font-size="10" text-anchor="middle" fill="#2e7d4f" font-weight="bold">ghi bộ nhớ</text>
  <line x1="460" y1="180" x2="560" y2="180" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="330" y="228" font-size="10.5" text-anchor="middle" fill="#444">MSI phù hợp PCIe và nhiều core: mỗi thiết bị có thể trỏ tới core riêng, không cần chân vật lý.</text>
  <rect x="20" y="252" width="190" height="54" rx="6" fill="#f4f7fb" stroke="#9bb4d8" stroke-width="1.2"/>
  <text x="115" y="274" font-size="11.5" text-anchor="middle" fill="#1d4278" font-weight="bold">Arm</text>
  <text x="115" y="292" font-size="10" text-anchor="middle" fill="#444">GIC (v2, v3, v4)</text>
  <rect x="240" y="252" width="190" height="54" rx="6" fill="#f4f7fb" stroke="#9bb4d8" stroke-width="1.2"/>
  <text x="335" y="274" font-size="11.5" text-anchor="middle" fill="#1d4278" font-weight="bold">RISC-V</text>
  <text x="335" y="292" font-size="10" text-anchor="middle" fill="#444">PLIC, rồi AIA (APLIC + IMSIC)</text>
  <rect x="460" y="252" width="190" height="54" rx="6" fill="#f4f7fb" stroke="#9bb4d8" stroke-width="1.2"/>
  <text x="555" y="274" font-size="11.5" text-anchor="middle" fill="#1d4278" font-weight="bold">x86</text>
  <text x="555" y="292" font-size="10" text-anchor="middle" fill="#444">APIC (IO-APIC + LAPIC)</text>
  <text x="330" y="326" font-size="10.5" text-anchor="middle" fill="#444">Tên interrupt controller theo kiến trúc.</text>
</svg>
