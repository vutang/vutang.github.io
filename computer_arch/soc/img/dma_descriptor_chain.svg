<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 860 284.89" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Scatter-gather bằng chuỗi descriptor trong bộ nhớ: mỗi descriptor chứa địa chỉ nguồn, địa chỉ đích, độ dài, cờ điều khiển và con trỏ tới descriptor kế tiếp; DMA controller lần lượt nạp từng descriptor và chép từng đoạn buffer</title>
  <rect width="860" height="260" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect x="20" y="40" width="140" height="56" rx="5" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="90.0" y="63.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Thanh ghi kênh</text>
  <text x="90.0" y="80.5" text-anchor="middle" fill="#555" font-size="11.5">con trỏ descriptor</text>
  <rect x="210" y="30" width="180" height="112" rx="5" fill="#ffffff" stroke="#4a78b5" stroke-width="1.2"/>
  <text x="300" y="48" text-anchor="middle" fill="#1f2d3d" font-size="12" font-weight="bold">Descriptor 0</text>
  <text x="222" y="68" text-anchor="start" fill="#555" font-size="10.5">src</text>
  <text x="222" y="83" text-anchor="start" fill="#555" font-size="10.5">dst</text>
  <text x="222" y="98" text-anchor="start" fill="#555" font-size="10.5">len</text>
  <text x="222" y="113" text-anchor="start" fill="#555" font-size="10.5">ctrl: ngắt khi xong</text>
  <text x="222" y="128" text-anchor="start" fill="#555" font-size="10.5">next</text>
  <rect x="230" y="180" width="140" height="40" rx="5" fill="#fffbe6" stroke="#b59a2a" stroke-width="1.2"/>
  <text x="300.0" y="204.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Đoạn buffer 0</text>
  <line x1="300" y1="142" x2="300" y2="178" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="420" y="30" width="180" height="112" rx="5" fill="#ffffff" stroke="#4a78b5" stroke-width="1.2"/>
  <text x="510" y="48" text-anchor="middle" fill="#1f2d3d" font-size="12" font-weight="bold">Descriptor 1</text>
  <text x="432" y="68" text-anchor="start" fill="#555" font-size="10.5">src</text>
  <text x="432" y="83" text-anchor="start" fill="#555" font-size="10.5">dst</text>
  <text x="432" y="98" text-anchor="start" fill="#555" font-size="10.5">len</text>
  <text x="432" y="113" text-anchor="start" fill="#555" font-size="10.5">ctrl: ngắt khi xong</text>
  <text x="432" y="128" text-anchor="start" fill="#555" font-size="10.5">next</text>
  <rect x="440" y="180" width="140" height="40" rx="5" fill="#fffbe6" stroke="#b59a2a" stroke-width="1.2"/>
  <text x="510.0" y="204.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Đoạn buffer 1</text>
  <line x1="510" y1="142" x2="510" y2="178" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="630" y="30" width="180" height="112" rx="5" fill="#ffffff" stroke="#4a78b5" stroke-width="1.2"/>
  <text x="720" y="48" text-anchor="middle" fill="#1f2d3d" font-size="12" font-weight="bold">Descriptor 2</text>
  <text x="642" y="68" text-anchor="start" fill="#555" font-size="10.5">src</text>
  <text x="642" y="83" text-anchor="start" fill="#555" font-size="10.5">dst</text>
  <text x="642" y="98" text-anchor="start" fill="#555" font-size="10.5">len</text>
  <text x="642" y="113" text-anchor="start" fill="#555" font-size="10.5">ctrl: ngắt khi xong</text>
  <text x="642" y="128" text-anchor="start" fill="#555" font-size="10.5">next = NULL (cuối)</text>
  <rect x="650" y="180" width="140" height="40" rx="5" fill="#fffbe6" stroke="#b59a2a" stroke-width="1.2"/>
  <text x="720.0" y="204.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Đoạn buffer 2</text>
  <line x1="720" y1="142" x2="720" y2="178" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="160" y1="68" x2="208" y2="68" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M330,128 H405 V60 H418" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M540,128 H615 V60 H628" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="430" y="248" text-anchor="middle" fill="#1f2d3d" font-size="11">Các đoạn buffer không cần liền nhau trong bộ nhớ vật lý; một lần khởi động kênh chép cả chuỗi</text>
<text id="wm" x="850.04" y="277.43" text-anchor="end" font-size="12.45" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
