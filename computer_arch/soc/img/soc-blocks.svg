<svg role="img" viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Sơ đồ khối một SoC điển hình: các khối chức năng nối với nhau qua interconnect</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="340" rx="8" fill="#ffffff"/>
  <rect x="10" y="26" width="640" height="250" rx="10" fill="#f4f7fb" stroke="#9bb4d8" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="24" y="20" font-size="11" text-anchor="start" fill="#1d4278" font-weight="bold">SoC (một chip)</text>
  <rect x="30" y="48" width="140" height="62" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="100.0" y="77.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">CPU cluster</text>
  <text x="100.0" y="92.0" font-size="9.5" text-anchor="middle" fill="#444">core + cache L1/L2</text>
  <line x1="100.0" y1="110" x2="100.0" y2="150" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="200" y="48" width="140" height="62" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="270.0" y="77.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Accelerator</text>
  <text x="270.0" y="92.0" font-size="9.5" text-anchor="middle" fill="#444">GPU / NPU / DSP</text>
  <line x1="270.0" y1="110" x2="270.0" y2="150" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="370" y="48" width="130" height="62" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="435.0" y="77.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Interrupt controller</text>
  <text x="435.0" y="92.0" font-size="9.5" text-anchor="middle" fill="#444">GIC / AIA / APIC</text>
  <line x1="435.0" y1="110" x2="435.0" y2="150" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="510" y="48" width="130" height="62" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="575.0" y="77.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">BootROM + RoT</text>
  <text x="575.0" y="92.0" font-size="9.5" text-anchor="middle" fill="#444">khởi động, bảo mật</text>
  <line x1="575.0" y1="110" x2="575.0" y2="150" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="30" y="150" width="610" height="34" rx="5" fill="#555" stroke="#333" stroke-width="1.2"/>
  <text x="335" y="172" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">Interconnect (bus / crossbar / NoC)</text>
  <rect x="30" y="224" width="140" height="44" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="100.0" y="244.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Memory controller</text>
  <text x="100.0" y="259.0" font-size="9.5" text-anchor="middle" fill="#444">điều khiển DRAM</text>
  <line x1="100.0" y1="184" x2="100.0" y2="224" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="200" y="224" width="140" height="44" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="270.0" y="244.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">I/O tốc độ cao</text>
  <text x="270.0" y="259.0" font-size="9.5" text-anchor="middle" fill="#444">PCIe, Ethernet, USB</text>
  <line x1="270.0" y1="184" x2="270.0" y2="224" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="370" y="224" width="130" height="44" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="435.0" y="244.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">DMA + IOMMU</text>
  <text x="435.0" y="259.0" font-size="9.5" text-anchor="middle" fill="#444">chuyển dữ liệu</text>
  <line x1="435.0" y1="184" x2="435.0" y2="224" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="510" y="224" width="130" height="44" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="575.0" y="244.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Ngoại vi chậm</text>
  <text x="575.0" y="259.0" font-size="9.5" text-anchor="middle" fill="#444">UART, SPI, I2C, GPIO</text>
  <line x1="575.0" y1="184" x2="575.0" y2="224" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="30" y="298" width="140" height="34" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="100.0" y="319.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">DRAM (ngoài chip)</text>
  <line x1="100" y1="268" x2="100" y2="298" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="190" y="320" font-size="10.5" text-anchor="start" fill="#444">Bộ nhớ chính thường nằm ngoài SoC, nối qua memory controller.</text>
</svg>
