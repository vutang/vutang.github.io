<svg role="img" viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Bus phân cấp AXI và APB, cùng 5 kênh độc lập của một kết nối AXI</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="340" rx="8" fill="#ffffff"/>
  <rect x="10" y="14" width="320" height="296" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
  <rect x="340" y="14" width="310" height="296" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
  <text x="170" y="36" font-size="12" text-anchor="middle" fill="#1d4278" font-weight="bold">Bus phân cấp</text>
  <rect x="20" y="52" width="90" height="32" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="65.0" y="72.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">CPU</text>
  <line x1="65" y1="84" x2="65" y2="108" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="120" y="52" width="90" height="32" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="165.0" y="72.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">DMA</text>
  <line x1="165" y1="84" x2="165" y2="108" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="220" y="52" width="90" height="32" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="265.0" y="72.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">GPU</text>
  <line x1="265" y1="84" x2="265" y2="108" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="20" y="108" width="290" height="30" rx="5" fill="#555" stroke="#333" stroke-width="1.2"/>
  <text x="165" y="128" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="bold">AXI interconnect (hiệu năng cao)</text>
  <line x1="65" y1="138" x2="65" y2="168" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="20" y="168" width="90" height="44" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="65.0" y="188.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Memory ctrl</text>
  <text x="65.0" y="203.0" font-size="9.5" text-anchor="middle" fill="#444">AXI</text>
  <line x1="165" y1="138" x2="165" y2="168" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="120" y="168" width="90" height="44" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="165.0" y="188.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">AXI → APB</text>
  <text x="165.0" y="203.0" font-size="9.5" text-anchor="middle" fill="#444">bridge</text>
  <line x1="265" y1="138" x2="265" y2="168" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="220" y="168" width="90" height="44" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="265.0" y="188.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">PCIe / NIC</text>
  <text x="265.0" y="203.0" font-size="9.5" text-anchor="middle" fill="#444">AXI</text>
  <line x1="165" y1="212" x2="165" y2="240" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="20" y="240" width="290" height="28" rx="4" fill="#888" stroke="#666" stroke-width="1.2"/>
  <text x="165" y="258" font-size="10.5" text-anchor="middle" fill="#ffffff" font-weight="bold">APB (đơn giản, ngoại vi chậm)</text>
  <text x="165" y="292" font-size="10" text-anchor="middle" fill="#444">UART, I2C, SPI, GPIO nằm trên APB</text>
  <text x="495" y="36" font-size="12" text-anchor="middle" fill="#1d4278" font-weight="bold">5 kênh của một kết nối AXI</text>
  <rect x="352" y="60" width="80" height="220" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="392.0" y="174.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Master</text>
  <rect x="558" y="60" width="80" height="220" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="598.0" y="174.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Slave</text>
  <line x1="436" y1="90" x2="554" y2="90" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="495" y="84" font-size="10" text-anchor="middle" fill="#111">AW: địa chỉ ghi</text>
  <line x1="436" y1="125" x2="554" y2="125" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="495" y="119" font-size="10" text-anchor="middle" fill="#111">W: dữ liệu ghi</text>
  <line x1="554" y1="160" x2="436" y2="160" stroke="#b5483a" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="495" y="154" font-size="10" text-anchor="middle" fill="#111">B: phản hồi ghi</text>
  <line x1="436" y1="210" x2="554" y2="210" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="495" y="204" font-size="10" text-anchor="middle" fill="#111">AR: địa chỉ đọc</text>
  <line x1="554" y1="250" x2="436" y2="250" stroke="#b5483a" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="495" y="244" font-size="10" text-anchor="middle" fill="#111">R: dữ liệu đọc</text>
  <line x1="440" y1="185" x2="550" y2="185" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="495" y="292" font-size="9.5" text-anchor="middle" fill="#444">Các kênh độc lập: đọc và ghi song song,</text>
  <text x="495" y="304" font-size="9.5" text-anchor="middle" fill="#444">nhiều giao dịch cùng lúc.</text>
</svg>
