<svg role="img" viewBox="0 0 660 330" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>DMA không có IOMMU thấy địa chỉ vật lý thật; có IOMMU thì địa chỉ được dịch và kiểm tra quyền</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="330" rx="8" fill="#ffffff"/>
  <rect x="10" y="14" width="310" height="300" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
  <text x="165" y="36" font-size="12" text-anchor="middle" fill="#1d4278" font-weight="bold">Không có IOMMU</text>
  <rect x="340" y="14" width="310" height="300" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
  <text x="495" y="36" font-size="12" text-anchor="middle" fill="#1d4278" font-weight="bold">Có IOMMU</text>
  <rect x="200" y="56" width="92" height="32" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="246.0" y="76.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Kernel</text>
  <rect x="200" y="96" width="92" height="32" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="246.0" y="116.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Ứng dụng</text>
  <rect x="200" y="136" width="92" height="32" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="246.0" y="156.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">DMA buffer</text>
  <rect x="24" y="80" width="90" height="44" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="69.0" y="100.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Thiết bị</text>
  <text x="69.0" y="115.0" font-size="9.5" text-anchor="middle" fill="#444">DMA</text>
  <line x1="114" y1="112" x2="200" y2="132" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="120" y="150" font-size="10" text-anchor="start" fill="#2e7d4f" font-weight="bold">đúng vùng</text>
  <line x1="114" y1="92" x2="200" y2="72" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="24" y="70" font-size="10" text-anchor="start" fill="#c0392b" font-weight="bold">ghi nhầm kernel</text>
  <text x="165" y="210" font-size="10.5" text-anchor="middle" fill="#444">Thiết bị thấy địa chỉ vật lý thật.</text>
  <text x="165" y="226" font-size="10.5" text-anchor="middle" fill="#444">Lỗi hoặc thiết bị độc hại có thể</text>
  <text x="165" y="242" font-size="10.5" text-anchor="middle" fill="#444">ghi vào bất kỳ đâu trong RAM.</text>
  <rect x="546" y="56" width="92" height="32" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="592.0" y="76.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Kernel</text>
  <rect x="546" y="96" width="92" height="32" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="592.0" y="116.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Ứng dụng</text>
  <rect x="546" y="136" width="92" height="32" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="592.0" y="156.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">DMA buffer</text>
  <rect x="348" y="80" width="72" height="44" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="384.0" y="100.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Thiết bị</text>
  <text x="384.0" y="115.0" font-size="9.5" text-anchor="middle" fill="#444">DMA</text>
  <rect x="452" y="70" width="64" height="64" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="484.0" y="100.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">IOMMU</text>
  <text x="484.0" y="115.0" font-size="9.5" text-anchor="middle" fill="#444">IOTLB</text>
  <line x1="420" y1="102" x2="452" y2="102" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="436" y="94" font-size="9.5" text-anchor="middle" fill="#444">IOVA</text>
  <line x1="516" y1="120" x2="546" y2="132" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="516" y1="86" x2="546" y2="72" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="3 2"/>
  <text x="531" y="76" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">✕</text>
  <text x="495" y="156" font-size="10" text-anchor="middle" fill="#2e7d4f" font-weight="bold">PA, đúng vùng</text>
  <text x="495" y="210" font-size="10.5" text-anchor="middle" fill="#444">Thiết bị chỉ thấy IOVA. IOMMU dịch sang</text>
  <text x="495" y="226" font-size="10.5" text-anchor="middle" fill="#444">PA và kiểm tra quyền; vùng chưa ánh xạ</text>
  <text x="495" y="242" font-size="10.5" text-anchor="middle" fill="#444">bị chặn và báo lỗi.</text>
  <text x="330" y="300" font-size="10.5" text-anchor="middle" fill="#444">IOMMU giống MMU của CPU nhưng áp dụng cho thiết bị.</text>
</svg>
