<svg role="img" viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Chuỗi boot nhiều tầng: BootROM, firmware đầu, firmware secure, bootloader, hệ điều hành</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="300" rx="8" fill="#ffffff"/>
  <rect x="10" y="70" width="120" height="56" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="70.0" y="96.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">BootROM</text>
  <text x="70.0" y="111.0" font-size="9.5" text-anchor="middle" fill="#444">cố định trong chip</text>
  <rect x="140" y="70" width="120" height="56" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="200.0" y="96.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Firmware đầu</text>
  <text x="200.0" y="111.0" font-size="9.5" text-anchor="middle" fill="#444">khởi tạo DRAM, clock</text>
  <rect x="270" y="70" width="120" height="56" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="330.0" y="96.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Firmware secure</text>
  <text x="330.0" y="111.0" font-size="9.5" text-anchor="middle" fill="#444">ATF, OpenSBI</text>
  <rect x="400" y="70" width="120" height="56" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="460.0" y="96.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Bootloader</text>
  <text x="460.0" y="111.0" font-size="9.5" text-anchor="middle" fill="#444">U-Boot, UEFI</text>
  <rect x="530" y="70" width="120" height="56" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="590.0" y="96.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Hệ điều hành</text>
  <text x="590.0" y="111.0" font-size="9.5" text-anchor="middle" fill="#444">Linux</text>
  <line x1="130" y1="98" x2="140" y2="98" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="260" y1="98" x2="270" y2="98" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="390" y1="98" x2="400" y2="98" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="520" y1="98" x2="530" y2="98" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M 10 54 V 46 H 380 V 54" fill="none" stroke="#6b4fa3" stroke-width="1.4"/>
  <text x="195" y="38" font-size="10" text-anchor="middle" fill="#6b4fa3" font-weight="bold">Secure / mức đặc quyền cao nhất (EL3, M-mode)</text>
  <path d="M 400 54 V 46 H 650 V 54" fill="none" stroke="#2f5d9e" stroke-width="1.4"/>
  <text x="525" y="38" font-size="10" text-anchor="middle" fill="#2f5d9e" font-weight="bold">Non-secure (EL2/EL1, S-mode)</text>
  <text x="70" y="148" font-size="9.5" text-anchor="middle" fill="#555">chạy trên: SRAM nội</text>
  <text x="200" y="148" font-size="9.5" text-anchor="middle" fill="#555">chạy trên: SRAM, rồi DRAM</text>
  <text x="330" y="148" font-size="9.5" text-anchor="middle" fill="#555">chạy trên: DRAM</text>
  <text x="460" y="148" font-size="9.5" text-anchor="middle" fill="#555">chạy trên: DRAM</text>
  <text x="590" y="148" font-size="9.5" text-anchor="middle" fill="#555">chạy trên: DRAM</text>
  <path d="M 70 160 V 186 H 200 V 168" fill="none" stroke="#b5483a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <path d="M 200 160 V 186 H 330 V 168" fill="none" stroke="#b5483a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <path d="M 330 160 V 186 H 460 V 168" fill="none" stroke="#b5483a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <path d="M 460 160 V 186 H 590 V 168" fill="none" stroke="#b5483a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="335" y="210" font-size="10.5" text-anchor="middle" fill="#b5483a" font-weight="bold">Chain of trust: mỗi tầng kiểm tra chữ ký của tầng kế tiếp trước khi chuyển quyền (secure boot).</text>
  <text x="335" y="252" font-size="10.5" text-anchor="middle" fill="#444">Tên cụ thể từng tầng khác nhau theo SoC và kiến trúc.</text>
  <text x="335" y="270" font-size="10.5" text-anchor="middle" fill="#444">Ví dụ cụ thể: xem trang U-Boot trên Zynq.</text>
</svg>
