<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 860 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Cấu trúc bên trong một DMA controller: giao diện slave cho CPU cấu hình thanh ghi, các kênh có thanh ghi và trạng thái riêng, bộ phân xử chọn kênh, khối nạp descriptor, FIFO dữ liệu, giao diện AXI master tới bộ nhớ, đường request từ ngoại vi và đầu ra ngắt</title>
  <rect width="860" height="360" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect x="150" y="20" width="560" height="300" rx="5" fill="#f3f8f3" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="430" y="42" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="bold">DMA controller</text>
  <rect x="170" y="60" width="160" height="50" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="250.0" y="80.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Giao diện slave</text>
  <text x="250.0" y="97.5" text-anchor="middle" fill="#555" font-size="11.5">APB / AXI-Lite</text>
  <rect x="170" y="130" width="160" height="120" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="250" y="150" text-anchor="middle" fill="#1f2d3d" font-size="12" font-weight="bold">Kênh 0..N-1</text>
  <text x="250" y="172" text-anchor="middle" fill="#555" font-size="10.5">src, dst, len</text>
  <text x="250" y="190" text-anchor="middle" fill="#555" font-size="10.5">ctrl: width, burst</text>
  <text x="250" y="208" text-anchor="middle" fill="#555" font-size="10.5">con trỏ descriptor</text>
  <text x="250" y="226" text-anchor="middle" fill="#555" font-size="10.5">trạng thái</text>
  <rect x="360" y="130" width="130" height="50" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="425.0" y="150.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Arbiter</text>
  <text x="425.0" y="167.5" text-anchor="middle" fill="#555" font-size="11.5">chọn kênh</text>
  <rect x="360" y="200" width="130" height="50" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="425.0" y="220.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Nạp descriptor</text>
  <text x="425.0" y="237.5" text-anchor="middle" fill="#555" font-size="11.5">linked list</text>
  <rect x="520" y="130" width="170" height="50" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="605.0" y="150.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">FIFO dữ liệu</text>
  <text x="605.0" y="167.5" text-anchor="middle" fill="#555" font-size="11.5">đệm giữa đọc và ghi</text>
  <rect x="520" y="200" width="170" height="50" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="605.0" y="220.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">AXI master</text>
  <text x="605.0" y="237.5" text-anchor="middle" fill="#555" font-size="11.5">burst, outstanding</text>
  <rect x="360" y="265" width="130" height="40" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="425.0" y="289.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Logic ngắt</text>
  <rect x="170" y="265" width="160" height="40" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="250.0" y="289.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Request / handshake</text>
  <rect x="10" y="60" width="110" height="50" rx="5" fill="#eef4fb" stroke="#4a78b5" stroke-width="1.2"/>
  <text x="65.0" y="80.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">CPU</text>
  <text x="65.0" y="97.5" text-anchor="middle" fill="#555" font-size="11.5">cấu hình</text>
  <rect x="10" y="260" width="110" height="50" rx="5" fill="#fbf1e8" stroke="#c0712b" stroke-width="1.2"/>
  <text x="65.0" y="280.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Ngoại vi</text>
  <text x="65.0" y="297.5" text-anchor="middle" fill="#555" font-size="11.5">DMA request</text>
  <rect x="750" y="200" width="100" height="50" rx="5" fill="#f7f7f7" stroke="#555" stroke-width="1.2"/>
  <text x="800.0" y="220.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Interconnect</text>
  <text x="800.0" y="237.5" text-anchor="middle" fill="#555" font-size="11.5">tới DRAM</text>
  <rect x="750" y="262" width="100" height="46" rx="5" fill="#f7f7f7" stroke="#555" stroke-width="1.2"/>
  <text x="800.0" y="280.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Interrupt</text>
  <text x="800.0" y="297.5" text-anchor="middle" fill="#555" font-size="11.5">controller</text>
  <line x1="120" y1="85" x2="168" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="250" y1="110" x2="250" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="330" y1="155" x2="358" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="155" x2="518" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="605" y1="180" x2="605" y2="198" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="425" y1="200" x2="425" y2="182" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="225" x2="518" y2="225" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="690" y1="225" x2="748" y2="225" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="120" y1="285" x2="168" y2="285" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M250,265 V252" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="285" x2="748" y2="285" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="430" y="345" text-anchor="middle" fill="#1f2d3d" font-size="11">Tên khối và số kênh thay đổi theo từng IP; hình mô tả các thành phần thường gặp</text>
</svg>
