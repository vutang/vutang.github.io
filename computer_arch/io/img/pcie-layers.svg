<svg role="img" viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Ba lớp của PCIe và cách đóng gói một TLP</title>
  <rect x="0" y="0" width="960" height="400" rx="8" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">Ba lớp PCIe và đóng gói TLP</text>
  <text x="20" y="60" font-size="12" font-weight="700" fill="#555">Lớp</text>
  <text x="330" y="60" font-size="12" font-weight="700" fill="#555">Dữ liệu ở mỗi lớp</text>
  <rect x="20" y="76" width="280" height="64" rx="6" fill="#e8f0fb" stroke="#1d4278" stroke-width="1.2"/>
  <text x="160" y="103" font-size="13" text-anchor="middle" font-weight="700" fill="#111">Transaction Layer</text>
  <text x="160" y="123" font-size="10.5" text-anchor="middle" fill="#444">TLP, flow control, ordering</text>
  <rect x="20" y="156" width="280" height="64" rx="6" fill="#fdf1e3" stroke="#1d4278" stroke-width="1.2"/>
  <text x="160" y="183" font-size="13" text-anchor="middle" font-weight="700" fill="#111">Data Link Layer</text>
  <text x="160" y="203" font-size="10.5" text-anchor="middle" fill="#444">Sequence number, LCRC, ACK/NAK</text>
  <rect x="20" y="236" width="280" height="64" rx="6" fill="#eef7ee" stroke="#1d4278" stroke-width="1.2"/>
  <text x="160" y="263" font-size="13" text-anchor="middle" font-weight="700" fill="#111">Physical Layer</text>
  <text x="160" y="283" font-size="10.5" text-anchor="middle" fill="#444">Framing, mã khối, LTSSM, SerDes</text>
  <!-- TL row -->
  <rect x="330" y="92" width="110" height="32" fill="#e8f0fb" stroke="#1d4278"/>
  <text x="385" y="113" font-size="11" text-anchor="middle" fill="#111">Header</text>
  <rect x="440" y="92" width="260" height="32" fill="#e8f0fb" stroke="#1d4278"/>
  <text x="570" y="113" font-size="11" text-anchor="middle" fill="#111">Data payload (0 đến 4096 byte)</text>
  <rect x="700" y="92" width="90" height="32" fill="#f4f6f9" stroke="#1d4278" stroke-dasharray="4 3"/>
  <text x="745" y="113" font-size="11" text-anchor="middle" fill="#111">ECRC (tùy chọn)</text>
  <!-- DLL row -->
  <rect x="330" y="172" width="60" height="32" fill="#fdf1e3" stroke="#1d4278"/>
  <text x="360" y="193" font-size="11" text-anchor="middle" fill="#111">Seq</text>
  <rect x="390" y="172" width="400" height="32" fill="#e8f0fb" stroke="#1d4278"/>
  <text x="590" y="193" font-size="11" text-anchor="middle" fill="#111">TLP của lớp trên</text>
  <rect x="790" y="172" width="70" height="32" fill="#fdf1e3" stroke="#1d4278"/>
  <text x="825" y="193" font-size="11" text-anchor="middle" fill="#111">LCRC</text>
  <!-- PHY row -->
  <rect x="330" y="252" width="60" height="32" fill="#eef7ee" stroke="#1d4278"/>
  <text x="360" y="273" font-size="11" text-anchor="middle" fill="#111">Start</text>
  <rect x="390" y="252" width="470" height="32" fill="#fdf1e3" stroke="#1d4278"/>
  <text x="625" y="273" font-size="11" text-anchor="middle" fill="#111">Seq + TLP + LCRC của lớp trên</text>
  <rect x="860" y="252" width="60" height="32" fill="#eef7ee" stroke="#1d4278"/>
  <text x="890" y="273" font-size="11" text-anchor="middle" fill="#111">End</text>
  <line x1="570" y1="124" x2="570" y2="170" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="590" y1="204" x2="590" y2="250" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="20" y="340" font-size="11.5" fill="#555">Bên thu gỡ từng lớp theo chiều ngược lại. DLLP (ACK/NAK, flow control update) chỉ tồn tại ở Data Link Layer,</text>
  <text x="20" y="358" font-size="11.5" fill="#555">không đi qua Transaction Layer. Ở chế độ FLIT (PCIe 6.0 trở lên) khuôn dạng này thay bằng flit 256 byte.</text>
</svg>
