  <line x1="454" y1="103.0" x2="477" y2="103.0" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="632" y="76" width="128" height="54" rx="6" fill="#eef7ee" stroke="#1d4278" stroke-width="1.2"/>
  <text x="696.0" y="107.0" font-size="12" text-anchor="middle" font-weight="700" fill="#111">Serializer</text>
  <line x1="607" y1="103.0" x2="630" y2="103.0" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="785" y="76" width="128" height="54" rx="6" fill="#e8f0fb" stroke="#1d4278" stroke-width="1.2"/>
