  <text x="237.0" y="246.0" font-size="12" text-anchor="middle" font-weight="700" fill="#111">CDR</text>
  <text x="237.0" y="262.0" font-size="10" text-anchor="middle" font-weight="400" fill="#444">khôi phục clock</text>
  <line x1="148" y1="249.0" x2="171" y2="249.0" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="326" y="222" width="128" height="54" rx="6" fill="#eef7ee" stroke="#1d4278" stroke-width="1.2"/>
  <text x="390.0" y="253.0" font-size="12" text-anchor="middle" font-weight="700" fill="#111">Deserializer</text>
  <line x1="301" y1="249.0" x2="324" y2="249.0" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="479" y="222" width="128" height="54" rx="6" fill="#e8f0fb" stroke="#1d4278" stroke-width="1.2"/>
  <text x="543.0" y="246.0" font-size="12" text-anchor="middle" font-weight="700" fill="#111">Đồng bộ khối</text>
  <text x="543.0" y="262.0" font-size="10" text-anchor="middle" font-weight="400" fill="#444">descrambler</text>
  <line x1="454" y1="249.0" x2="477" y2="249.0" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="632" y="222" width="128" height="54" rx="6" fill="#e8f0fb" stroke="#1d4278" stroke-width="1.2"/>
  <text x="696.0" y="253.0" font-size="12" text-anchor="middle" font-weight="700" fill="#111">Giải mã khối</text>
  <line x1="607" y1="249.0" x2="630" y2="249.0" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="785" y="222" width="128" height="54" rx="6" fill="#fdf1e3" stroke="#1d4278" stroke-width="1.2"/>
  <text x="849.0" y="253.0" font-size="12" text-anchor="middle" font-weight="700" fill="#111">FEC, dữ liệu</text>
  <line x1="760" y1="249.0" x2="783" y2="249.0" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="480" y="312" font-size="11.5" text-anchor="middle" font-weight="400" fill="#333">Các khối màu xanh là phần liên quan tới line coding; CDR cần đủ cạnh chuyển mức trong tín hiệu để khóa pha.</text>
<text id="wm" x="948.88" y="349.45" text-anchor="end" font-size="13.89" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
