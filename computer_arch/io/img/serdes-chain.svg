<svg role="img" viewBox="0 0 960 357.79" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Vị trí của line coding trong một đường SerDes</title>
  <rect x="0" y="0" width="960" height="330" rx="8" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#1d4278">Vị trí của line coding trong một đường SerDes</text>
  <text x="20" y="62" font-size="12" text-anchor="start" font-weight="700" fill="#555">Bên phát (TX)</text>
  <rect x="20" y="76" width="128" height="54" rx="6" fill="#f4f6f9" stroke="#1d4278" stroke-width="1.2"/>
  <text x="84.0" y="100.0" font-size="12" text-anchor="middle" font-weight="700" fill="#111">Dữ liệu</text>
  <text x="84.0" y="116.0" font-size="10" text-anchor="middle" font-weight="400" fill="#444">song song</text>
  <rect x="173" y="76" width="128" height="54" rx="6" fill="#fdf1e3" stroke="#1d4278" stroke-width="1.2"/>
  <text x="237.0" y="100.0" font-size="12" text-anchor="middle" font-weight="700" fill="#111">FEC</text>
