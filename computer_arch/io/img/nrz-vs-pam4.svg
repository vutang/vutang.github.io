  <text x="480" y="400" font-size="12" text-anchor="middle" font-weight="400" fill="#333">Cùng biên độ đỉnh, PAM4 có khoảng cách giữa hai mức kề nhau bằng 1/3 so với NRZ, tức kém khoảng 9,5 dB về SNR.</text>
