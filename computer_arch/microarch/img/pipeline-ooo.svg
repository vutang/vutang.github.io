<svg role="img" viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Luồng out-of-order: nạp và commit theo thứ tự, thực thi theo mức sẵn sàng của toán hạng</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="340" rx="8" fill="#ffffff"/>
  <rect x="10" y="28" width="640" height="104" rx="8" fill="#f4f7fb" stroke="#9bb4d8" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="640" y="46" font-size="11" text-anchor="end" fill="#1d4278" font-weight="bold">Front-end: theo thứ tự chương trình</text>
  <rect x="24" y="62" width="120" height="58" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="84.0" y="89.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Fetch + Decode</text>
  <text x="84.0" y="104.0" font-size="9.5" text-anchor="middle" fill="#444">đoán nhánh</text>
  <rect x="194" y="62" width="120" height="58" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="254.0" y="89.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Rename</text>
  <text x="254.0" y="104.0" font-size="9.5" text-anchor="middle" fill="#444">xóa WAR/WAW</text>
  <rect x="364" y="62" width="120" height="58" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="424.0" y="89.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Issue Queue</text>
  <text x="424.0" y="104.0" font-size="9.5" text-anchor="middle" fill="#444">chờ toán hạng</text>
  <line x1="144" y1="91" x2="194" y2="91" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="314" y1="91" x2="364" y2="91" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="10" y="160" width="640" height="80" rx="8" fill="#fffaf0" stroke="#e0b86a" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="20" y="178" font-size="11" text-anchor="start" fill="#8a5a00" font-weight="bold">Thực thi: không theo thứ tự</text>
  <rect x="240" y="190" width="90" height="40" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="285.0" y="214.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">ALU</text>
  <rect x="340" y="190" width="90" height="40" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="385.0" y="214.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">ALU</text>
  <rect x="440" y="190" width="90" height="40" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="485.0" y="214.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Load/Store</text>
  <rect x="540" y="190" width="90" height="40" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="585.0" y="214.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">FPU / Vector</text>
  <line x1="424" y1="120" x2="424" y2="146" stroke="#444" stroke-width="1.2"/>
  <line x1="285" y1="146" x2="585" y2="146" stroke="#444" stroke-width="1.2"/>
  <line x1="285" y1="146" x2="285" y2="190" stroke="#444" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="385" y1="146" x2="385" y2="190" stroke="#444" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="485" y1="146" x2="485" y2="190" stroke="#444" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="585" y1="146" x2="585" y2="190" stroke="#444" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="10" y="262" width="640" height="62" rx="8" fill="#f4f7fb" stroke="#9bb4d8" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="640" y="278" font-size="11" text-anchor="end" fill="#1d4278" font-weight="bold">Back-end: commit theo thứ tự chương trình</text>
  <rect x="24" y="288" width="200" height="28" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="124.0" y="306.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Reorder Buffer (ROB)</text>
  <rect x="290" y="288" width="160" height="28" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="370.0" y="306.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Commit / Retire</text>
  <line x1="224" y1="302" x2="290" y2="302" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="285" y1="230" x2="285" y2="248" stroke="#6b4fa3" stroke-width="1.2"/>
  <line x1="385" y1="230" x2="385" y2="248" stroke="#6b4fa3" stroke-width="1.2"/>
  <line x1="485" y1="230" x2="485" y2="248" stroke="#6b4fa3" stroke-width="1.2"/>
  <line x1="585" y1="230" x2="585" y2="248" stroke="#6b4fa3" stroke-width="1.2"/>
  <path d="M 585 248 H 124 V 288" fill="none" stroke="#6b4fa3" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="350" y="244" font-size="9.5" text-anchor="middle" fill="#6b4fa3">kết quả ghi vào ROB (chưa commit)</text>
</svg>
