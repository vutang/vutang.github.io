<svg role="img" viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Dịch địa chỉ ảo sang vật lý với page table 3 cấp (kiểu RISC-V Sv39) và đường tắt qua TLB</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="340" rx="8" fill="#ffffff"/>
  <text x="40" y="22" font-size="10.5" text-anchor="start" fill="#444" font-weight="bold">Địa chỉ ảo (VA)</text>
  <rect x="40" y="30" width="100" height="36" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="90.0" y="52.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">VPN[2] (9 bit)</text>
  <rect x="140" y="30" width="100" height="36" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="190.0" y="52.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">VPN[1] (9 bit)</text>
  <rect x="240" y="30" width="100" height="36" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="290.0" y="52.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">VPN[0] (9 bit)</text>
  <rect x="340" y="30" width="140" height="36" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="410.0" y="52.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Offset (12 bit)</text>
  <rect x="70" y="120" width="100" height="60" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="120.0" y="148.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Bảng cấp 2</text>
  <text x="120.0" y="163.0" font-size="9.5" text-anchor="middle" fill="#444">512 entry</text>
  <rect x="200" y="120" width="100" height="60" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="250.0" y="148.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Bảng cấp 1</text>
  <text x="250.0" y="163.0" font-size="9.5" text-anchor="middle" fill="#444">512 entry</text>
  <rect x="330" y="120" width="100" height="60" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="380.0" y="148.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Bảng cấp 0</text>
  <text x="380.0" y="163.0" font-size="9.5" text-anchor="middle" fill="#444">512 entry</text>
  <text x="30" y="156" font-size="11" text-anchor="end" fill="#6b4fa3" font-weight="bold">satp</text>
  <line x1="34" y1="152" x2="70" y2="152" stroke="#6b4fa3" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="90" y1="66" x2="120" y2="120" stroke="#444" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="190" y1="66" x2="250" y2="120" stroke="#444" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="290" y1="66" x2="380" y2="120" stroke="#444" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="150" y="112" font-size="9.5" text-anchor="middle" fill="#666">index</text>
  <line x1="170" y1="150" x2="200" y2="150" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="300" y1="150" x2="330" y2="150" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="185" y="140" font-size="9" text-anchor="middle" fill="#666">PPN</text>
  <text x="315" y="140" font-size="9" text-anchor="middle" fill="#666">PPN</text>
  <text x="200" y="200" font-size="10.5" text-anchor="middle" fill="#8a5a00" font-weight="bold">Page walk: 3 lần đọc bộ nhớ</text>
  <path d="M 380 180 V 225 H 240 V 270" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M 470 66 V 270" fill="none" stroke="#6b4fa3" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="476" y="240" font-size="9.5" text-anchor="start" fill="#6b4fa3">offset giữ nguyên</text>
  <text x="40" y="262" font-size="10.5" text-anchor="start" fill="#444" font-weight="bold">Địa chỉ vật lý (PA)</text>
  <rect x="140" y="270" width="200" height="36" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="240.0" y="292.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">PPN (từ page table)</text>
  <rect x="340" y="270" width="140" height="36" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="410.0" y="292.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Offset (12 bit)</text>
  <rect x="530" y="110" width="110" height="56" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="585.0" y="136.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">TLB</text>
  <text x="585.0" y="151.0" font-size="9.5" text-anchor="middle" fill="#444">cache của page table</text>
  <path d="M 480 48 H 585 V 110" fill="none" stroke="#b5483a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="578" y="84" font-size="10" text-anchor="end" fill="#b5483a" font-weight="bold">tra TLB trước</text>
  <path d="M 585 166 V 250 H 240" fill="none" stroke="#b5483a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="578" y="200" font-size="10" text-anchor="end" fill="#b5483a">TLB hit: có PPN</text>
  <text x="578" y="214" font-size="10" text-anchor="end" fill="#b5483a">ngay, bỏ page walk</text>
</svg>
