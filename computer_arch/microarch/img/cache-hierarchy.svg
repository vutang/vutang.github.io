<svg role="img" viewBox="0 0 660 346" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Phân cấp bộ nhớ: càng gần CPU càng nhanh, nhỏ và đắt; càng xa càng chậm, lớn và rẻ</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="346" rx="8" fill="#ffffff"/>
  <text x="450" y="26" font-size="10.5" text-anchor="start" fill="#444" font-weight="bold">Dung lượng</text>
  <text x="570" y="26" font-size="10.5" text-anchor="start" fill="#444" font-weight="bold">Độ trễ</text>
  <rect x="210.0" y="40" width="100" height="40" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="260.0" y="64.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Register</text>
  <text x="450" y="65" font-size="10.5" text-anchor="start" fill="#111">~1 KB</text>
  <text x="570" y="65" font-size="10.5" text-anchor="start" fill="#111">&lt; 1 ns</text>
  <rect x="180.0" y="90" width="160" height="40" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="260.0" y="114.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">L1 cache</text>
  <text x="450" y="115" font-size="10.5" text-anchor="start" fill="#111">32-64 KB</text>
  <text x="570" y="115" font-size="10.5" text-anchor="start" fill="#111">~1 ns</text>
  <rect x="150.0" y="140" width="220" height="40" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="260.0" y="164.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">L2 cache</text>
  <text x="450" y="165" font-size="10.5" text-anchor="start" fill="#111">256 KB - 2 MB</text>
  <text x="570" y="165" font-size="10.5" text-anchor="start" fill="#111">~4 ns</text>
  <rect x="120.0" y="190" width="280" height="40" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="260.0" y="214.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">L3 cache</text>
  <text x="450" y="215" font-size="10.5" text-anchor="start" fill="#111">vài MB - vài chục MB</text>
  <text x="570" y="215" font-size="10.5" text-anchor="start" fill="#111">~10-20 ns</text>
  <rect x="90.0" y="240" width="340" height="40" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="260.0" y="264.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">DRAM</text>
  <text x="450" y="265" font-size="10.5" text-anchor="start" fill="#111">GB</text>
  <text x="570" y="265" font-size="10.5" text-anchor="start" fill="#111">~60-100 ns</text>
  <path d="M 20 60 V 292" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="30" y="62" font-size="10" text-anchor="start" fill="#444">nhanh, nhỏ, đắt</text>
  <text x="30" y="304" font-size="10" text-anchor="start" fill="#444">chậm, lớn, rẻ</text>
  <text x="330" y="334" font-size="10.5" text-anchor="middle" fill="#444">Cache giữ bản sao của dữ liệu hay dùng để CPU hiếm khi phải chờ DRAM.</text>
</svg>
