<svg role="img" viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Where the RAID logic runs: on a controller for hardware RAID, in an OS driver for firmware RAID, in the kernel for software RAID</title>
  <rect x="0" y="0" width="720" height="340" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect x="10" y="12" width="224" height="316" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
  <text x="122.0" y="34" font-size="12" text-anchor="middle" fill="#1d4278" font-weight="bold">Hardware RAID</text>
  <text x="122.0" y="50" font-size="10" text-anchor="middle" fill="#444">dedicated controller</text>
  <rect x="30" y="56" width="184" height="28" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
  <text x="122.0" y="74.0" font-size="10" text-anchor="middle" fill="#222">Apps / filesystem</text>
  <line x1="122" y1="86" x2="122" y2="100" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="30" y="102" width="184" height="42" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
  <text x="122.0" y="120.0" font-size="10" text-anchor="middle" fill="#222">Block layer</text>
  <text x="122.0" y="134.0" font-size="10" text-anchor="middle" fill="#444">sees 1 logical disk</text>
  <line x1="122" y1="146" x2="122" y2="160" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="30" y="162" width="184" height="64" rx="5" fill="#fbe3e1" stroke="#c0392b" stroke-width="1.8"/>
  <text x="122.0" y="184.0" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="bold">RAID controller</text>
  <text x="122.0" y="198.0" font-size="10" text-anchor="middle" fill="#444">own CPU + RAM</text>
  <text x="122.0" y="212.0" font-size="10" text-anchor="middle" fill="#444">cache + BBU</text>
  <line x1="122" y1="228" x2="122" y2="242" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="44" y="244" width="48" height="30" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="68" y="263" font-size="10" text-anchor="middle" fill="#444">Disk 1</text>
  <rect x="102" y="244" width="48" height="30" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="126" y="263" font-size="10" text-anchor="middle" fill="#444">Disk 2</text>
  <rect x="160" y="244" width="48" height="30" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="184" y="263" font-size="10" text-anchor="middle" fill="#444">Disk 3</text>
  <text x="122" y="294" font-size="10" text-anchor="middle" fill="#444">physical disks hidden from OS</text>
  <text x="122" y="312" font-size="10" text-anchor="middle" fill="#1d4278" font-weight="bold">RAID work: controller CPU</text>
  <rect x="248" y="12" width="224" height="316" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
  <text x="360.0" y="34" font-size="12" text-anchor="middle" fill="#1d4278" font-weight="bold">Firmware RAID</text>
  <text x="360.0" y="50" font-size="10" text-anchor="middle" fill="#444">BIOS setup, OS driver</text>
  <rect x="268" y="56" width="184" height="28" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
  <text x="360.0" y="74.0" font-size="10" text-anchor="middle" fill="#222">Apps / filesystem</text>
  <line x1="360" y1="86" x2="360" y2="100" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="268" y="102" width="184" height="48" rx="5" fill="#fbe3e1" stroke="#c0392b" stroke-width="1.8"/>
  <text x="360.0" y="123.0" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="bold">OS RAID driver</text>
  <text x="360.0" y="137.0" font-size="10" text-anchor="middle" fill="#444">md / IMSM on host CPU</text>
  <line x1="360" y1="152" x2="360" y2="166" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="268" y="168" width="184" height="42" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
  <text x="360.0" y="186.0" font-size="10" text-anchor="middle" fill="#222">Chipset SATA / NVMe ports</text>
  <text x="360.0" y="200.0" font-size="10" text-anchor="middle" fill="#444">RAID set in BIOS</text>
  <line x1="360" y1="212" x2="360" y2="226" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="282" y="228" width="48" height="30" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="306" y="247" font-size="10" text-anchor="middle" fill="#444">Disk 1</text>
  <rect x="340" y="228" width="48" height="30" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="364" y="247" font-size="10" text-anchor="middle" fill="#444">Disk 2</text>
  <rect x="398" y="228" width="48" height="30" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="422" y="247" font-size="10" text-anchor="middle" fill="#444">Disk 3</text>
  <text x="360" y="278" font-size="10" text-anchor="middle" fill="#444">metadata in vendor format</text>
  <text x="360" y="312" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">RAID work: host CPU</text>
  <rect x="486" y="12" width="224" height="316" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
  <text x="598.0" y="34" font-size="12" text-anchor="middle" fill="#1d4278" font-weight="bold">Software RAID</text>
  <text x="598.0" y="50" font-size="10" text-anchor="middle" fill="#444">handled by the kernel</text>
  <rect x="506" y="56" width="184" height="28" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
  <text x="598.0" y="74.0" font-size="10" text-anchor="middle" fill="#222">Apps / filesystem</text>
  <line x1="598" y1="86" x2="598" y2="100" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="506" y="102" width="184" height="48" rx="5" fill="#fbe3e1" stroke="#c0392b" stroke-width="1.8"/>
  <text x="598.0" y="123.0" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="bold">md / dm-raid</text>
  <text x="598.0" y="137.0" font-size="10" text-anchor="middle" fill="#444">kernel, on host CPU</text>
  <line x1="598" y1="152" x2="598" y2="166" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="506" y="168" width="184" height="42" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
  <text x="598.0" y="186.0" font-size="10" text-anchor="middle" fill="#222">HBA / SATA / NVMe</text>
  <text x="598.0" y="200.0" font-size="10" text-anchor="middle" fill="#444">plain disk access</text>
  <line x1="598" y1="212" x2="598" y2="226" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="520" y="228" width="48" height="30" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="544" y="247" font-size="10" text-anchor="middle" fill="#444">Disk 1</text>
  <rect x="578" y="228" width="48" height="30" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="602" y="247" font-size="10" text-anchor="middle" fill="#444">Disk 2</text>
  <rect x="636" y="228" width="48" height="30" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="660" y="247" font-size="10" text-anchor="middle" fill="#444">Disk 3</text>
  <text x="598" y="278" font-size="10" text-anchor="middle" fill="#444">any machine can read the array</text>
  <text x="598" y="312" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">RAID work: host CPU</text>
</svg>
