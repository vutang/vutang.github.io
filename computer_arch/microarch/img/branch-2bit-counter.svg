<svg role="img" viewBox="0 0 660 240" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Bộ đếm bão hòa 2 bit: 4 trạng thái, cần đoán sai 2 lần liên tiếp mới đổi dự đoán</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="240" rx="8" fill="#ffffff"/>
  <rect x="30" y="80" width="110" height="64" rx="8" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.6"/>
  <text x="85.0" y="102" font-size="14" text-anchor="middle" fill="#b5483a" font-weight="bold">00</text>
  <text x="85.0" y="120" font-size="10.5" text-anchor="middle" fill="#111">Strongly</text>
  <text x="85.0" y="134" font-size="10.5" text-anchor="middle" fill="#111">Not-taken</text>
  <text x="85.0" y="70" font-size="10.5" text-anchor="middle" fill="#b5483a" font-weight="bold">đoán: Not-taken</text>
  <rect x="192" y="80" width="110" height="64" rx="8" fill="#fbeccb" stroke="#b07d12" stroke-width="1.6"/>
  <text x="247.0" y="102" font-size="14" text-anchor="middle" fill="#b07d12" font-weight="bold">01</text>
  <text x="247.0" y="120" font-size="10.5" text-anchor="middle" fill="#111">Weakly</text>
  <text x="247.0" y="134" font-size="10.5" text-anchor="middle" fill="#111">Not-taken</text>
  <text x="247.0" y="70" font-size="10.5" text-anchor="middle" fill="#b07d12" font-weight="bold">đoán: Not-taken</text>
  <rect x="354" y="80" width="110" height="64" rx="8" fill="#fbeccb" stroke="#b07d12" stroke-width="1.6"/>
  <text x="409.0" y="102" font-size="14" text-anchor="middle" fill="#b07d12" font-weight="bold">10</text>
  <text x="409.0" y="120" font-size="10.5" text-anchor="middle" fill="#111">Weakly</text>
  <text x="409.0" y="134" font-size="10.5" text-anchor="middle" fill="#111">Taken</text>
  <text x="409.0" y="70" font-size="10.5" text-anchor="middle" fill="#b07d12" font-weight="bold">đoán: Taken</text>
  <rect x="516" y="80" width="110" height="64" rx="8" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.6"/>
  <text x="571.0" y="102" font-size="14" text-anchor="middle" fill="#2e7d4f" font-weight="bold">11</text>
  <text x="571.0" y="120" font-size="10.5" text-anchor="middle" fill="#111">Strongly</text>
  <text x="571.0" y="134" font-size="10.5" text-anchor="middle" fill="#111">Taken</text>
  <text x="571.0" y="70" font-size="10.5" text-anchor="middle" fill="#2e7d4f" font-weight="bold">đoán: Taken</text>
  <line x1="142" y1="102" x2="190" y2="102" stroke="#2e7d4f" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="190" y1="126" x2="142" y2="126" stroke="#b5483a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="166.0" y="96" font-size="10" text-anchor="middle" fill="#2e7d4f" font-weight="bold">T</text>
  <text x="166.0" y="142" font-size="10" text-anchor="middle" fill="#b5483a" font-weight="bold">NT</text>
  <line x1="304" y1="102" x2="352" y2="102" stroke="#2e7d4f" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="352" y1="126" x2="304" y2="126" stroke="#b5483a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="328.0" y="96" font-size="10" text-anchor="middle" fill="#2e7d4f" font-weight="bold">T</text>
  <text x="328.0" y="142" font-size="10" text-anchor="middle" fill="#b5483a" font-weight="bold">NT</text>
  <line x1="466" y1="102" x2="514" y2="102" stroke="#2e7d4f" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="514" y1="126" x2="466" y2="126" stroke="#b5483a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="490.0" y="96" font-size="10" text-anchor="middle" fill="#2e7d4f" font-weight="bold">T</text>
  <text x="490.0" y="142" font-size="10" text-anchor="middle" fill="#b5483a" font-weight="bold">NT</text>
  <path d="M 50 144 v 18 h 40 v -18" fill="none" stroke="#b5483a" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="70" y="176" font-size="10" text-anchor="middle" fill="#b5483a" font-weight="bold">NT</text>
  <path d="M 566 144 v 18 h 40 v -18" fill="none" stroke="#2e7d4f" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="586" y="176" font-size="10" text-anchor="middle" fill="#2e7d4f" font-weight="bold">T</text>
  <text x="330" y="205" font-size="10.5" text-anchor="middle" fill="#444">T = nhánh thực sự được thực hiện (taken), NT = không thực hiện. Mỗi nhánh có một bộ đếm riêng.</text>
  <text x="330" y="223" font-size="10.5" text-anchor="middle" fill="#444">Vòng lặp: chỉ lần thoát vòng bị đoán sai; bộ đếm mới tụt xuống Weakly Taken nên lần vào vòng sau vẫn đoán Taken.</text>
</svg>
