  <rect x="299" y="216" width="32" height="22" rx="4" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.2"/>
  <text x="315.0" y="231.0" font-size="10.5" text-anchor="middle" fill="#111">MEM</text>
