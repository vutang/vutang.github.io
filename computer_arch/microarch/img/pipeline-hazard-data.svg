  <text x="330" y="300" font-size="10.5" text-anchor="middle" fill="#444">Không có forwarding, add/sub phải đợi lw/add ghi xong ở WB: tốn thêm 2 chu kỳ stall.</text>
  <text x="330" y="318" font-size="10.5" text-anchor="middle" fill="#444">Mũi tên đỏ = đường forwarding.</text>
