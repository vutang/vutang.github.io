  <text x="213.0" y="231.0" font-size="10.5" text-anchor="middle" fill="#111">ID</text>
  <rect x="231" y="216" width="32" height="22" rx="4" fill="#eeeeee" stroke="#888888" stroke-width="1.2" stroke-dasharray="3 2"/>
