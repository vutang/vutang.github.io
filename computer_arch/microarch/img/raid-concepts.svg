<svg role="img" viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Ba kỹ thuật nền tảng của RAID: striping rải dữ liệu lên nhiều ổ, mirroring ghi bản sao, parity lưu XOR để dựng lại</title>
  <rect x="0" y="0" width="720" height="330" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect x="10" y="12" width="224" height="300" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
  <text x="122.0" y="34" font-size="12" text-anchor="middle" fill="#1d4278" font-weight="bold">Striping</text>
  <text x="122.0" y="50" font-size="10" text-anchor="middle" fill="#444">chia dữ liệu thành stripe, rải lên nhiều ổ</text>
  <text x="122" y="66" font-size="10" text-anchor="middle" fill="#444">Dữ liệu</text>
  <rect x="32" y="72" width="44" height="22" rx="3" fill="#cfe3f7" stroke="#1d4278" stroke-width="1.2"/>
  <text x="54.0" y="87.0" font-size="11" text-anchor="middle" fill="#222">A</text>
  <rect x="80" y="72" width="44" height="22" rx="3" fill="#d6efd2" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="102.0" y="87.0" font-size="11" text-anchor="middle" fill="#222">B</text>
  <rect x="128" y="72" width="44" height="22" rx="3" fill="#fde5c2" stroke="#b26a00" stroke-width="1.2"/>
  <text x="150.0" y="87.0" font-size="11" text-anchor="middle" fill="#222">C</text>
  <rect x="176" y="72" width="44" height="22" rx="3" fill="#e6d7f2" stroke="#6a3d9a" stroke-width="1.2"/>
  <text x="198.0" y="87.0" font-size="11" text-anchor="middle" fill="#222">D</text>
  <line x1="92" y1="98" x2="72" y2="128" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="152" y1="98" x2="172" y2="128" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="52" y="134" width="52" height="84" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="78.0" y="212" font-size="10" text-anchor="middle" fill="#444">Ổ 1</text>
  <rect x="56" y="142" width="44" height="22" rx="3" fill="#cfe3f7" stroke="#1d4278" stroke-width="1.2"/>
  <text x="78.0" y="157.0" font-size="11" text-anchor="middle" fill="#222">A</text>
  <rect x="56" y="168" width="44" height="22" rx="3" fill="#fde5c2" stroke="#b26a00" stroke-width="1.2"/>
  <text x="78.0" y="183.0" font-size="11" text-anchor="middle" fill="#222">C</text>
  <rect x="138" y="134" width="52" height="84" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="164.0" y="212" font-size="10" text-anchor="middle" fill="#444">Ổ 2</text>
  <rect x="142" y="142" width="44" height="22" rx="3" fill="#d6efd2" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="164.0" y="157.0" font-size="11" text-anchor="middle" fill="#222">B</text>
  <rect x="142" y="168" width="44" height="22" rx="3" fill="#e6d7f2" stroke="#6a3d9a" stroke-width="1.2"/>
  <text x="164.0" y="183.0" font-size="11" text-anchor="middle" fill="#222">D</text>
  <text x="122" y="256" font-size="10" text-anchor="middle" fill="#1d4278" font-weight="bold">Đọc/ghi song song trên 2 ổ</text>
  <text x="122" y="272" font-size="10" text-anchor="middle" fill="#444">→ băng thông gấp ~2 lần</text>
  <text x="122" y="290" font-size="10" text-anchor="middle" fill="#c0392b">Mất 1 ổ = mất toàn bộ dữ liệu</text>
  <rect x="248" y="12" width="224" height="300" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
  <text x="360.0" y="34" font-size="12" text-anchor="middle" fill="#1d4278" font-weight="bold">Mirroring</text>
  <text x="360.0" y="50" font-size="10" text-anchor="middle" fill="#444">ghi cùng dữ liệu lên nhiều ổ</text>
  <text x="360" y="66" font-size="10" text-anchor="middle" fill="#444">Dữ liệu</text>
  <rect x="314" y="72" width="44" height="22" rx="3" fill="#cfe3f7" stroke="#1d4278" stroke-width="1.2"/>
  <text x="336.0" y="87.0" font-size="11" text-anchor="middle" fill="#222">A</text>
  <rect x="362" y="72" width="44" height="22" rx="3" fill="#d6efd2" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="384.0" y="87.0" font-size="11" text-anchor="middle" fill="#222">B</text>
  <line x1="336" y1="98" x2="300" y2="128" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="384" y1="98" x2="420" y2="128" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="274" y="134" width="52" height="84" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="300.0" y="212" font-size="10" text-anchor="middle" fill="#444">Ổ 1</text>
  <rect x="278" y="142" width="44" height="22" rx="3" fill="#cfe3f7" stroke="#1d4278" stroke-width="1.2"/>
  <text x="300.0" y="157.0" font-size="11" text-anchor="middle" fill="#222">A</text>
  <rect x="278" y="168" width="44" height="22" rx="3" fill="#d6efd2" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="300.0" y="183.0" font-size="11" text-anchor="middle" fill="#222">B</text>
  <rect x="366" y="134" width="52" height="84" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="392.0" y="212" font-size="10" text-anchor="middle" fill="#444">Ổ 2</text>
  <rect x="370" y="142" width="44" height="22" rx="3" fill="#cfe3f7" stroke="#1d4278" stroke-width="1.2"/>
  <text x="392.0" y="157.0" font-size="11" text-anchor="middle" fill="#222">A</text>
  <rect x="370" y="168" width="44" height="22" rx="3" fill="#d6efd2" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="392.0" y="183.0" font-size="11" text-anchor="middle" fill="#222">B</text>
  <text x="360" y="256" font-size="10" text-anchor="middle" fill="#1d4278" font-weight="bold">Ghi: mỗi khối ghi lên cả 2 ổ</text>
  <text x="360" y="272" font-size="10" text-anchor="middle" fill="#444">Đọc: có thể chia đều cho các ổ</text>
  <text x="360" y="290" font-size="10" text-anchor="middle" fill="#c0392b">Chịu lỗi tốt, tốn 50% dung lượng</text>
  <rect x="486" y="12" width="224" height="300" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
  <text x="598.0" y="34" font-size="12" text-anchor="middle" fill="#1d4278" font-weight="bold">Parity</text>
  <text x="598.0" y="50" font-size="10" text-anchor="middle" fill="#444">P = A ⊕ B, dựng lại dữ liệu khi mất ổ</text>
  <rect x="504" y="74" width="52" height="58" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="530.0" y="126" font-size="10" text-anchor="middle" fill="#444">Ổ 1</text>
  <rect x="508" y="82" width="44" height="22" rx="3" fill="#cfe3f7" stroke="#1d4278" stroke-width="1.2"/>
  <text x="530.0" y="97.0" font-size="11" text-anchor="middle" fill="#222">A</text>
  <rect x="570" y="74" width="52" height="58" rx="5" fill="#eeeeee" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="596.0" y="126" font-size="10" text-anchor="middle" fill="#444">Ổ 2</text>
  <rect x="574" y="82" width="44" height="22" rx="3" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2"/>
  <text x="596.0" y="97.0" font-size="11" text-anchor="middle" fill="#999">B</text>
  <path d="M576,80 L616,110 M616,80 L576,110" stroke="#c0392b" stroke-width="2" stroke-opacity="0.55"/>
  <rect x="636" y="74" width="52" height="58" rx="5" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="662.0" y="126" font-size="10" text-anchor="middle" fill="#444">Ổ 3</text>
  <rect x="640" y="82" width="44" height="22" rx="3" fill="#fbe3e1" stroke="#c0392b" stroke-width="1.2"/>
  <text x="662.0" y="97.0" font-size="11" text-anchor="middle" fill="#222">P</text>
  <text x="598" y="170" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">Ổ 2 hỏng</text>
  <text x="598" y="196" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">B = A ⊕ P</text>
  <text x="598" y="214" font-size="10" text-anchor="middle" fill="#444">XOR các ổ còn lại cho ra khối bị mất</text>
  <text x="598" y="252" font-size="10" text-anchor="middle" fill="#1d4278" font-weight="bold">Chỉ tốn 1 ổ cho cả nhóm,</text>
  <text x="598" y="268" font-size="10" text-anchor="middle" fill="#1d4278" font-weight="bold">chịu được mất 1 ổ</text>
  <text x="598" y="290" font-size="10" text-anchor="middle" fill="#c0392b">Ghi phải cập nhật lại parity</text>
</svg>
