<svg role="img" viewBox="0 0 660 330" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Đường truy cập của CPU: TLB dịch địa chỉ, cache kiểm tra, DRAM khi miss, page fault khi trang chưa có trong RAM</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="330" rx="8" fill="#ffffff"/>
  <rect x="10" y="40" width="110" height="50" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="65.0" y="63.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">CPU</text>
  <text x="65.0" y="78.0" font-size="9.5" text-anchor="middle" fill="#444">địa chỉ ảo</text>
  <rect x="180" y="40" width="110" height="50" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="235.0" y="63.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">TLB</text>
  <text x="235.0" y="78.0" font-size="9.5" text-anchor="middle" fill="#444">dịch VA → PA</text>
  <rect x="350" y="40" width="110" height="50" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="405.0" y="63.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Cache</text>
  <text x="405.0" y="78.0" font-size="9.5" text-anchor="middle" fill="#444">L1, L2, L3</text>
  <rect x="520" y="40" width="110" height="50" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="575.0" y="63.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">DRAM</text>
  <text x="575.0" y="78.0" font-size="9.5" text-anchor="middle" fill="#444">bộ nhớ chính</text>
  <line x1="120" y1="65" x2="180" y2="65" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="150.0" y="58" font-size="9.5" text-anchor="middle" fill="#444">VA</text>
  <line x1="290" y1="65" x2="350" y2="65" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="320.0" y="58" font-size="9.5" text-anchor="middle" fill="#444">PA</text>
  <line x1="460" y1="65" x2="520" y2="65" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="490.0" y="58" font-size="9.5" text-anchor="middle" fill="#444">miss</text>
  <rect x="180" y="140" width="110" height="50" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="235.0" y="163.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Page walk</text>
  <text x="235.0" y="178.0" font-size="9.5" text-anchor="middle" fill="#444">đọc page table</text>
  <line x1="245" y1="90" x2="245" y2="140" stroke="#b5483a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="250" y="118" font-size="10" text-anchor="start" fill="#b5483a" font-weight="bold">TLB miss</text>
  <path d="M 205 140 V 90" fill="none" stroke="#2e7d4f" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="200" y="118" font-size="10" text-anchor="end" fill="#2e7d4f">nạp vào TLB</text>
  <rect x="160" y="240" width="150" height="50" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="235.0" y="263.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Page fault</text>
  <text x="235.0" y="278.0" font-size="9.5" text-anchor="middle" fill="#444">trang chưa có trong RAM</text>
  <line x1="245" y1="190" x2="245" y2="240" stroke="#b5483a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="250" y="218" font-size="10" text-anchor="start" fill="#b5483a" font-weight="bold">PTE invalid</text>
  <rect x="380" y="240" width="130" height="50" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="445.0" y="263.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">SSD / HDD</text>
  <text x="445.0" y="278.0" font-size="9.5" text-anchor="middle" fill="#444">hệ điều hành nạp trang</text>
  <line x1="310" y1="265" x2="380" y2="265" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="410" y="180" font-size="10" text-anchor="start" fill="#444">Hit ở cache: không cần xuống DRAM.</text>
  <text x="410" y="196" font-size="10" text-anchor="start" fill="#444">Page fault mất cỡ micro giây đến mili giây,</text>
  <text x="410" y="212" font-size="10" text-anchor="start" fill="#444">chậm hơn truy cập DRAM hàng nghìn lần.</text>
</svg>
