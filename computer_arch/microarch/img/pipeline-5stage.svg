<svg role="img" viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Pipeline 5 giai đoạn IF, ID, EX, MEM, WB, ngăn cách bằng các thanh ghi pipeline</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="340" rx="8" fill="#ffffff"/>
  <rect x="20" y="90" width="100" height="92" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.6"/>
  <text x="70.0" y="112" font-size="15" text-anchor="middle" fill="#2f5d9e" font-weight="bold">IF</text>
  <text x="70.0" y="130" font-size="9.5" text-anchor="middle" fill="#444">Instruction Fetch</text>
  <text x="70.0" y="152" font-size="10.5" text-anchor="middle" fill="#111">PC, I-cache</text>
  <text x="70.0" y="167" font-size="10.5" text-anchor="middle" fill="#111">PC + 4</text>
  <rect x="148" y="90" width="100" height="92" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.6"/>
  <text x="198.0" y="112" font-size="15" text-anchor="middle" fill="#2e7d4f" font-weight="bold">ID</text>
  <text x="198.0" y="130" font-size="9.5" text-anchor="middle" fill="#444">Decode</text>
  <text x="198.0" y="152" font-size="10.5" text-anchor="middle" fill="#111">Giải mã lệnh</text>
  <text x="198.0" y="167" font-size="10.5" text-anchor="middle" fill="#111">Đọc thanh ghi</text>
  <rect x="276" y="90" width="100" height="92" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.6"/>
  <text x="326.0" y="112" font-size="15" text-anchor="middle" fill="#b07d12" font-weight="bold">EX</text>
  <text x="326.0" y="130" font-size="9.5" text-anchor="middle" fill="#444">Execute</text>
  <text x="326.0" y="152" font-size="10.5" text-anchor="middle" fill="#111">ALU</text>
  <text x="326.0" y="167" font-size="10.5" text-anchor="middle" fill="#111">So sánh nhánh</text>
  <rect x="404" y="90" width="100" height="92" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.6"/>
  <text x="454.0" y="112" font-size="15" text-anchor="middle" fill="#b5483a" font-weight="bold">MEM</text>
  <text x="454.0" y="130" font-size="9.5" text-anchor="middle" fill="#444">Memory</text>
  <text x="454.0" y="152" font-size="10.5" text-anchor="middle" fill="#111">D-cache</text>
  <text x="454.0" y="167" font-size="10.5" text-anchor="middle" fill="#111">load / store</text>
  <rect x="532" y="90" width="100" height="92" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.6"/>
  <text x="582.0" y="112" font-size="15" text-anchor="middle" fill="#6b4fa3" font-weight="bold">WB</text>
  <text x="582.0" y="130" font-size="9.5" text-anchor="middle" fill="#444">Write-back</text>
  <text x="582.0" y="152" font-size="10.5" text-anchor="middle" fill="#111">Ghi kết quả</text>
  <text x="582.0" y="167" font-size="10.5" text-anchor="middle" fill="#111">vào thanh ghi</text>
  <rect x="127.0" y="78" width="14" height="116" rx="2" fill="#555" stroke="#333" stroke-width="1.2"/>
  <text x="134.0" y="70" font-size="9.5" text-anchor="middle" fill="#333" font-weight="bold">IF/ID</text>
  <line x1="120" y1="136.0" x2="127.0" y2="136.0" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="141.0" y1="136.0" x2="148" y2="136.0" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="255.0" y="78" width="14" height="116" rx="2" fill="#555" stroke="#333" stroke-width="1.2"/>
  <text x="262.0" y="70" font-size="9.5" text-anchor="middle" fill="#333" font-weight="bold">ID/EX</text>
  <line x1="248" y1="136.0" x2="255.0" y2="136.0" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="269.0" y1="136.0" x2="276" y2="136.0" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="383.0" y="78" width="14" height="116" rx="2" fill="#555" stroke="#333" stroke-width="1.2"/>
  <text x="390.0" y="70" font-size="9.5" text-anchor="middle" fill="#333" font-weight="bold">EX/MEM</text>
  <line x1="376" y1="136.0" x2="383.0" y2="136.0" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="397.0" y1="136.0" x2="404" y2="136.0" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="511.0" y="78" width="14" height="116" rx="2" fill="#555" stroke="#333" stroke-width="1.2"/>
  <text x="518.0" y="70" font-size="9.5" text-anchor="middle" fill="#333" font-weight="bold">MEM/WB</text>
  <line x1="504" y1="136.0" x2="511.0" y2="136.0" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="525.0" y1="136.0" x2="532" y2="136.0" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M 582.0 182 V 264 H 218.0 V 182" fill="none" stroke="#6b4fa3" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="380.0" y="258" font-size="10" text-anchor="middle" fill="#6b4fa3">ghi kết quả về register file (WB → ID)</text>
  <path d="M 326.0 90 V 46 H 70.0 V 90" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="178.0" y="40" font-size="10" text-anchor="middle" fill="#c0392b">nhánh được thực hiện: nạp PC mới (EX → IF)</text>
  <path d="M 434.0 182 V 222 H 346.0 V 182" fill="none" stroke="#2e7d4f" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="390.0" y="216" font-size="10" text-anchor="middle" fill="#2e7d4f">forwarding (MEM/WB → EX)</text>
  <text x="330" y="326" font-size="10.5" text-anchor="middle" fill="#444">Thanh ghi pipeline (cột đen) giữ trạng thái của lệnh khi chuyển giữa các giai đoạn.</text>
</svg>
