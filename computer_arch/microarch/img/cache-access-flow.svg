<svg role="img" viewBox="0 0 660 424" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Luồng xử lý một truy cập bộ nhớ qua cache (write-back, write-allocate)</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="424" rx="8" fill="#ffffff"/>
  <rect x="200" y="14" width="260" height="34" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="330.0" y="35.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">CPU: load / store địa chỉ A</text>
  <rect x="200" y="70" width="260" height="40" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="330.0" y="94.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Tra cache: tag khớp và valid?</text>
  <line x1="330" y1="48" x2="330" y2="70" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="20" y="150" width="190" height="74" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="115" y="174" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Hit</text>
  <text x="115" y="194" font-size="9.5" text-anchor="middle" fill="#444">load: trả dữ liệu</text>
  <text x="115" y="208" font-size="9.5" text-anchor="middle" fill="#444">store: ghi vào line, đặt dirty</text>
  <path d="M 200 90 H 115 V 150" fill="none" stroke="#2e7d4f" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="150" y="84" font-size="10.5" text-anchor="middle" fill="#2e7d4f" font-weight="bold">Hit</text>
  <rect x="380" y="130" width="240" height="40" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="500.0" y="148.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Chọn line bị thay (victim)</text>
  <text x="500.0" y="163.0" font-size="9.5" text-anchor="middle" fill="#444">theo LRU, ...</text>
  <path d="M 460 90 H 500 V 130" fill="none" stroke="#b5483a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="480" y="84" font-size="10.5" text-anchor="middle" fill="#b5483a" font-weight="bold">Miss</text>
  <rect x="380" y="190" width="240" height="36" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="500.0" y="212.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Victim có dirty?</text>
  <line x1="500" y1="170" x2="500" y2="190" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="380" y="250" width="240" height="36" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="500.0" y="272.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Ghi victim xuống cấp dưới</text>
  <line x1="500" y1="226" x2="500" y2="250" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="508" y="242" font-size="10" text-anchor="start" fill="#444">có</text>
  <rect x="380" y="310" width="240" height="36" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="500.0" y="332.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Nạp line chứa A từ cấp dưới</text>
  <line x1="500" y1="286" x2="500" y2="310" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M 380 208 H 350 V 328 H 380" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="376" y="202" font-size="10" text-anchor="end" fill="#444">không</text>
  <rect x="380" y="368" width="240" height="36" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="500.0" y="384.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Cập nhật tag, valid; thực hiện</text>
  <text x="500.0" y="399.0" font-size="9.5" text-anchor="middle" fill="#444">load / store</text>
  <line x1="500" y1="346" x2="500" y2="368" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="20" y="262" font-size="10.5" text-anchor="start" fill="#2e7d4f" font-weight="bold">Hit: vài chu kỳ.</text>
  <text x="20" y="280" font-size="10.5" text-anchor="start" fill="#b5483a" font-weight="bold">Miss: hàng chục đến hàng trăm chu kỳ,</text>
  <text x="20" y="296" font-size="10.5" text-anchor="start" fill="#444">CPU phải stall (xem trang Pipeline).</text>
</svg>
