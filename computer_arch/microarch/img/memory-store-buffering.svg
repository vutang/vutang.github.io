<svg role="img" viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Store buffering: cả hai core đều có thể đọc giá trị cũ vì store còn nằm trong store buffer</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="320" rx="8" fill="#ffffff"/>
  <text x="330" y="20" font-size="11" text-anchor="middle" fill="#444" font-weight="bold">Ban đầu x = 0, y = 0</text>
  <rect x="30" y="40" width="180" height="90" rx="8" fill="#f4f7fb" stroke="#9bb4d8" stroke-width="1.2"/>
  <text x="120" y="58" font-size="12" text-anchor="middle" fill="#1d4278" font-weight="bold">Core 0</text>
  <rect x="45" y="66" width="150" height="24" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="120.0" y="82.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">x = 1  (store)</text>
  <rect x="45" y="98" width="150" height="24" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="120.0" y="114.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">r1 = y  (load)</text>
  <rect x="45" y="160" width="150" height="34" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="120.0" y="175.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Store buffer</text>
  <text x="120.0" y="190.0" font-size="9.5" text-anchor="middle" fill="#444">chờ ghi: x = 1</text>
  <line x1="70" y1="90" x2="70" y2="160" stroke="#b07d12" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="450" y="40" width="180" height="90" rx="8" fill="#f4f7fb" stroke="#9bb4d8" stroke-width="1.2"/>
  <text x="540" y="58" font-size="12" text-anchor="middle" fill="#1d4278" font-weight="bold">Core 1</text>
  <rect x="465" y="66" width="150" height="24" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="540.0" y="82.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">y = 1  (store)</text>
  <rect x="465" y="98" width="150" height="24" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="540.0" y="114.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">r2 = x  (load)</text>
  <rect x="465" y="160" width="150" height="34" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="540.0" y="175.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Store buffer</text>
  <text x="540.0" y="190.0" font-size="9.5" text-anchor="middle" fill="#444">chờ ghi: y = 1</text>
  <line x1="490" y1="90" x2="490" y2="160" stroke="#b07d12" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="260" y="60" width="140" height="70" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="330.0" y="93.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Bộ nhớ chung</text>
  <text x="330.0" y="108.0" font-size="9.5" text-anchor="middle" fill="#444">x = 0, y = 0</text>
  <line x1="210" y1="110" x2="260" y2="110" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="450" y1="110" x2="400" y2="110" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="235" y="102" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">đọc 0</text>
  <text x="425" y="102" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">đọc 0</text>
  <path d="M 195 177 H 330 V 130" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <path d="M 465 177 H 330" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="330" y="194" font-size="9.5" text-anchor="middle" fill="#666">chưa kịp ghi xuống</text>
  <text x="330" y="226" font-size="10.5" text-anchor="middle" fill="#444">Kết quả r1 = 0 và r2 = 0 xảy ra được trên TSO (x86) và RVWMO (RISC-V),</text>
  <text x="330" y="244" font-size="10.5" text-anchor="middle" fill="#444">nhưng không thể xảy ra với sequential consistency.</text>
  <text x="330" y="268" font-size="10.5" text-anchor="middle" fill="#1f5c38" font-weight="bold">Cách khắc phục: chèn fence giữa store và load ở mỗi core.</text>
</svg>
