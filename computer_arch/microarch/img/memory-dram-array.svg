  <text x="212.0" y="240.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Row buffer (sense amplifier)</text>
  <path d="M 332 116 H 356 V 236 H 334" fill="none" stroke="#b07d12" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="362" y="138" font-size="9.5" text-anchor="start" fill="#b07d12" font-weight="bold">ACTIVATE:</text>
  <text x="362" y="151" font-size="9.5" text-anchor="start" fill="#b07d12">chép cả hàng</text>
  <rect x="132" y="276" width="160" height="30" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
