  <rect x="440" y="180" width="212" height="46" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="546.0" y="201.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">PRECHARGE</text>
