  <text x="440" y="258" font-size="10" text-anchor="start" fill="#2e7d4f" font-weight="bold">Row hit: chỉ cần READ (nhanh).</text>
  <text x="440" y="274" font-size="10" text-anchor="start" fill="#b5483a" font-weight="bold">Row miss: PRECHARGE + ACTIVATE</text>
  <text x="440" y="289" font-size="10" text-anchor="start" fill="#b5483a" font-weight="bold">+ READ, chậm hơn cỡ 3 lần.</text>
