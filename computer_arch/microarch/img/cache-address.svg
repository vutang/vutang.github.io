<svg role="img" viewBox="0 0 660 330" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Tra cache direct-mapped: địa chỉ tách thành tag, index, offset; index chọn set, so tag, offset chọn byte</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="330" rx="8" fill="#ffffff"/>
  <rect x="60" y="36" width="240" height="36" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="180.0" y="58.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Tag (18 bit)</text>
  <rect x="300" y="36" width="140" height="36" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="370.0" y="58.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Index (8 bit)</text>
  <rect x="440" y="36" width="160" height="36" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="520.0" y="58.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Offset (6 bit)</text>
  <text x="60" y="28" font-size="10.5" text-anchor="start" fill="#444">Địa chỉ 32 bit (cache 16 KB, line 64 byte)</text>
  <text x="260" y="112" font-size="9.5" text-anchor="middle" fill="#666">V</text>
  <text x="300" y="112" font-size="9.5" text-anchor="middle" fill="#666">Tag</text>
  <text x="440" y="112" font-size="9.5" text-anchor="middle" fill="#666">Data (64 byte)</text>
  <rect x="230" y="118" width="30" height="26" rx="2" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2"/>
  <rect x="260" y="118" width="80" height="26" rx="2" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2"/>
  <rect x="340" y="118" width="200" height="26" rx="2" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2"/>
