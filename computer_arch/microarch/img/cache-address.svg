  <rect x="260" y="144" width="80" height="26" rx="2" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2"/>
  <rect x="340" y="144" width="200" height="26" rx="2" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2"/>
  <rect x="230" y="170" width="30" height="26" rx="2" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2"/>
  <rect x="260" y="170" width="80" height="26" rx="2" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2"/>
  <rect x="340" y="170" width="200" height="26" rx="2" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2"/>
  <text x="385" y="187" font-size="14" text-anchor="middle" fill="#888">⋮</text>
  <rect x="230" y="196" width="30" height="26" rx="2" fill="#fbeccb" stroke="#b07d12" stroke-width="1.2"/>
  <rect x="260" y="196" width="80" height="26" rx="2" fill="#fbeccb" stroke="#b07d12" stroke-width="1.2"/>
  <rect x="340" y="196" width="200" height="26" rx="2" fill="#fbeccb" stroke="#b07d12" stroke-width="1.2"/>
  <text x="300" y="213" font-size="9.5" text-anchor="middle" fill="#555">tag lưu</text>
  <path d="M 370 72 V 98 H 215 V 209 H 230" fill="none" stroke="#2e7d4f" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="262" y="90" font-size="10" text-anchor="start" fill="#2e7d4f">index chọn 1 set</text>
  <path d="M 100 72 V 262 H 286" fill="none" stroke="#2f5d9e" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="300" y1="222" x2="300" y2="248" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <circle cx="300" cy="262" r="14" fill="#ffffff" stroke="#444" stroke-width="1.4"/>
  <text x="300" y="267" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">=?</text>
  <text x="322" y="266" font-size="10.5" text-anchor="start" fill="#1f5c38" font-weight="bold">tag khớp, V=1</text>
  <text x="322" y="281" font-size="10.5" text-anchor="start" fill="#1f5c38" font-weight="bold">→ Hit</text>
