  <line x1="440" y1="222" x2="440" y2="240" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M 580 72 V 255 H 560" fill="none" stroke="#6b4fa3" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="490" y1="270" x2="490" y2="300" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="500" y="314" font-size="10.5" text-anchor="start" fill="#444">dữ liệu trả về CPU</text>
