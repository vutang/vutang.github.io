  <text x="383.0" y="169.0" font-size="10.5" text-anchor="middle" fill="#111">WB</text>
  <text x="267.0" y="101" font-size="10" text-anchor="start" fill="#888">bị hủy (flush)</text>
  <text x="253.8" y="126.80000000000001" font-size="10" text-anchor="start" fill="#c0392b">PC đích</text>
  <line x1="213.0" y1="74" x2="247.0" y2="154" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="330" y="225" font-size="10.5" text-anchor="middle" fill="#444">Kết quả nhánh có ở cuối EX nên lệnh đích chỉ được nạp ở chu kỳ 4 → mất 2 chu kỳ.</text>
  <text x="330" y="242" font-size="10.5" text-anchor="middle" fill="#444">Branch prediction đoán trước hướng nhánh để nạp lệnh đúng ngay, tránh penalty này.</text>
