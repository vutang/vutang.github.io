  <text x="281.0" y="67.0" font-size="10.5" text-anchor="middle" fill="#111">WB</text>
  <text x="120" y="101.0" font-size="11" text-anchor="end" fill="#111">lệnh kế (sai)</text>
  <rect x="163" y="86" width="32" height="22" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="179.0" y="101.0" font-size="10.5" text-anchor="middle" fill="#999">IF</text>
  <rect x="197" y="86" width="32" height="22" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="213.0" y="101.0" font-size="10.5" text-anchor="middle" fill="#999">ID</text>
  <text x="120" y="135.0" font-size="11" text-anchor="end" fill="#111">lệnh kế + 1 (sai)</text>
  <rect x="197" y="120" width="32" height="22" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 2"/>
