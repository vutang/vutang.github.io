<svg role="img" viewBox="0 0 660 250" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Control hazard: nhánh được quyết định ở EX nên 2 lệnh đã nạp sai bị hủy, tốn 2 chu kỳ</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="250" rx="8" fill="#ffffff"/>
  <text x="20" y="22" font-size="12" text-anchor="start" fill="#1d4278" font-weight="bold">Branch penalty: beq quyết định nhánh ở giai đoạn EX (chu kỳ 3)</text>
