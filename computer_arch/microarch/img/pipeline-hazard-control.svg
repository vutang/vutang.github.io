  <rect x="265" y="154" width="32" height="22" rx="4" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.2"/>
  <text x="281.0" y="169.0" font-size="10.5" text-anchor="middle" fill="#111">ID</text>
  <rect x="299" y="154" width="32" height="22" rx="4" fill="#fbeccb" stroke="#b07d12" stroke-width="1.2"/>
  <text x="315.0" y="169.0" font-size="10.5" text-anchor="middle" fill="#111">EX</text>
  <rect x="333" y="154" width="32" height="22" rx="4" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.2"/>
