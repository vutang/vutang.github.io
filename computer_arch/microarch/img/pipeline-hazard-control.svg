  <text x="213.0" y="46" font-size="10" text-anchor="middle" fill="#666">3</text>
  <text x="247.0" y="46" font-size="10" text-anchor="middle" fill="#666">4</text>
  <text x="281.0" y="46" font-size="10" text-anchor="middle" fill="#666">5</text>
  <text x="315.0" y="46" font-size="10" text-anchor="middle" fill="#666">6</text>
  <text x="349.0" y="46" font-size="10" text-anchor="middle" fill="#666">7</text>
  <text x="383.0" y="46" font-size="10" text-anchor="middle" fill="#666">8</text>
  <text x="417.0" y="46" font-size="10" text-anchor="middle" fill="#666">9</text>
  <text x="120" y="46" font-size="10" text-anchor="end" fill="#666">chu kỳ</text>
  <text x="120" y="67.0" font-size="11" text-anchor="end" fill="#111">beq x1, x2, L</text>
  <rect x="129" y="52" width="32" height="22" rx="4" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.2"/>
  <text x="145.0" y="67.0" font-size="10.5" text-anchor="middle" fill="#111">IF</text>
  <rect x="163" y="52" width="32" height="22" rx="4" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.2"/>
  <text x="179.0" y="67.0" font-size="10.5" text-anchor="middle" fill="#111">ID</text>
  <rect x="197" y="52" width="32" height="22" rx="4" fill="#fbeccb" stroke="#b07d12" stroke-width="1.2"/>
  <text x="213.0" y="67.0" font-size="10.5" text-anchor="middle" fill="#111">EX</text>
  <rect x="231" y="52" width="32" height="22" rx="4" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.2"/>
  <text x="247.0" y="67.0" font-size="10.5" text-anchor="middle" fill="#111">MEM</text>
