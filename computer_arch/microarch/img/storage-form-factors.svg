<svg role="img" viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Hình dạng và đầu nối thực tế của ổ SATA 2.5 inch, M.2 SATA, M.2 NVMe và chip eMMC</title>
  <rect x="0" y="0" width="660" height="400" rx="8" fill="#ffffff"/>

  <!-- 1. SATA 2.5" -->
  <text x="20" y="24" font-size="11.5" font-weight="bold" fill="#111">1. SSD/HDD SATA 2.5" (vỏ kim loại, 7 - 9,5 mm dày)</text>
  <rect x="20" y="34" width="250" height="70" rx="6" fill="#e3e6ea" stroke="#555" stroke-width="1.5"/>
  <text x="145" y="74" font-size="11" text-anchor="middle" fill="#333">Nhãn ổ (vỏ nhôm / thép)</text>
  <rect x="270" y="52" width="42" height="34" fill="#f1c40f" stroke="#7d6608" stroke-width="1.2"/>
  <rect x="270" y="52" width="14" height="34" fill="#2c3e50"/>
  <text x="322" y="66" font-size="9.5" fill="#111">Data 7 chân</text>
  <text x="322" y="80" font-size="9.5" fill="#111">+ Power 15 chân (liền nhau)</text>
  <text x="20" y="120" font-size="9.5" fill="#555">Ví dụ: Samsung 870 EVO (SSD), WD Blue 2,5" (HDD). Cáp SATA + cáp nguồn riêng.</text>

  <!-- 2. M.2 SATA -->
  <text x="20" y="152" font-size="11.5" font-weight="bold" fill="#111">2. M.2 2280 SATA (khoá B+M: 2 khe cắt)</text>
  <rect x="20" y="162" width="300" height="26" rx="2" fill="#1e8449" stroke="#0b3d20" stroke-width="1.2"/>
  <rect x="48" y="166" width="46" height="18" fill="#222"/>
  <rect x="104" y="166" width="46" height="18" fill="#222"/>
  <rect x="160" y="166" width="46" height="18" fill="#222"/>
  <rect x="216" y="166" width="46" height="18" fill="#444"/>
  <text x="239" y="178" font-size="8" fill="#ddd" text-anchor="middle">NAND/Ctrl</text>
  <rect x="20" y="162" width="46" height="26" fill="none"/>
  <path d="M320,162 v26" stroke="#b9770e" stroke-width="2"/>
  <rect x="322" y="162" width="64" height="26" fill="#f1c40f" stroke="#7d6608" stroke-width="1.2"/>
  <rect x="338" y="162" width="6" height="8" fill="#ffffff"/>
  <rect x="352" y="162" width="6" height="8" fill="#ffffff"/>
  <text x="396" y="173" font-size="9.5" fill="#111">Cùng giao diện M.2</text>
  <text x="396" y="186" font-size="9.5" fill="#111">nhưng giao thức SATA</text>

  <!-- 3. M.2 NVMe -->
  <text x="20" y="222" font-size="11.5" font-weight="bold" fill="#111">3. M.2 2280 NVMe (khoá M: 1 khe cắt, PCIe x4)</text>
  <rect x="20" y="232" width="300" height="26" rx="2" fill="#2471a3" stroke="#0b2f4a" stroke-width="1.2"/>
  <rect x="48" y="236" width="46" height="18" fill="#222"/>
  <rect x="104" y="236" width="46" height="18" fill="#222"/>
  <rect x="160" y="236" width="46" height="18" fill="#222"/>
  <rect x="216" y="236" width="46" height="18" fill="#444"/>
  <text x="239" y="248" font-size="8" fill="#ddd" text-anchor="middle">NAND/Ctrl</text>
  <rect x="322" y="232" width="64" height="26" fill="#f1c40f" stroke="#7d6608" stroke-width="1.2"/>
  <rect x="342" y="232" width="6" height="8" fill="#ffffff"/>
  <text x="396" y="243" font-size="9.5" fill="#111">Cắm thẳng vào khe M.2 trên mainboard,</text>
  <text x="396" y="256" font-size="9.5" fill="#111">không cần cáp. Rộng 22 mm, dài 80 mm.</text>
  <text x="20" y="274" font-size="9.5" fill="#555">Ví dụ: Samsung 990 PRO, WD Black SN850X. Khe cắm khác nhau nên dễ nhầm giữa M.2 SATA và NVMe.</text>

  <!-- 4. eMMC / UFS -->
  <text x="20" y="308" font-size="11.5" font-weight="bold" fill="#111">4. eMMC / UFS (hàn trực tiếp lên board, dạng BGA)</text>
  <rect x="20" y="318" width="420" height="62" rx="4" fill="#1e8449" stroke="#0b3d20" stroke-width="1.2"/>
  <rect x="40" y="328" width="60" height="42" fill="#222"/>
  <text x="70" y="352" font-size="9" text-anchor="middle" fill="#ddd">SoC</text>
  <rect x="150" y="332" width="46" height="34" fill="#333"/>
  <text x="173" y="352" font-size="9" text-anchor="middle" fill="#ddd">eMMC</text>
  <path d="M100,349 H150" stroke="#f1c40f" stroke-width="2.5"/>
  <text x="125" y="344" font-size="8" text-anchor="middle" fill="#fff">bus</text>
  <text x="210" y="344" font-size="9.5" fill="#fff">Không tháo được, 11,5 x 13 mm</text>
  <text x="210" y="360" font-size="9.5" fill="#fff">(eMMC); gặp trên Raspberry Pi CM4,</text>
  <text x="210" y="374" font-size="9.5" fill="#fff">điện thoại, board nhúng</text>
</svg>
