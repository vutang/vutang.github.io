<svg role="img" viewBox="0 0 660 270" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Sơ đồ khối máy tính: CPU gồm control và datapath, nối với bộ nhớ và I/O qua bus</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="270" rx="8" fill="#ffffff"/>
  <rect x="20" y="30" width="300" height="170" rx="8" fill="#f4f7fb" stroke="#9bb4d8" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="170" y="50" font-size="13" text-anchor="middle" fill="#1d4278" font-weight="bold">CPU</text>
  <rect x="36" y="66" width="128" height="58" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="100.0" y="93.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Control Unit</text>
  <text x="100.0" y="108.0" font-size="9.5" text-anchor="middle" fill="#444">giải mã, điều khiển</text>
  <rect x="176" y="66" width="128" height="58" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="240.0" y="93.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">ALU</text>
  <text x="240.0" y="108.0" font-size="9.5" text-anchor="middle" fill="#444">tính toán</text>
  <rect x="36" y="136" width="268" height="50" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="170.0" y="159.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Thanh ghi (register file, PC)</text>
  <text x="170.0" y="174.0" font-size="9.5" text-anchor="middle" fill="#444">lưu tạm dữ liệu và địa chỉ lệnh</text>
  <text x="240" y="62" font-size="10" text-anchor="middle" fill="#8a5a00" font-weight="bold">Datapath</text>
  <rect x="400" y="40" width="230" height="66" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="515.0" y="71.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Bộ nhớ (memory)</text>
  <text x="515.0" y="86.0" font-size="9.5" text-anchor="middle" fill="#444">chứa lệnh và dữ liệu</text>
  <rect x="400" y="134" width="230" height="66" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="515.0" y="165.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Thiết bị I/O</text>
  <text x="515.0" y="180.0" font-size="9.5" text-anchor="middle" fill="#444">ngoại vi, mạng, lưu trữ</text>
  <rect x="352" y="40" width="12" height="160" rx="3" fill="#555" stroke="#333" stroke-width="1.2"/>
  <line x1="320" y1="120" x2="352" y2="120" stroke="#444" stroke-width="1.4"/>
  <line x1="364" y1="73" x2="400" y2="73" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="400" y1="80" x2="364" y2="80" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="364" y1="167" x2="400" y2="167" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="400" y1="174" x2="364" y2="174" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="358" y="216" font-size="10" text-anchor="middle" fill="#444">Bus: địa chỉ, dữ liệu, điều khiển</text>
  <text x="330" y="256" font-size="10.5" text-anchor="middle" fill="#444">CPU nạp lệnh và đọc/ghi dữ liệu từ bộ nhớ; giao tiếp ngoại vi qua I/O.</text>
</svg>
