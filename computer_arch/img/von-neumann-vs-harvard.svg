<svg role="img" viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>So sánh kiến trúc von Neumann, Harvard và modified Harvard</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="300" rx="8" fill="#ffffff"/>
  <rect x="10" y="24" width="204" height="232" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
  <text x="112" y="46" font-size="12" text-anchor="middle" fill="#1d4278" font-weight="bold">Von Neumann</text>
  <rect x="60" y="66" width="104" height="40" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="112.0" y="90.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">CPU</text>
  <line x1="112" y1="106" x2="112" y2="160" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="122" y1="160" x2="122" y2="106" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="40" y="160" width="144" height="60" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="112.0" y="188.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Bộ nhớ chung</text>
  <text x="112.0" y="203.0" font-size="9.5" text-anchor="middle" fill="#444">lệnh + dữ liệu</text>
  <text x="112" y="242" font-size="9.5" text-anchor="middle" fill="#444">1 bus: lệnh và dữ liệu tranh nhau</text>
  <rect x="228" y="24" width="204" height="232" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
  <text x="330" y="46" font-size="12" text-anchor="middle" fill="#1f5c38" font-weight="bold">Harvard</text>
  <rect x="278" y="66" width="104" height="40" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="330.0" y="90.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">CPU</text>
  <line x1="310" y1="106" x2="270" y2="160" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="350" y1="106" x2="360" y2="160" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="240" y="160" width="84" height="60" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="282.0" y="194.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Bộ nhớ lệnh</text>
  <rect x="340" y="160" width="84" height="60" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="382.0" y="188.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Bộ nhớ</text>
  <text x="382.0" y="203.0" font-size="9.5" text-anchor="middle" fill="#444">dữ liệu</text>
  <text x="330" y="242" font-size="9.5" text-anchor="middle" fill="#444">2 bộ nhớ, 2 bus: truy cập song song</text>
  <rect x="446" y="24" width="204" height="232" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
  <text x="548" y="46" font-size="12" text-anchor="middle" fill="#6b4fa3" font-weight="bold">Modified Harvard</text>
  <rect x="496" y="62" width="104" height="34" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="548.0" y="83.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">CPU</text>
  <rect x="468" y="110" width="76" height="30" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="506.0" y="129.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">L1 I-cache</text>
  <rect x="548" y="110" width="76" height="30" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="586.0" y="129.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">L1 D-cache</text>
  <line x1="515" y1="96" x2="506" y2="110" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="580" y1="96" x2="586" y2="110" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="506" y1="140" x2="520" y2="170" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="586" y1="140" x2="570" y2="170" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="468" y="170" width="156" height="50" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="546.0" y="193.0" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Cache cấp dưới + RAM</text>
  <text x="546.0" y="208.0" font-size="9.5" text-anchor="middle" fill="#444">bộ nhớ thống nhất</text>
  <text x="548" y="242" font-size="9.5" text-anchor="middle" fill="#444">tách ở L1, thống nhất ở bộ nhớ chính</text>
  <text x="330" y="282" font-size="10.5" text-anchor="middle" fill="#444">Hầu hết CPU hiện nay (x86, Arm, RISC-V) là modified Harvard.</text>
</svg>
