<svg role="img" viewBox="0 0 660 330" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Thị phần x86 quý 2/2026 theo Mercury Research: AMD so với Intel, theo từng phân khúc</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="330" rx="8" fill="#ffffff"/>
  <text x="20" y="24" font-size="11" text-anchor="start" fill="#b5483a" font-weight="bold">AMD</text>
  <text x="55" y="24" font-size="11" text-anchor="start" fill="#444">so với</text>
  <text x="100" y="24" font-size="11" text-anchor="start" fill="#2f5d9e" font-weight="bold">Intel</text>
  <text x="190" y="65" font-size="10.5" text-anchor="end" fill="#111">Client (desktop + laptop)</text>
  <rect x="200" y="44" width="121.2" height="30" rx="3" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.4"/>
  <rect x="321.2" y="44" width="278.8" height="30" rx="3" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.4"/>
  <text x="260.6" y="64" font-size="11" text-anchor="middle" fill="#b5483a" font-weight="bold">30.3%</text>
  <text x="460.6" y="64" font-size="11" text-anchor="middle" fill="#2f5d9e" font-weight="bold">69.7%</text>
  <text x="190" y="113" font-size="10.5" text-anchor="end" fill="#111">Desktop</text>
  <rect x="200" y="92" width="139.6" height="30" rx="3" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.4"/>
  <rect x="339.6" y="92" width="260.4" height="30" rx="3" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.4"/>
  <text x="269.8" y="112" font-size="11" text-anchor="middle" fill="#b5483a" font-weight="bold">34.9%</text>
  <text x="469.8" y="112" font-size="11" text-anchor="middle" fill="#2f5d9e" font-weight="bold">65.1%</text>
  <text x="190" y="161" font-size="10.5" text-anchor="end" fill="#111">Laptop</text>
  <rect x="200" y="140" width="115.6" height="30" rx="3" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.4"/>
  <rect x="315.6" y="140" width="284.4" height="30" rx="3" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.4"/>
  <text x="257.8" y="160" font-size="11" text-anchor="middle" fill="#b5483a" font-weight="bold">28.9%</text>
  <text x="457.8" y="160" font-size="11" text-anchor="middle" fill="#2f5d9e" font-weight="bold">71.1%</text>
  <text x="190" y="209" font-size="10.5" text-anchor="end" fill="#111">Server, theo số chip</text>
  <rect x="200" y="188" width="138.0" height="30" rx="3" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.4"/>
  <rect x="338.0" y="188" width="262.0" height="30" rx="3" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.4"/>
  <text x="269.0" y="208" font-size="11" text-anchor="middle" fill="#b5483a" font-weight="bold">34.5%</text>
  <text x="469.0" y="208" font-size="11" text-anchor="middle" fill="#2f5d9e" font-weight="bold">65.5%</text>
  <text x="190" y="257" font-size="10.5" text-anchor="end" fill="#111">Server, chỉ EPYC so với Xeon</text>
  <rect x="200" y="236" width="185.6" height="30" rx="3" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.4"/>
  <rect x="385.6" y="236" width="214.4" height="30" rx="3" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.4"/>
  <text x="292.8" y="256" font-size="11" text-anchor="middle" fill="#b5483a" font-weight="bold">46.4%</text>
  <text x="492.8" y="256" font-size="11" text-anchor="middle" fill="#2f5d9e" font-weight="bold">53.6%</text>
  <line x1="400.0" y1="40" x2="400.0" y2="286" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="400.0" y="300" font-size="9.5" text-anchor="middle" fill="#666">50%</text>
  <text x="330" y="320" font-size="10" text-anchor="middle" fill="#444">Hai hàng server đo khác nhau, không so trực tiếp được; chỉ tính x86 (chưa gồm Arm).</text>
</svg>
