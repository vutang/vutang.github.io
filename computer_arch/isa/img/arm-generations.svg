<svg role="img" viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Các thế hệ kiến trúc Arm và các dòng core: Cortex-A, Cortex-R, Cortex-M, Neoverse</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="300" rx="8" fill="#ffffff"/>
  <text x="20" y="24" font-size="12" text-anchor="start" fill="#1d4278" font-weight="bold">Thế hệ kiến trúc (ISA)</text>
  <rect x="14" y="36" width="144" height="74" rx="8" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.6"/>
  <text x="86" y="58" font-size="13" text-anchor="middle" fill="#2f5d9e" font-weight="bold">Arm cổ điển</text>
  <text x="86" y="74" font-size="10" text-anchor="middle" fill="#555">ARMv1 - v6</text>
  <text x="86" y="94" font-size="9.5" text-anchor="middle" fill="#111">32-bit; thêm Thumb</text>
  <line x1="158" y1="73" x2="176" y2="73" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="176" y="36" width="144" height="74" rx="8" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.6"/>
  <text x="248" y="58" font-size="13" text-anchor="middle" fill="#2e7d4f" font-weight="bold">ARMv7</text>
  <text x="248" y="74" font-size="10" text-anchor="middle" fill="#555">~2005</text>
  <text x="248" y="94" font-size="9.5" text-anchor="middle" fill="#111">3 profile A/R/M; Thumb-2</text>
  <line x1="320" y1="73" x2="338" y2="73" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="338" y="36" width="144" height="74" rx="8" fill="#fbeccb" stroke="#b07d12" stroke-width="1.6"/>
  <text x="410" y="58" font-size="13" text-anchor="middle" fill="#b07d12" font-weight="bold">ARMv8</text>
  <text x="410" y="74" font-size="10" text-anchor="middle" fill="#555">2011</text>
  <text x="410" y="94" font-size="9.5" text-anchor="middle" fill="#111">AArch64 (64-bit) + AArch32</text>
  <line x1="482" y1="73" x2="500" y2="73" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="500" y="36" width="144" height="74" rx="8" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.6"/>
  <text x="572" y="58" font-size="13" text-anchor="middle" fill="#b5483a" font-weight="bold">ARMv9</text>
  <text x="572" y="74" font-size="10" text-anchor="middle" fill="#555">2021</text>
  <text x="572" y="94" font-size="9.5" text-anchor="middle" fill="#111">SVE2, SME, bảo mật</text>
  <text x="20" y="150" font-size="12" text-anchor="start" fill="#1d4278" font-weight="bold">Dòng core do Arm thiết kế</text>
  <rect x="14" y="162" width="144" height="70" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.5"/>
  <text x="86" y="184" font-size="12" text-anchor="middle" fill="#b07d12" font-weight="bold">Cortex-A</text>
  <text x="86" y="204" font-size="9.5" text-anchor="middle" fill="#444">ứng dụng: điện thoại,</text>
  <text x="86" y="218" font-size="9.5" text-anchor="middle" fill="#444">PC, ô tô</text>
  <rect x="176" y="162" width="144" height="70" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="248" y="184" font-size="12" text-anchor="middle" fill="#b5483a" font-weight="bold">Cortex-R</text>
  <text x="248" y="204" font-size="9.5" text-anchor="middle" fill="#444">thời gian thực:</text>
  <text x="248" y="218" font-size="9.5" text-anchor="middle" fill="#444">modem, lưu trữ, ô tô</text>
  <rect x="338" y="162" width="144" height="70" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="410" y="184" font-size="12" text-anchor="middle" fill="#2f5d9e" font-weight="bold">Cortex-M</text>
  <text x="410" y="204" font-size="9.5" text-anchor="middle" fill="#444">vi điều khiển, IoT</text>
  <text x="410" y="218" font-size="9.5" text-anchor="middle" fill="#444">(số chip nhiều nhất)</text>
  <rect x="500" y="162" width="144" height="70" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.5"/>
  <text x="572" y="184" font-size="12" text-anchor="middle" fill="#6b4fa3" font-weight="bold">Neoverse</text>
  <text x="572" y="204" font-size="9.5" text-anchor="middle" fill="#444">server, mạng,</text>
  <text x="572" y="218" font-size="9.5" text-anchor="middle" fill="#444">hạ tầng đám mây</text>
  <path d="M 14 250 H 626" fill="none" stroke="#888" stroke-width="1.2"/>
  <text x="330" y="272" font-size="10.5" text-anchor="middle" fill="#444">Ngoài core có sẵn, hãng có architecture license (Apple, Qualcomm...) tự thiết kế core riêng</text>
  <text x="330" y="288" font-size="10.5" text-anchor="middle" fill="#444">nhưng vẫn tuân theo ISA của Arm.</text>
</svg>
