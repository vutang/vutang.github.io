<svg role="img" viewBox="0 0 660 330" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>x86 chồng thêm chế độ 32-bit và 64-bit lên 16-bit cũ, và thêm các tập lệnh vector, ma trận</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="330" rx="8" fill="#ffffff"/>
  <text x="20" y="24" font-size="12" text-anchor="start" fill="#1d4278" font-weight="bold">Chế độ hoạt động (tương thích ngược)</text>
  <rect x="20" y="40" width="330" height="58" rx="8" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.6"/>
  <text x="185.0" y="64" font-size="12" text-anchor="middle" fill="#6b4fa3" font-weight="bold">Long mode 64-bit</text>
  <text x="185.0" y="84" font-size="9.5" text-anchor="middle" fill="#111">AMD64, 2003; chạy được cả mã 32-bit</text>
  <rect x="20" y="110" width="290" height="58" rx="8" fill="#fbeccb" stroke="#b07d12" stroke-width="1.6"/>
  <text x="165.0" y="134" font-size="12" text-anchor="middle" fill="#b07d12" font-weight="bold">Protected mode 32-bit</text>
  <text x="165.0" y="154" font-size="9.5" text-anchor="middle" fill="#111">386, 1985; bộ nhớ ảo, bảo vệ</text>
  <rect x="20" y="180" width="250" height="58" rx="8" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.6"/>
  <text x="145.0" y="204" font-size="12" text-anchor="middle" fill="#2f5d9e" font-weight="bold">Real mode 16-bit</text>
  <text x="145.0" y="224" font-size="9.5" text-anchor="middle" fill="#111">8086, 1978; CPU luôn khởi động ở đây</text>
  <text x="190" y="262" font-size="10.5" text-anchor="middle" fill="#444">Mỗi chế độ mới bao gồm chế độ cũ hơn.</text>
  <text x="400" y="24" font-size="12" text-anchor="start" fill="#1d4278" font-weight="bold">Mở rộng vector và ma trận</text>
  <rect x="400" y="40" width="230" height="36" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.4"/>
  <text x="470" y="63" font-size="11" text-anchor="middle" fill="#2f5d9e" font-weight="bold">MMX</text>
  <text x="580" y="63" font-size="10.5" text-anchor="middle" fill="#111">64-bit</text>
  <line x1="515" y1="76" x2="515" y2="84" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="400" y="84" width="230" height="36" rx="6" fill="#d5ecd9" stroke="#2e7d4f" stroke-width="1.4"/>
  <text x="470" y="107" font-size="11" text-anchor="middle" fill="#2e7d4f" font-weight="bold">SSE</text>
  <text x="580" y="107" font-size="10.5" text-anchor="middle" fill="#111">128-bit</text>
  <line x1="515" y1="120" x2="515" y2="128" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="400" y="128" width="230" height="36" rx="6" fill="#fbeccb" stroke="#b07d12" stroke-width="1.4"/>
  <text x="470" y="151" font-size="11" text-anchor="middle" fill="#b07d12" font-weight="bold">AVX / AVX2</text>
  <text x="580" y="151" font-size="10.5" text-anchor="middle" fill="#111">256-bit</text>
  <line x1="515" y1="164" x2="515" y2="172" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="400" y="172" width="230" height="36" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.4"/>
  <text x="470" y="195" font-size="11" text-anchor="middle" fill="#b5483a" font-weight="bold">AVX-512</text>
  <text x="580" y="195" font-size="10.5" text-anchor="middle" fill="#111">512-bit</text>
  <line x1="515" y1="208" x2="515" y2="216" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="400" y="216" width="230" height="36" rx="6" fill="#e4dcf3" stroke="#6b4fa3" stroke-width="1.4"/>
  <text x="470" y="239" font-size="11" text-anchor="middle" fill="#6b4fa3" font-weight="bold">AMX</text>
  <text x="580" y="239" font-size="10.5" text-anchor="middle" fill="#111">ma trận (tile)</text>
  <text x="515" y="276" font-size="10.5" text-anchor="middle" fill="#6b4fa3" font-weight="bold">Hiện đang hợp nhất: AVX10 và APX</text>
  <text x="330" y="312" font-size="10.5" text-anchor="middle" fill="#444">Mỗi thế hệ CPU hỗ trợ một tập con; phần mềm cần phát hiện tính năng lúc chạy (CPUID).</text>
</svg>
