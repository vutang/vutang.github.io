<svg role="img" viewBox="0 0 960 250" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Bộ đồng bộ hai flip-flop cho tín hiệu một bit</title>
  <rect x="0" y="0" width="960" height="250" rx="8" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">Bộ đồng bộ hai flip-flop</text>
  <rect x="20" y="70" width="230" height="130" rx="6" fill="#fdf1e3" stroke="#1d4278" stroke-width="1.2"/>
  <text x="135" y="95" font-size="12" text-anchor="middle" font-weight="700" fill="#111">Miền clk_a</text>
  <rect x="60" y="120" width="150" height="50" rx="6" fill="#f4f6f9" stroke="#1d4278" stroke-width="1.2"/>
  <text x="135" y="150" font-size="12" text-anchor="middle" fill="#111">FF nguồn (Q)</text>
  <rect x="330" y="70" width="610" height="130" rx="6" fill="#eef7ee" stroke="#1d4278" stroke-width="1.2"/>
  <text x="635" y="95" font-size="12" text-anchor="middle" font-weight="700" fill="#111">Miền clk_b</text>
  <rect x="380" y="120" width="130" height="50" rx="6" fill="#e8f0fb" stroke="#1d4278" stroke-width="1.2"/>
  <text x="445" y="142" font-size="12" text-anchor="middle" font-weight="700" fill="#111">FF1</text>
  <text x="445" y="158" font-size="10" text-anchor="middle" fill="#444">có thể metastable</text>
  <rect x="580" y="120" width="130" height="50" rx="6" fill="#e8f0fb" stroke="#1d4278" stroke-width="1.2"/>
  <text x="645" y="142" font-size="12" text-anchor="middle" font-weight="700" fill="#111">FF2</text>
  <text x="645" y="158" font-size="10" text-anchor="middle" fill="#444">đã ổn định</text>
  <rect x="780" y="120" width="130" height="50" rx="6" fill="#f4f6f9" stroke="#1d4278" stroke-width="1.2"/>
  <text x="845" y="150" font-size="12" text-anchor="middle" fill="#111">Logic clk_b</text>
  <line x1="210" y1="145" x2="378" y2="145" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="510" y1="145" x2="578" y2="145" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="710" y1="145" x2="778" y2="145" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="294" y="136" font-size="10.5" text-anchor="middle" fill="#555">tín hiệu bất đồng bộ</text>
  <text x="635" y="225" font-size="11" text-anchor="middle" fill="#555">Cả FF1 và FF2 cùng nhận clk_b; không đặt logic tổ hợp giữa hai flip-flop</text>
</svg>
