<svg xmlns='http://www.w3.org/2000/svg' viewBox="0 0 400 410" role="img" aria-labelledby="f1t"><style>text{fill:#142033;font-family:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif;font-size:13px;font-weight:500}
text.t14{font-size:14px;font-weight:700}text.t12{font-size:12px;font-weight:400}text.t11{font-size:11px;font-weight:400}
text.b{font-weight:700}text.mut{fill:#55657a}text.mid{text-anchor:middle}text.end{text-anchor:end}
.bx-sw{fill:#dce7ff;stroke:#2f5fe0;stroke-width:1.5}.bx-gpu{fill:#dff2cc;stroke:#4f8f12;stroke-width:1.5}
.bx-hw{fill:#e6ebf1;stroke:#76879b;stroke-width:1.5}.bx-plan{fill:#ffebc7;stroke:#bb7a10;stroke-width:1.5}
.bx-none{fill:none;stroke:#76879b;stroke-width:1.5;stroke-dasharray:6 4}
.arrow{stroke:#55657a;stroke-width:1.8;fill:none}marker path{fill:#55657a}
.dot-gpu{fill:#4f8f12}.dot-plan{fill:#bb7a10}.dot-hw{fill:#76879b}</style><rect x='0' y='0' width='400' height='410' fill='#ffffff'/>
        <title id="f1t">Ba giai đoạn của kiến trúc RAN: RAN chuyên dụng, Cloud RAN, AI-RAN</title>
        <defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker></defs>

        <text x="20" y="20" class="t14">RAN chuyên dụng</text>
        <text x="380" y="20" class="t11 mut end">xử lý trên chip riêng</text>
        <rect class="bx-sw" x="20" y="30" width="360" height="34" rx="10"/>
        <text x="200" y="52" class="mid">Phần mềm RAN</text>
        <rect class="bx-hw" x="20" y="70" width="360" height="34" rx="10"/>
        <text x="200" y="92" class="mid">ASIC / SoC / FPGA chuyên dụng</text>

        <line class="arrow" x1="40" y1="110" x2="40" y2="144" marker-end="url(#a1)"/>
        <text x="56" y="131" class="t12 mut">tách phần mềm khỏi phần cứng chuyên dụng</text>

        <text x="20" y="170" class="t14">Cloud RAN</text>
        <text x="380" y="170" class="t11 mut end">xử lý trên server đa dụng</text>
        <rect class="bx-sw" x="20" y="180" width="360" height="34" rx="10"/>
        <text x="200" y="202" class="mid">Phần mềm RAN</text>
        <rect class="bx-hw" x="20" y="220" width="360" height="34" rx="10"/>
        <text x="200" y="242" class="mid">CPU x86 + accelerator (ví dụ FEC)</text>

        <line class="arrow" x1="40" y1="260" x2="40" y2="294" marker-end="url(#a1)"/>
        <text x="56" y="281" class="t12 mut">đưa xử lý nặng lên GPU</text>

        <text x="20" y="320" class="t14">AI-RAN</text>
        <text x="380" y="320" class="t11 mut end">xử lý trên GPU</text>
        <rect class="bx-sw" x="20" y="330" width="360" height="34" rx="10"/>
        <text x="200" y="352" class="mid">Phần mềm RAN + workload AI</text>
        <rect class="bx-gpu" x="20" y="370" width="360" height="34" rx="10"/>
        <text x="200" y="392" class="mid">GPU + CPU (Nvidia ARC)</text>
      </svg>
