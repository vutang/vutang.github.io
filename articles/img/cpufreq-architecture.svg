<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 730 166" role="img" aria-labelledby="t d" font-family="system-ui,sans-serif">
<title id="t">Kiến trúc ba lớp của cpufreq</title>
<desc id="d">Scheduler, sysfs và thermal/PM QoS đi vào cpufreq core gồm governor và policy; core gửi tần số đích hoặc min/max cộng EPP xuống scaling driver (x86 pstate, cpufreq-dt, driver dựa trên firmware); driver điều khiển phần cứng.</desc>
<style>
.n-box{fill:#f1efe8;stroke:#888780}.n-t{fill:#2c2c2a}.n-s{fill:#5f5e5a}
.p-box{fill:#eeedfe;stroke:#534ab7}.p-in{fill:#fff;stroke:#7f77dd}.p-t{fill:#26215c}.p-it{fill:#3c3489}.p-s{fill:#534ab7}
.t-box{fill:#e1f5ee;stroke:#0f6e56}.t-in{fill:#fff;stroke:#1d9e75}.t-t{fill:#04342c}.t-it{fill:#085041}.t-s{fill:#0f6e56}
.a-box{fill:#faeeda;stroke:#854f0b}.a-t{fill:#412402}.a-s{fill:#633806}
.ln{stroke:#5f5e5a;fill:none}.lbl-t{fill:#444441}.p-ln{stroke:#534ab7;fill:none}.mk{stroke:#5f5e5a;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="mk" d="M1 1L8 5L1 9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="-8" y="-8" width="730" height="166" rx="6" fill="#ffffff"/>
<g font-size="9.5" text-anchor="middle">
<rect class="n-box" x="2" y="12" width="118" height="36" rx="6" stroke-width=".7"/><text class="n-t" x="61" y="28" font-weight="600">Scheduler</text><text class="n-s" x="61" y="41" font-size="8">tín hiệu utilization</text>
<rect class="n-box" x="2" y="57" width="118" height="36" rx="6" stroke-width=".7"/><text class="n-t" x="61" y="73" font-weight="600">sysfs / userspace</text><text class="n-s" x="61" y="86" font-size="8">governor, min/max</text>
<rect class="n-box" x="2" y="102" width="118" height="36" rx="6" stroke-width=".7"/><text class="n-t" x="61" y="118" font-weight="600">thermal / PM QoS</text><text class="n-s" x="61" y="131" font-size="8">giới hạn từ ngoài</text>
<line class="ln" x1="122" y1="30" x2="146" y2="62" stroke-width="1" marker-end="url(#a)"/>
<line class="ln" x1="122" y1="75" x2="146" y2="75" stroke-width="1" marker-end="url(#a)"/>
<line class="ln" x1="122" y1="120" x2="146" y2="88" stroke-width="1" marker-end="url(#a)"/>
<rect class="p-box" x="150" y="6" width="170" height="138" rx="10" stroke-width=".8"/>
<text class="p-t" x="235" y="22" font-weight="600">cpufreq core</text>
<rect class="p-in" x="164" y="31" width="142" height="44" rx="6" stroke-width=".7"/><text class="p-it" x="235" y="49" font-weight="600">Governor</text><text class="p-s" x="235" y="63" font-size="8">schedutil, performance…</text>
<line class="p-ln" x1="235" y1="77" x2="235" y2="89" stroke-width="1" marker-end="url(#a)"/>
<rect class="p-in" x="164" y="92" width="142" height="44" rx="6" stroke-width=".7"/><text class="p-it" x="235" y="110" font-weight="600">Policy</text><text class="p-s" x="235" y="124" font-size="8">min/max theo miền clock</text>
<line class="ln" x1="322" y1="75" x2="384" y2="75" stroke-width="1" marker-end="url(#a)"/>
<text class="lbl-t" x="353" y="58" font-size="7.6">target():</text><text class="lbl-t" x="353" y="67" font-size="7.6">tần số đích</text>
<text class="lbl-t" x="353" y="88" font-size="7.6">setpolicy():</text><text class="lbl-t" x="353" y="97" font-size="7.6">min/max + EPP</text>
<rect class="t-box" x="388" y="6" width="196" height="138" rx="10" stroke-width=".8"/>
<text class="t-t" x="486" y="22" font-weight="600">Scaling driver</text>
<rect class="t-in" x="400" y="29" width="172" height="33" rx="6" stroke-width=".7"/><text class="t-it" x="486" y="43" font-weight="600">x86 pstate</text><text class="t-s" x="486" y="55" font-size="8">intel_pstate, amd-pstate</text>
<rect class="t-in" x="400" y="68" width="172" height="33" rx="6" stroke-width=".7"/><text class="t-it" x="486" y="82" font-weight="600">cpufreq-dt / SoC</text><text class="t-s" x="486" y="94" font-size="8">OPP + clk + regulator</text>
<rect class="t-in" x="400" y="107" width="172" height="33" rx="6" stroke-width=".7"/><text class="t-it" x="486" y="121" font-weight="600">Dựa trên firmware</text><text class="t-s" x="486" y="133" font-size="8">cppc_cpufreq, scmi-cpufreq</text>
<line class="ln" x1="586" y1="75" x2="608" y2="75" stroke-width="1" marker-end="url(#a)"/>
<rect class="a-box" x="612" y="6" width="100" height="138" rx="10" stroke-width=".8"/>
<text class="a-t" x="662" y="22" font-weight="600">Phần cứng</text>
<text class="a-s" x="662" y="50" font-size="8.5">MSR HWP/CPPC</text>
<text class="a-s" x="662" y="72" font-size="8.5">Clock / PLL</text>
<text class="a-s" x="662" y="94" font-size="8.5">Regulator</text>
<text class="a-s" x="662" y="116" font-size="8.5">SMU / SCP</text>
</g>
</svg>
