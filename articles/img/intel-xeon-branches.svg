<svg role="img" aria-label="Từ 2024, Xeon chia thành ba nhánh: P-core, E-core và edge" viewBox="0 0 760 488" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif" font-size="13">
  <rect width="760" height="488" rx="6" fill="#ffffff"/>
  <defs><marker id="xeon-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#111827">Từ 2024, Xeon chia thành ba nhánh: P-core, E-core và edge</text>
  <text x="107" y="64" text-anchor="middle" font-size="12" fill="#4b5563">Đến 2023</text>
  <text x="289" y="64" text-anchor="middle" font-size="12" fill="#4b5563">2024–2025</text>
  <text x="471" y="64" text-anchor="middle" font-size="12" fill="#4b5563">2026</text>
  <text x="653" y="64" text-anchor="middle" font-size="12" fill="#4b5563">2027 (dự kiến)</text>
  <rect x="16" y="80" width="728" height="120" rx="8" fill="#eef2f7"/>
  <rect x="16" y="212" width="728" height="120" rx="8" fill="#eef2f7"/>
  <rect x="16" y="344" width="728" height="120" rx="8" fill="#eef2f7"/>
  <text x="28" y="100" font-size="12" font-weight="600" fill="#4b5563">Nhánh P-core (server)</text>
  <text x="28" y="232" font-size="12" font-weight="600" fill="#4b5563">Nhánh E-core (server)</text>
  <text x="28" y="364" font-size="12" font-weight="600" fill="#4b5563">Nhánh edge và vRAN</text>
  <path d="M190 148H206" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#xeon-arrow)"/>
  <path d="M372 148H570" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#xeon-arrow)"/>
  <path d="M372 280H388" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#xeon-arrow)"/>
  <path d="M190 412H206" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#xeon-arrow)"/>
  <rect x="24" y="112" width="166" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="107" y="136" text-anchor="middle" font-weight="600" fill="#111827">Xeon Scalable 1–5</text><text x="107" y="154" text-anchor="middle" font-size="11.5" fill="#4b5563">5 thế hệ, 2017–2023</text><text x="107" y="170" text-anchor="middle" font-size="11.5" fill="#4b5563">tối đa 64 lõi</text>
  <rect x="206" y="112" width="166" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="289" y="136" text-anchor="middle" font-weight="600" fill="#111827">Xeon 6 (P-core)</text><text x="289" y="154" text-anchor="middle" font-size="11.5" fill="#4b5563">Granite Rapids</text><text x="289" y="170" text-anchor="middle" font-size="11.5" fill="#4b5563">≤ 128 lõi, có AVX-512</text>
  <rect x="570" y="112" width="166" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25" stroke-dasharray="5 4"/><text x="653" y="136" text-anchor="middle" font-weight="600" fill="#111827">Xeon 7</text><text x="653" y="154" text-anchor="middle" font-size="11.5" fill="#4b5563">Diamond Rapids, 18A-P</text><text x="653" y="170" text-anchor="middle" font-size="11.5" fill="#4b5563">≤ 256 lõi, 16 kênh</text>
  <rect x="206" y="244" width="166" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="289" y="268" text-anchor="middle" font-weight="600" fill="#111827">Xeon 6 (E-core)</text><text x="289" y="286" text-anchor="middle" font-size="11.5" fill="#4b5563">Sierra Forest</text><text x="289" y="302" text-anchor="middle" font-size="11.5" fill="#4b5563">≤ 144 lõi, chỉ AVX2</text>
  <rect x="388" y="244" width="166" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="471" y="268" text-anchor="middle" font-weight="600" fill="#111827">Xeon 6+</text><text x="471" y="286" text-anchor="middle" font-size="11.5" fill="#4b5563">Clearwater Forest</text><text x="471" y="302" text-anchor="middle" font-size="11.5" fill="#4b5563">≤ 288 lõi, Intel 18A</text>
  <rect x="24" y="376" width="166" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="107" y="400" text-anchor="middle" font-weight="600" fill="#111827">Ice Lake-D, SPR-EE</text><text x="107" y="418" text-anchor="middle" font-size="11.5" fill="#4b5563">Xeon D-1700/2700</text><text x="107" y="434" text-anchor="middle" font-size="11.5" fill="#4b5563">SPR-EE có vRAN Boost</text>
  <rect x="206" y="376" width="166" height="72" rx="8" fill="#2563eb" fill-opacity=".12" stroke="#2563eb" stroke-width="2"/><text x="289" y="400" text-anchor="middle" font-weight="600" fill="#111827">Xeon 6 SoC</text><text x="289" y="418" text-anchor="middle" font-size="11.5" fill="#111827">Granite Rapids-D, -B</text><text x="289" y="434" text-anchor="middle" font-size="11.5" fill="#111827">≤ 72 lõi, vRAN Boost</text>
</svg>
