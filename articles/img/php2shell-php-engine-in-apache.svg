<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 560' role='img' aria-label='PHP engine nằm trong tiến trình Apache; lỗi ở đó bỏ qua đăng nhập của ứng dụng' font-family='system-ui,sans-serif' font-size='13'><defs><marker id='ca' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8896a4'/></marker></defs><rect x='0' y='0' width='760' height='560' rx='6' fill='#ffffff'/><text x='24' y='28' font-size='15' font-weight='600' fill='#1f2933'>PHP engine nằm trong tiến trình Apache, không phải trong ứng dụng</text><text x='24' y='46' font-size='11.5' font-weight='400' fill='#5b6675'>Ví dụ với mod_php — mô hình PHP chạy trực tiếp trong Apache</text><text x='380' y='70' font-size='11.5' font-weight='400' fill='#5b6675' text-anchor='middle'>Trình duyệt</text><path d='M380 78V108' fill='none' stroke='#8896a4' stroke-width='1.25' marker-end='url(#ca)'/><rect x='40' y='108' width='680' height='230' rx='20' fill='none' stroke='#8896a4' stroke-width='1.25'/><text x='64' y='134' font-size='14' font-weight='600' fill='#1f2933'>Tiến trình Apache</text><text x='64' y='152' font-size='11.5' font-weight='400' fill='#5b6675'>Một tiến trình duy nhất, dùng chung một vùng nhớ</text><rect x='90' y='168' width='600' height='60' rx='10' fill='#2f6fdb' fill-opacity='0.12' stroke='#2f6fdb' stroke-width='1.25'/><text x='390' y='192' font-size='13' font-weight='600' fill='#1f2933' text-anchor='middle'>Nhận và phân loại request</text><text x='390' y='210' font-size='11.5' font-weight='400' fill='#5b6675' text-anchor='middle'>Việc của Apache</text><path d='M390 228V248' fill='none' stroke='#8896a4' stroke-width='1.25' marker-end='url(#ca)'/><rect x='90' y='250' width='600' height='76' rx='10' fill='#c8372d' fill-opacity='0.12' stroke='#c8372d' stroke-width='1.25'/><text x='390' y='274' font-size='13' font-weight='600' fill='#1f2933' text-anchor='middle'>PHP engine (mod_php)</text><text x='390' y='292' font-size='1