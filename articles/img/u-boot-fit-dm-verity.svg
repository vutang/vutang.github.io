<svg role="img" aria-label="Luồng dm-verity trong FIT image" viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <rect width="760" height="400" rx="6" fill="#ffffff"/>
  <defs>
    <marker id="dg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3949ab"/></marker>
  </defs>

  <!-- FIT image -->
  <rect x="14" y="14" width="300" height="290" rx="8" fill="#f5f5f5" stroke="#999"/>
  <text x="26" y="34" font-size="13" font-weight="700" fill="#333">FIT image (trên flash/eMMC)</text>

  <rect x="28" y="46" width="272" height="36" rx="5" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="38" y="62" font-size="11" font-weight="700" fill="#1a237e">configuration</text>
  <text x="38" y="76" font-size="10" fill="#1a237e">chữ ký RSA/ECDSA</text>

  <rect x="28" y="92" width="272" height="30" rx="5" fill="#fff" stroke="#999"/>
  <text x="38" y="111" font-size="11">kernel + hash</text>
  <text x="290" y="111" font-size="10" text-anchor="end" fill="#2e7d32">✓ được ký</text>

  <rect x="28" y="130" width="272" height="30" rx="5" fill="#fff" stroke="#999"/>
  <text x="38" y="149" font-size="11">fdt + hash</text>
  <text x="290" y="149" font-size="10" text-anchor="end" fill="#2e7d32">✓ được ký</text>

  <rect x="28" y="168" width="272" height="124" rx="5" fill="#fff" stroke="#999"/>
  <text x="38" y="186" font-size="11" font-weight="700">rootfs (squashfs/erofs)</text>
  <rect x="40" y="194" width="248" height="34" rx="4" fill="#fff8e1" stroke="#f9a825"/>
  <text x="50" y="209" font-size="10">dữ liệu filesystem + cây hash Merkle</text>
  <text x="50" y="222" font-size="9.5" fill="#8d6e00">U-Boot không hash, kernel kiểm tra</text>
  <rect x="40" y="236" width="248" height="48" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="50" y="252" font-size="10" font-weight="700">node dm-verity</text>
  <text x="50" y="265" font-size="10">roothash, salt, block size</text>
  <text x="50" y="278" font-size="9.5" fill="#2e7d32">✓ được ký (từ v2026.10-rc2)</text>

  <!-- Flow -->
  <g font-size="10.5">
    <rect x="360" y="20" width="386" height="46" rx="6" fill="#e8eaf6" stroke="#3949ab"/>
    <text x="372" y="39" font-weight="700" fill="#1a237e">① U-Boot xác minh chữ ký configuration</text>
    <text x="372" y="56" fill="#1a237e">bao phủ hash kernel, hash fdt và roothash</text>

    <rect x="360" y="86" width="386" height="46" rx="6" fill="#e8eaf6" stroke="#3949ab"/>
    <text x="372" y="105" font-weight="700" fill="#1a237e">② U-Boot sinh bootargs cho kernel</text>
    <text x="372" y="122" fill="#1a237e">dm-mod.create=… roothash …  dm-mod.waitfor=…</text>

    <rect x="360" y="152" width="386" height="62" rx="6" fill="#fff8e1" stroke="#f9a825"/>
    <text x="372" y="171" font-weight="700" fill="#5d4300">③ Kernel dm-verity, mỗi lần đọc một block</text>
    <text x="372" y="188" fill="#5d4300">hash block → so với cây Merkle → lên tới roothash</text>
    <text x="372" y="204" fill="#5d4300">rootfs map thẳng từ FIT qua fitblk, không chép vào RAM</text>

    <rect x="360" y="234" width="386" height="46" rx="6" fill="#ffebee" stroke="#c62828"/>
    <text x="372" y="253" font-weight="700" fill="#b71c1c">④ Block bị sửa → hash không khớp</text>
    <text x="372" y="270" fill="#b71c1c">lỗi I/O, dữ liệu sai không bao giờ tới userspace</text>
  </g>
  <g stroke-width="1.5">
    <line x1="553" y1="66" x2="553" y2="84" stroke="#3949ab" marker-end="url(#db)"/>
    <line x1="553" y1="132" x2="553" y2="150" stroke="#555" marker-end="url(#dg)"/>
    <line x1="553" y1="214" x2="553" y2="232" stroke="#555" marker-end="url(#dg)"/>
    <line x1="300" y1="64" x2="358" y2="44" stroke="#3949ab" stroke-dasharray="4,3" marker-end="url(#db)"/>
    <line x1="288" y1="211" x2="358" y2="186" stroke="#555" stroke-dasharray="4,3" marker-end="url(#dg)"/>
  </g>

  <!-- Attack note -->
  <rect x="14" y="320" width="732" height="66" rx="6" fill="#ffebee" stroke="#c62828" stroke-dasharray="5,3"/>
  <text x="26" y="340" font-size="11" font-weight="700" fill="#b71c1c">Lỗ hổng trước bản vá: node dm-verity nằm ngoài vùng được chữ ký bao phủ</text>
  <text x="26" y="358" font-size="10.5" fill="#b71c1c">Kẻ tấn công ghi được flash: thay rootfs → tính lại cây hash → ghi roothash mới vào node dm-verity.</text>
  <text x="26" y="375" font-size="10.5" fill="#b71c1c">Chữ ký configuration vẫn hợp lệ, và dm-verity xác nhận rootfs độc hại là hợp lệ.</text>
</svg>
