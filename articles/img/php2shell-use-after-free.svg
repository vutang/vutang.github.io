'80' rx='10' fill='none' stroke='#c8372d' stroke-width='1.25' stroke-dasharray='4 4'/><text x='380' y='142' font-size='13' font-weight='400' fill='#1f2933' text-anchor='middle'>Vùng nhớ</text><text x='380' y='162' font-size='11.5' font-weight='400' fill='#5b6675' text-anchor='middle'>trống, đã thu hồi</text><path d='M380 220V250' fill='none' stroke='#c8372d' stroke-width='1.25' stroke-dasharray='4 4' marker-end='url(#ua)'/><rect x='330' y='252' width='100' height='40' rx='8' fill='none' stroke='#c8372d' stroke-width='1.25'/><text x='380' y='276' font-size='13' font-weight='400' fill='#1f2933' text-anchor='middle'>con trỏ</text><text x='380' y='304' font-size='11.5' font-weight='400' fill='#5b6675' text-anchor='middle'>vẫn trỏ tới chỗ đó</text><text x='620' y='90' font-size='13' font-weight='600' fill='#1f2933' text-anchor='middle'>Cấp cho dữ liệu khác</text><rect x='530' y='110' width='180' height='80' rx='10' fill='#2f6fdb' fill-opacity='0.12' stroke='#2f6fdb' stroke-width='2'/><text x='620' y='142' font-size='13' font-weight='400' fill='#1f2933' text-anchor='middle'>Dữ liệu khác</text><text x='620' y='162' font-size='11.5' font-weight='400' fill='#5b6675' text-anchor='middle'>đã chiếm chỗ cũ</text><path d='M620 220V250' fill='none' stroke='#c8372d' stroke-width='1.25' stroke-dasharray='4 4' marker-end='url(#ua)'/><rect x='570' y='252' width='100' height='40' rx='8' fill='none' stroke='#c8372d' stroke-width='1.25'/><text x='620' y='276' font-size='13' font-weight='400' fill='#1f2933' text-anchor='middle'>con trỏ cũ</text><text x='620' y='304' font-size='11.5' font-weight='400' fill='#5b6675' text-anchor='middle'>vẫn trỏ tới đây</text><rect x='410' y='330' width='320' height='48' rx='10' fill='#c8372d' fill-opacity='0.12' stroke='#c8372d' stroke-width='2'/><text x='620' y='359' font-size='13' font-weight='600' fill='#1f2933' text-anchor='middle'>Đọc/ghi nhầm vào đó → UAF</text></svg>
