<svg role="img" aria-label="KGDB chạy trong kernel target, QEMU điều khiển guest từ bên ngoài" viewBox="0 0 760 328" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif" font-size="13">
