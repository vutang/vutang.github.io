  <path d="M204 234H290" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#dbg-arrow)"/><path d="M470 234H556" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#dbg-arrow)"/>
