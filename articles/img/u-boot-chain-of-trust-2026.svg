<svg role="img" aria-label="Chuỗi tin cậy U-Boot trước và sau 2026" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <rect width="760" height="330" rx="6" fill="#ffffff"/>
  <defs>
    <marker id="cg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="cr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>

  <!-- Row 1: before -->
  <text x="14" y="24" font-size="13" font-weight="700" fill="#333">Trước 2026: verified boot dừng ở kernel, còn nhiều đường vòng</text>
  <g font-size="11.5" text-anchor="middle" font-weight="700">
    <rect x="14" y="40" width="104" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32"/><text x="66" y="66">Boot ROM</text>
    <rect x="138" y="40" width="104" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32"/><text x="190" y="66">SPL</text>
    <rect x="262" y="40" width="104" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32"/><text x="314" y="60">TF-A</text><text x="314" y="75">OP-TEE</text>
    <rect x="386" y="40" width="104" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32"/><text x="438" y="66">U-Boot</text>
    <rect x="510" y="40" width="104" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32"/><text x="562" y="60">Kernel</text><text x="562" y="75">+ DTB</text>
    <rect x="634" y="40" width="112" height="44" rx="6" fill="#ffebee" stroke="#c62828" stroke-dasharray="4,3"/><text x="690" y="66" fill="#b71c1c">RootFS</text>
  </g>
  <g stroke-width="1.6">
    <line x1="118" y1="62" x2="136" y2="62" stroke="#2e7d32" marker-end="url(#cg)"/>
    <line x1="242" y1="62" x2="260" y2="62" stroke="#2e7d32" marker-end="url(#cg)"/>
    <line x1="366" y1="62" x2="384" y2="62" stroke="#2e7d32" marker-end="url(#cg)"/>
    <line x1="490" y1="62" x2="508" y2="62" stroke="#2e7d32" marker-end="url(#cg)"/>
    <line x1="614" y1="62" x2="632" y2="62" stroke="#c62828" stroke-dasharray="3,2" marker-end="url(#cr)"/>
  </g>
  <g font-size="10.5" fill="#b71c1c">
    <path d="M190 84 C 190 112, 562 112, 562 86" fill="none" stroke="#c62828" stroke-dasharray="4,3" marker-end="url(#cr)"/>
    <text x="376" y="124" text-anchor="middle">falcon mode: SPL boot trực tiếp Linux, fallback khi lỗi, file args (DTB) chưa ký</text>
    <text x="438" y="140" text-anchor="middle">parser đọc metadata ngoài chữ ký (offset, size)</text>
    <text x="690" y="100" text-anchor="middle">không được kiểm tra</text>
  </g>

  <line x1="14" y1="160" x2="746" y2="160" stroke="#ddd"/>

  <!-- Row 2: after -->
  <text x="14" y="186" font-size="13" font-weight="700" fill="#333">Sau v2026.10: chuỗi phủ tới rootfs, đường vòng bị chặn</text>
  <g font-size="11.5" text-anchor="middle" font-weight="700">
    <rect x="14" y="202" width="104" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32"/><text x="66" y="228">Boot ROM</text>
    <rect x="138" y="202" width="104" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32"/><text x="190" y="228">SPL</text>
    <rect x="262" y="202" width="104" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32"/><text x="314" y="222">TF-A</text><text x="314" y="237">OP-TEE</text>
    <rect x="386" y="202" width="104" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32"/><text x="438" y="228">U-Boot</text>
    <rect x="510" y="202" width="104" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32"/><text x="562" y="222">Kernel</text><text x="562" y="237">+ DTB</text>
    <rect x="634" y="202" width="112" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32"/><text x="690" y="228">RootFS</text>
  </g>
  <g stroke-width="1.6" stroke="#2e7d32">
    <line x1="118" y1="224" x2="136" y2="224" marker-end="url(#cg)"/>
    <line x1="242" y1="224" x2="260" y2="224" marker-end="url(#cg)"/>
    <line x1="366" y1="224" x2="384" y2="224" marker-end="url(#cg)"/>
    <line x1="490" y1="224" x2="508" y2="224" marker-end="url(#cg)"/>
    <line x1="614" y1="224" x2="632" y2="224" marker-end="url(#cg)"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#1b5e20">
    <text x="190" y="264">secure falcon:</text><text x="190" y="277">không fallback,</text><text x="190" y="290">chỉ nhận FIT</text>
    <text x="314" y="264">firewall DDR</text><text x="314" y="277">cô lập vùng</text><text x="314" y="290">TF-A/OP-TEE</text>
    <text x="438" y="264">parser FIT, FS,</text><text x="438" y="277">bootm được</text><text x="438" y="290">hardening</text>
    <text x="690" y="264">dm-verity,</text><text x="690" y="277">roothash nằm</text><text x="690" y="290">trong chữ ký</text>
  </g>
  <text x="380" y="318" font-size="10" text-anchor="middle" fill="#666">Mũi tên xanh: tầng trước xác minh tầng sau. Đỏ nét đứt: chỗ hở.</text>
</svg>
