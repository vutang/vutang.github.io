<svg xmlns='http://www.w3.org/2000/svg' viewBox="0 0 760 372" role='img' aria-label='LUO giữ bộ nhớ và file descriptor qua kexec, workload chỉ dừng trong khoảng ngắn' font-family='system-ui,sans-serif' font-size='12.5'>
<rect x='0' y='0' width='760' height='350' rx='8' fill='#ffffff'/>
<defs><marker id='luo-a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#90a4ae'/></marker></defs>
<text x='24' y='30' font-size='15' font-weight='600' fill='#455a64'>LUO giữ bộ nhớ và file descriptor qua kexec, workload chỉ dừng trong khoảng ngắn</text>
<text x='24' y='50' font-size='11.5' fill='#2c3a42'>Một máy, theo thời gian: luôn chỉ có một kernel chạy</text>
<line x1='120' x2='736' y1='290' y2='290' stroke='#90a4ae' marker-end='url(#luo-a)'/>
<text x='736' y='282' text-anchor='end' font-size='11.5' fill='#2c3a42'>thời gian</text>
<text x='24' y='96' font-size='12.5' font-weight='600' fill='#455a64'>Kernel</text>
<text x='24' y='166' font-size='12.5' font-weight='600' fill='#455a64'>Workload</text>
<text x='24' y='236' font-size='12.5' font-weight='600' fill='#455a64'>RAM giữ lại</text>
<rect x='120' y='72' width='270' height='40' rx='6' fill='none' stroke='#90a4ae' stroke-width='1.25'/>
<text x='255' y='96' text-anchor='middle' font-weight='600' fill='#455a64'>Kernel cũ</text>
<rect x='390' y='72' width='70' height='40' rx='6' fill='#f59e0b' fill-opacity='0.12' stroke='#f59e0b' stroke-width='1.5'/>
<text x='425' y='90' text-anchor='middle' font-size='11.5' font-weight='600' fill='#455a64'>kexec</text>
<text x='425' y='104' text-anchor='middle' font-size='11' fill='#455a64'>đóng băng</text>
<rect x='460' y='72' width='276' height='40' rx='6' fill='none' stroke='#90a4ae' stroke-width='1.25'/>
<text x='598' y='96' text-anchor='middle' font-weight='600' fill='#455a64'>Kernel mới</text>
<rect x='120' y='142' width='250' height='40' rx='6' fill='#14b8a6' fill-opacity='0.12' stroke='#14b8a6' stroke-width='1.5'/>
<text x='245' y='166' text-anchor='middle' fill='#455a64'>VM / workload chạy</text>
<rect x='480' y='142' width='256' height='40' rx='6' fill='#14b8a6' fill-opacity='0.12' stroke='#14b8a6' stroke-width='1.5'/>
<text x='608' y='166' text-anchor='middle' fill='#455a64'>VM / workload chạy tiếp</text>
<line x1='370' x2='480' y1='162' y2='162' stroke='#f59e0b' stroke-width='1.5' stroke-dasharray='4 4'/>
<text x='425' y='196' text-anchor='middle' font-size='11' fill='#2c3a42'>dừng ngắn</text>
<rect x='300' y='212' width='436' height='40' rx='6' fill='#6366f1' fill-opacity='0.14' stroke='#6366f1' stroke-width='1.5'/>
<text x='518' y='236' text-anchor='middle' font-size='11.5' fill='#455a64'>memfd/shmem chứa RAM của VM: KHO đánh dấu, kernel mới không ghi đè</text>
<line x1='300' x2='300' y1='72' y2='262' stroke='#78909c' stroke-width='1' stroke-dasharray='2 3'/>
<line x1='390' x2='390' y1='72' y2='262' stroke='#78909c' stroke-width='1' stroke-dasharray='2 3'/>
<line x1='470' x2='470' y1='72' y2='262' stroke='#78909c' stroke-width='1' stroke-dasharray='2 3'/>
<circle cx='300' cy='62' r='9' fill='#ffffff' stroke='#78909c' stroke-width='1'/>
<text x='300' y='66' text-anchor='middle' font-size='11' font-weight='600' fill='#455a64'>1</text>
<circle cx='390' cy='62' r='9' fill='#ffffff' stroke='#78909c' stroke-width='1'/>
<text x='390' y='66' text-anchor='middle' font-size='11' font-weight='600' fill='#455a64'>2</text>
<circle cx='470' cy='62' r='9' fill='#ffffff' stroke='#78909c' stroke-width='1'/>
<text x='470' y='66' text-anchor='middle' font-size='11' font-weight='600' fill='#455a64'>3</text>
<text x='120' y='316' font-size='11.5' fill='#2c3a42'>(1) Daemon đưa FD vào LUO session.   (2) LUO ghi metadata qua KHO, rồi kexec.</text>
<text x='120' y='336' font-size='11.5' fill='#2c3a42'>(3) Kernel mới boot, daemon lấy lại FD và chạy tiếp workload.</text>
<text id="wm" x="751.2" y="365.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
