<svg role="img" aria-label="Chỉ lớp chính sách thay đổi, kernel giữ nguyên cơ chế nền" viewBox="0 0 760 386" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif" font-size="13">
  <rect width="760" height="364" rx="6" fill="#ffffff"/>
  <defs><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#111827">Chỉ lớp chính sách thay đổi, kernel giữ nguyên cơ chế nền</text>
  <path d="M254 114V130" fill="none" stroke="#6b7280" stroke-width="1.25" marker-start="url(#aa)" marker-end="url(#aa)"/>
  <path d="M254 190V206" fill="none" stroke="#6b7280" stroke-width="1.25" marker-start="url(#aa)" marker-end="url(#aa)"/>
  <path d="M254 266V282" fill="none" stroke="#6b7280" stroke-width="1.25" marker-start="url(#aa)" marker-end="url(#aa)"/>
  <text x="266" y="126" font-size="11.5" fill="#4b5563">BPF maps</text>
  <text x="266" y="202" font-size="11.5" fill="#4b5563">callback sched_ext_ops</text>
  <text x="266" y="278" font-size="11.5" fill="#4b5563">sched_class</text>
  <rect x="24" y="56" width="460" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
  <text x="40" y="80" font-weight="600" fill="#111827">Chương trình userspace (Rust)</text><text x="40" y="96" font-size="11.5" fill="#4b5563">Nạp chương trình BPF, đọc thống kê, có thể tham gia ra quyết định</text>
  <rect x="24" y="132" width="460" height="56" rx="8" fill="#2563eb" fill-opacity=".12" stroke="#2563eb" stroke-width="2"/>
  <text x="40" y="156" font-weight="600" fill="#111827">BPF scheduler (chính sách)</text><text x="40" y="172" font-size="11.5" fill="#111827">Chọn CPU, xếp task vào hàng đợi, chọn task chạy tiếp theo</text>
  <rect x="24" y="208" width="460" height="56" rx="8" fill="#eef2f7" stroke="#6b7280" stroke-width="1.25"/>
  <text x="40" y="232" font-weight="600" fill="#111827">Framework sched_ext (kernel)</text><text x="40" y="248" font-size="11.5" fill="#4b5563">Hàng đợi DSQ, kiểm tra kết quả callback, watchdog tự gỡ khi lỗi</text>
  <rect x="24" y="284" width="460" height="56" rx="8" fill="#eef2f7" stroke="#6b7280" stroke-width="1.25"/>
  <text x="40" y="308" font-weight="600" fill="#111827">Core scheduler (kernel)</text><text x="40" y="324" font-size="11.5" fill="#4b5563">Context switch, runqueue, các lớp RT và deadline</text>
  <path d="M500 60H510V184H500" fill="none" stroke="#2563eb" stroke-width="1.5"/><text x="524" y="118" font-weight="600" fill="#111827">Phần thay được</text><text x="524" y="136" font-size="11.5" fill="#4b5563">nạp và gỡ khi máy đang chạy</text>
  <path d="M500 212H510V336H500" fill="none" stroke="#6b7280" stroke-width="1.5"/><text x="524" y="270" font-weight="600" fill="#111827">Kernel giữ nguyên</text><text x="524" y="288" font-size="11.5" fill="#4b5563">cơ chế nền, không cần build lại</text>
<text id="wm" x="751.2" y="379.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
