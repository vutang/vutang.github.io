<svg xmlns='http://www.w3.org/2000/svg' viewBox="0 0 760 402" role='img' aria-label='Multikernel chia CPU, RAM và device của một máy cho nhiều kernel, không có hypervisor' font-family='system-ui,sans-serif' font-size='12.5'>
<text x='24' y='30' font-size='15' font-weight='600' fill='#455a64'>Multikernel chia CPU, RAM và device của một máy cho nhiều kernel, không có hypervisor</text>
<text x='24' y='50' font-size='11.5' fill='#2c3a42'>Ví dụ máy 8 core; mỗi instance sở hữu riêng phần tài nguyên của mình</text>
<rect x='120' y='70' width='380' height='52' rx='6' fill='#14b8a6' fill-opacity='0.12' stroke='#14b8a6' stroke-width='1.5'/>
<text x='310' y='92' text-anchor='middle' font-weight='600' fill='#455a64'>Predecessor (kernel đang chạy máy)</text>
<text x='310' y='110' text-anchor='middle' font-size='11.5' fill='#455a64'>host kernel, giữ pool tài nguyên</text>
<rect x='540' y='70' width='196' height='52' rx='6' fill='#6366f1' fill-opacity='0.14' stroke='#6366f1' stroke-width='1.5'/>
<text x='638' y='92' text-anchor='middle' font-weight='600' fill='#455a64'>Successor</text>
<text x='638' y='110' text-anchor='middle' font-size='11.5' fill='#455a64'>instance chờ sẵn</text>
<line x1='500' x2='540' y1='96' y2='96' stroke='#90a4ae' stroke-width='1.5'/>
<text x='520' y='140' text-anchor='middle' font-size='11' fill='#2c3a42'>IPI, vsock</text>
<text x='24' y='182' font-size='12.5' font-weight='600' fill='#455a64'>CPU</text>
<text x='24' y='242' font-size='12.5' font-weight='600' fill='#455a64'>RAM</text>
<text x='24' y='302' font-size='12.5' font-weight='600' fill='#455a64'>PCI device</text>
<rect x='120.0' y='160' width='59' height='36' rx='6' fill='#14b8a6' fill-opacity='0.1' stroke='#14b8a6' stroke-width='1.5'/>
