<rect x='638' y='160' width='94' height='36' rx='6' fill='#6366f1' fill-opacity='0.1' stroke='#6366f1' stroke-width='1.5'/>
<text x='685' y='183' text-anchor='middle' font-size='11.5' fill='#455a64'>core 7</text>
<rect x='120' y='220' width='380' height='36' rx='6' fill='#14b8a6' fill-opacity='0.1' stroke='#14b8a6' stroke-width='1.5'/>
<text x='310' y='243' text-anchor='middle' font-size='11.5' fill='#455a64'>Phần lớn RAM</text>
<rect x='540' y='220' width='196' height='36' rx='6' fill='#6366f1' fill-opacity='0.1' stroke='#6366f1' stroke-width='1.5'/>
<text x='638' y='243' text-anchor='middle' font-size='11.5' fill='#455a64'>Vùng RAM riêng</text>
<rect x='120' y='280' width='120' height='36' rx='6' fill='#14b8a6' fill-opacity='0.1' stroke='#14b8a6' stroke-width='1.5'/>
<text x='180' y='303' text-anchor='middle' font-size='11.5' fill='#455a64'>NIC</text>
<rect x='250' y='280' width='120' height='36' rx='6' fill='#14b8a6' fill-opacity='0.1' stroke='#14b8a6' stroke-width='1.5'/>
<text x='310' y='303' text-anchor='middle' font-size='11.5' fill='#455a64'>NVMe</text>
<rect x='380' y='280' width='120' height='36' rx='6' fill='#14b8a6' fill-opacity='0.1' stroke='#14b8a6' stroke-width='1.5'/>
<text x='440' y='303' text-anchor='middle' font-size='11.5' fill='#455a64'>Card tăng tốc</text>
<rect x='540' y='280' width='196' height='36' rx='6' fill='#6366f1' fill-opacity='0.1' stroke='#6366f1' stroke-width='1.5' stroke-dasharray='5 4'/>
<text x='638' y='303' text-anchor='middle' font-size='11.5' fill='#455a64'>Có thể nhận thêm device</text>
<line x1='520' x2='520' y1='150' y2='326' stroke='#90a4ae' stroke-dasharray='4 4'/>
<text x='24' y='350' font-size='11.5' fill='#2c3a42'>Phân chia khai báo bằng device tree qua /sys/fs/multikernel; overlay chuyển tài nguyên giữa các instance khi đang chạy.</text>
<text x='24' y='368' font-size='11.5' fill='#2c3a42'>Mỗi kernel chạy native trên phần cứng của mình: không VM exit, không bảng trang hai tầng.</text>
<text id="wm" x="751.2" y="395.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
