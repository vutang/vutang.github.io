<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="PHP2Shell">
  <defs>
    <linearGradient id="gphp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f1d1d"/><stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <pattern id="pphp" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#fff" fill-opacity=".22"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#gphp)"/>
  <rect width="1200" height="300" fill="url(#pphp)"/>
  <circle cx="1060" cy="60" r="190" fill="#fff" fill-opacity=".08"/>
  <circle cx="1130" cy="270" r="120" fill="#fff" fill-opacity=".08"/>
  <text x="64" y="86" fill="#fff" fill-opacity=".85" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="600" letter-spacing="3">SECURITY</text>
  <text x="64" y="180" fill="#fff" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="84" font-weight="800">PHP2Shell</text>
  <text x="66" y="236" fill="#fff" fill-opacity=".9" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="30">Từ lỗi sử dụng bộ nhớ đến thực thi mã từ xa trên server</text>
</svg>
