<svg xmlns='http://www.w3.org/2000/svg' viewBox="0 0 760 398" role='img' aria-label='Successor dừng CPU cũ trước, chặn DMA, rồi mới nhận RAM' font-family='system-ui,sans-serif' font-size='13'>
<defs><marker id='tk-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#90a4ae'/></marker></defs>
<text x='24' y='30' font-size='15' font-weight='600' fill='#455a64'>Successor dừng CPU cũ trước, chặn DMA, rồi mới nhận RAM</text>
<text x='24' y='52' font-size='11.5' fill='#78909c'>Trình tự takeover của kmorphd; từ lúc phát hiện đến khi successor chạy khoảng 1 giây theo README</text>
<g fill='none' stroke='#90a4ae' stroke-width='1.25'>
<path d='M184 112H204' marker-end='url(#tk-arrow)'/>
<path d='M366 112H386' marker-end='url(#tk-arrow)'/>
<path d='M548 112H568' marker-end='url(#tk-arrow)'/>
<path d='M650 140V182' marker-end='url(#tk-arrow)'/>
<path d='M570 212H550' marker-end='url(#tk-arrow)'/>
<path d='M388 212H368' marker-end='url(#tk-arrow)'/>
<path d='M206 212H186' marker-end='url(#tk-arrow)'/>
<path d='M104 240V292' marker-end='url(#tk-arrow)'/>
<path d='M364 322H386' marker-end='url(#tk-arrow)'/>
</g>
<rect x='24' y='84' width='160' height='56' rx='8' fill='none' stroke='#90a4ae' stroke-width='1.25'/>
<text x='104' y='108' text-anchor='middle' font-weight='600' fill='#455a64'>1. Detect</text>
<text x='104' y='126' text-anchor='middle' font-size='11.5' fill='#78909c'>~0,5 s im lặng qua vsock</text>
<rect x='206' y='84' width='160' height='56' rx='8' fill='#14b8a6' fill-opacity='0.12' stroke='#14b8a6' stroke-width='2'/>
<text x='286' y='108' text-anchor='middle' font-weight='600' fill='#455a64'>2. Fence CPU</text>
<text x='286' y='126' text-anchor='middle' font-size='11.5' fill='#455a64'>dừng và xác nhận từng core</text>
<rect x='388' y='84' width='160' height='56' rx='8' fill='none' stroke='#90a4ae' stroke-width='1.25'/>
<text x='468' y='108' text-anchor='middle' font-weight='600' fill='#455a64'>3. Adopt device</text>
<text x='468' y='126' text-anchor='middle' font-size='11.5' fill='#78909c'>reset, tắt bus master</text>
<rect x='570' y='84' width='160' height='56' rx='8' fill='none' stroke='#90a4ae' stroke-width='1.25'/>
<text x='650' y='108' text-anchor='middle' font-weight='600' fill='#455a64'>4. IOMMU</text>
<text x='650' y='126' text-anchor='middle' font-size='11.5' fill='#78909c'>chuyển sang bảng riêng</text>
<rect x='570' y='184' width='160' height='56' rx='8' fill='none' stroke='#90a4ae' stroke-width='1.25'/>
<text x='650' y='208' text-anchor='middle' font-weight='600' fill='#455a64'>5. Khôi phục mạng</text>
<text x='650' y='226' text-anchor='middle' font-size='11.5' fill='#78909c'>MAC, địa chỉ, route</text>
<rect x='388' y='184' width='160' height='56' rx='8' fill='none' stroke='#90a4ae' stroke-width='1.25'/>
<text x='468' y='208' text-anchor='middle' font-weight='600' fill='#455a64'>6. Nhận CPU, RAM</text>
<text x='468' y='226' text-anchor='middle' font-size='11.5' fill='#78909c'>hot-add theo granule</text>
<rect x='206' y='184' width='160' height='56' rx='8' fill='none' stroke='#90a4ae' stroke-width='1.25'/>
<text x='286' y='208' text-anchor='middle' font-weight='600' fill='#455a64'>7. Dump vmcore</text>
<text x='286' y='226' text-anchor='middle' font-size='11.5' fill='#78909c'>tùy chọn, kiểu kdump</text>
<rect x='24' y='184' width='160' height='56' rx='8' fill='none' stroke='#90a4ae' stroke-width='1.25'/>
<text x='104' y='208' text-anchor='middle' font-weight='600' fill='#455a64'>8. Console</text>
<text x='104' y='226' text-anchor='middle' font-size='11.5' fill='#78909c'>login trên serial</text>
<rect x='24' y='294' width='340' height='56' rx='8' fill='none' stroke='#90a4ae' stroke-width='1.25'/>
<text x='194' y='318' text-anchor='middle' font-weight='600' fill='#455a64'>User space chạy lại từ disk</text>
<text x='194' y='336' text-anchor='middle' font-size='11.5' fill='#78909c'>standby services chạy tiếp qua pivot_root</text>
<rect x='388' y='294' width='342' height='56' rx='8' fill='none' stroke='#90a4ae' stroke-width='1.25'/>
<text x='559' y='318' text-anchor='middle' font-weight='600' fill='#455a64'>Arm successor thế hệ N+1</text>
<text x='559' y='336' text-anchor='middle' font-size='11.5' fill='#78909c'>kmorph.service; máy lại được bảo vệ</text>
<text x='24' y='272' font-size='11.5' fill='#78909c'>Sau takeover</text>
<text id="wm" x="751.2" y="391.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
