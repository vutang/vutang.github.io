<svg role="img" viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Observer: temp_publish() gọi mọi callback đã đăng ký</title>
  <rect x="0" y="0" width="640" height="250" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker></defs>
  <rect x="225" y="14" width="190" height="46" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.2"/>
  <text x="320.0" y="33.8" font-size="11" text-anchor="middle" font-weight="700" fill="#111">temp_publish(t)</text>
  <text x="320.0" y="47.2" font-size="9.5" text-anchor="middle" fill="#111">Subject: không biết ai nghe</text>
  <line x1="320" y1="60" x2="320" y2="96" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="215" y="98" width="210" height="54" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
  <text x="320.0" y="121.8" font-size="11" text-anchor="middle" font-weight="700" fill="#111">subs[] : { cb, ctx }</text>
  <text x="320.0" y="135.2" font-size="9.5" text-anchor="middle" fill="#111">mảng tĩnh, MAX_SUBS</text>
  <text x="110" y="120" font-size="9.5" text-anchor="middle" fill="#444">đăng ký lúc init:</text>
  <text x="110" y="134" font-size="9" text-anchor="middle" fill="#444" font-family="DejaVu Sans Mono, monospace">temp_subscribe(cb, ctx)</text>
  <rect x="36" y="196" width="168" height="40" rx="6" fill="#d4ecdc" stroke="#2e7d4f" stroke-width="1.2"/>
  <text x="120.0" y="219.2" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111">fan_on_temp()</text>
  <line x1="320" y1="152" x2="120" y2="194" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="236" y="196" width="168" height="40" rx="6" fill="#d4ecdc" stroke="#2e7d4f" stroke-width="1.2"/>
  <text x="320.0" y="219.2" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111">alarm_on_temp()</text>
  <line x1="320" y1="152" x2="320" y2="194" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="436" y="196" width="168" height="40" rx="6" fill="#d4ecdc" stroke="#2e7d4f" stroke-width="1.2"/>
  <text x="520.0" y="219.2" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111">logger_on_temp()</text>
  <line x1="320" y1="152" x2="520" y2="194" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
