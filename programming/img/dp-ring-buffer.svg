<svg role="img" viewBox="0 0 700 225" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Ring buffer SPSC: producer ghi ở head, consumer đọc ở tail</title>
  <rect x="0" y="0" width="700" height="225" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker></defs>
  <rect x="16" y="70" width="128" height="50" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.2"/>
  <text x="80.0" y="91.7" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111">Producer (ISR)</text>
  <text x="80.0" y="105.0" font-size="9.5" text-anchor="middle" fill="#111">chỉ ghi ở head</text>
  <text x="80" y="140" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">buf[head] = x;</text>
  <text x="80" y="154" font-size="8.5" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">head = (head+1) &amp; MASK</text>
  <rect x="556" y="70" width="128" height="50" rx="6" fill="#d4ecdc" stroke="#2e7d4f" stroke-width="1.2"/>
  <text x="620.0" y="91.7" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111">Consumer (main)</text>
  <text x="620.0" y="105.0" font-size="9.5" text-anchor="middle" fill="#111">chỉ đọc ở tail</text>
  <text x="620" y="140" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">x = buf[tail];</text>
  <text x="620" y="154" font-size="8.5" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">tail = (tail+1) &amp; MASK</text>
  <rect x="182" y="75" width="42" height="40" rx="0" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="203.0" y="130" font-size="9" text-anchor="middle" fill="#555">0</text>
  <rect x="224" y="75" width="42" height="40" rx="0" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="245.0" y="130" font-size="9" text-anchor="middle" fill="#555">1</text>
  <rect x="266" y="75" width="42" height="40" rx="0" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <text x="287.0" y="99" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">d0</text>
  <text x="287.0" y="130" font-size="9" text-anchor="middle" fill="#555">2</text>
  <rect x="308" y="75" width="42" height="40" rx="0" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <text x="329.0" y="99" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">d1</text>
  <text x="329.0" y="130" font-size="9" text-anchor="middle" fill="#555">3</text>
  <rect x="350" y="75" width="42" height="40" rx="0" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <text x="371.0" y="99" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">d2</text>
  <text x="371.0" y="130" font-size="9" text-anchor="middle" fill="#555">4</text>
  <rect x="392" y="75" width="42" height="40" rx="0" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="413.0" y="130" font-size="9" text-anchor="middle" fill="#555">5</text>
  <rect x="434" y="75" width="42" height="40" rx="0" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="455.0" y="130" font-size="9" text-anchor="middle" fill="#555">6</text>
  <rect x="476" y="75" width="42" height="40" rx="0" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="497.0" y="130" font-size="9" text-anchor="middle" fill="#555">7</text>
  <line x1="287.0" y1="40" x2="287.0" y2="72" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="287.0" y="34" font-size="10" text-anchor="middle" font-weight="700" fill="#111" font-family="DejaVu Sans Mono, monospace">tail</text>
  <line x1="413.0" y1="40" x2="413.0" y2="72" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="413.0" y="34" font-size="10" text-anchor="middle" font-weight="700" fill="#111" font-family="DejaVu Sans Mono, monospace">head</text>
  <text x="350" y="150" font-size="9" text-anchor="middle" fill="#555">N = 8 (lũy thừa của 2)</text>
  <line x1="144" y1="95" x2="180" y2="95" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="518" y1="95" x2="554" y2="95" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M497.0,162 C497.0,205 203.0,205 203.0,166" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="350" y="214" font-size="9" text-anchor="middle" fill="#555">quay vòng về 0 nhờ &amp; MASK</text>
</svg>
