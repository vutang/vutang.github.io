<svg role="img" viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Event-driven: ISR chỉ đẩy event vào hàng đợi, main() dispatch</title>
  <rect x="0" y="0" width="640" height="230" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker></defs>
  <rect x="16" y="24" width="124" height="40" rx="6" fill="#ececec" stroke="#777777" stroke-width="1.2"/>
  <text x="78.0" y="47.1" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111">UART RX ISR</text>
  <line x1="140" y1="44" x2="188" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="16" y="90" width="124" height="40" rx="6" fill="#ececec" stroke="#777777" stroke-width="1.2"/>
  <text x="78.0" y="113.2" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111">Timer ISR</text>
  <line x1="140" y1="110" x2="188" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="16" y="156" width="124" height="40" rx="6" fill="#ececec" stroke="#777777" stroke-width="1.2"/>
  <text x="78.0" y="179.2" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111">GPIO ISR</text>
  <line x1="140" y1="176" x2="188" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="190" y="82" width="136" height="66" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
  <text x="258.0" y="105.3" font-size="11" text-anchor="middle" font-weight="700" fill="#111">Hàng đợi event</text>
  <text x="258.0" y="118.8" font-size="9.5" text-anchor="middle" fill="#111">ring buffer tĩnh</text>
  <text x="258.0" y="131.8" font-size="9.5" text-anchor="middle" fill="#111">event_t { sig, data }</text>
  <line x1="326" y1="115" x2="364" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="366" y="92" width="110" height="46" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.2"/>
  <text x="421.0" y="111.7" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111">main()</text>
  <text x="421.0" y="125.0" font-size="9.5" text-anchor="middle" fill="#111">dispatch()</text>
  <rect x="510" y="24" width="114" height="40" rx="6" fill="#d4ecdc" stroke="#2e7d4f" stroke-width="1.2"/>
  <text x="567.0" y="47.1" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111">Xử lý UART</text>
  <line x1="476" y1="115" x2="508" y2="44" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="510" y="90" width="114" height="40" rx="6" fill="#d4ecdc" stroke="#2e7d4f" stroke-width="1.2"/>
  <text x="567.0" y="113.2" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111">Xử lý Timer</text>
  <line x1="476" y1="115" x2="508" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="510" y="156" width="114" height="40" rx="6" fill="#d4ecdc" stroke="#2e7d4f" stroke-width="1.2"/>
  <text x="567.0" y="179.2" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111">Xử lý GPIO</text>
  <line x1="476" y1="115" x2="508" y2="176" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="320" y="222" font-size="9" text-anchor="middle" font-style="italic" fill="#555">hết event: CPU ngủ (WFI) đến ngắt kế tiếp</text>
