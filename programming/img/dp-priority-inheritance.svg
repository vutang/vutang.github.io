<svg role="img" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Priority inversion và priority inheritance trên trục thời gian</title>
  <rect x="0" y="0" width="640" height="300" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker></defs>
  <text x="16" y="24" font-size="11" text-anchor="start" font-weight="700" fill="#111">Không có priority inheritance: H chờ 3,5 đơn vị</text>
  <text x="112" y="48" font-size="9.5" text-anchor="end" fill="#111">H (cao)</text>
  <text x="112" y="74" font-size="9.5" text-anchor="end" fill="#111">M (trung bình)</text>
  <text x="112" y="100" font-size="9.5" text-anchor="end" fill="#111">L (thấp)</text>
  <rect x="120" y="87" width="66" height="18" rx="2" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.2"/>
  <text x="153.0" y="100" font-size="8.5" text-anchor="middle" fill="#111">giữ lock</text>
  <rect x="186" y="35" width="33.0" height="18" rx="2" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <line x1="219.0" y1="44" x2="450" y2="44" stroke="#b42318" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="334.5" y="41" font-size="8.5" text-anchor="middle" fill="#b42318">H bị chặn chờ lock</text>
  <rect x="219.0" y="87" width="33.0" height="18" rx="2" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.2"/>
  <rect x="252" y="61" width="132" height="18" rx="2" fill="#d4ecdc" stroke="#2e7d4f" stroke-width="1.2"/>
  <text x="318.0" y="74" font-size="8.5" text-anchor="middle" fill="#111">M chen vào</text>
  <rect x="384" y="87" width="66" height="18" rx="2" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.2"/>
  <text x="417.0" y="100" font-size="8.5" text-anchor="middle" fill="#111">unlock</text>
  <rect x="450" y="35" width="66" height="18" rx="2" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <text x="16" y="144" font-size="11" text-anchor="start" font-weight="700" fill="#111">Có priority inheritance: H chờ 1 đơn vị</text>
  <text x="112" y="168" font-size="9.5" text-anchor="end" fill="#111">H (cao)</text>
  <text x="112" y="194" font-size="9.5" text-anchor="end" fill="#111">M (trung bình)</text>
  <text x="112" y="220" font-size="9.5" text-anchor="end" fill="#111">L (thấp)</text>
  <rect x="120" y="207" width="66" height="18" rx="2" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.2"/>
  <text x="153.0" y="220" font-size="8.5" text-anchor="middle" fill="#111">giữ lock</text>
  <rect x="186" y="155" width="33.0" height="18" rx="2" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <line x1="219.0" y1="164" x2="285.0" y2="164" stroke="#b42318" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="252.0" y="161" font-size="8.5" text-anchor="middle" fill="#b42318">chờ</text>
  <rect x="219.0" y="207" width="66" height="18" rx="2" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <text x="252" y="220" font-size="8.5" text-anchor="middle" fill="#111">L mượn mức H</text>
  <rect x="285.0" y="155" width="66.0" height="18" rx="2" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <line x1="252" y1="190" x2="351.0" y2="190" stroke="#b42318" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="301.5" y="187" font-size="8.5" text-anchor="middle" fill="#b42318">M phải chờ</text>
  <rect x="351.0" y="181" width="132.0" height="18" rx="2" fill="#d4ecdc" stroke="#2e7d4f" stroke-width="1.2"/>
  <rect x="483.0" y="207" width="66.0" height="18" rx="2" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.2"/>
  <line x1="120" y1="262" x2="555.5999999999999" y2="262" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="561.5999999999999" y="266" font-size="9" text-anchor="start" fill="#555">thời gian</text>
  <line x1="120" y1="258" x2="120" y2="266" stroke="#555"/>
  <text x="120" y="278" font-size="8.5" text-anchor="middle" fill="#555">0</text>
  <line x1="186" y1="258" x2="186" y2="266" stroke="#555"/>
  <text x="186" y="278" font-size="8.5" text-anchor="middle" fill="#555">1</text>
  <line x1="252" y1="258" x2="252" y2="266" stroke="#555"/>
  <text x="252" y="278" font-size="8.5" text-anchor="middle" fill="#555">2</text>
  <line x1="318" y1="258" x2="318" y2="266" stroke="#555"/>
  <text x="318" y="278" font-size="8.5" text-anchor="middle" fill="#555">3</text>
  <line x1="384" y1="258" x2="384" y2="266" stroke="#555"/>
  <text x="384" y="278" font-size="8.5" text-anchor="middle" fill="#555">4</text>
  <line x1="450" y1="258" x2="450" y2="266" stroke="#555"/>
  <text x="450" y="278" font-size="8.5" text-anchor="middle" fill="#555">5</text>
  <line x1="516" y1="258" x2="516" y2="266" stroke="#555"/>
  <text x="516" y="278" font-size="8.5" text-anchor="middle" fill="#555">6</text>
</svg>
