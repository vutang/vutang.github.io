<svg role="img" viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>State machine đồng bộ GNSS: FREERUN, LOCKED, HOLDOVER</title>
  <rect x="0" y="0" width="640" height="250" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker></defs>
  <circle cx="95" cy="30" r="7" fill="#333"/>
  <line x1="95" y1="37" x2="95" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="30" y="90" width="130" height="50" rx="6" fill="#ececec" stroke="#777777" stroke-width="1.2"/>
  <text x="95.0" y="111.8" font-size="11" text-anchor="middle" font-weight="700" fill="#111">FREERUN</text>
  <text x="95.0" y="125.2" font-size="9.5" text-anchor="middle" fill="#111">chạy tự do</text>
  <rect x="255" y="90" width="130" height="50" rx="6" fill="#d4ecdc" stroke="#2e7d4f" stroke-width="1.2"/>
  <text x="320.0" y="111.8" font-size="11" text-anchor="middle" font-weight="700" fill="#111">LOCKED</text>
  <text x="320.0" y="125.2" font-size="9.5" text-anchor="middle" fill="#111">bám GNSS</text>
  <rect x="480" y="90" width="130" height="50" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <text x="545.0" y="111.8" font-size="11" text-anchor="middle" font-weight="700" fill="#111">HOLDOVER</text>
  <text x="545.0" y="125.2" font-size="9.5" text-anchor="middle" fill="#111">giữ tần số đã học</text>
  <line x1="160" y1="108" x2="253" y2="108" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="206" y="88" font-size="9.5" text-anchor="middle" font-weight="700" fill="#111" font-family="DejaVu Sans Mono, monospace">E_LOCK</text>
  <text x="206" y="100" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">alarm_clear</text>
  <line x1="385" y1="104" x2="478" y2="104" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="431" y="84" font-size="9.5" text-anchor="middle" font-weight="700" fill="#111" font-family="DejaVu Sans Mono, monospace">E_LOST</text>
  <text x="431" y="96" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">ho_timer_start</text>
  <line x1="478" y1="126" x2="387" y2="126" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="431" y="141" font-size="9.5" text-anchor="middle" font-weight="700" fill="#111" font-family="DejaVu Sans Mono, monospace">E_LOCK</text>
  <text x="431" y="153" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">ho_timer_stop</text>
  <path d="M545,140 C545,212 95,212 95,143" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="320" y="212" font-size="9.5" text-anchor="middle" font-weight="700" fill="#111" font-family="DejaVu Sans Mono, monospace">E_TMO</text>
  <text x="320" y="225" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">alarm_raise</text>
  <text x="320" y="242" font-size="8.5" text-anchor="middle" font-style="italic" fill="#666">mỗi mũi tên: sự kiện / hành động</text>
</svg>
