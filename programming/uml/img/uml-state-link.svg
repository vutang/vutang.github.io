<svg role="img" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>State machine diagram: trạng thái của một liên kết truyền thông</title>
  <rect x="0" y="0" width="700" height="260" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <circle cx="40" cy="110" r="9" fill="#333"/>
  <line x1="49" y1="110" x2="88" y2="110" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <g font-size="11" fill="#111" text-anchor="middle">
    <rect x="90" y="88" width="120" height="44" rx="16" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.3"/><text x="150" y="114" font-weight="700">Idle</text>
    <rect x="300" y="88" width="130" height="44" rx="16" fill="#fde68a" stroke="#b45309" stroke-width="1.3"/><text x="365" y="108" font-weight="700">Connecting</text>
    <text x="365" y="123" font-size="9" fill="#444" font-family="DejaVu Sans Mono, monospace">entry / start_timer()</text>
    <rect x="530" y="88" width="130" height="44" rx="16" fill="#d4ecdc" stroke="#2e7d4f" stroke-width="1.3"/><text x="595" y="114" font-weight="700">Connected</text>
  </g>
  <g stroke="#333" stroke-width="1.4" fill="none">
    <line x1="210" y1="104" x2="298" y2="104" marker-end="url(#a)"/>
    <line x1="430" y1="104" x2="528" y2="104" marker-end="url(#a)"/>
    <path d="M330,132 C300,190 190,190 165,134" marker-end="url(#a)"/>
    <path d="M595,132 C580,230 170,230 140,134" marker-end="url(#a)"/>
    <path d="M330,88 C310,40 390,40 372,86" marker-end="url(#a)"/>
  </g>
  <g font-size="9.5" fill="#111" font-family="DejaVu Sans Mono, monospace" text-anchor="middle">
    <text x="254" y="97">open</text>
    <text x="482" y="97" font-size="9">ack / stop_timer()</text>
    <text x="255" y="156">timeout [retry ≥ 3]</text>
    <text x="370" y="214">close / flush()</text>
    <text x="350" y="36">timeout [retry &lt; 3] / resend()</text>
  </g>
  <text x="350" y="248" font-size="9.5" text-anchor="middle" fill="#444">Nhãn transition: event [guard] / action</text>
</svg>
