<svg role="img" viewBox="0 0 780 330" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Ký hiệu class và sáu loại quan hệ trong class diagram</title>
  <rect x="0" y="0" width="780" height="330" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.3"/></marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L11,6 L0,12 z" fill="#fff" stroke="#333" stroke-width="1.2"/></marker>
    <marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto"><path d="M1,5 L8,0 L15,5 L8,10 z" fill="#fff" stroke="#333" stroke-width="1.2"/></marker>
    <marker id="diaf" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto"><path d="M1,5 L8,0 L15,5 L8,10 z" fill="#333" stroke="#333" stroke-width="1.2"/></marker>
  </defs>
  <!-- class box -->
  <g font-size="10.5" fill="#111">
    <rect x="20" y="20" width="200" height="130" fill="#fde68a" stroke="#b45309" stroke-width="1.4"/>
    <text x="120" y="40" text-anchor="middle" font-weight="700">UartDriver</text>
    <line x1="20" y1="50" x2="220" y2="50" stroke="#b45309"/>
    <text x="30" y="68" font-family="DejaVu Sans Mono, monospace" font-size="10">- baud : uint32</text>
    <text x="30" y="84" font-family="DejaVu Sans Mono, monospace" font-size="10">- rx_buf : RingBuffer</text>
    <line x1="20" y1="94" x2="220" y2="94" stroke="#b45309"/>
    <text x="30" y="112" font-family="DejaVu Sans Mono, monospace" font-size="10">+ init(baud) : int</text>
    <text x="30" y="128" font-family="DejaVu Sans Mono, monospace" font-size="10">+ send(buf, n) : int</text>
    <text x="30" y="144" font-family="DejaVu Sans Mono, monospace" font-size="10"># on_irq() : void</text>
    <text x="120" y="172" text-anchor="middle" font-size="9.5" fill="#444">tên / thuộc tính / thao tác</text>
    <text x="120" y="188" text-anchor="middle" font-size="9.5" fill="#444">+ public  - private  # protected  ~ package</text>
  </g>
  <!-- relationships -->
  <g font-size="10.5" fill="#111" stroke-width="1.4">
    <text x="260" y="30" font-weight="700">Quan hệ</text>
    <text x="560" y="30" font-weight="700">Ý nghĩa</text>
    <line x1="260" y1="56" x2="440" y2="56" stroke="#333"/>
    <text x="454" y="60">Association</text><text x="560" y="60" font-size="9.5" fill="#444">hai class liên kết lâu dài</text>
    <line x1="260" y1="96" x2="440" y2="96" stroke="#333" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <text x="454" y="100">Dependency</text><text x="560" y="100" font-size="9.5" fill="#444">dùng tạm (tham số, biến cục bộ)</text>
    <line x1="274" y1="136" x2="440" y2="136" stroke="#333" marker-start="url(#dia)"/>
    <text x="454" y="140">Aggregation</text><text x="560" y="140" font-size="9.5" fill="#444">toàn thể và bộ phận, sở hữu lỏng</text>
    <line x1="274" y1="176" x2="440" y2="176" stroke="#333" marker-start="url(#diaf)"/>
    <text x="454" y="180">Composition</text><text x="560" y="180" font-size="9.5" fill="#444">bộ phận sống chết theo toàn thể</text>
    <line x1="260" y1="216" x2="438" y2="216" stroke="#333" marker-end="url(#tri)"/>
    <text x="454" y="220">Generalization</text><text x="560" y="220" font-size="9.5" fill="#444">kế thừa (is-a)</text>
    <line x1="260" y1="256" x2="438" y2="256" stroke="#333" stroke-dasharray="6 4" marker-end="url(#tri)"/>
    <text x="454" y="260">Realization</text><text x="560" y="260" font-size="9.5" fill="#444">hiện thực một interface</text>
  </g>
  <text x="390" y="306" font-size="9.5" text-anchor="middle" fill="#444">Đầu hình thoi nằm ở phía class toàn thể; đầu tam giác chỉ về class cha hoặc interface.</text>
</svg>
