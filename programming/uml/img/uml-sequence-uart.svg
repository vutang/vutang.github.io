<svg role="img" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Sequence diagram: ứng dụng gửi dữ liệu qua UART driver dùng ngắt</title>
  <rect x="0" y="0" width="680" height="360" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="fill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.3"/></marker>
  </defs>
  <g font-size="11" fill="#111" font-weight="700" text-anchor="middle">
    <rect x="50" y="14" width="120" height="32" rx="4" fill="#d3e3f7" stroke="#2f5d9e"/><text x="110" y="34">app</text>
    <rect x="270" y="14" width="140" height="32" rx="4" fill="#fde68a" stroke="#b45309"/><text x="340" y="34">uart_driver</text>
    <rect x="510" y="14" width="120" height="32" rx="4" fill="#d4ecdc" stroke="#2e7d4f"/><text x="570" y="34">UART HW</text>
  </g>
  <g stroke="#888" stroke-dasharray="4 4"><line x1="110" y1="46" x2="110" y2="346"/><line x1="340" y1="46" x2="340" y2="346"/><line x1="570" y1="46" x2="570" y2="346"/></g>
  <g fill="#fff" stroke="#333"><rect x="104" y="70" width="12" height="230"/><rect x="334" y="76" width="12" height="62"/><rect x="334" y="204" width="12" height="60"/></g>
  <g font-size="10" fill="#111" stroke-width="1.3">
    <line x1="116" y1="80" x2="332" y2="80" stroke="#333" marker-end="url(#fill)"/>
    <text x="224" y="74" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">send(buf, n)</text>
    <line x1="346" y1="104" x2="568" y2="104" stroke="#333" marker-end="url(#fill)"/>
    <text x="457" y="98" text-anchor="middle">ghi DR, bật TXE IRQ</text>
    <line x1="332" y1="134" x2="118" y2="134" stroke="#333" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <text x="224" y="128" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">return 0</text>
    <rect x="300" y="160" width="350" height="122" fill="none" stroke="#2f5d9e" stroke-width="1.2"/>
    <path d="M300,160 h58 v12 l-8,8 h-50 z" fill="#e6effa" stroke="#2f5d9e"/>
    <text x="306" y="175" font-weight="700" font-size="9.5">loop</text>
    <text x="368" y="175" font-size="9.5" fill="#444">[còn byte trong buffer]</text>
    <line x1="568" y1="212" x2="348" y2="212" stroke="#333" marker-end="url(#open)"/>
    <text x="457" y="206" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">TXE interrupt</text>
    <line x1="346" y1="246" x2="568" y2="246" stroke="#333" marker-end="url(#fill)"/>
    <text x="457" y="240" text-anchor="middle">ghi byte kế tiếp vào DR</text>
  </g>
  <g font-size="9.5" fill="#444">
    <line x1="40" y1="322" x2="80" y2="322" stroke="#333" stroke-width="1.3" marker-end="url(#fill)"/><text x="88" y="326">gọi đồng bộ</text>
    <line x1="200" y1="322" x2="240" y2="322" stroke="#333" stroke-width="1.3" marker-end="url(#open)"/><text x="248" y="326">bất đồng bộ</text>
    <line x1="360" y1="322" x2="400" y2="322" stroke="#333" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="408" y="326">trả về</text>
  </g>
</svg>
