<svg role="img" viewBox="0 0 760 210" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Pipeline CI/CD cho phần mềm nhúng: Continuous Integration gồm commit, build, phân tích tĩnh và unit test; Continuous Delivery tiếp tục với đóng gói, test trên board và release</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5483a"/></marker></defs>
  <rect x="0" y="0" width="760" height="210" rx="8" fill="#ffffff"/>
  <path d="M 20 62 L 20 52 L 378 52 L 378 62" fill="none" stroke="#1d4278" stroke-width="1.5"/>
  <text x="199.0" y="40" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">Continuous Integration</text>
  <path d="M 398 62 L 398 52 L 756 52 L 756 62" fill="none" stroke="#1f5c38" stroke-width="1.5"/>
  <text x="577.0" y="40" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5c38">Continuous Delivery</text>
  <rect x="20" y="72" width="106" height="56" rx="6" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="73.0" y="96" font-size="11" text-anchor="middle" fill="#111">Commit</text>
  <text x="73.0" y="112" font-size="11" text-anchor="middle" fill="#111">và push</text>
  <line x1="126" y1="100" x2="145" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="146" y="72" width="106" height="56" rx="6" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="199.0" y="96" font-size="11" text-anchor="middle" fill="#111">Build</text>
  <text x="199.0" y="112" font-size="11" text-anchor="middle" fill="#111">(cross compile)</text>
  <line x1="252" y1="100" x2="271" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="272" y="72" width="106" height="56" rx="6" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="325.0" y="96" font-size="11" text-anchor="middle" fill="#111">Phân tích tĩnh</text>
  <text x="325.0" y="112" font-size="11" text-anchor="middle" fill="#111">và unit test</text>
  <line x1="378" y1="100" x2="397" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="398" y="72" width="106" height="56" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="451.0" y="96" font-size="11" text-anchor="middle" fill="#111">Đóng gói</text>
  <text x="451.0" y="112" font-size="11" text-anchor="middle" fill="#111">artifact</text>
  <line x1="504" y1="100" x2="523" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="524" y="72" width="106" height="56" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="577.0" y="96" font-size="11" text-anchor="middle" fill="#111">Test trên</text>
  <text x="577.0" y="112" font-size="11" text-anchor="middle" fill="#111">board (HIL)</text>
  <line x1="630" y1="100" x2="649" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="650" y="72" width="106" height="56" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="703.0" y="96" font-size="11" text-anchor="middle" fill="#111">Release hoặc</text>
  <text x="703.0" y="112" font-size="11" text-anchor="middle" fill="#111">triển khai</text>
  <path d="M 325.0 128 C 325.0 175, 73.0 175, 73.0 132" fill="none" stroke="#b5483a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <text x="199.0" y="185" font-size="10.5" text-anchor="middle" fill="#b5483a">build hoặc test lỗi: pipeline dừng và báo lại cho người commit</text>
</svg>
