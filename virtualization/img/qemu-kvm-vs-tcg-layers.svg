<svg role="img" viewBox="0 0 760 422" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>The three measured configurations on a dev machine with two virtualization layers: the physical host runs VirtualBox with nested VT-x, the dev VM runs QEMU, and QEMU runs an x86-64 guest with KVM, the same x86-64 guest with TCG as the control, and an aarch64 guest with TCG</title>
  <rect x="0" y="0" width="760" height="400" rx="8" fill="#ffffff"/>

  <!-- L0: physical host -->
  <rect x="16" y="16" width="728" height="368" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="36" y="44" font-size="14" font-weight="700" fill="#2f5d9e">L0: physical host</text>
  <text x="36" y="64" font-size="13" fill="#1f2d3d">CPU with VT-x, VirtualBox as the hypervisor, <tspan font-weight="700" fill="#6e4508">nested VT-x enabled</tspan></text>

  <!-- L1: dev VM -->
  <rect x="36" y="80" width="688" height="288" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="56" y="106" font-size="14" font-weight="700" fill="#2e7d4f">L1: dev VM (Linux)</text>
  <text x="56" y="126" font-size="13" fill="#1f2d3d">vmx flag in /proc/cpuinfo, /dev/kvm, modules kvm and kvm_intel</text>

  <!-- QEMU -->
  <rect x="56" y="142" width="648" height="210" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="76" y="166" font-size="14" font-weight="700" fill="#2f5d9e">QEMU: three L2 guests, one at a time</text>

  <!-- Guest 1: x86-64 + KVM -->
  <rect x="72" y="180" width="200" height="156" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="2"/>
  <text x="172" y="206" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">x86-64 guest</text>
  <text x="172" y="228" font-size="13" text-anchor="middle" fill="#1f2d3d">-accel kvm</text>
  <text x="172" y="256" font-size="13" text-anchor="middle" fill="#1f2d3d">instructions run</text>
  <text x="172" y="274" font-size="13" text-anchor="middle" fill="#1f2d3d">directly on the CPU</text>
  <text x="172" y="302" font-size="13" text-anchor="middle" fill="#2c3a42">exits go through</text>
  <text x="172" y="320" font-size="13" text-anchor="middle" fill="#2c3a42">KVM and VirtualBox</text>

  <!-- Guest 2: x86-64 + TCG (control) -->
  <rect x="280" y="180" width="200" height="156" rx="6" fill="#ffffff" stroke="#a23b72" stroke-width="2"/>
  <text x="380" y="206" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">x86-64 guest</text>
  <text x="380" y="228" font-size="13" text-anchor="middle" fill="#1f2d3d">-accel tcg</text>
  <text x="380" y="256" font-size="13" text-anchor="middle" fill="#1f2d3d">QEMU translates</text>
  <text x="380" y="274" font-size="13" text-anchor="middle" fill="#1f2d3d">x86-64 to x86-64</text>
  <text x="380" y="302" font-size="13" font-weight="700" text-anchor="middle" fill="#a23b72">control: same ISA,</text>
  <text x="380" y="320" font-size="13" font-weight="700" text-anchor="middle" fill="#a23b72">only -accel differs</text>

  <!-- Guest 3: aarch64 + TCG -->
  <rect x="488" y="180" width="200" height="156" rx="6" fill="#ffffff" stroke="#2c3a42" stroke-width="1.5"/>
  <text x="588" y="206" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">aarch64 guest</text>
  <text x="588" y="228" font-size="13" text-anchor="middle" fill="#1f2d3d">-accel tcg</text>
  <text x="588" y="256" font-size="13" text-anchor="middle" fill="#1f2d3d">QEMU translates</text>
  <text x="588" y="274" font-size="13" text-anchor="middle" fill="#1f2d3d">aarch64 to x86-64</text>
  <text x="588" y="302" font-size="13" text-anchor="middle" fill="#2c3a42">KVM cannot run</text>
  <text x="588" y="320" font-size="13" text-anchor="middle" fill="#2c3a42">a foreign ISA</text>
<text id="wm" x="751.2" y="415.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
