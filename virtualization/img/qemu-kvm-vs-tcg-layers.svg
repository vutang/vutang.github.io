<svg role="img" viewBox="0 0 760 422" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Three virtualization layers on a dev machine: the physical host runs VirtualBox with nested VT-x enabled, the dev VM runs QEMU, an x86-64 guest is accelerated by KVM and an aarch64 guest is emulated by TCG</title>
  <rect x="0" y="0" width="760" height="400" rx="8" fill="#ffffff"/>

  <!-- L0: physical host -->
  <rect x="20" y="20" width="720" height="360" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="40" y="48" font-size="14" font-weight="700" fill="#2f5d9e">L0: physical host</text>
  <text x="40" y="68" font-size="13" fill="#1f2d3d">CPU with VT-x, VirtualBox as the hypervisor</text>

  <!-- Setting badge -->
  <rect x="470" y="30" width="250" height="44" rx="6" fill="#fdf1d6" stroke="#b7791f" stroke-width="1.5"/>
  <text x="595" y="49" font-size="13" font-weight="700" text-anchor="middle" fill="#6e4508">Enable nested VT-x</text>
  <text x="595" y="66" font-size="13" text-anchor="middle" fill="#6e4508">set while the VM is off</text>
  <line x1="595" y1="74" x2="595" y2="96" stroke="#b7791f" stroke-width="2"/>
  <polygon points="589,90 601,90 595,98" fill="#b7791f"/>

  <!-- L1: dev VM -->
  <rect x="50" y="96" width="660" height="264" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="70" y="124" font-size="14" font-weight="700" fill="#2e7d4f">L1: dev VM (Linux)</text>
  <text x="70" y="144" font-size="13" fill="#1f2d3d">vmx flag in /proc/cpuinfo, /dev/kvm, modules kvm and kvm_intel</text>

  <!-- QEMU -->
  <rect x="80" y="164" width="600" height="176" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="100" y="190" font-size="14" font-weight="700" fill="#2f5d9e">QEMU</text>

  <!-- L2 guest x86-64 with KVM -->
  <rect x="100" y="206" width="272" height="114" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="2"/>
  <text x="236" y="234" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">L2: x86-64 guest</text>
  <text x="236" y="258" font-size="13" text-anchor="middle" fill="#1f2d3d">-accel kvm</text>
  <text x="236" y="280" font-size="13" text-anchor="middle" fill="#1f2d3d">runs on the real CPU</text>
  <text x="236" y="300" font-size="13" text-anchor="middle" fill="#2c3a42">through two hypervisors</text>

  <!-- L2 guest aarch64 with TCG -->
  <rect x="388" y="206" width="272" height="114" rx="6" fill="#ffffff" stroke="#2c3a42" stroke-width="1.5"/>
  <text x="524" y="234" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">L2: aarch64 guest</text>
  <text x="524" y="258" font-size="13" text-anchor="middle" fill="#1f2d3d">-accel tcg</text>
  <text x="524" y="280" font-size="13" text-anchor="middle" fill="#1f2d3d">QEMU translates each block</text>
  <text x="524" y="300" font-size="13" text-anchor="middle" fill="#2c3a42">KVM does not apply</text>
<text id="wm" x="751.2" y="415.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
