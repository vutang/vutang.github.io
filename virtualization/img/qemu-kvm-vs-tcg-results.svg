<svg role="img" viewBox="0 0 760 312" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>The same CPU workload takes 1.52 s with KVM, 11.00 s with x86-64 TCG and 14.04 s with aarch64 TCG: switching to TCG adds 9.48 s (7.2x) while the foreign ISA adds only 3.04 s (1.28x), median of five runs on the dev VM</title>
  <rect x="0" y="0" width="760" height="290" rx="8" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1f2d3d">Most of the cost is translation, not the foreign ISA</text>
  <text x="24" y="52" font-size="13" fill="#2c3a42">Bar = median of 5 runs, dot = each run, measured on the host clock</text>

  <!-- grid: 0 s at x=230, 25.875 px per second -->
  <line x1="230.0" y1="70" x2="230.0" y2="244" stroke="#d5dbe3" stroke-width="1"/>
  <text x="230.0" y="266" font-size="13" text-anchor="middle" fill="#2c3a42">0 s</text>
  <line x1="333.5" y1="70" x2="333.5" y2="244" stroke="#d5dbe3" stroke-width="1"/>
  <text x="333.5" y="266" font-size="13" text-anchor="middle" fill="#2c3a42">4 s</text>
  <line x1="437.0" y1="70" x2="437.0" y2="244" stroke="#d5dbe3" stroke-width="1"/>
  <text x="437.0" y="266" font-size="13" text-anchor="middle" fill="#2c3a42">8 s</text>
  <line x1="540.5" y1="70" x2="540.5" y2="244" stroke="#d5dbe3" stroke-width="1"/>
  <text x="540.5" y="266" font-size="13" text-anchor="middle" fill="#2c3a42">12 s</text>
  <line x1="644.0" y1="70" x2="644.0" y2="244" stroke="#d5dbe3" stroke-width="1"/>
  <text x="644.0" y="266" font-size="13" text-anchor="middle" fill="#2c3a42">16 s</text>

  <!-- x86-64 + KVM -->
  <text x="24" y="96" font-size="13" font-weight="700" fill="#1f2d3d">x86-64 + KVM</text>
  <rect x="230.0" y="78" width="39.3" height="26" rx="3" fill="#2f5d9e" fill-opacity="0.85"/>
  <circle cx="269.1" cy="91" r="3.5" fill="#1f2d3d" fill-opacity="0.8"/>
  <circle cx="269.8" cy="91" r="3.5" fill="#1f2d3d" fill-opacity="0.8"/>
  <circle cx="270.6" cy="91" r="3.5" fill="#1f2d3d" fill-opacity="0.8"/>
  <circle cx="269.1" cy="91" r="3.5" fill="#1f2d3d" fill-opacity="0.8"/>
  <circle cx="269.3" cy="91" r="3.5" fill="#1f2d3d" fill-opacity="0.8"/>
  <text x="282.6" y="96" font-size="13" font-weight="700" fill="#1f2d3d">1.52 s · 1.0x</text>

  <!-- step 1: translation cost -->
  <line x1="269.3" y1="128" x2="514.6" y2="128" stroke="#a23b72" stroke-width="2"/>
  <line x1="269.3" y1="121" x2="269.3" y2="135" stroke="#a23b72" stroke-width="2"/>
  <line x1="514.6" y1="121" x2="514.6" y2="135" stroke="#a23b72" stroke-width="2"/>
  <text x="392.0" y="122" font-size="13" font-weight="700" text-anchor="middle" fill="#a23b72">TCG translation: +9.48 s (7.2x)</text>

  <!-- x86-64 + TCG -->
  <text x="24" y="158" font-size="13" fill="#1f2d3d">x86-64 + TCG</text>
  <rect x="230.0" y="140" width="284.6" height="26" rx="3" fill="#78909c" fill-opacity="0.45"/>
  <circle cx="514.6" cy="153" r="3.5" fill="#1f2d3d" fill-opacity="0.8"/>
  <circle cx="526.5" cy="153" r="3.5" fill="#1f2d3d" fill-opacity="0.8"/>
  <circle cx="506.1" cy="153" r="3.5" fill="#1f2d3d" fill-opacity="0.8"/>
  <circle cx="502.5" cy="153" r="3.5" fill="#1f2d3d" fill-opacity="0.8"/>
  <circle cx="515.4" cy="153" r="3.5" fill="#1f2d3d" fill-opacity="0.8"/>
  <text x="538.6" y="158" font-size="13" fill="#1f2d3d">11.00 s · 7.2x</text>

  <!-- step 2: foreign ISA (not isolated) -->
  <line x1="514.6" y1="190" x2="593.3" y2="190" stroke="#2c3a42" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="514.6" y1="183" x2="514.6" y2="197" stroke="#2c3a42" stroke-width="2"/>
  <line x1="593.3" y1="183" x2="593.3" y2="197" stroke="#2c3a42" stroke-width="2"/>
  <text x="506.0" y="195" font-size="13" text-anchor="end" fill="#2c3a42">foreign ISA, not isolated: +3.04 s (1.28x)</text>

  <!-- aarch64 + TCG -->
  <text x="24" y="220" font-size="13" fill="#1f2d3d">aarch64 + TCG</text>
  <rect x="230.0" y="202" width="363.3" height="26" rx="3" fill="#78909c" fill-opacity="0.45"/>
  <circle cx="601.6" cy="215" r="3.5" fill="#1f2d3d" fill-opacity="0.8"/>
  <circle cx="557.1" cy="215" r="3.5" fill="#1f2d3d" fill-opacity="0.8"/>
  <circle cx="593.3" cy="215" r="3.5" fill="#1f2d3d" fill-opacity="0.8"/>
  <circle cx="600.8" cy="215" r="3.5" fill="#1f2d3d" fill-opacity="0.8"/>
  <circle cx="562.7" cy="215" r="3.5" fill="#1f2d3d" fill-opacity="0.8"/>
  <text x="613.7" y="220" font-size="13" fill="#1f2d3d">14.04 s · 9.2x</text>
<text id="wm" x="751.2" y="305.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
