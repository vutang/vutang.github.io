<svg role="img" viewBox="0 0 760 402" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Three virtualization layers on a dev machine: the physical host runs VirtualBox, the dev VM runs QEMU with KVM, and the QEMU guest is the nested level; nested VT-x must be enabled on the host side so the dev VM sees the vmx flag</title>
  <rect x="0" y="0" width="760" height="380" rx="8" fill="#ffffff"/>

  <!-- L0: physical host -->
  <rect x="20" y="20" width="720" height="340" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="40" y="48" font-size="14" font-weight="700" fill="#2f5d9e">L0: physical host</text>
  <text x="40" y="68" font-size="13" fill="#1f2d3d">CPU with VT-x, VirtualBox as the hypervisor</text>

  <!-- Setting badge -->
  <rect x="470" y="30" width="250" height="44" rx="6" fill="#fdf1d6" stroke="#b7791f" stroke-width="1.5"/>
  <text x="595" y="49" font-size="13" font-weight="700" text-anchor="middle" fill="#6e4508">Enable nested VT-x</text>
  <text x="595" y="66" font-size="13" text-anchor="middle" fill="#6e4508">set while the VM is off</text>

  <!-- L1: dev VM -->
  <rect x="50" y="96" width="660" height="244" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="70" y="124" font-size="14" font-weight="700" fill="#2e7d4f">L1: dev VM (Linux)</text>
  <text x="70" y="144" font-size="13" fill="#1f2d3d">vmx flag in /proc/cpuinfo, /dev/kvm, modules kvm and kvm_intel</text>

  <!-- arrow from badge to L1 -->
  <line x1="595" y1="74" x2="595" y2="96" stroke="#b7791f" stroke-width="2"/>
  <polygon points="589,90 601,90 595,98" fill="#b7791f"/>

  <!-- QEMU/KVM -->
  <rect x="80" y="166" width="600" height="150" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="100" y="192" font-size="14" font-weight="700" fill="#2f5d9e">QEMU with -accel kvm</text>

  <!-- L2 guest -->
  <rect x="100" y="208" width="270" height="88" rx="6" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="235" y="236" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">L2: guest</text>
  <text x="235" y="258" font-size="13" text-anchor="middle" fill="#1f2d3d">test kernel, driver,</text>
  <text x="235" y="276" font-size="13" text-anchor="middle" fill="#1f2d3d">multikernel</text>

  <!-- vCPU box -->
  <rect x="400" y="208" width="260" height="88" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="530" y="236" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">KVM in L1</text>
  <text x="530" y="258" font-size="13" text-anchor="middle" fill="#1f2d3d">vCPU runs on the CPU</text>
  <text x="530" y="276" font-size="13" text-anchor="middle" fill="#1f2d3d">through two hypervisors</text>
<text id="wm" x="751.2" y="395.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
