<svg role="img" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>So sánh máy ảo (hypervisor) và container: mỗi VM có kernel riêng, các container dùng chung kernel của host</title>
  <rect x="0" y="0" width="600" height="400" rx="8" fill="#ffffff"/>

  <!-- Titles -->
  <text x="150" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1d4278">MÁY ẢO (VM)</text>
  <text x="450" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1f5c38">CONTAINER</text>
  <line x1="300" y1="14" x2="300" y2="386" stroke="#bbb" stroke-dasharray="4 4"/>

  <!-- ===== VM column ===== -->
  <!-- VM 1 -->
  <rect x="20" y="44" width="128" height="196" rx="6" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="84" y="62" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4278">VM 1</text>
  <rect x="30" y="72" width="108" height="34" rx="4" fill="#d3e3f7" stroke="#2f5d9e"/>
  <text x="84" y="93" font-size="11" text-anchor="middle" fill="#111">App</text>
  <rect x="30" y="114" width="108" height="34" rx="4" fill="#d3e3f7" stroke="#2f5d9e"/>
  <text x="84" y="135" font-size="11" text-anchor="middle" fill="#111">Bins / Libs</text>
  <rect x="30" y="156" width="108" height="74" rx="4" fill="#f8d9d2" stroke="#b5483a"/>
  <text x="84" y="190" font-size="11" font-weight="700" text-anchor="middle" fill="#111">Guest OS</text>
  <text x="84" y="206" font-size="9.5" text-anchor="middle" fill="#111">kernel riêng</text>
  <!-- VM 2 -->
  <rect x="158" y="44" width="128" height="196" rx="6" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="222" y="62" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4278">VM 2</text>
  <rect x="168" y="72" width="108" height="34" rx="4" fill="#d3e3f7" stroke="#2f5d9e"/>
  <text x="222" y="93" font-size="11" text-anchor="middle" fill="#111">App</text>
  <rect x="168" y="114" width="108" height="34" rx="4" fill="#d3e3f7" stroke="#2f5d9e"/>
  <text x="222" y="135" font-size="11" text-anchor="middle" fill="#111">Bins / Libs</text>
  <rect x="168" y="156" width="108" height="74" rx="4" fill="#f8d9d2" stroke="#b5483a"/>
  <text x="222" y="190" font-size="11" font-weight="700" text-anchor="middle" fill="#111">Guest OS</text>
  <text x="222" y="206" font-size="9.5" text-anchor="middle" fill="#111">kernel riêng</text>
  <!-- Hypervisor + HW -->
  <rect x="20" y="252" width="266" height="44" rx="5" fill="#fff3cf" stroke="#b58a1b" stroke-width="1.5"/>
  <text x="153" y="272" font-size="12" font-weight="700" text-anchor="middle" fill="#111">Hypervisor</text>
  <text x="153" y="287" font-size="9.5" text-anchor="middle" fill="#111">KVM, Xen, Hyper-V, ESXi</text>
  <rect x="20" y="308" width="266" height="40" rx="5" fill="#e6e6e6" stroke="#666" stroke-width="1.5"/>
  <text x="153" y="333" font-size="12" font-weight="700" text-anchor="middle" fill="#111">Phần cứng</text>

  <!-- ===== Container column ===== -->
  <!-- Container 1 -->
  <rect x="320" y="44" width="128" height="140" rx="6" fill="#eaf5ee" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="384" y="62" font-size="11" font-weight="700" text-anchor="middle" fill="#1f5c38">Container 1</text>
  <rect x="330" y="72" width="108" height="34" rx="4" fill="#d4ecdc" stroke="#2e7d4f"/>
  <text x="384" y="93" font-size="11" text-anchor="middle" fill="#111">App</text>
  <rect x="330" y="114" width="108" height="34" rx="4" fill="#d4ecdc" stroke="#2e7d4f"/>
  <text x="384" y="135" font-size="11" text-anchor="middle" fill="#111">Bins / Libs</text>
  <text x="384" y="170" font-size="9.5" text-anchor="middle" fill="#1f5c38">namespace + cgroup</text>
  <!-- Container 2 -->
  <rect x="458" y="44" width="128" height="140" rx="6" fill="#eaf5ee" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="522" y="62" font-size="11" font-weight="700" text-anchor="middle" fill="#1f5c38">Container 2</text>
  <rect x="468" y="72" width="108" height="34" rx="4" fill="#d4ecdc" stroke="#2e7d4f"/>
  <text x="522" y="93" font-size="11" text-anchor="middle" fill="#111">App</text>
  <rect x="468" y="114" width="108" height="34" rx="4" fill="#d4ecdc" stroke="#2e7d4f"/>
  <text x="522" y="135" font-size="11" text-anchor="middle" fill="#111">Bins / Libs</text>
  <text x="522" y="170" font-size="9.5" text-anchor="middle" fill="#1f5c38">namespace + cgroup</text>
  <!-- Runtime, kernel, HW -->
  <rect x="320" y="196" width="266" height="44" rx="5" fill="#fff3cf" stroke="#b58a1b" stroke-width="1.5"/>
  <text x="453" y="216" font-size="12" font-weight="700" text-anchor="middle" fill="#111">Container runtime</text>
  <text x="453" y="231" font-size="9.5" text-anchor="middle" fill="#111">Docker Engine, containerd, runc, Podman</text>
  <rect x="320" y="252" width="266" height="44" rx="5" fill="#f8d9d2" stroke="#b5483a" stroke-width="1.5"/>
  <text x="453" y="272" font-size="12" font-weight="700" text-anchor="middle" fill="#111">Host OS kernel</text>
  <text x="453" y="287" font-size="9.5" text-anchor="middle" fill="#111">dùng chung cho mọi container</text>
  <rect x="320" y="308" width="266" height="40" rx="5" fill="#e6e6e6" stroke="#666" stroke-width="1.5"/>
  <text x="453" y="333" font-size="12" font-weight="700" text-anchor="middle" fill="#111">Phần cứng</text>

  <!-- Footer notes -->
  <text x="153" y="372" font-size="10" text-anchor="middle" fill="#444">Cô lập ở mức phần cứng ảo, mỗi VM một kernel</text>
  <text x="453" y="372" font-size="10" text-anchor="middle" fill="#444">Cô lập ở mức tiến trình, một kernel chung</text>
</svg>
