<svg role="img" viewBox="0 0 760 362" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Intel VT-x control flow: the hypervisor in VMX root mode enters the guest with VMLAUNCH or VMRESUME, and a VM exit returns to the hypervisor, with state kept in the VMCS</title>
  <rect x="0" y="0" width="760" height="340" rx="8" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3a42"/>
    </marker>
  </defs>

  <!-- VMX root -->
  <rect x="20" y="20" width="250" height="190" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="145" y="46" font-size="15" font-weight="700" text-anchor="middle" fill="#2f5d9e">VMX root mode</text>
  <text x="145" y="66" font-size="13" text-anchor="middle" fill="#2c3a42">Hypervisor (for example KVM)</text>
  <rect x="40" y="82" width="210" height="44" rx="6" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="145" y="109" font-size="13" text-anchor="middle" fill="#1f2d3d">Handle the exit reason</text>
  <rect x="40" y="140" width="210" height="52" rx="6" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="145" y="162" font-size="13" text-anchor="middle" fill="#1f2d3d">Set up VMCS with</text>
  <text x="145" y="180" font-size="13" text-anchor="middle" fill="#1f2d3d" font-family="DejaVu Sans Mono, monospace">VMWRITE</text>

  <!-- VMX non-root -->
  <rect x="490" y="20" width="250" height="190" rx="8" fill="#f6e6ef" stroke="#a23b72" stroke-width="1.5"/>
  <text x="615" y="46" font-size="15" font-weight="700" text-anchor="middle" fill="#a23b72">VMX non-root mode</text>
  <text x="615" y="66" font-size="13" text-anchor="middle" fill="#2c3a42">Guest OS and applications</text>
  <rect x="510" y="82" width="210" height="44" rx="6" fill="#ffffff" stroke="#a23b72"/>
  <text x="615" y="109" font-size="13" text-anchor="middle" fill="#1f2d3d">Run directly on the CPU</text>
  <rect x="510" y="140" width="210" height="52" rx="6" fill="#ffffff" stroke="#a23b72"/>
  <text x="615" y="162" font-size="13" text-anchor="middle" fill="#1f2d3d">Sensitive event occurs</text>
  <text x="615" y="180" font-size="13" text-anchor="middle" fill="#2c3a42">(I/O, MSR, EPT fault, ...)</text>

  <!-- VM entry arrow -->
  <line x1="272" y1="100" x2="488" y2="100" stroke="#2c3a42" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="380" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#2e7d4f">VM entry</text>
  <text x="380" y="120" font-size="13" text-anchor="middle" fill="#2c3a42" font-family="DejaVu Sans Mono, monospace">VMLAUNCH</text>
  <text x="380" y="136" font-size="13" text-anchor="middle" fill="#2c3a42" font-family="DejaVu Sans Mono, monospace">VMRESUME</text>

  <!-- VM exit arrow -->
  <line x1="488" y1="170" x2="272" y2="170" stroke="#2c3a42" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="380" y="160" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">VM exit</text>
  <text x="380" y="192" font-size="13" text-anchor="middle" fill="#2c3a42">reason recorded in VMCS</text>

  <!-- VMCS -->
  <rect x="20" y="230" width="720" height="92" rx="8" fill="#f4f7fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="380" y="254" font-size="15" font-weight="700" text-anchor="middle" fill="#2f5d9e">VMCS (one per vCPU, in memory)</text>
  <rect x="36" y="266" width="160" height="44" rx="6" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="116" y="293" font-size="13" text-anchor="middle" fill="#1f2d3d">Guest-state area</text>
  <rect x="210" y="266" width="160" height="44" rx="6" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="290" y="293" font-size="13" text-anchor="middle" fill="#1f2d3d">Host-state area</text>
  <rect x="384" y="266" width="170" height="44" rx="6" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="469" y="293" font-size="13" text-anchor="middle" fill="#1f2d3d">Control fields</text>
  <rect x="568" y="266" width="156" height="44" rx="6" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="646" y="293" font-size="13" text-anchor="middle" fill="#1f2d3d">Exit information</text>
<text id="wm" x="751.2" y="355.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
