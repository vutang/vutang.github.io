<svg role="img" viewBox="0 0 760 422" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>libvirt architecture: management tools call the libvirt API, the libvirt daemon uses a hypervisor driver to control QEMU processes that run guests through KVM in the kernel</title>
  <rect x="0" y="0" width="760" height="400" rx="8" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3a42"/>
    </marker>
  </defs>

  <!-- Tools layer -->
  <text x="20" y="28" font-size="14" font-weight="700" fill="#2f5d9e">Management tools</text>
  <rect x="20" y="38" width="160" height="44" rx="6" fill="#e8eef8" stroke="#2f5d9e"/>
  <text x="100" y="66" font-size="14" text-anchor="middle" fill="#1f2d3d" font-family="DejaVu Sans Mono, monospace">virsh</text>
  <rect x="200" y="38" width="160" height="44" rx="6" fill="#e8eef8" stroke="#2f5d9e"/>
  <text x="280" y="66" font-size="14" text-anchor="middle" fill="#1f2d3d" font-family="DejaVu Sans Mono, monospace">virt-install</text>
  <rect x="380" y="38" width="160" height="44" rx="6" fill="#e8eef8" stroke="#2f5d9e"/>
  <text x="460" y="66" font-size="14" text-anchor="middle" fill="#1f2d3d" font-family="DejaVu Sans Mono, monospace">virt-manager</text>
  <rect x="560" y="38" width="180" height="44" rx="6" fill="#e8eef8" stroke="#2f5d9e"/>
  <text x="650" y="66" font-size="14" text-anchor="middle" fill="#1f2d3d">OpenStack Nova, oVirt</text>

  <!-- Arrows tools -> API -->
  <line x1="380" y1="84" x2="380" y2="112" stroke="#2c3a42" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="392" y="104" font-size="13" fill="#2c3a42">libvirt API (C, Python, Go)</text>

  <!-- libvirt layer -->
  <rect x="20" y="116" width="720" height="124" rx="8" fill="#f4f7fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="36" y="140" font-size="14" font-weight="700" fill="#2f5d9e">libvirt (libvirtd or modular daemons)</text>
  <rect x="36" y="154" width="212" height="72" rx="6" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="142" y="178" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">Hypervisor driver</text>
  <text x="142" y="198" font-size="13" text-anchor="middle" fill="#2c3a42">QEMU/KVM, LXC, Xen</text>
  <text x="142" y="216" font-size="13" text-anchor="middle" fill="#2c3a42">Domain XML to QEMU args</text>
  <rect x="266" y="154" width="212" height="72" rx="6" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="372" y="178" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">Storage driver</text>
  <text x="372" y="198" font-size="13" text-anchor="middle" fill="#2c3a42">Pools and volumes</text>
  <text x="372" y="216" font-size="13" text-anchor="middle" fill="#2c3a42">dir, LVM, NFS, Ceph</text>
  <rect x="496" y="154" width="228" height="72" rx="6" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="610" y="178" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">Network driver</text>
  <text x="610" y="198" font-size="13" text-anchor="middle" fill="#2c3a42">Virtual networks, bridge</text>
  <text x="610" y="216" font-size="13" text-anchor="middle" fill="#2c3a42">NAT, DHCP/DNS (dnsmasq)</text>

  <!-- Arrow libvirt -> QEMU -->
  <line x1="142" y1="242" x2="142" y2="272" stroke="#2c3a42" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="154" y="262" font-size="13" fill="#2c3a42">fork, QMP socket</text>

  <!-- QEMU layer -->
  <rect x="20" y="276" width="500" height="50" rx="6" fill="#f6e6ef" stroke="#a23b72" stroke-width="1.5"/>
  <text x="270" y="297" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">One QEMU process per VM (guest RAM, vCPU threads, virtio devices)</text>
  <text x="270" y="316" font-size="13" text-anchor="middle" fill="#2c3a42">VM 1, VM 2, ... each isolated by sVirt (SELinux or AppArmor)</text>
  <rect x="540" y="276" width="200" height="50" rx="6" fill="#eef3ee" stroke="#2e7d4f"/>
  <text x="640" y="297" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2d3d">Other drivers</text>
  <text x="640" y="316" font-size="13" text-anchor="middle" fill="#2c3a42">LXC, Xen, Cloud Hypervisor</text>

  <!-- Arrow QEMU -> KVM -->
  <line x1="270" y1="328" x2="270" y2="348" stroke="#2c3a42" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="282" y="343" font-size="13" fill="#2c3a42">ioctl on /dev/kvm</text>

  <!-- Kernel layer -->
  <rect x="20" y="352" width="720" height="38" rx="6" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="380" y="377" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">Linux kernel: KVM (VT-x, AMD-V), vhost, bridge, cgroups</text>
<text id="wm" x="751.2" y="415.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
