<svg role="img" viewBox="0 0 600 190" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Trình tự boot khi Linux là root partition trên Hyper-V</title>
  <rect x="0" y="0" width="600" height="190" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <!-- boxes: x = 14, 132, 250, 368, 486 ; w=100 -->
  <rect x="14" y="30" width="100" height="62" rx="6" fill="#ececec" stroke="#777"/>
  <text x="64" y="54" font-size="10" font-weight="700" text-anchor="middle" fill="#111">1. UEFI</text>
  <text x="64" y="69" font-size="10" text-anchor="middle" fill="#111">firmware</text>

  <rect x="132" y="30" width="100" height="62" rx="6" fill="#ececec" stroke="#777"/>
  <text x="182" y="58" font-size="10" font-weight="700" text-anchor="middle" fill="#111">2. Bootloader</text>
  <text x="182" y="73" font-size="9" text-anchor="middle" fill="#111">nạp hypervisor</text>

  <rect x="250" y="30" width="100" height="62" rx="6" fill="#fbe7c8" stroke="#b8741a"/>
  <text x="300" y="54" font-size="10" font-weight="700" text-anchor="middle" fill="#7a4a00">3. Microsoft</text>
  <text x="300" y="69" font-size="10" font-weight="700" text-anchor="middle" fill="#7a4a00">Hypervisor</text>

  <rect x="368" y="30" width="100" height="62" rx="6" fill="#d4ecdc" stroke="#2e7d4f"/>
  <text x="418" y="54" font-size="10" font-weight="700" text-anchor="middle" fill="#1f5c38">4. Linux kernel</text>
  <text x="418" y="69" font-size="9" text-anchor="middle" fill="#1f5c38">root partition</text>

  <rect x="486" y="30" width="100" height="62" rx="6" fill="#d3e3f7" stroke="#2f5d9e"/>
  <text x="536" y="54" font-size="10" font-weight="700" text-anchor="middle" fill="#1d4278">5. VM con</text>
  <text x="536" y="69" font-size="9" text-anchor="middle" fill="#1d4278">guest</text>

  <g stroke="#555" stroke-width="1.6" marker-end="url(#a)">
    <line x1="114" y1="61" x2="130" y2="61"/>
    <line x1="232" y1="61" x2="248" y2="61"/>
    <line x1="350" y1="61" x2="366" y2="61"/>
    <line x1="468" y1="61" x2="484" y2="61"/>
  </g>

  <!-- edge labels -->
  <g font-size="9" fill="#333" text-anchor="middle">
    <text x="241" y="110">bật VMX/SVM</text>
    <text x="359" y="110">tạo root partition</text>
    <text x="477" y="110">/dev/mshv</text>
  </g>

  <!-- hypervisor stays below -->
  <rect x="250" y="130" width="336" height="34" rx="6" fill="#fdf3e2" stroke="#b8741a" stroke-dasharray="4,3"/>
  <text x="418" y="151" font-size="10" text-anchor="middle" fill="#7a4a00">Hypervisor vẫn giữ quyền cao nhất suốt thời gian chạy</text>
  <line x1="300" y1="92" x2="300" y2="130" stroke="#b8741a" stroke-dasharray="4,3"/>
</svg>
