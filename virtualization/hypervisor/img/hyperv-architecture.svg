<svg role="img" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Kiến trúc Hyper-V: root partition, child partition, hypervisor và phần cứng</title>
  <rect x="0" y="0" width="600" height="400" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <!-- Root partition -->
  <rect x="20" y="16" width="270" height="190" rx="8" fill="#eaf5ee" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="155" y="38" font-size="13" font-weight="700" text-anchor="middle" fill="#1f5c38">ROOT PARTITION</text>
  <text x="155" y="53" font-size="10" text-anchor="middle" fill="#1f5c38">Windows hoặc Linux (mshv)</text>
  <rect x="38" y="66" width="234" height="38" rx="5" fill="#d4ecdc" stroke="#2e7d4f"/>
  <text x="155" y="83" font-size="11" font-weight="700" text-anchor="middle" fill="#111">VMMS + VM Worker</text>
  <text x="155" y="97" font-size="9.5" text-anchor="middle" fill="#111">quản lý VM, giả lập thiết bị</text>
  <rect x="38" y="112" width="234" height="38" rx="5" fill="#d4ecdc" stroke="#2e7d4f"/>
  <text x="155" y="129" font-size="11" font-weight="700" text-anchor="middle" fill="#111">VSP</text>
  <text x="155" y="143" font-size="9.5" text-anchor="middle" fill="#111">Service Provider: storage, network</text>
  <rect x="38" y="158" width="234" height="38" rx="5" fill="#d4ecdc" stroke="#2e7d4f"/>
  <text x="155" y="175" font-size="11" font-weight="700" text-anchor="middle" fill="#111">Driver thiết bị thật</text>
  <text x="155" y="189" font-size="9.5" text-anchor="middle" fill="#111">NIC, NVMe, GPU</text>

  <!-- Child partition -->
  <rect x="330" y="16" width="250" height="190" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="455" y="38" font-size="13" font-weight="700" text-anchor="middle" fill="#1d4278">CHILD PARTITION</text>
  <text x="455" y="53" font-size="10" text-anchor="middle" fill="#1d4278">VM guest</text>
  <rect x="348" y="66" width="214" height="38" rx="5" fill="#d3e3f7" stroke="#2f5d9e"/>
  <text x="455" y="89" font-size="11" font-weight="700" text-anchor="middle" fill="#111">Ứng dụng của guest</text>
  <rect x="348" y="112" width="214" height="38" rx="5" fill="#d3e3f7" stroke="#2f5d9e"/>
  <text x="455" y="129" font-size="11" font-weight="700" text-anchor="middle" fill="#111">VSC</text>
  <text x="455" y="143" font-size="9.5" text-anchor="middle" fill="#111">hv_netvsc, hv_storvsc</text>

  <!-- VMBus -->
  <line x1="272" y1="131" x2="348" y2="131" stroke="#555" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="285" y="116" width="50" height="14" rx="3" fill="#ffffff"/>
  <text x="310" y="127" font-size="10" font-weight="700" text-anchor="middle" fill="#333">VMBus</text>

  <!-- Hypervisor -->
  <rect x="20" y="256" width="560" height="62" rx="8" fill="#fbe7c8" stroke="#b8741a" stroke-width="1.5"/>
  <text x="300" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#7a4a00">MICROSOFT HYPERVISOR</text>
  <text x="300" y="293" font-size="10" text-anchor="middle" fill="#7a4a00">VMX root / SVM host / EL2</text>
  <text x="300" y="309" font-size="10" text-anchor="middle" fill="#111">scheduler • SLAT (EPT/NPT) • hypercall • SynIC • VTL</text>

  <!-- Hardware -->
  <rect x="20" y="352" width="560" height="38" rx="8" fill="#ececec" stroke="#777" stroke-width="1.5"/>
  <text x="300" y="376" font-size="11" font-weight="700" text-anchor="middle" fill="#111">Phần cứng: CPU, RAM, IOMMU, thiết bị PCIe</text>

  <!-- Arrows to hypervisor -->
  <line x1="155" y1="206" x2="155" y2="256" stroke="#555" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="165" y="222" width="70" height="14" rx="3" fill="#ffffff"/>
  <text x="200" y="233" font-size="10" text-anchor="middle" fill="#333">hypercall</text>
  <line x1="455" y1="206" x2="455" y2="256" stroke="#555" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="465" y="222" width="110" height="14" rx="3" fill="#ffffff"/>
  <text x="520" y="233" font-size="10" text-anchor="middle" fill="#333">VM exit / hypercall</text>
  <line x1="300" y1="318" x2="300" y2="352" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
