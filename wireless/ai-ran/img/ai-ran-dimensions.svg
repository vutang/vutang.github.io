<svg role="img" viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
<title>Ba hướng của AI-RAN: AI cho RAN với model ở SMO và Non-RT RIC, Near-RT RIC, gNB và UE theo thang thời gian; AI và RAN dùng chung hạ tầng tính toán; AI trên RAN với ứng dụng AI ở biên mạng</title>
<rect x="0" y="0" width="960" height="500" rx="8" fill="#ffffff"/>
<rect x="10" y="10" width="940" height="480" rx="10" fill="#f6f8fb" stroke="#c9d3e3"/>
<text x="30" y="38" font-size="15" font-weight="700" fill="#1d4278">Ba hướng của AI-RAN</text>
<text x="30" y="57" font-size="10.5" fill="#666">Cách chia theo ba nhóm làm việc của AI-RAN Alliance; ví dụ use case lấy từ các nghiên cứu của 3GPP và O-RAN</text>
<rect x="24" y="72" width="530" height="406" rx="8" fill="#fff" stroke="#c9d3e3"/>
<text x="40" y="96" font-size="12.5" text-anchor="start" fill="#1d4278" font-weight="700">1. AI cho RAN (AI-for-RAN)</text>
<text x="40" y="113" font-size="9.5" text-anchor="start" fill="#555">Dùng AI/ML để vận hành và tối ưu chính RAN; model đặt ở nhiều tầng theo thang thời gian</text>
<rect x="40" y="128" width="150" height="62" rx="6" fill="#a23b72" fill-opacity="0.15" stroke="#a23b72" stroke-width="1.4"/>
<text x="115.0" y="156.0" font-size="10.5" text-anchor="middle" fill="#a23b72" font-weight="700">SMO, Non-RT RIC</text>
<text x="115.0" y="170.0" font-size="8.8" text-anchor="middle" fill="#555">≥ 1 s</text>
<text x="204" y="154" font-size="9.5" text-anchor="start" fill="#333">rApp: huấn luyện model, tối ưu vùng phủ,</text>
<text x="204" y="169" font-size="9.5" text-anchor="start" fill="#333">tiết kiệm năng lượng theo lịch</text>
<rect x="40" y="204" width="150" height="62" rx="6" fill="#b7791f" fill-opacity="0.15" stroke="#b7791f" stroke-width="1.4"/>
<text x="115.0" y="232.0" font-size="10.5" text-anchor="middle" fill="#b7791f" font-weight="700">Near-RT RIC</text>
<text x="115.0" y="246.0" font-size="8.8" text-anchor="middle" fill="#555">10 ms tới 1 s</text>
<text x="204" y="230" font-size="9.5" text-anchor="start" fill="#333">xApp: điều hướng lưu lượng, cân bằng tải,</text>
<text x="204" y="245" font-size="9.5" text-anchor="start" fill="#333">tài nguyên theo slice</text>
<rect x="40" y="280" width="150" height="62" rx="6" fill="#1d4278" fill-opacity="0.15" stroke="#1d4278" stroke-width="1.4"/>
<text x="115.0" y="308.0" font-size="10.5" text-anchor="middle" fill="#1d4278" font-weight="700">gNB (CU, DU)</text>
<text x="115.0" y="322.0" font-size="8.8" text-anchor="middle" fill="#555">&lt; 10 ms</text>
<text x="204" y="306" font-size="9.5" text-anchor="start" fill="#333">Model trong L1, L2: ước lượng kênh, dự đoán beam,</text>
<text x="204" y="321" font-size="9.5" text-anchor="start" fill="#333">link adaptation, lập lịch</text>
<rect x="40" y="356" width="150" height="62" rx="6" fill="#2f5d9e" fill-opacity="0.15" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="115.0" y="384.0" font-size="10.5" text-anchor="middle" fill="#2f5d9e" font-weight="700">UE</text>
<text x="115.0" y="398.0" font-size="8.8" text-anchor="middle" fill="#555">&lt; 10 ms</text>
<text x="204" y="382" font-size="9.5" text-anchor="start" fill="#333">Model phía UE hoặc hai phía: nén CSI,</text>
<text x="204" y="397" font-size="9.5" text-anchor="start" fill="#333">dự đoán beam, định vị</text>
<text x="40" y="442" font-size="9" text-anchor="start" fill="#555">Vòng gNB và UE là phạm vi AI/ML cho giao diện vô tuyến của 3GPP (RAN1);</text>
<text x="40" y="455" font-size="9" text-anchor="start" fill="#555">vòng RIC theo O-RAN WG2, WG3; AI/ML cho NG-RAN (RAN3) dùng dữ liệu giữa các node.</text>
<rect x="570" y="72" width="366" height="200" rx="8" fill="#fff" stroke="#c9d3e3"/>
<text x="586" y="96" font-size="12.5" text-anchor="start" fill="#1d4278" font-weight="700">2. AI và RAN (AI-and-RAN)</text>
<text x="586" y="113" font-size="9.5" text-anchor="start" fill="#555">RAN và tải AI dùng chung một hạ tầng tính toán</text>
<rect x="590" y="126" width="326" height="96" rx="6" fill="#555" fill-opacity="0.06" stroke="#555"/>
<text x="753" y="142" font-size="9.5" text-anchor="middle" fill="#555" font-weight="700">Server với GPU hoặc accelerator</text>
<rect x="602" y="150" width="140" height="60" rx="6" fill="#1d4278" fill-opacity="0.15" stroke="#1d4278" stroke-width="1.4"/>
<text x="672.0" y="177.0" font-size="10.5" text-anchor="middle" fill="#1d4278" font-weight="700">Tải RAN</text>
<text x="672.0" y="191.0" font-size="8.8" text-anchor="middle" fill="#555">L1, L2 của DU</text>
<rect x="762" y="150" width="142" height="60" rx="6" fill="#a23b72" fill-opacity="0.15" stroke="#a23b72" stroke-width="1.4"/>
<text x="833.0" y="177.0" font-size="10.5" text-anchor="middle" fill="#a23b72" font-weight="700">Tải AI</text>
<text x="833.0" y="191.0" font-size="8.8" text-anchor="middle" fill="#555">suy luận, huấn luyện</text>
<text x="753" y="240" font-size="9" text-anchor="middle" fill="#555">Phần năng lực tính toán RAN không dùng (giờ thấp điểm)</text>
<text x="753" y="254" font-size="9" text-anchor="middle" fill="#555">được cấp cho tải AI; đổi lại cần cách ly để giữ deadline của L1.</text>
<rect x="570" y="286" width="366" height="192" rx="8" fill="#fff" stroke="#c9d3e3"/>
<text x="586" y="310" font-size="12.5" text-anchor="start" fill="#1d4278" font-weight="700">3. AI trên RAN (AI-on-RAN)</text>
<text x="586" y="327" font-size="9.5" text-anchor="start" fill="#555">Ứng dụng AI của người dùng chạy ở biên mạng, gần RAN</text>
<rect x="596" y="342" width="96" height="52" rx="6" fill="#2f5d9e" fill-opacity="0.15" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="644.0" y="365.0" font-size="10" text-anchor="middle" fill="#2f5d9e" font-weight="700">UE</text>
<text x="644.0" y="379.0" font-size="8.8" text-anchor="middle" fill="#555">camera, robot</text>
<rect x="716" y="342" width="96" height="52" rx="6" fill="#1d4278" fill-opacity="0.15" stroke="#1d4278" stroke-width="1.4"/>
<text x="764.0" y="365.0" font-size="10" text-anchor="middle" fill="#1d4278" font-weight="700">gNB</text>
<text x="764.0" y="379.0" font-size="8.8" text-anchor="middle" fill="#555">RAN</text>
<rect x="836" y="342" width="90" height="52" rx="6" fill="#a23b72" fill-opacity="0.15" stroke="#a23b72" stroke-width="1.4"/>
<text x="881.0" y="365.0" font-size="10" text-anchor="middle" fill="#a23b72" font-weight="700">AI tại biên</text>
<text x="881.0" y="379.0" font-size="8.8" text-anchor="middle" fill="#555">edge server</text>
<line x1="692" y1="368" x2="716" y2="368" stroke="#555" stroke-width="1.4"/><line x1="812" y1="368" x2="836" y2="368" stroke="#555" stroke-width="1.4"/>
<text x="753" y="418" font-size="9" text-anchor="middle" fill="#555">Độ trễ thấp nhờ xử lý gần người dùng: phân tích video,</text>
<text x="753" y="432" font-size="9" text-anchor="middle" fill="#555">điều khiển robot, ứng dụng AI tạo sinh;</text>
<text x="753" y="446" font-size="9" text-anchor="middle" fill="#555">RAN cung cấp kết nối và có thể ưu tiên QoS cho các luồng này.</text>
</svg>