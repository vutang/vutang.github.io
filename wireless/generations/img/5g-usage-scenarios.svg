<svg role="img" viewBox="0 0 760 492" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Ba nhóm kịch bản sử dụng của IMT-2020: eMBB, URLLC và mMTC ở ba đỉnh tam giác, kèm chỉ tiêu chính và ví dụ ứng dụng; RedCap nằm giữa eMBB và mMTC</title>
  <rect x="0" y="0" width="760" height="470" rx="8" fill="#ffffff"/>
  <polygon points="380,70 110,390 650,390" fill="#f1f6fd" stroke="#7d8fb3" stroke-width="1.5"/>
  <!-- eMBB -->
  <circle cx="380" cy="70" r="9" fill="#1d4278"/>
  <text x="380" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#1d4278">eMBB</text>
  <text x="380" y="52" font-size="10.5" text-anchor="middle" fill="#334155">Tốc độ đỉnh 20 Gbit/s, 100 Mbit/s trải nghiệm</text>
  <text x="380" y="150" font-size="10" text-anchor="middle" fill="#475569">Video độ phân giải cao</text>
  <text x="380" y="165" font-size="10" text-anchor="middle" fill="#475569">Fixed wireless access</text>
  <text x="380" y="180" font-size="10" text-anchor="middle" fill="#475569">AR/VR</text>
  <!-- URLLC -->
  <circle cx="650" cy="390" r="9" fill="#b45309"/>
  <text x="650" y="420" font-size="16" font-weight="700" text-anchor="middle" fill="#b45309">URLLC</text>
  <text x="650" y="438" font-size="10.5" text-anchor="middle" fill="#334155">Trễ 1 ms, độ tin cậy 1-10⁻⁵</text>
  <text x="535" y="335" font-size="10" text-anchor="middle" fill="#475569">Điều khiển công nghiệp</text>
  <text x="535" y="350" font-size="10" text-anchor="middle" fill="#475569">Xe tự hành, V2X</text>
  <text x="535" y="365" font-size="10" text-anchor="middle" fill="#475569">Lưới điện thông minh</text>
  <!-- mMTC -->
  <circle cx="110" cy="390" r="9" fill="#047857"/>
  <text x="110" y="420" font-size="16" font-weight="700" text-anchor="middle" fill="#047857">mMTC</text>
  <text x="110" y="438" font-size="10.5" text-anchor="middle" fill="#334155">1 triệu thiết bị/km²</text>
  <text x="225" y="335" font-size="10" text-anchor="middle" fill="#475569">Đồng hồ đo thông minh</text>
  <text x="225" y="350" font-size="10" text-anchor="middle" fill="#475569">Cảm biến môi trường</text>
  <text x="225" y="365" font-size="10" text-anchor="middle" fill="#475569">Theo dõi tài sản</text>
  <!-- RedCap -->
  <rect x="160" y="210" width="110" height="42" rx="6" fill="#ffffff" stroke="#64748b" stroke-dasharray="5 3"/>
  <text x="215" y="228" font-size="11" font-weight="700" text-anchor="middle" fill="#1e293b">RedCap</text>
  <text x="215" y="243" font-size="9.5" text-anchor="middle" fill="#475569">wearable, camera</text>
  <!-- center -->
  <text x="380" y="270" font-size="11" text-anchor="middle" fill="#1d4278">Một mạng NR,</text>
  <text x="380" y="285" font-size="11" text-anchor="middle" fill="#1d4278">tách logic bằng network slicing</text>
<text id="wm" x="751.2" y="485.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
