<!-- bottom support blocks -->
<rect x="20" y="345" width="290" height="100" rx="8" fill="#2f5d9e" fill-opacity="0.08" stroke="#2f5d9e" stroke-width="1.3"/>
<text x="165" y="368" font-size="11.5" text-anchor="middle" fill="#2f5d9e" font-weight="700">Điều khiển và quản lý</text>
<text x="165" y="388" font-size="9.5" text-anchor="middle" fill="#555">CPU nhúng chạy Linux</text>
<text x="165" y="403" font-size="9.5" text-anchor="middle" fill="#555">M-plane (NETCONF/YANG), firmware</text>
<text x="165" y="418" font-size="9.5" text-anchor="middle" fill="#555">cấu hình transceiver, cảnh báo, hiệu chỉnh</text>

<rect x="330" y="345" width="290" height="100" rx="8" fill="#a23b72" fill-opacity="0.08" stroke="#a23b72" stroke-width="1.3"/>
<text x="475" y="368" font-size="11.5" text-anchor="middle" fill="#a23b72" font-weight="700">Clock và đồng bộ</text>
<text x="475" y="388" font-size="9.5" text-anchor="middle" fill="#555">PTP và SyncE từ fronthaul</text>
<text x="475" y="403" font-size="9.5" text-anchor="middle" fill="#555">DPLL, jitter cleaner</text>
<text x="475" y="418" font-size="9.5" text-anchor="middle" fill="#555">device clock, SYSREF, LO cho transceiver</text>

<rect x="640" y="345" width="300" height="100" rx="8" fill="#b7791f" fill-opacity="0.08" stroke="#b7791f" stroke-width="1.3"/>
<text x="790" y="368" font-size="11.5" text-anchor="middle" fill="#6e4508" font-weight="700">Nguồn và nhiệt</text>
<text x="790" y="388" font-size="9.5" text-anchor="middle" fill="#555">DC vào (thường -48 V) → các rail nguồn</text>
<text x="790" y="403" font-size="9.5" text-anchor="middle" fill="#555">nguồn và bias cho PA</text>
<text x="790" y="418" font-size="9.5" text-anchor="middle" fill="#555">cảm biến nhiệt, tản nhiệt thụ động</text>
