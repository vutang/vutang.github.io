<text x="365" y="192" font-size="9.5" text-anchor="middle" fill="#555">CFR</text>
<text x="365" y="206" font-size="9.5" text-anchor="middle" fill="#555">DPD</text>
<text x="365" y="220" font-size="9.5" text-anchor="middle" fill="#555">AGC</text>

