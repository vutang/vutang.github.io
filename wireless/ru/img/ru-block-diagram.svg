<line x1="884" y1="185" x2="910" y2="185" stroke="#555" stroke-width="1.4"/>
<line x1="910" y1="185" x2="910" y2="140" stroke="#555" stroke-width="1.4"/>
<polygon points="894,118 926,118 910,140" fill="none" stroke="#555" stroke-width="1.6"/>
<text x="910" y="228" font-size="9.5" text-anchor="middle" fill="#555">Anten</text>

