<rect x="832" y="160" width="52" height="50" rx="6" fill="#555" fill-opacity="0.16" stroke="#555" stroke-width="1.5"/>
<text x="858" y="182" font-size="10.5" text-anchor="middle" fill="#555" font-weight="700">Bộ</text>
<text x="858" y="196" font-size="10.5" text-anchor="middle" fill="#555" font-weight="700">lọc</text>
<line x1="818" y1="185" x2="832" y2="185" stroke="#555" stroke-width="1.4"/>

