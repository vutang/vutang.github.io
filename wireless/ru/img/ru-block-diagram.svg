<line x1="704" y1="135" x2="738" y2="135" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<circle cx="718" cy="135" r="4" fill="#a23b72"/>
<polyline points="718,139 718,300 600,300" fill="none" stroke="#a23b72" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#b)"/>
<text x="724" y="290" font-size="9" fill="#a23b72">coupler</text>

