<rect x="638" y="110" width="66" height="50" rx="6" fill="#b7791f" fill-opacity="0.16" stroke="#b7791f" stroke-width="1.5"/>
<text x="671" y="140" font-size="11.5" text-anchor="middle" fill="#6e4508" font-weight="700">PA</text>
<rect x="638" y="210" width="66" height="50" rx="6" fill="#b7791f" fill-opacity="0.16" stroke="#b7791f" stroke-width="1.5"/>
<text x="671" y="240" font-size="11.5" text-anchor="middle" fill="#6e4508" font-weight="700">LNA</text>
<line x1="598" y1="135" x2="636" y2="135" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="638" y1="235" x2="600" y2="235" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>

