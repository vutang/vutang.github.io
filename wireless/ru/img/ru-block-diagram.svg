<svg role="img" viewBox="0 0 960 497.79" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
<title>Sơ đồ khối O-RU: giao diện fronthaul, Low-PHY, DFE, transceiver với DAC và ADC, RF front-end gồm PA, LNA, chuyển mạch, bộ lọc, anten, cùng các khối điều khiển, clock và nguồn</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a23b72"/></marker>
</defs>
<rect x="0" y="0" width="960" height="470" rx="8" fill="#ffffff"/>
<rect x="10" y="10" width="940" height="450" rx="10" fill="#f6f8fb" stroke="#c9d3e3"/>
<text x="30" y="36" font-size="14" font-weight="700" fill="#1d4278">Sơ đồ khối của một O-RU (split 7.2x)</text>
<text x="30" y="54" font-size="10.5" fill="#666">Một nhánh thu phát được vẽ chi tiết; RU thực tế có N nhánh song song (từ 2T2R tới 64T64R)</text>

<!-- group boxes -->
<rect x="20" y="70" width="415" height="250" rx="8" fill="#1d4278" fill-opacity="0.05" stroke="#1d4278" stroke-dasharray="5 4"/>
<text x="227" y="86" font-size="11.5" text-anchor="middle" fill="#1d4278" font-weight="700">Xử lý số (FPGA, SoC hoặc ASIC)</text>
<rect x="482" y="70" width="130" height="250" rx="8" fill="#555" fill-opacity="0.05" stroke="#555" stroke-dasharray="5 4"/>
<text x="547" y="86" font-size="11.5" text-anchor="middle" fill="#555" font-weight="700">Transceiver</text>
<rect x="625" y="70" width="315" height="250" rx="8" fill="#b7791f" fill-opacity="0.05" stroke="#b7791f" stroke-dasharray="5 4"/>
<text x="782" y="86" font-size="11.5" text-anchor="middle" fill="#6e4508" font-weight="700">RF front-end (analog)</text>

<!-- fronthaul input -->

