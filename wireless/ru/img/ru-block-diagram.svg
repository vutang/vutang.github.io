<text x="91" y="178" font-size="9.5" text-anchor="middle" fill="#555">Ethernet, eCPRI</text>
<text x="91" y="192" font-size="9.5" text-anchor="middle" fill="#555">C/U-plane</text>
<text x="91" y="206" font-size="9.5" text-anchor="middle" fill="#555">nén/giải nén IQ</text>
<text x="91" y="220" font-size="9.5" text-anchor="middle" fill="#555">PTP timestamp</text>

<rect x="170" y="110" width="118" height="150" rx="6" fill="#1d4278" fill-opacity="0.16" stroke="#1d4278" stroke-width="1.5"/>
<text x="229" y="160" font-size="11.5" text-anchor="middle" fill="#1d4278" font-weight="700">Low-PHY</text>
<text x="229" y="178" font-size="9.5" text-anchor="middle" fill="#555">iFFT/FFT, CP</text>
<text x="229" y="192" font-size="9.5" text-anchor="middle" fill="#555">beamforming</text>
<text x="229" y="206" font-size="9.5" text-anchor="middle" fill="#555">precoding (Cat B)</text>
<text x="229" y="220" font-size="9.5" text-anchor="middle" fill="#555">lọc PRACH</text>

<rect x="308" y="110" width="115" height="150" rx="6" fill="#b7791f" fill-opacity="0.16" stroke="#b7791f" stroke-width="1.5"/>
<text x="365" y="160" font-size="11.5" text-anchor="middle" fill="#6e4508" font-weight="700">DFE</text>
