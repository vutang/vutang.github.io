<text x="160" y="104" font-size="9.5" fill="#2f5d9e" font-weight="700">Downlink (phát) →</text>
<text x="160" y="276" font-size="9.5" fill="#2f5d9e" font-weight="700">← Uplink (thu)</text>

<!-- fronthaul to DU -->
<text x="91" y="300" font-size="9.5" text-anchor="middle" fill="#2f5d9e" font-weight="700">↕ Tới O-DU</text>
