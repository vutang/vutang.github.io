<rect x="740" y="110" width="78" height="150" rx="6" fill="#555" fill-opacity="0.16" stroke="#555" stroke-width="1.5"/>
<text x="779" y="170" font-size="10.5" text-anchor="middle" fill="#555" font-weight="700">Chuyển</text>
<text x="779" y="184" font-size="10.5" text-anchor="middle" fill="#555" font-weight="700">mạch TDD</text>
<text x="779" y="202" font-size="9" text-anchor="middle" fill="#555">hoặc duplexer</text>
<text x="779" y="215" font-size="9" text-anchor="middle" fill="#555">(FDD)</text>
<line x1="740" y1="235" x2="706" y2="235" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>

