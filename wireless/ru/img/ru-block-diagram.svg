<line x1="423" y1="135" x2="492" y2="135" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="494" y1="240" x2="425" y2="240" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="494" y1="291" x2="410" y2="291" stroke="#a23b72" stroke-width="1.4"/>
<line x1="410" y1="291" x2="410" y2="262" stroke="#a23b72" stroke-width="1.4" marker-end="url(#b)"/>
