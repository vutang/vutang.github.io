<svg role="img" viewBox="0 0 960 459.79" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
<title>Hai kiến trúc học hệ số DPD: indirect learning với post-inverse và direct learning vòng kín</title>
<rect x="0" y="0" width="960" height="432" rx="8" fill="#ffffff"/>
<rect x="20" y="16" width="920" height="204" rx="10" fill="#f6f8fb" stroke="#c9d3e3"/>
<text x="40" y="42" font-size="14" font-weight="700" fill="#1d4278">Indirect learning (học gián tiếp)</text>
<text x="40" y="60" font-size="10.5" fill="#666">Huấn luyện bộ post-inverse từ đầu ra PA, rồi chép hệ số sang DPD</text>
<text x="50" y="134" font-size="11" text-anchor="start" fill="#555" font-weight="700">x(n)</text>
<line x1="85" y1="130" x2="140" y2="130" stroke="#555" stroke-width="1.5"/>
<path d="M132.6 133.1 L140 130 L132.6 126.9" fill="none" stroke="#555" stroke-width="1.5"/>
<rect x="140" y="106" width="110" height="48" rx="6" fill="#b7791f" fill-opacity="0.16" stroke="#b7791f" stroke-width="1.5"/>
<text x="195.0" y="128.0" font-size="11.5" text-anchor="middle" fill="#b7791f" font-weight="700">DPD</text>
<text x="195.0" y="143.0" font-size="9.5" text-anchor="middle" fill="#555">bản sao hệ số</text>
<line x1="250" y1="130" x2="330" y2="130" stroke="#555" stroke-width="1.5"/>
<path d="M322.6 133.1 L330 130 L322.6 126.9" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="290" y="122" font-size="10" text-anchor="middle" fill="#555">u(n)</text>
<rect x="330" y="106" width="90" height="48" rx="6" fill="#2f5d9e" fill-opacity="0.16" stroke="#2f5d9e" stroke-width="1.5"/>
<text x="375.0" y="134.0" font-size="11.5" text-anchor="middle" fill="#2f5d9e" font-weight="700">PA</text>
<line x1="420" y1="130" x2="520" y2="130" stroke="#555" stroke-width="1.5"/>
<path d="M512.6 133.1 L520 130 L512.6 126.9" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="520" y="122" font-size="10" text-anchor="end" fill="#555">y(n)/G</text>
<rect x="520" y="106" width="130" height="48" rx="6" fill="#a23b72" fill-opacity="0.16" stroke="#a23b72" stroke-width="1.5"/>
<text x="585.0" y="128.0" font-size="11.5" text-anchor="middle" fill="#a23b72" font-weight="700">Post-inverse</text>
<text x="585.0" y="143.0" font-size="9.5" text-anchor="middle" fill="#555">ước lượng ngược PA</text>
<line x1="650" y1="130" x2="730" y2="130" stroke="#a23b72" stroke-width="1.5"/>
<path d="M722.6 133.1 L730 130 L722.6 126.9" fill="none" stroke="#a23b72" stroke-width="1.5"/>
<text x="690" y="122" font-size="10" text-anchor="middle" fill="#a23b72">û(n)</text>
<circle cx="745" cy="130" r="14" fill="#fff" stroke="#a23b72" stroke-width="1.5"/>
<text x="745" y="135" font-size="14" text-anchor="middle" fill="#a23b72" font-weight="700">−</text>
<polyline points="290,130 290,186 745,186 745,144" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M748.1 151.4 L745 144 L741.9 151.4" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="560" y="200" font-size="10.5" text-anchor="middle" fill="#a23b72">e(n) = u(n) − û(n) dùng để cập nhật post-inverse</text>
<polyline points="585,106 585,90 195,90 195,106" fill="none" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="5 3"/>
<path d="M191.9 98.6 L195 106 L198.1 98.6" fill="none" stroke="#b7791f" stroke-width="1.5"/>
<text x="390" y="85" font-size="10" text-anchor="middle" fill="#b7791f">chép hệ số</text>
<rect x="20" y="234" width="920" height="182" rx="10" fill="#f6f8fb" stroke="#c9d3e3"/>
<text x="40" y="260" font-size="14" font-weight="700" fill="#1d4278">Direct learning (học trực tiếp, vòng kín)</text>
<text x="40" y="278" font-size="10.5" fill="#666">So sánh trực tiếp đầu vào mong muốn với đầu ra PA và cập nhật hệ số DPD</text>
<text x="50" y="338" font-size="11" text-anchor="start" fill="#555" font-weight="700">x(n)</text>
<line x1="85" y1="334" x2="200" y2="334" stroke="#555" stroke-width="1.5"/>
<path d="M192.6 337.1 L200 334 L192.6 330.9" fill="none" stroke="#555" stroke-width="1.5"/>
<rect x="200" y="310" width="110" height="48" rx="6" fill="#b7791f" fill-opacity="0.16" stroke="#b7791f" stroke-width="1.5"/>
<text x="255.0" y="338.0" font-size="11.5" text-anchor="middle" fill="#b7791f" font-weight="700">DPD</text>
<line x1="310" y1="334" x2="400" y2="334" stroke="#555" stroke-width="1.5"/>
<path d="M392.6 337.1 L400 334 L392.6 330.9" fill="none" stroke="#555" stroke-width="1.5"/>
<rect x="400" y="310" width="90" height="48" rx="6" fill="#2f5d9e" fill-opacity="0.16" stroke="#2f5d9e" stroke-width="1.5"/>
<text x="445.0" y="338.0" font-size="11.5" text-anchor="middle" fill="#2f5d9e" font-weight="700">PA</text>
<line x1="490" y1="334" x2="640" y2="334" stroke="#555" stroke-width="1.5"/>
<path d="M632.6 337.1 L640 334 L632.6 330.9" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="600" y="326" font-size="10" text-anchor="middle" fill="#555">y(n)/G</text>
<circle cx="655" cy="334" r="14" fill="#fff" stroke="#a23b72" stroke-width="1.5"/>
<text x="655" y="339" font-size="14" text-anchor="middle" fill="#a23b72" font-weight="700">−</text>
<polyline points="130,334 130,386 655,386 655,348" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M658.1 355.4 L655 348 L651.9 355.4" fill="none" stroke="#555" stroke-width="1.5"/>
<line x1="669" y1="334" x2="740" y2="334" stroke="#a23b72" stroke-width="1.5"/>
<path d="M732.6 337.1 L740 334 L732.6 330.9" fill="none" stroke="#a23b72" stroke-width="1.5"/>
<rect x="740" y="310" width="170" height="48" rx="6" fill="#a23b72" fill-opacity="0.16" stroke="#a23b72" stroke-width="1.5"/>
<text x="825.0" y="332.0" font-size="11.5" text-anchor="middle" fill="#a23b72" font-weight="700">Cập nhật hệ số</text>
<text x="825.0" y="347.0" font-size="9.5" text-anchor="middle" fill="#555">từ e(n) = x(n) − y(n)/G</text>
<polyline points="825,310 825,292 255,292 255,310" fill="none" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="5 3"/>
<path d="M251.9 302.6 L255 310 L258.1 302.6" fill="none" stroke="#b7791f" stroke-width="1.5"/>
<text id="wm" x="948.88" y="451.45" text-anchor="end" font-size="13.89" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
