<svg role="img" viewBox="0 0 960 450" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
<title>Quy hoạch khối phổ theo IBW: hai khối nằm trong một cửa sổ IBW và hai khối cách nhau xa hơn IBW</title>
<rect x="0" y="0" width="960" height="450" rx="8" fill="#ffffff"/>
<rect x="20" y="16" width="920" height="200" rx="10" fill="#f6f8fb" stroke="#c9d3e3"/>
<text x="40" y="42" font-size="14" font-weight="700" fill="#1d4278">Hai khối phổ nằm trong một cửa sổ IBW</text>
<text x="40" y="60" font-size="10.5" fill="#666">Ví dụ minh họa: khối 3400 – 3500 MHz và 3540 – 3580 MHz, một RU phục vụ được cả hai</text>
<path d="M80.0 102 V94 H880.0 V102" fill="none" stroke="#777" stroke-width="1.5"/>
<text x="480.0" y="88" font-size="11" text-anchor="middle" fill="#777">Frequency range của RU: 3300 – 3700 MHz</text>
<rect x="280.0" y="140" width="200.0" height="50" rx="4" fill="#2f5d9e" fill-opacity="0.28" stroke="#2f5d9e" stroke-width="1.5"/>
<text x="380.0" y="170" font-size="11" text-anchor="middle" fill="#2f5d9e" font-weight="700">100 MHz</text>
<rect x="560.0" y="140" width="80.0" height="50" rx="4" fill="#b7791f" fill-opacity="0.28" stroke="#b7791f" stroke-width="1.5"/>
<text x="600.0" y="170" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="700">40 MHz</text>
<rect x="260.0" y="130" width="400.0" height="64" rx="6" fill="none" stroke="#2c7a4b" stroke-width="2" stroke-dasharray="7 4"/>
<text x="266.0" y="123" font-size="11" text-anchor="start" fill="#2c7a4b" font-weight="700">Cửa sổ IBW 200 MHz</text>
<line x1="60" y1="198" x2="920" y2="198" stroke="#555" stroke-width="1.3"/>
<text x="920" y="216" font-size="10" text-anchor="end" fill="#555">Tần số</text>
<rect x="20" y="232" width="920" height="200" rx="10" fill="#f6f8fb" stroke="#c9d3e3"/>
<text x="40" y="258" font-size="14" font-weight="700" fill="#1d4278">Hai khối phổ cách nhau xa hơn IBW</text>
<text x="40" y="276" font-size="10.5" fill="#666">Ví dụ minh họa: khối 3320 – 3420 MHz và 3600 – 3680 MHz, cần hai RU hoặc hai nhánh RF</text>
<path d="M80.0 318 V310 H880.0 V318" fill="none" stroke="#777" stroke-width="1.5"/>
<text x="480.0" y="304" font-size="11" text-anchor="middle" fill="#777">Frequency range của RU: 3300 – 3700 MHz</text>
<rect x="120.0" y="356" width="200.0" height="50" rx="4" fill="#2f5d9e" fill-opacity="0.28" stroke="#2f5d9e" stroke-width="1.5"/>
<text x="220.0" y="386" font-size="11" text-anchor="middle" fill="#2f5d9e" font-weight="700">100 MHz</text>
<rect x="680.0" y="356" width="160.0" height="50" rx="4" fill="#b7791f" fill-opacity="0.28" stroke="#b7791f" stroke-width="1.5"/>
<text x="760.0" y="386" font-size="11" text-anchor="middle" fill="#b7791f" font-weight="700">80 MHz</text>
<rect x="100.0" y="346" width="400.0" height="64" rx="6" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 4"/>
<text x="106.0" y="339" font-size="11" text-anchor="start" fill="#c0392b" font-weight="700">Cửa sổ IBW 200 MHz</text>
<line x1="60" y1="414" x2="920" y2="414" stroke="#555" stroke-width="1.3"/>
<text x="920" y="432" font-size="10" text-anchor="end" fill="#555">Tần số</text>
</svg>
