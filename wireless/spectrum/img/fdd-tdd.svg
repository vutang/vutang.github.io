<svg role="img" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
<title>So sánh FDD và TDD: FDD dùng hai dải tần riêng cho DL và UL, TDD chia thời gian trên cùng một dải tần</title>
<rect x="0" y="0" width="960" height="360" rx="8" fill="#ffffff"/>
<text x="40" y="30" font-size="14" font-weight="700" fill="#1d4278">FDD: hai dải tần riêng</text>
<line x1="70" y1="60" x2="70" y2="300" stroke="#555" stroke-width="1.5"/>
<line x1="70" y1="300" x2="450" y2="300" stroke="#555" stroke-width="1.5"/>
<text x="34" y="180" font-size="11" fill="#444" transform="rotate(-90 34 180)" text-anchor="middle">Tần số</text>
<text x="260" y="322" font-size="11" text-anchor="middle" fill="#444">Thời gian</text>
<rect x="75" y="80" width="350" height="50" rx="4" fill="#b7791f" fill-opacity="0.25" stroke="#b7791f"/>
<text x="250" y="110" font-size="12" font-weight="700" text-anchor="middle" fill="#7b4f10">Downlink (liên tục): f_DL</text>
<rect x="75" y="210" width="350" height="50" rx="4" fill="#2f5d9e" fill-opacity="0.25" stroke="#2f5d9e"/>
<text x="250" y="240" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">Uplink (liên tục): f_UL</text>
<line x1="250" y1="134" x2="250" y2="206" stroke="#777" stroke-dasharray="4 3"/>
<text x="258" y="174" font-size="10.5" fill="#555">khoảng duplex</text>
<text x="250" y="342" font-size="10.5" text-anchor="middle" fill="#666">Cần filter duplexer, không cần đồng bộ UL/DL giữa các trạm</text>
<text x="520" y="30" font-size="14" font-weight="700" fill="#1d4278">TDD: một dải tần, chia theo thời gian</text>
<line x1="550" y1="60" x2="550" y2="300" stroke="#555" stroke-width="1.5"/>
<line x1="550" y1="300" x2="930" y2="300" stroke="#555" stroke-width="1.5"/>
<text x="514" y="180" font-size="11" fill="#444" transform="rotate(-90 514 180)" text-anchor="middle">Tần số</text>
<text x="740" y="322" font-size="11" text-anchor="middle" fill="#444">Thời gian</text>
<rect x="575" y="140" width="33" height="70" rx="3" fill="#b7791f" fill-opacity="0.3" stroke="#b7791f"/>
<text x="591.5" y="181" font-size="13" font-weight="700" text-anchor="middle" fill="#b7791f">D</text>
<rect x="610" y="140" width="33" height="70" rx="3" fill="#b7791f" fill-opacity="0.3" stroke="#b7791f"/>
<text x="626.5" y="181" font-size="13" font-weight="700" text-anchor="middle" fill="#b7791f">D</text>
<rect x="645" y="140" width="33" height="70" rx="3" fill="#b7791f" fill-opacity="0.3" stroke="#b7791f"/>
<text x="661.5" y="181" font-size="13" font-weight="700" text-anchor="middle" fill="#b7791f">D</text>
<rect x="680" y="140" width="33" height="70" rx="3" fill="#888" fill-opacity="0.3" stroke="#888"/>
<text x="696.5" y="181" font-size="13" font-weight="700" text-anchor="middle" fill="#888">S</text>
<rect x="715" y="140" width="33" height="70" rx="3" fill="#2f5d9e" fill-opacity="0.3" stroke="#2f5d9e"/>
<text x="731.5" y="181" font-size="13" font-weight="700" text-anchor="middle" fill="#2f5d9e">U</text>
<rect x="750" y="140" width="33" height="70" rx="3" fill="#b7791f" fill-opacity="0.3" stroke="#b7791f"/>
<text x="766.5" y="181" font-size="13" font-weight="700" text-anchor="middle" fill="#b7791f">D</text>
<rect x="785" y="140" width="33" height="70" rx="3" fill="#b7791f" fill-opacity="0.3" stroke="#b7791f"/>
<text x="801.5" y="181" font-size="13" font-weight="700" text-anchor="middle" fill="#b7791f">D</text>
<rect x="820" y="140" width="33" height="70" rx="3" fill="#b7791f" fill-opacity="0.3" stroke="#b7791f"/>
<text x="836.5" y="181" font-size="13" font-weight="700" text-anchor="middle" fill="#b7791f">D</text>
<rect x="855" y="140" width="33" height="70" rx="3" fill="#888" fill-opacity="0.3" stroke="#888"/>
<text x="871.5" y="181" font-size="13" font-weight="700" text-anchor="middle" fill="#888">S</text>
<rect x="890" y="140" width="33" height="70" rx="3" fill="#2f5d9e" fill-opacity="0.3" stroke="#2f5d9e"/>
<text x="906.5" y="181" font-size="13" font-weight="700" text-anchor="middle" fill="#2f5d9e">U</text>
<text x="750" y="124" font-size="10.5" text-anchor="middle" fill="#555">Ví dụ mẫu DDDSU lặp lại (D: downlink, S: special, U: uplink)</text>
<text x="750" y="342" font-size="10.5" text-anchor="middle" fill="#666">Các trạm lân cận phải đồng pha và dùng cùng mẫu UL/DL</text>
</svg>