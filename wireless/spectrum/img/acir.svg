<svg role="img" viewBox="0 0 960 447.79" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
<title>Nhiễu kênh kề giữa máy phát A và máy thu B: phần do ACLR của A và phần do ACS của B gộp thành ACIR</title>
<rect x="0" y="0" width="960" height="420" rx="8" fill="#ffffff"/>
<rect x="20" y="16" width="920" height="388" rx="10" fill="#f6f8fb" stroke="#c9d3e3"/>
<text x="40" y="42" font-size="14" font-weight="700" fill="#1d4278">ACLR, ACS và ACIR</text>
<text x="40" y="60" font-size="10.5" fill="#666">Máy phát A gây nhiễu cho máy thu B ở kênh kề theo hai đường</text>
<rect x="500" y="96" width="280" height="194" fill="#b7791f" fill-opacity="0.06"/>
<path d="M140 290 L160 110 H400 L420 230 Q520 250 640 262 L780 270 L780 290 Z" fill="#2f5d9e" fill-opacity="0.22" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="280" y="150" font-size="12" text-anchor="middle" fill="#2f5d9e" font-weight="700">Tín hiệu phát A</text>
<path d="M160 280 L320 274 Q420 262 500 230 L520 120 H760 L780 290" fill="none" stroke="#b7791f" stroke-width="2" stroke-dasharray="7 4"/>
<text x="640" y="150" font-size="12" text-anchor="middle" fill="#6e4508" font-weight="700">Đáp ứng bộ lọc thu B</text>
<text x="640" y="90" font-size="11" text-anchor="middle" fill="#6e4508">Kênh của B</text>
<text x="280" y="100" font-size="11" text-anchor="middle" fill="#2f5d9e">Kênh của A</text>
<circle cx="640" cy="240" r="10" fill="#ffffff" stroke="#a23b72" stroke-width="1.6"/>
<text x="640" y="244" font-size="11" text-anchor="middle" fill="#a23b72" font-weight="700">1</text>
<circle cx="330" cy="255" r="10" fill="#ffffff" stroke="#a23b72" stroke-width="1.6"/>
<text x="330" y="259" font-size="11" text-anchor="middle" fill="#a23b72" font-weight="700">2</text>
<line x1="120" y1="290" x2="920" y2="290" stroke="#555" stroke-width="1.3"/>
<text x="920" y="308" font-size="10" text-anchor="end" fill="#555">Tần số</text>
<circle cx="52" cy="326" r="10" fill="#ffffff" stroke="#a23b72" stroke-width="1.6"/>
<text x="52" y="330" font-size="11" text-anchor="middle" fill="#a23b72" font-weight="700">1</text>
<text x="70" y="330" font-size="11" text-anchor="start" fill="#444">Công suất A rò vào kênh B. Phần này nằm trong băng thu của B, bộ lọc thu không loại được. Giới hạn bởi ACLR của A.</text>
<circle cx="52" cy="352" r="10" fill="#ffffff" stroke="#a23b72" stroke-width="1.6"/>
<text x="52" y="356" font-size="11" text-anchor="middle" fill="#a23b72" font-weight="700">2</text>
<text x="70" y="356" font-size="11" text-anchor="start" fill="#444">Công suất A trong kênh A lọt qua sườn bộ lọc thu của B. Giới hạn bởi ACS của B.</text>
<text x="40" y="384" font-size="11" text-anchor="start" fill="#1d4278" font-weight="700">ACIR = 1 / (1/ACLR + 1/ACS), các đại lượng ở dạng tuyến tính. Ví dụ với giá trị giả định ACLR = 45 dB, ACS = 33 dB: ACIR khoảng 32,7 dB.</text>
<text id="wm" x="948.88" y="439.45" text-anchor="end" font-size="13.89" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
