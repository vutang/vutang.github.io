<svg role="img" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
<title>Các lớp băng thông RF: frequency range, IBW, OBW của RU và channel bandwidth, transmission bandwidth, guard band, occupied bandwidth của một sóng mang</title>
<rect x="0" y="0" width="960" height="560" rx="8" fill="#ffffff"/>

<!-- Panel 1: RU -->
<rect x="20" y="16" width="920" height="248" rx="10" fill="#f6f8fb" stroke="#c9d3e3"/>
<text x="40" y="42" font-size="14" font-weight="700" fill="#1d4278">Mức RU (thông số datasheet)</text>
<text x="40" y="60" font-size="10.5" fill="#666">Ví dụ minh họa: RU band n78, theo tỷ lệ 2,1 px/MHz</text>

<path d="M60 92 V84 H900 V92" fill="none" stroke="#777" stroke-width="1.3"/>
<text x="480" y="78" font-size="11.5" text-anchor="middle" fill="#444">Frequency range: dải thông của filter, ví dụ 3400 – 3800 MHz (400 MHz)</text>

<path d="M200 130 V122 H620 V130" fill="none" stroke="#2c7a4b" stroke-width="1.6"/>
<text x="410" y="116" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2c7a4b">IBW: khối phổ RU phát/thu đồng thời, ví dụ 200 MHz</text>
<line x1="200" y1="130" x2="200" y2="222" stroke="#2c7a4b" stroke-dasharray="4 3"/>
<line x1="620" y1="130" x2="620" y2="222" stroke="#2c7a4b" stroke-dasharray="4 3"/>

<rect x="210" y="150" width="210" height="62" rx="4" fill="#2f5d9e" fill-opacity="0.28" stroke="#2f5d9e" stroke-width="1.5"/>
<text x="315" y="178" font-size="12" font-weight="700" text-anchor="middle" fill="#2f5d9e">Carrier 1</text>
<text x="315" y="196" font-size="10.5" text-anchor="middle" fill="#2f5d9e">100 MHz</text>
<rect x="470" y="150" width="126" height="62" rx="4" fill="#b7791f" fill-opacity="0.28" stroke="#b7791f" stroke-width="1.5"/>
<text x="533" y="178" font-size="12" font-weight="700" text-anchor="middle" fill="#b7791f">Carrier 2</text>
<text x="533" y="196" font-size="10.5" text-anchor="middle" fill="#b7791f">60 MHz</text>
<text x="445" y="186" font-size="10" text-anchor="middle" fill="#888">trống</text>

<line x1="40" y1="222" x2="920" y2="222" stroke="#555" stroke-width="1.3"/>
<text x="920" y="240" font-size="10" text-anchor="end" fill="#555">Tần số</text>
<text x="40" y="250" font-size="11" fill="#444">OBW theo cách dùng trong datasheet: tổng băng thông các carrier đang hoạt động = 100 + 60 = 160 MHz</text>

<!-- Panel 2: one carrier -->
<rect x="20" y="280" width="920" height="264" rx="10" fill="#f6f8fb" stroke="#c9d3e3"/>
<text x="40" y="306" font-size="14" font-weight="700" fill="#1d4278">Mức một sóng mang (định nghĩa 3GPP)</text>
<text x="40" y="324" font-size="10.5" fill="#666">Carrier 1 phóng to: 100 MHz, SCS 30 kHz. Guard band được vẽ rộng hơn thực tế</text>

<path d="M120 356 V348 H840 V356" fill="none" stroke="#2f5d9e" stroke-width="1.6"/>
<text x="480" y="342" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2f5d9e">Channel bandwidth: 100 MHz</text>

<path d="M175 386 V378 H785 V386" fill="none" stroke="#a23b72" stroke-width="1.6"/>
<text x="480" y="372" font-size="11.5" font-weight="700" text-anchor="middle" fill="#a23b72">Occupied bandwidth: chứa 99% công suất phát</text>

<path d="M170 416 V408 H790 V416" fill="none" stroke="#444" stroke-width="1.4"/>
<text x="480" y="402" font-size="11.5" text-anchor="middle" fill="#444">Transmission bandwidth configuration: 273 RB × 12 × 30 kHz = 98,28 MHz</text>

<line x1="120" y1="356" x2="120" y2="500" stroke="#2f5d9e" stroke-dasharray="4 3"/>
<line x1="840" y1="356" x2="840" y2="500" stroke="#2f5d9e" stroke-dasharray="4 3"/>

<path d="M150 500 L172 432 H788 L810 500 Z" fill="#2f5d9e" fill-opacity="0.22" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="480" y="472" font-size="11" text-anchor="middle" fill="#2f5d9e">Phổ tín hiệu khi cấp phát đủ RB</text>

<line x1="40" y1="500" x2="920" y2="500" stroke="#555" stroke-width="1.3"/>
<text x="920" y="518" font-size="10" text-anchor="end" fill="#555">Tần số</text>
<text x="120" y="518" font-size="10" text-anchor="middle" fill="#2f5d9e">channel edge</text>
<text x="840" y="518" font-size="10" text-anchor="middle" fill="#2f5d9e">channel edge</text>
<text x="145" y="536" font-size="10" text-anchor="middle" fill="#444">guard band</text>
<text x="815" y="536" font-size="10" text-anchor="middle" fill="#444">guard band</text>
</svg>
