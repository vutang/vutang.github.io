<svg role="img" viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
<title>Base Station RF Bandwidth với một sóng mang và với nhiều sóng mang, so với Maximum Base Station RF Bandwidth</title>
<rect x="0" y="0" width="960" height="470" rx="8" fill="#ffffff"/>
<rect x="20" y="16" width="920" height="190" rx="10" fill="#f6f8fb" stroke="#c9d3e3"/>
<text x="40" y="42" font-size="14" font-weight="700" fill="#1d4278">Một sóng mang</text>
<text x="40" y="60" font-size="10.5" fill="#666">Base Station RF Bandwidth bằng BS channel bandwidth</text>
<rect x="380" y="110" width="200" height="60" rx="4" fill="#2f5d9e" fill-opacity="0.28" stroke="#2f5d9e" stroke-width="1.5"/>
<text x="480" y="145" font-size="12" text-anchor="middle" fill="#2f5d9e" font-weight="700">Carrier</text>
<path d="M380 94 V86 H580 V94" fill="none" stroke="#2c7a4b" stroke-width="1.5"/>
<text x="480.0" y="80" font-size="11.5" text-anchor="middle" fill="#2c7a4b" font-weight="700">Base Station RF Bandwidth = channel bandwidth</text>
<line x1="40" y1="170" x2="920" y2="170" stroke="#555" stroke-width="1.3"/>
<text x="920" y="188" font-size="10" text-anchor="end" fill="#555">Tần số</text>
<rect x="20" y="222" width="920" height="232" rx="10" fill="#f6f8fb" stroke="#c9d3e3"/>
<text x="40" y="248" font-size="14" font-weight="700" fill="#1d4278">Nhiều sóng mang trong một band</text>
<text x="40" y="266" font-size="10.5" fill="#666">Base Station RF Bandwidth trải từ biên dưới sóng mang thấp nhất tới biên trên sóng mang cao nhất</text>
<rect x="220" y="360" width="180" height="60" rx="4" fill="#2f5d9e" fill-opacity="0.28" stroke="#2f5d9e" stroke-width="1.5"/>
<text x="310" y="395" font-size="12" text-anchor="middle" fill="#2f5d9e" font-weight="700">Carrier 1</text>
<rect x="560" y="360" width="120" height="60" rx="4" fill="#b7791f" fill-opacity="0.28" stroke="#b7791f" stroke-width="1.5"/>
<text x="620" y="395" font-size="12" text-anchor="middle" fill="#b7791f" font-weight="700">Carrier 2</text>
<text x="480" y="395" font-size="10" text-anchor="middle" fill="#888">khoảng trống</text>
<path d="M220 342 V334 H680 V342" fill="none" stroke="#2c7a4b" stroke-width="1.5"/>
<text x="450.0" y="328" font-size="11.5" text-anchor="middle" fill="#2c7a4b" font-weight="700">Base Station RF Bandwidth (gồm cả khoảng trống)</text>
<path d="M120 298 V290 H840 V298" fill="none" stroke="#777" stroke-width="1.5"/>
<text x="480.0" y="284" font-size="11.5" text-anchor="middle" fill="#777">Maximum Base Station RF Bandwidth: giới hạn thiết bị trong band</text>
<line x1="120" y1="298" x2="120" y2="420" stroke="#777" stroke-dasharray="4 3"/>
<line x1="840" y1="298" x2="840" y2="420" stroke="#777" stroke-dasharray="4 3"/>
<line x1="40" y1="420" x2="920" y2="420" stroke="#555" stroke-width="1.3"/>
<text x="920" y="438" font-size="10" text-anchor="end" fill="#555">Tần số</text>
</svg>
