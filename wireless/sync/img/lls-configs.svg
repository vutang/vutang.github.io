<svg role="img" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Bốn cấu hình đồng bộ LLS-C1 đến LLS-C4 của O-RAN: đường đi của thời gian từ nguồn tham chiếu tới O-DU và O-RU</title>
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d9822b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d9e"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" rx="8" fill="#ffffff"/>

  <!-- Row separators -->
  <line x1="15" y1="120" x2="945" y2="120" stroke="#d0d7e2" stroke-width="1"/>
  <line x1="15" y1="220" x2="945" y2="220" stroke="#d0d7e2" stroke-width="1"/>
  <line x1="15" y1="380" x2="945" y2="380" stroke="#d0d7e2" stroke-width="1"/>
  <line x1="15" y1="480" x2="945" y2="480" stroke="#d0d7e2" stroke-width="1"/>

  <!-- ===== LLS-C1 ===== -->
  <text x="25" y="64" font-size="14" font-weight="700" fill="#1d4278">LLS-C1</text>
  <text x="25" y="81" font-size="10" fill="#444">DU nối trực tiếp RU</text>

  <rect x="200" y="47" width="110" height="46" rx="6" fill="#fbe0c0" stroke="#d9822b" stroke-width="1.5"/>
  <text x="255" y="68" font-size="11.5" font-weight="700" text-anchor="middle" fill="#8a4a0a">PRTC / T-GM</text>
  <text x="255" y="83" font-size="9" text-anchor="middle" fill="#111">có thể đặt tại DU</text>

  <rect x="420" y="47" width="110" height="46" rx="6" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="475" y="68" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5c38">O-DU</text>
  <text x="475" y="83" font-size="9" text-anchor="middle" fill="#111">master cho RU</text>

  <rect x="680" y="47" width="110" height="46" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="735" y="68" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">O-RU</text>
  <text x="735" y="83" font-size="9" text-anchor="middle" fill="#111">T-TSC</text>

  <line x1="310" y1="70" x2="416" y2="70" stroke="#d9822b" stroke-width="2.5" marker-end="url(#o)"/>
  <line x1="530" y1="70" x2="676" y2="70" stroke="#d9822b" stroke-width="2.5" marker-end="url(#o)"/>
  <text x="603" y="60" font-size="9.5" text-anchor="middle" fill="#555">nối điểm-điểm</text>

  <!-- ===== LLS-C2 ===== -->
  <text x="25" y="164" font-size="14" font-weight="700" fill="#1d4278">LLS-C2</text>
  <text x="25" y="181" font-size="10" fill="#444">DU là master, qua switch</text>

  <rect x="200" y="147" width="110" height="46" rx="6" fill="#fbe0c0" stroke="#d9822b" stroke-width="1.5"/>
  <text x="255" y="168" font-size="11.5" font-weight="700" text-anchor="middle" fill="#8a4a0a">PRTC / T-GM</text>
  <text x="255" y="183" font-size="9" text-anchor="middle" fill="#111">nguồn phía DU</text>

  <rect x="360" y="147" width="100" height="46" rx="6" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="410" y="168" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5c38">O-DU</text>
  <text x="410" y="183" font-size="9" text-anchor="middle" fill="#111">master cho RU</text>

  <rect x="510" y="147" width="100" height="46" rx="6" fill="#eeeeee" stroke="#666666" stroke-width="1.5"/>
  <text x="560" y="168" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111">Switch</text>
  <text x="560" y="183" font-size="9" text-anchor="middle" fill="#111">T-BC</text>

  <rect x="660" y="147" width="100" height="46" rx="6" fill="#eeeeee" stroke="#666666" stroke-width="1.5"/>
  <text x="710" y="168" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111">Switch</text>
  <text x="710" y="183" font-size="9" text-anchor="middle" fill="#111">T-BC</text>

  <rect x="810" y="147" width="100" height="46" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="860" y="168" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">O-RU</text>
  <text x="860" y="183" font-size="9" text-anchor="middle" fill="#111">T-TSC</text>

  <line x1="310" y1="170" x2="356" y2="170" stroke="#d9822b" stroke-width="2.5" marker-end="url(#o)"/>
  <line x1="460" y1="170" x2="506" y2="170" stroke="#d9822b" stroke-width="2.5" marker-end="url(#o)"/>
  <line x1="610" y1="170" x2="656" y2="170" stroke="#d9822b" stroke-width="2.5" marker-end="url(#o)"/>
  <line x1="760" y1="170" x2="806" y2="170" stroke="#d9822b" stroke-width="2.5" marker-end="url(#o)"/>

  <!-- ===== LLS-C3 ===== -->
  <text x="25" y="294" font-size="14" font-weight="700" fill="#1d4278">LLS-C3</text>
  <text x="25" y="311" font-size="10" fill="#444">T-GM trong mạng fronthaul</text>

  <rect x="200" y="277" width="110" height="46" rx="6" fill="#fbe0c0" stroke="#d9822b" stroke-width="1.5"/>
  <text x="255" y="298" font-size="11.5" font-weight="700" text-anchor="middle" fill="#8a4a0a">PRTC / T-GM</text>
  <text x="255" y="313" font-size="9" text-anchor="middle" fill="#111">trong fronthaul</text>

  <rect x="400" y="277" width="100" height="46" rx="6" fill="#eeeeee" stroke="#666666" stroke-width="1.5"/>
  <text x="450" y="298" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111">Switch</text>
  <text x="450" y="313" font-size="9" text-anchor="middle" fill="#111">T-BC</text>

  <rect x="640" y="236" width="100" height="46" rx="6" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="690" y="257" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5c38">O-DU</text>
  <text x="690" y="272" font-size="9" text-anchor="middle" fill="#111">T-TSC</text>

  <rect x="640" y="318" width="100" height="46" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="690" y="339" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">O-RU</text>
  <text x="690" y="354" font-size="9" text-anchor="middle" fill="#111">T-TSC</text>

  <line x1="310" y1="300" x2="396" y2="300" stroke="#d9822b" stroke-width="2.5" marker-end="url(#o)"/>
  <line x1="500" y1="292" x2="636" y2="262" stroke="#d9822b" stroke-width="2.5" marker-end="url(#o)"/>
  <line x1="500" y1="308" x2="636" y2="338" stroke="#d9822b" stroke-width="2.5" marker-end="url(#o)"/>
  <text x="770" y="296" font-size="9.5" fill="#555">DU và RU đều là slave,</text>
  <text x="770" y="310" font-size="9.5" fill="#555">nhận thời gian từ mạng</text>

  <!-- ===== LLS-C4 ===== -->
  <text x="25" y="424" font-size="14" font-weight="700" fill="#1d4278">LLS-C4</text>
  <text x="25" y="441" font-size="10" fill="#444">GNSS cục bộ tại RU</text>

  <rect x="400" y="407" width="100" height="46" rx="6" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="450" y="428" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5c38">O-DU</text>
  <text x="450" y="443" font-size="9" text-anchor="middle" fill="#111">nguồn riêng</text>

  <rect x="640" y="407" width="100" height="46" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="690" y="428" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">O-RU</text>
  <text x="690" y="443" font-size="9" text-anchor="middle" fill="#111">PRTC cục bộ</text>

  <line x1="500" y1="430" x2="640" y2="430" stroke="#94a3b8" stroke-width="4"/>
  <text x="570" y="420" font-size="9.5" text-anchor="middle" fill="#555">fronthaul</text>
  <text x="570" y="448" font-size="9.5" text-anchor="middle" fill="#555">không mang đồng bộ</text>

  <ellipse cx="850" cy="430" rx="45" ry="24" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="850" y="434" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">GNSS</text>
  <line x1="805" y1="430" x2="744" y2="430" stroke="#2f5d9e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/>

  <!-- Legend -->
  <line x1="200" y1="510" x2="240" y2="510" stroke="#d9822b" stroke-width="2.5"/>
  <text x="248" y="514" font-size="10.5" fill="#111">đường đồng bộ (PTP, SyncE)</text>
  <line x1="470" y1="510" x2="510" y2="510" stroke="#2f5d9e" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="518" y="514" font-size="10.5" fill="#111">tín hiệu GNSS</text>
  <line x1="650" y1="510" x2="690" y2="510" stroke="#94a3b8" stroke-width="4"/>
  <text x="698" y="514" font-size="10.5" fill="#111">fronthaul chỉ mang dữ liệu</text>
</svg>
