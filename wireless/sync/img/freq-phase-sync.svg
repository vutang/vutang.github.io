  <text x="480" y="352" font-size="10.5" text-anchor="middle" fill="#333">Mỗi xung là một mốc thời gian của đồng hồ (ví dụ 1PPS). Đường nét đứt là mốc của đồng hồ tham chiếu.</text>
  <text x="480" y="368" font-size="10.5" text-anchor="middle" fill="#333">FDD chỉ cần đồng bộ tần số, TDD cần thêm đồng bộ pha để các trạm chuyển uplink/downlink cùng lúc.</text>
