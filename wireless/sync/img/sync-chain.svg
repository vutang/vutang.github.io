<svg role="img" viewBox="0 50 960 317.79" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Chuỗi phân phối thời gian: GNSS cấp cho PRTC/T-GM, thời gian đi qua các T-BC bằng PTP và SyncE tới T-TSC là DU hoặc RU</title>
  <defs>
    <marker id="ptp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d9822b"/></marker>
    <marker id="syn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f8a55"/></marker>
    <marker id="rf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d9e"/></marker>
  </defs>
  <rect x="0" y="50" width="960" height="290" rx="8" fill="#ffffff"/>

  <!-- GNSS -->
  <ellipse cx="70" cy="125" rx="50" ry="30" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="70" y="122" font-size="13" font-weight="700" text-anchor="middle" fill="#1d4278">GNSS</text>
  <text x="70" y="138" font-size="9.5" text-anchor="middle" fill="#111">vệ tinh</text>
  <line x1="122" y1="125" x2="166" y2="125" stroke="#2f5d9e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#rf)"/>
  <text x="144" y="112" font-size="9" text-anchor="middle" fill="#1d4278">vô tuyến</text>

  <!-- PRTC / T-GM -->
  <rect x="170" y="95" width="150" height="60" rx="6" fill="#fbe0c0" stroke="#d9822b" stroke-width="1.5"/>
  <text x="245" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="#8a4a0a">PRTC / T-GM</text>
  <text x="245" y="138" font-size="9.5" text-anchor="middle" fill="#111">grandmaster</text>

  <!-- T-BC 1 -->
  <rect x="390" y="95" width="120" height="60" rx="6" fill="#eeeeee" stroke="#666666" stroke-width="1.5"/>
  <text x="450" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="#111">T-BC</text>
  <text x="450" y="138" font-size="9.5" text-anchor="middle" fill="#111">boundary clock</text>

  <!-- T-BC 2 -->
  <rect x="580" y="95" width="120" height="60" rx="6" fill="#eeeeee" stroke="#666666" stroke-width="1.5"/>
  <text x="640" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="#111">T-BC</text>
  <text x="640" y="138" font-size="9.5" text-anchor="middle" fill="#111">boundary clock</text>

  <!-- T-TSC -->
  <rect x="770" y="95" width="170" height="60" rx="6" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="855" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="#1f5c38">T-TSC</text>
  <text x="855" y="138" font-size="9.5" text-anchor="middle" fill="#111">DU hoặc RU</text>

  <!-- Links: PTP (top) and SyncE (bottom) -->
  <line x1="320" y1="115" x2="386" y2="115" stroke="#d9822b" stroke-width="2.5" marker-end="url(#ptp)"/>
  <line x1="320" y1="137" x2="386" y2="137" stroke="#2f8a55" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#syn)"/>
  <line x1="510" y1="115" x2="576" y2="115" stroke="#d9822b" stroke-width="2.5" marker-end="url(#ptp)"/>
  <line x1="510" y1="137" x2="576" y2="137" stroke="#2f8a55" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#syn)"/>
  <line x1="700" y1="115" x2="766" y2="115" stroke="#d9822b" stroke-width="2.5" marker-end="url(#ptp)"/>
  <line x1="700" y1="137" x2="766" y2="137" stroke="#2f8a55" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#syn)"/>

  <!-- Port roles: M (master) / S (slave) -->
  <text x="328" y="92" font-size="10" font-weight="700" fill="#555">M</text>
  <text x="376" y="92" font-size="10" font-weight="700" fill="#555">S</text>
  <text x="518" y="92" font-size="10" font-weight="700" fill="#555">M</text>
  <text x="566" y="92" font-size="10" font-weight="700" fill="#555">S</text>
  <text x="708" y="92" font-size="10" font-weight="700" fill="#555">M</text>
  <text x="756" y="92" font-size="10" font-weight="700" fill="#555">S</text>

  <!-- Roles under boxes -->
  <text x="245" y="178" font-size="10" text-anchor="middle" fill="#333">nguồn thời gian chuẩn</text>
  <text x="245" y="192" font-size="10" text-anchor="middle" fill="#333">(G.8272)</text>
  <text x="450" y="178" font-size="10" text-anchor="middle" fill="#333">nhận, lọc, phát lại</text>
  <text x="450" y="192" font-size="10" text-anchor="middle" fill="#333">(G.8273.2)</text>
  <text x="640" y="178" font-size="10" text-anchor="middle" fill="#333">nhận, lọc, phát lại</text>
  <text x="640" y="192" font-size="10" text-anchor="middle" fill="#333">(G.8273.2)</text>
  <text x="855" y="178" font-size="10" text-anchor="middle" fill="#333">đầu cuối nhận thời gian</text>
  <text x="855" y="192" font-size="10" text-anchor="middle" fill="#333">(G.8273.2)</text>

  <!-- Accumulated time error wedge -->
  <polygon points="245,232 855,218 855,246" fill="#fde2e0" stroke="#b42318" stroke-width="1"/>
  <text x="480" y="270" font-size="10.5" text-anchor="middle" fill="#b42318">Sai số thời gian tích lũy qua mỗi chặng, tổng phải nằm trong ngân sách (ví dụ ±1,5 µs với TDD)</text>

  <!-- Legend -->
  <line x1="200" y1="305" x2="240" y2="305" stroke="#d9822b" stroke-width="2.5"/>
  <text x="248" y="309" font-size="10.5" fill="#111">PTP: thời gian và pha</text>
  <line x1="430" y1="305" x2="470" y2="305" stroke="#2f8a55" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="478" y="309" font-size="10.5" fill="#111">SyncE: tần số</text>
  <text x="620" y="309" font-size="10.5" font-weight="700" fill="#555">M / S</text>
  <text x="660" y="309" font-size="10.5" fill="#111">: cổng master / slave</text>
<text id="wm" x="948.88" y="359.45" text-anchor="end" font-size="13.89" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
