<svg role="img" viewBox="0 0 960 387.79" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Các thành phần linuxptp trên một nút: ts2phc đồng bộ PHC theo GNSS, ptp4l trao đổi PTP qua cổng Ethernet, phc2sys đồng bộ CLOCK_REALTIME theo PHC</title>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9822b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d9e"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="360" rx="8" fill="#ffffff"/>

  <!-- Layer bands -->
  <rect x="15" y="20" width="930" height="100" rx="6" fill="#f5f7fa" stroke="#d0d7e2"/>
  <text x="28" y="40" font-size="10.5" font-weight="700" fill="#555">User space</text>
  <rect x="15" y="140" width="930" height="140" rx="6" fill="#f5f7fa" stroke="#d0d7e2"/>
  <text x="28" y="272" font-size="10.5" font-weight="700" fill="#555">Kernel và phần cứng</text>

  <!-- User space daemons -->
  <rect x="190" y="50" width="130" height="50" rx="6" fill="#fff3cf" stroke="#b8860b" stroke-width="1.5"/>
  <text x="255" y="73" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5a00">ts2phc</text>
  <text x="255" y="89" font-size="9" text-anchor="middle" fill="#111">PHC theo GNSS (GM)</text>

  <rect x="430" y="50" width="130" height="50" rx="6" fill="#fff3cf" stroke="#b8860b" stroke-width="1.5"/>
  <text x="495" y="73" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5a00">ptp4l</text>
  <text x="495" y="89" font-size="9" text-anchor="middle" fill="#111">giao thức PTP</text>

  <rect x="700" y="50" width="130" height="50" rx="6" fill="#fff3cf" stroke="#b8860b" stroke-width="1.5"/>
  <text x="765" y="73" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5a00">phc2sys</text>
  <text x="765" y="89" font-size="9" text-anchor="middle" fill="#111">PHC → đồng hồ hệ thống</text>

  <!-- GNSS module -->
  <rect x="35" y="185" width="120" height="60" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="95" y="210" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">Module GNSS</text>
  <text x="95" y="227" font-size="9" text-anchor="middle" fill="#111">1PPS + ToD</text>

  <!-- NIC with PHC -->
  <rect x="250" y="175" width="390" height="80" rx="8" fill="none" stroke="#2f8a55" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="262" y="193" font-size="10.5" font-weight="700" fill="#1f5c38">NIC</text>
  <rect x="300" y="200" width="160" height="44" rx="6" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="380" y="219" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5c38">PHC</text>
  <text x="380" y="235" font-size="9" text-anchor="middle" fill="#111">/dev/ptpN</text>
  <rect x="510" y="200" width="110" height="44" rx="6" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="565" y="219" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f5c38">Cổng Ethernet</text>
  <text x="565" y="235" font-size="9" text-anchor="middle" fill="#111">timestamp HW</text>
  <line x1="460" y1="222" x2="510" y2="222" stroke="#2f8a55" stroke-width="2"/>

  <!-- System clock -->
  <rect x="700" y="190" width="130" height="50" rx="6" fill="#eeeeee" stroke="#666666" stroke-width="1.5"/>
  <text x="765" y="212" font-size="11" font-weight="700" text-anchor="middle" fill="#111">CLOCK_REALTIME</text>
  <text x="765" y="228" font-size="9" text-anchor="middle" fill="#111">đồng hồ hệ thống</text>

  <!-- Network -->
  <text x="565" y="320" font-size="11" font-weight="700" text-anchor="middle" fill="#8a4a0a">Mạng: T-BC / T-GM / T-TSC khác</text>
  <line x1="565" y1="246" x2="565" y2="304" stroke="#d9822b" stroke-width="2.5" marker-start="url(#o)" marker-end="url(#o)"/>
  <text x="575" y="280" font-size="9.5" fill="#8a4a0a">gói PTP (ptp4l gửi / nhận)</text>

  <!-- GNSS → PHC (1PPS) -->
  <line x1="155" y1="222" x2="296" y2="222" stroke="#2f5d9e" stroke-width="2" marker-end="url(#b)"/>
  <text x="225" y="214" font-size="9.5" text-anchor="middle" fill="#1d4278">1PPS (chân SDP)</text>
  <!-- GNSS → ts2phc (ToD) -->
  <polyline points="95,185 95,75 186,75" fill="none" stroke="#2f5d9e" stroke-width="2" marker-end="url(#b)"/>
  <text x="102" y="130" font-size="9.5" fill="#1d4278">ToD (NMEA, UART)</text>

  <!-- ts2phc ↔ PHC -->
  <line x1="290" y1="100" x2="350" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#k)"/>
  <text x="300" y="136" font-size="9.5" text-anchor="end" fill="#333">chỉnh PHC</text>

  <!-- ptp4l ↔ PHC / port -->
  <line x1="470" y1="100" x2="410" y2="196" stroke="#475569" stroke-width="2" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="432" y="136" font-size="9.5" text-anchor="end" fill="#333">đọc / chỉnh PHC</text>
  <line x1="530" y1="100" x2="560" y2="196" stroke="#d9822b" stroke-width="2" marker-start="url(#o)" marker-end="url(#o)"/>

  <!-- phc2sys: reads PHC, steers CLOCK_REALTIME -->
  <line x1="705" y1="100" x2="464" y2="198" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#k)"/>
  <line x1="765" y1="100" x2="765" y2="186" stroke="#475569" stroke-width="2" marker-end="url(#k)"/>
  <text x="773" y="136" font-size="9.5" fill="#333">chỉnh</text>
  <text x="650" y="150" font-size="9.5" fill="#333">đọc PHC</text>

  <!-- Footer -->
  <text x="480" y="345" font-size="10.5" text-anchor="middle" fill="#333">Nút grandmaster: ts2phc chỉnh PHC theo GNSS, ptp4l làm master. Nút slave: không có ts2phc, ptp4l chỉnh PHC theo mạng.</text>
<text id="wm" x="948.88" y="379.45" text-anchor="end" font-size="13.89" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
