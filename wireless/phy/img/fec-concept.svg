  <text x="451.0" y="108" font-size="12" text-anchor="middle" font-weight="400" fill="#111">0</text>
  <text x="385" y="80" font-size="11.5" text-anchor="middle" font-weight="400" fill="#111">n bit codeword</text>
  <text x="385" y="136" font-size="10.5" text-anchor="middle" font-weight="400" fill="#555">k thông tin + (n − k) parity</text>
  <line x1="464" y1="103" x2="500" y2="103" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="502" y="78" width="120" height="50" rx="6" fill="#fbe9e7" stroke="#1d4278" stroke-width="1.2"/>
  <text x="562.0" y="107.0" font-size="12" text-anchor="middle" font-weight="700" fill="#111">Kênh + nhiễu</text>
  <line x1="622" y1="103" x2="658" y2="103" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="660" y="90" width="38" height="26" fill="#ffffff" stroke="#555" stroke-width="0.8"/>
  <text x="679.0" y="108" font-size="10.5" text-anchor="middle" font-weight="400" fill="#111">−3.1</text>
  <rect x="698" y="90" width="38" height="26" fill="#fbe9e7" stroke="#555" stroke-width="0.8"/>
  <text x="717.0" y="108" font-size="10.5" text-anchor="middle" font-weight="400" fill="#111">−0.4</text>
  <rect x="736" y="90" width="38" height="26" fill="#ffffff" stroke="#555" stroke-width="0.8"/>
  <text x="755.0" y="108" font-size="10.5" text-anchor="middle" font-weight="400" fill="#111">−2.2</text>
  <rect x="774" y="90" width="38" height="26" fill="#ffffff" stroke="#555" stroke-width="0.8"/>
  <text x="793.0" y="108" font-size="10.5" text-anchor="middle" font-weight="400" fill="#111">−1.8</text>
  <rect x="812" y="90" width="38" height="26" fill="#ffffff" stroke="#555" stroke-width="0.8"/>
  <text x="831.0" y="108" font-size="10.5" text-anchor="middle" font-weight="400" fill="#111">+2.6</text>
  <rect x="850" y="90" width="38" height="26" fill="#ffffff" stroke="#555" stroke-width="0.8"/>
  <text x="869.0" y="108" font-size="10.5" text-anchor="middle" font-weight="400" fill="#111">−0.9</text>
  <rect x="888" y="90" width="38" height="26" fill="#ffffff" stroke="#555" stroke-width="0.8"/>
  <text x="907.0" y="108" font-size="10.5" text-anchor="middle" font-weight="400" fill="#111">+1.7</text>
  <text x="793.0" y="80" font-size="11.5" text-anchor="middle" font-weight="400" fill="#111">giá trị mềm (LLR) tại bên thu</text>
  <text x="793.0" y="136" font-size="10.5" text-anchor="middle" font-weight="400" fill="#c0392b">bit 2 bị nhiễu đảo dấu (LLR &gt; 0 nghiêng về bit 0)</text>
  <line x1="793.0" y1="146" x2="793.0" y2="178" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="723.0" y="180" width="140" height="46" rx="6" fill="#fdf1e3" stroke="#1d4278" stroke-width="1.2"/>
  <text x="793.0" y="207.0" font-size="12" text-anchor="middle" font-weight="700" fill="#111">Decoder</text>
  <line x1="721.0" y1="203" x2="560" y2="203" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="468" y="190" width="22" height="26" fill="#e8f0fb" stroke="#555" stroke-width="0.8"/>
  <text x="479.0" y="208" font-size="12" text-anchor="middle" font-weight="400" fill="#111">1</text>
  <rect x="490" y="190" width="22" height="26" fill="#e8f0fb" stroke="#555" stroke-width="0.8"/>
  <text x="501.0" y="208" font-size="12" text-anchor="middle" font-weight="400" fill="#111">0</text>
  <rect x="512" y="190" width="22" height="26" fill="#e8f0fb" stroke="#555" stroke-width="0.8"/>
  <text x="523.0" y="208" font-size="12" text-anchor="middle" font-weight="400" fill="#111">1</text>
  <rect x="534" y="190" width="22" height="26" fill="#e8f0fb" stroke="#555" stroke-width="0.8"/>
  <text x="545.0" y="208" font-size="12" text-anchor="middle" font-weight="400" fill="#111">1</text>
  <text x="512" y="238" font-size="11.5" text-anchor="middle" font-weight="400" fill="#111">k bit đã sửa lỗi</text>
  <text x="20" y="196" font-size="13" text-anchor="start" font-weight="700" fill="#111">Code rate R = k / n</text>
  <text x="20" y="216" font-size="11.5" text-anchor="start" font-weight="400" fill="#555">Ví dụ trong hình: R = 4/7</text>
  <text x="20" y="236" font-size="11.5" text-anchor="start" font-weight="400" fill="#555">R càng nhỏ, càng nhiều parity:</text>
  <text x="20" y="254" font-size="11.5" text-anchor="start" font-weight="400" fill="#555">chịu nhiễu tốt hơn, tốc độ hữu ích thấp hơn.</text>
  <text x="480" y="288" font-size="11.5" text-anchor="middle" font-weight="400" fill="#333">Bên thu không quyết định cứng từng bit ngay mà giữ độ tin cậy của từng bit để decoder tận dụng.</text>
<text id="wm" x="948.88" y="319.45" text-anchor="end" font-size="13.89" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
