<svg role="img" viewBox="0 0 960 327.79" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Nguyên lý mã hóa kênh: thêm bit dư thừa ở bên phát để bên thu sửa được lỗi</title>
  <rect x="0" y="0" width="960" height="300" rx="8" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <text x="20" y="28" font-size="14" text-anchor="start" font-weight="700" fill="#1d4278">Nguyên lý mã hóa kênh</text>
  <rect x="20" y="90" width="22" height="26" fill="#e8f0fb" stroke="#555" stroke-width="0.8"/>
  <text x="31.0" y="108" font-size="12" text-anchor="middle" font-weight="400" fill="#111">1</text>
