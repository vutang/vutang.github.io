<svg role="img" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
<title>Ba thủ tục quản lý beam P-1, P-2, P-3: quét beam rộng, gNB tinh chỉnh beam phát, UE tinh chỉnh beam thu</title>
<rect x="0" y="0" width="960" height="360" rx="8" fill="#ffffff"/>
<rect x="10" y="10" width="940" height="340" rx="10" fill="#f6f8fb" stroke="#c9d3e3"/>
<text x="30" y="36" font-size="14" font-weight="700" fill="#1d4278">Quản lý beam đường xuống: P-1, P-2, P-3</text>
<text x="30" y="54" font-size="10.5" fill="#666">Beam đậm là beam được chọn hoặc giữ cố định; beam nhạt là các beam được quét</text>
