<text x="720.0" y="229.0" font-size="11.5" text-anchor="middle" fill="#1d4278" font-weight="700">gNB (NR)</text>
<line x1="650" y1="146" x2="690" y2="200" stroke="#a23b72" stroke-width="1.6" stroke-dasharray="5 4"/>
