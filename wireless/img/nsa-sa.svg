<text x="230.0" y="334.0" font-size="11.5" text-anchor="middle" fill="#555" font-weight="700">UE</text>
<line x1="125" y1="250" x2="215" y2="310" stroke="#b7791f" stroke-width="1.6" stroke-dasharray="5 4"/>
