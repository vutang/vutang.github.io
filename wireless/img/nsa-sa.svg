<text x="795" y="178" font-size="9.5" text-anchor="start" fill="#555">NG-U</text>
<rect x="685" y="310" width="70" height="40" rx="6" fill="#555" fill-opacity="0.15" stroke="#555" stroke-width="1.5"/>
<text x="720.0" y="334.0" font-size="11.5" text-anchor="middle" fill="#555" font-weight="700">UE</text>
<line x1="712" y1="250" x2="712" y2="310" stroke="#1d4278" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="728" y1="250" x2="728" y2="310" stroke="#1d4278" stroke-width="1.6"/>
<text x="740" y="292" font-size="9.5" text-anchor="start" fill="#1d4278">NR: RRC, NAS và dữ liệu</text>
<rect x="520" y="200" width="100" height="50" rx="6" fill="#b7791f" fill-opacity="0.15" stroke="#b7791f" stroke-width="1.5"/>
<text x="570.0" y="222.0" font-size="11.5" text-anchor="middle" fill="#b7791f" font-weight="700">eNB (LTE)</text>
<text x="570.0" y="237.0" font-size="9.5" text-anchor="middle" fill="#555">UE 4G</text>
<text x="570" y="268" font-size="9.5" text-anchor="middle" fill="#b7791f">LTE vẫn phục vụ</text>
<text x="570" y="281" font-size="9.5" text-anchor="middle" fill="#b7791f">UE 4G song song</text>
<text x="245" y="388" font-size="9.5" text-anchor="middle" fill="#555">Điều khiển qua LTE, mạng lõi vẫn là EPC.</text>
<text x="245" y="403" font-size="9.5" text-anchor="middle" fill="#555">NR chỉ thêm dung lượng; cần vùng phủ LTE làm điểm neo.</text>
<text x="715" y="388" font-size="9.5" text-anchor="middle" fill="#555">Điều khiển và dữ liệu đều qua NR, mạng lõi 5GC.</text>
<text x="715" y="403" font-size="9.5" text-anchor="middle" fill="#555">Dùng được slicing, QoS flow, RRC_INACTIVE và các tính năng 5GC.</text>
<text id="wm" x="948.88" y="449.45" text-anchor="end" font-size="13.89" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
