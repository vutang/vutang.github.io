<svg role="img" viewBox="0 0 960 457.79" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
<title>So sánh 5G Non-Standalone (EN-DC, option 3x) và 5G Standalone (option 2): ở NSA, UE nối đồng thời với eNB và en-gNB, cả hai nối với mạng lõi EPC; ở SA, UE chỉ nối với gNB, gNB nối với mạng lõi 5GC</title>
<rect x="0" y="0" width="960" height="430" rx="8" fill="#ffffff"/>
<rect x="10" y="10" width="940" height="410" rx="10" fill="#f6f8fb" stroke="#c9d3e3"/>
<text x="30" y="36" font-size="14" font-weight="700" fill="#1d4278">4G và 5G trong cùng một mạng: Non-Standalone và Standalone</text>
<text x="30" y="54" font-size="10.5" fill="#666">Nét đứt: control plane (báo hiệu); nét liền: user plane (dữ liệu)</text>
<rect x="20" y="68" width="450" height="300" rx="8" fill="#1d4278" fill-opacity="0.03" stroke="#c9d3e3"/>
<text x="245" y="88" font-size="12" text-anchor="middle" fill="#1d4278" font-weight="700">5G Non-Standalone (NSA): EN-DC, option 3x</text>
