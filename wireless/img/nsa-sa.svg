<text x="320.0" y="120.0" font-size="11.5" text-anchor="middle" fill="#555" font-weight="700">S-GW</text>
<text x="320.0" y="135.0" font-size="9.5" text-anchor="middle" fill="#555">EPC (4G)</text>
