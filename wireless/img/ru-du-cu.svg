<svg role="img" viewBox="0 0 960 310" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>gNodeB gồm ba khối RU, DU, CU nối với nhau qua fronthaul, midhaul và nối với mạng lõi 5G qua backhaul</title>
  <rect x="0" y="0" width="960" height="310" rx="8" fill="#ffffff"/>

  <!-- gNodeB bracket -->
  <rect x="148" y="40" width="596" height="186" rx="12" fill="none" stroke="#7d8fb3" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="166" y="62" font-size="13" font-weight="700" fill="#1d4278">gNodeB</text>
  <text x="236" y="62" font-size="10" fill="#555">(O-RAN: O-RU + O-DU + O-CU)</text>

  <!-- Links -->
  <line x1="95" y1="123" x2="165" y2="123" stroke="#2f5d9e" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="285" y1="123" x2="385" y2="123" stroke="#475569" stroke-width="4"/>
  <line x1="505" y1="123" x2="605" y2="123" stroke="#475569" stroke-width="4"/>
  <line x1="725" y1="123" x2="830" y2="123" stroke="#475569" stroke-width="4"/>

  <!-- Link labels: interface above the line, latency below -->
  <text x="130" y="113" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1d4278">NR-Uu</text>
  <text x="130" y="144" font-size="9.5" text-anchor="middle" fill="#555">vô tuyến</text>

  <text x="335" y="113" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1d4278">Open Fronthaul</text>
  <text x="335" y="141" font-size="9.5" text-anchor="middle" fill="#555">fronthaul</text>
  <text x="335" y="155" font-size="9.5" text-anchor="middle" fill="#555">~100 µs</text>

  <text x="555" y="113" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1d4278">F1</text>
  <text x="555" y="141" font-size="9.5" text-anchor="middle" fill="#555">midhaul</text>
  <text x="555" y="155" font-size="9.5" text-anchor="middle" fill="#555">vài ms – chục ms</text>

  <text x="777" y="113" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1d4278">NG</text>
  <text x="777" y="141" font-size="9.5" text-anchor="middle" fill="#555">backhaul</text>
  <text x="777" y="155" font-size="9.5" text-anchor="middle" fill="#555">≥ chục ms</text>

  <!-- UE -->
  <rect x="15" y="95" width="80" height="56" rx="6" fill="#eeeeee" stroke="#666666" stroke-width="1.5"/>
  <text x="55" y="119" font-size="13" font-weight="700" text-anchor="middle" fill="#111">UE</text>
  <text x="55" y="136" font-size="9.5" text-anchor="middle" fill="#111">đầu cuối</text>

  <!-- RU -->
  <rect x="165" y="95" width="120" height="56" rx="6" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="225" y="119" font-size="14" font-weight="700" text-anchor="middle" fill="#1d4278">RU</text>
  <text x="225" y="136" font-size="9.5" text-anchor="middle" fill="#111">Radio Unit</text>
  <text x="225" y="176" font-size="10.5" text-anchor="middle" fill="#111">RF</text>
  <text x="225" y="192" font-size="10.5" text-anchor="middle" fill="#111">Low-PHY</text>

  <!-- DU -->
  <rect x="385" y="95" width="120" height="56" rx="6" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="445" y="119" font-size="14" font-weight="700" text-anchor="middle" fill="#1f5c38">DU</text>
  <text x="445" y="136" font-size="9.5" text-anchor="middle" fill="#111">Distributed Unit</text>
  <text x="445" y="176" font-size="10.5" text-anchor="middle" fill="#111">High-PHY</text>
  <text x="445" y="192" font-size="10.5" text-anchor="middle" fill="#111">MAC</text>
  <text x="445" y="208" font-size="10.5" text-anchor="middle" fill="#111">RLC</text>

  <!-- CU -->
  <rect x="605" y="95" width="120" height="56" rx="6" fill="#fff3cf" stroke="#b8860b" stroke-width="1.5"/>
  <text x="665" y="119" font-size="14" font-weight="700" text-anchor="middle" fill="#7a5a00">CU</text>
  <text x="665" y="136" font-size="9.5" text-anchor="middle" fill="#111">Centralized Unit</text>
  <text x="665" y="176" font-size="10.5" text-anchor="middle" fill="#111">PDCP</text>
  <text x="665" y="192" font-size="10.5" text-anchor="middle" fill="#111">SDAP</text>
  <text x="665" y="208" font-size="10.5" text-anchor="middle" fill="#111">RRC</text>

  <!-- 5G Core -->
  <rect x="830" y="95" width="115" height="56" rx="6" fill="#fbe0c0" stroke="#d9822b" stroke-width="1.5"/>
  <text x="887" y="119" font-size="13" font-weight="700" text-anchor="middle" fill="#8a4a0a">5G Core</text>
  <text x="887" y="136" font-size="9.5" text-anchor="middle" fill="#111">mạng lõi</text>
  <text x="887" y="176" font-size="10.5" text-anchor="middle" fill="#111">AMF, SMF, UPF</text>

  <!-- Footer note -->
  <text x="480" y="262" font-size="10.5" text-anchor="middle" fill="#333">Các lớp càng thấp càng nhạy với thời gian: PHY và MAC phải xong trong một slot,</text>
  <text x="480" y="278" font-size="10.5" text-anchor="middle" fill="#333">còn PDCP và RRC chịu được vài ms. Độ trễ mỗi đoạn là mức thường được trích dẫn.</text>
</svg>
