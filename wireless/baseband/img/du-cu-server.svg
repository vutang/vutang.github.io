<svg role="img" viewBox="0 0 960 447.79" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
<title>O-DU và O-CU trên server: NIC fronthaul có PTP và GNSS, CPU chạy L1 High-PHY và L2, accelerator qua PCIe, NIC midhaul nối tới CU-CP và CU-UP, rồi tới 5GC</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a23b72"/></marker>
</defs>
<rect x="0" y="0" width="960" height="420" rx="8" fill="#ffffff"/>
<rect x="10" y="10" width="940" height="400" rx="10" fill="#f6f8fb" stroke="#c9d3e3"/>
<text x="30" y="36" font-size="14" font-weight="700" fill="#1d4278">DU và CU triển khai trên server (vRAN)</text>
<text x="30" y="54" font-size="10.5" fill="#666">Sơ đồ đơn giản hóa; số NIC, accelerator và vị trí đặt CU thay đổi theo kiểu triển khai</text>

<!-- RUs -->
<rect x="24" y="130" width="78" height="34" rx="5" fill="#b7791f" fill-opacity="0.16" stroke="#b7791f" stroke-width="1.3"/>
<text x="63" y="152" font-size="11" text-anchor="middle" fill="#6e4508" font-weight="700">O-RU</text>
<rect x="24" y="176" width="78" height="34" rx="5" fill="#b7791f" fill-opacity="0.16" stroke="#b7791f" stroke-width="1.3"/>
<text x="63" y="198" font-size="11" text-anchor="middle" fill="#6e4508" font-weight="700">O-RU</text>
<rect x="24" y="222" width="78" height="34" rx="5" fill="#b7791f" fill-opacity="0.16" stroke="#b7791f" stroke-width="1.3"/>
<text x="63" y="244" font-size="11" text-anchor="middle" fill="#6e4508" font-weight="700">O-RU</text>
<line x1="102" y1="147" x2="160" y2="170" stroke="#555" stroke-width="1.3"/>
<line x1="102" y1="193" x2="160" y2="180" stroke="#555" stroke-width="1.3"/>
<line x1="102" y1="239" x2="160" y2="190" stroke="#555" stroke-width="1.3"/>
<text x="63" y="282" font-size="9.5" text-anchor="middle" fill="#555" font-weight="700">Fronthaul</text>
<text x="63" y="295" font-size="9" text-anchor="middle" fill="#666">eCPRI, 25 GbE</text>

<!-- DU server -->
<rect x="150" y="70" width="440" height="300" rx="8" fill="#1d4278" fill-opacity="0.05" stroke="#1d4278" stroke-dasharray="5 4"/>
<text x="370" y="88" font-size="11.5" text-anchor="middle" fill="#1d4278" font-weight="700">Server O-DU</text>

<rect x="162" y="120" width="120" height="110" rx="6" fill="#2f5d9e" fill-opacity="0.16" stroke="#2f5d9e" stroke-width="1.5"/>
<text x="222" y="146" font-size="11" text-anchor="middle" fill="#2f5d9e" font-weight="700">NIC fronthaul</text>
<text x="222" y="166" font-size="9.5" text-anchor="middle" fill="#555">Ethernet, eCPRI</text>
<text x="222" y="180" font-size="9.5" text-anchor="middle" fill="#555">PTP timestamp</text>
<text x="222" y="194" font-size="9.5" text-anchor="middle" fill="#555">SyncE, DPLL</text>
<text x="222" y="208" font-size="9.5" text-anchor="middle" fill="#555">đầu vào GNSS</text>

<rect x="162" y="250" width="120" height="100" rx="6" fill="#b7791f" fill-opacity="0.16" stroke="#b7791f" stroke-width="1.5"/>
<text x="222" y="276" font-size="11" text-anchor="middle" fill="#6e4508" font-weight="700">Accelerator</text>
<text x="222" y="296" font-size="9.5" text-anchor="middle" fill="#555">FEC (LDPC)</text>
<text x="222" y="310" font-size="9.5" text-anchor="middle" fill="#555">hoặc offload L1</text>
<text x="222" y="324" font-size="9.5" text-anchor="middle" fill="#555">lookaside / inline</text>

<!-- CPU -->
<rect x="302" y="110" width="160" height="240" rx="6" fill="#1d4278" fill-opacity="0.10" stroke="#1d4278" stroke-width="1.5"/>
<text x="382" y="130" font-size="11" text-anchor="middle" fill="#1d4278" font-weight="700">CPU (nhiều core)</text>
<rect x="314" y="142" width="136" height="44" rx="4" fill="#1d4278" fill-opacity="0.16" stroke="#1d4278"/>
<text x="382" y="161" font-size="10.5" text-anchor="middle" fill="#1d4278" font-weight="700">L1 High-PHY</text>
<text x="382" y="176" font-size="9" text-anchor="middle" fill="#555">core cô lập, real-time</text>
<text x="382" y="201" font-size="9.5" text-anchor="middle" fill="#666">↕ FAPI (L1-L2)</text>
<rect x="314" y="210" width="136" height="44" rx="4" fill="#1d4278" fill-opacity="0.16" stroke="#1d4278"/>
<text x="382" y="229" font-size="10.5" text-anchor="middle" fill="#1d4278" font-weight="700">L2: MAC, RLC</text>
<text x="382" y="244" font-size="9" text-anchor="middle" fill="#555">scheduler theo slot</text>
<rect x="314" y="266" width="136" height="70" rx="4" fill="#555" fill-opacity="0.12" stroke="#555"/>
<text x="382" y="286" font-size="10.5" text-anchor="middle" fill="#555" font-weight="700">Core housekeeping</text>
<text x="382" y="302" font-size="9" text-anchor="middle" fill="#555">OS, ptp4l/phc2sys</text>
<text x="382" y="316" font-size="9" text-anchor="middle" fill="#555">OAM, M-plane client</text>

<line x1="282" y1="175" x2="300" y2="175" stroke="#555" stroke-width="1.3" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="282" y1="300" x2="300" y2="300" stroke="#555" stroke-width="1.3" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="291" y="242" font-size="9" text-anchor="middle" fill="#666">PCIe</text>

<rect x="478" y="120" width="100" height="80" rx="6" fill="#2f5d9e" fill-opacity="0.16" stroke="#2f5d9e" stroke-width="1.5"/>
<text x="528" y="150" font-size="11" text-anchor="middle" fill="#2f5d9e" font-weight="700">NIC</text>
<text x="528" y="166" font-size="11" text-anchor="middle" fill="#2f5d9e" font-weight="700">midhaul</text>
<text x="528" y="184" font-size="9.5" text-anchor="middle" fill="#555">F1 (IP)</text>
<line x1="462" y1="160" x2="476" y2="160" stroke="#555" stroke-width="1.3" marker-end="url(#a)" marker-start="url(#a)"/>

<!-- GNSS -->
<polygon points="206,62 238,62 222,84" fill="none" stroke="#a23b72" stroke-width="1.6"/>
<text x="250" y="70" font-size="9.5" fill="#a23b72" font-weight="700">GNSS</text>
<line x1="222" y1="84" x2="222" y2="118" stroke="#a23b72" stroke-width="1.4" marker-end="url(#b)"/>

<!-- F1 -->
<line x1="578" y1="160" x2="636" y2="160" stroke="#555" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="607" y="152" font-size="9.5" text-anchor="middle" fill="#555" font-weight="700">F1</text>

<!-- CU server -->
<rect x="620" y="70" width="210" height="300" rx="8" fill="#a23b72" fill-opacity="0.05" stroke="#a23b72" stroke-dasharray="5 4"/>
<text x="725" y="88" font-size="11.5" text-anchor="middle" fill="#a23b72" font-weight="700">O-CU (server hoặc cloud)</text>
<rect x="640" y="110" width="170" height="80" rx="6" fill="#a23b72" fill-opacity="0.14" stroke="#a23b72" stroke-width="1.5"/>
<text x="725" y="138" font-size="11" text-anchor="middle" fill="#a23b72" font-weight="700">CU-CP</text>
<text x="725" y="156" font-size="9.5" text-anchor="middle" fill="#555">RRC, PDCP-C</text>
<text x="725" y="170" font-size="9.5" text-anchor="middle" fill="#555">F1-C, E1, NG-C, Xn-C</text>
<rect x="640" y="250" width="170" height="80" rx="6" fill="#a23b72" fill-opacity="0.14" stroke="#a23b72" stroke-width="1.5"/>
<text x="725" y="278" font-size="11" text-anchor="middle" fill="#a23b72" font-weight="700">CU-UP</text>
<text x="725" y="296" font-size="9.5" text-anchor="middle" fill="#555">SDAP, PDCP-U</text>
<text x="725" y="310" font-size="9.5" text-anchor="middle" fill="#555">F1-U, NG-U (GTP-U)</text>
<line x1="725" y1="190" x2="725" y2="248" stroke="#555" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="734" y="224" font-size="9.5" fill="#555" font-weight="700">E1</text>
<polyline points="607,166 607,290 638,290" fill="none" stroke="#555" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="600" y="235" font-size="9" text-anchor="end" fill="#666">F1-U</text>

<!-- 5GC -->
<rect x="856" y="160" width="80" height="110" rx="6" fill="#555" fill-opacity="0.14" stroke="#555" stroke-width="1.5"/>
<text x="896" y="210" font-size="12" text-anchor="middle" fill="#555" font-weight="700">5GC</text>
<text x="896" y="228" font-size="9" text-anchor="middle" fill="#555">AMF, UPF</text>
<line x1="810" y1="150" x2="854" y2="185" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="810" y1="290" x2="854" y2="250" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
<text x="840" y="150" font-size="9" fill="#555">NG-C</text>
<text x="840" y="300" font-size="9" fill="#555">NG-U</text>
