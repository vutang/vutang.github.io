<svg role="img" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Radio link failure detection with N310 and T310, followed by re-establishment with T311 and T301</title>
  <rect x="0" y="0" width="960" height="300" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="m333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="mc0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <text x="20" y="28" font-size="14" font-weight="700" text-anchor="start" fill="#1d4278">Radio link failure and re-establishment</text>
  <line x1="40" y1="90" x2="930" y2="90" stroke="#333" stroke-width="1.2" marker-end="url(#m333)"/>
  <text x="930" y="108" font-size="10" text-anchor="end" fill="#555">time</text>
  <rect x="60" y="68" width="24" height="18" rx="3" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1"/>
  <text x="72" y="81" font-size="8.5" font-weight="700" text-anchor="middle" fill="#1f5a37">IS</text>
  <rect x="90" y="68" width="24" height="18" rx="3" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1"/>
  <text x="102" y="81" font-size="8.5" font-weight="700" text-anchor="middle" fill="#1f5a37">IS</text>
  <rect x="120" y="68" width="24" height="18" rx="3" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1"/>
  <text x="132" y="81" font-size="8.5" font-weight="700" text-anchor="middle" fill="#1f5a37">IS</text>
  <rect x="150" y="68" width="24" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="162" y="81" font-size="8.5" font-weight="700" text-anchor="middle" fill="#922b21">OOS</text>
  <rect x="180" y="68" width="24" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="192" y="81" font-size="8.5" font-weight="700" text-anchor="middle" fill="#922b21">OOS</text>
  <rect x="210" y="68" width="24" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="222" y="81" font-size="8.5" font-weight="700" text-anchor="middle" fill="#922b21">OOS</text>
  <rect x="240" y="68" width="24" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="252" y="81" font-size="8.5" font-weight="700" text-anchor="middle" fill="#922b21">OOS</text>
  <line x1="150" y1="60" x2="264" y2="60" stroke="#c0392b" stroke-width="1.2" marker-end="url(#mc0392b)" marker-start="url(#mc0392b)"/>
  <text x="207" y="54" font-size="10" font-weight="700" text-anchor="middle" fill="#922b21">N310 out-of-sync in a row</text>
  <rect x="268" y="106" width="202" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
  <text x="369" y="123" font-size="10.5" font-weight="700" text-anchor="middle" fill="#922b21">T310 running</text>
  <rect x="470" y="106" width="170" height="26" rx="4" fill="#fff4e0" stroke="#b7791f" stroke-width="1.3"/>
  <text x="555" y="123" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7b4f10">T311: cell selection</text>
  <rect x="640" y="106" width="160" height="26" rx="4" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.3"/>
  <text x="720" y="123" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1d4278">T301: waiting</text>
  <line x1="268" y1="86" x2="268" y2="150" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="268" y="162" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">T310 starts</text>
  <line x1="470" y1="86" x2="470" y2="166" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="470" y="178" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">RLF declared</text>
  <line x1="640" y1="86" x2="640" y2="150" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="640" y="162" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">ReestablishmentRequest</text>
  <line x1="800" y1="86" x2="800" y2="166" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="800" y="178" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">Reestablishment</text>
  <text x="40" y="220" font-size="10.5" text-anchor="start" fill="#555">• N311 in-sync indications while T310 runs → T310 stops, no RLF.</text>
  <text x="40" y="238" font-size="10.5" text-anchor="start" fill="#555">• Other RLF causes: random access problem, RLC max retransmissions, T304 expiry (failed handover).</text>
  <text x="40" y="256" font-size="10.5" text-anchor="start" fill="#555">• T311 or T301 expiry, or reestablishment rejected → RRC_IDLE, the connection starts again from RRC setup.</text>
</svg>
