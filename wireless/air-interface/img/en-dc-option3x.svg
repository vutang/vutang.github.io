<svg role="img" viewBox="0 0 960 390" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>EN-DC option 3x: eNB as master node, en-gNB as secondary node with split bearer</title>
  <rect x="0" y="0" width="960" height="390" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="mb7791f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker>
    <marker id="m2f5d9e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9e"/></marker>
  </defs>
  <text x="20" y="28" font-size="14" font-weight="700" text-anchor="start" fill="#1d4278">EN-DC (option 3x): LTE anchors control, NR carries the bulk of user data</text>
  <rect x="170" y="54" width="140" height="44" rx="8" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="240" y="79.9" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5a37">MME</text>
  <rect x="560" y="54" width="140" height="44" rx="8" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="630" y="79.9" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5a37">S-GW</text>
  <text x="435" y="70" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5a37">EPC</text>
  <rect x="130" y="170" width="220" height="74" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="240" y="197.4" font-size="12" font-weight="700" text-anchor="middle" fill="#7b4f10">eNB  (master node)</text>
  <text x="240" y="210.5" font-size="10" text-anchor="middle" fill="#555">RRC, SRB1 / SRB2</text>
  <text x="240" y="224" font-size="10" text-anchor="middle" fill="#555">LTE leg of the split bearer</text>
  <rect x="520" y="170" width="240" height="74" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="640" y="197.4" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">en-gNB  (secondary node)</text>
  <text x="640" y="210.5" font-size="10" text-anchor="middle" fill="#555">PDCP of the split bearer</text>
  <text x="640" y="224" font-size="10" text-anchor="middle" fill="#555">SRB3 (optional)</text>
  <rect x="390" y="316" width="160" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="470" y="338.15" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">UE</text>
  <text x="470" y="351.25" font-size="10" text-anchor="middle" fill="#555">EN-DC capable</text>
  <line x1="240" y1="98" x2="240" y2="168" stroke="#2e7d4f" stroke-width="2"/>
  <text x="246" y="138" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f5a37">S1-MME</text>
  <line x1="630" y1="98" x2="630" y2="168" stroke="#2f5d9e" stroke-width="4"/>
  <text x="636" y="138" font-size="10.5" font-weight="700" text-anchor="start" fill="#1d4278">S1-U (all user data)</text>
  <line x1="352" y1="196" x2="518" y2="196" stroke="#475569" stroke-width="2"/>
  <text x="435" y="188" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">X2-C</text>
  <line x1="518" y1="222" x2="352" y2="222" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#mb7791f)"/>
  <text x="435" y="238" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7b4f10">X2-U (LTE share)</text>
  <line x1="240" y1="246" x2="420" y2="314" stroke="#b7791f" stroke-width="3" marker-end="url(#mb7791f)"/>
  <text x="300" y="296" font-size="10.5" font-weight="700" text-anchor="end" fill="#7b4f10">LTE leg</text>
  <line x1="640" y1="246" x2="520" y2="314" stroke="#2f5d9e" stroke-width="3" marker-end="url(#m2f5d9e)"/>
  <text x="600" y="296" font-size="10.5" font-weight="700" text-anchor="start" fill="#1d4278">NR leg</text>
  <text x="790" y="280" font-size="10.5" text-anchor="start" fill="#555">Control plane: one RRC</text>
  <text x="790" y="294.175" font-size="10.5" text-anchor="start" fill="#555">connection, anchored at</text>
  <text x="790" y="308.35" font-size="10.5" text-anchor="start" fill="#555">the eNB. NR-only changes</text>
  <text x="790" y="322.525" font-size="10.5" text-anchor="start" fill="#555">may go over SRB3.</text>
</svg>
