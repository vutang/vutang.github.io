<svg role="img" viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Initial access steps from power-on to RRC_CONNECTED</title>
  <rect x="0" y="0" width="960" height="320" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="m475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <text x="20" y="28" font-size="14" font-weight="700" text-anchor="start" fill="#1d4278">From power-on to RRC_CONNECTED</text>
  <rect x="20" y="50" width="164" height="92" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="102" y="85.725" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">1. PLMN selection</text>
  <text x="102" y="99.3" font-size="10.5" text-anchor="middle" fill="#555">NAS, USIM</text>
  <text x="102" y="113.475" font-size="10.5" text-anchor="middle" fill="#555">list of allowed PLMNs</text>
  <rect x="208" y="50" width="164" height="92" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="290" y="85.725" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">2. Cell search</text>
  <text x="290" y="99.3" font-size="10.5" text-anchor="middle" fill="#555">PSS / SSS</text>
  <text x="290" y="113.475" font-size="10.5" text-anchor="middle" fill="#555">→ PCI, frame timing</text>
  <line x1="185" y1="96" x2="205" y2="96" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
  <rect x="396" y="50" width="164" height="92" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="478" y="85.725" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">3. Read MIB</text>
  <text x="478" y="99.3" font-size="10.5" text-anchor="middle" fill="#555">PBCH</text>
  <text x="478" y="113.475" font-size="10.5" text-anchor="middle" fill="#555">→ SFN, where SIB1 is</text>
  <line x1="373" y1="96" x2="393" y2="96" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
  <rect x="584" y="50" width="164" height="92" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="666" y="85.725" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">4. Read SIB1</text>
  <text x="666" y="99.3" font-size="10.5" text-anchor="middle" fill="#555">PDSCH</text>
  <text x="666" y="113.475" font-size="10.5" text-anchor="middle" fill="#555">→ PLMN, TAC, RACH config</text>
  <line x1="561" y1="96" x2="581" y2="96" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
  <rect x="772" y="50" width="164" height="92" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="854" y="85.725" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">5. Cell selection</text>
  <text x="854" y="99.3" font-size="10.5" text-anchor="middle" fill="#555">S-criterion</text>
  <text x="854" y="113.475" font-size="10.5" text-anchor="middle" fill="#555">→ camp on the cell</text>
  <line x1="749" y1="96" x2="769" y2="96" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
  <line x1="854" y1="144" x2="854" y2="186" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
  <rect x="772" y="188" width="164" height="64" rx="30" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="854" y="216.812" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">RRC_IDLE</text>
  <text x="854" y="230.387" font-size="10.5" text-anchor="middle" fill="#555">camped, monitors paging</text>
  <rect x="440" y="188" width="250" height="64" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="565" y="216.812" font-size="12" font-weight="700" text-anchor="middle" fill="#7b4f10">6. Random access + RRC setup</text>
  <text x="565" y="230.387" font-size="10.5" text-anchor="middle" fill="#555">Msg1 … Msg4, Msg5 carries NAS</text>
  <rect x="130" y="188" width="220" height="64" rx="30" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="240" y="216.812" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5a37">RRC_CONNECTED</text>
  <text x="240" y="230.387" font-size="10.5" text-anchor="middle" fill="#555">SRB1 up, NAS procedure starts</text>
  <line x1="770" y1="220" x2="692" y2="220" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
  <line x1="438" y1="220" x2="352" y2="220" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
  <text x="731" y="210" font-size="10.5" text-anchor="middle" fill="#555">trigger</text>
  <text x="480" y="284" font-size="10.5" text-anchor="middle" fill="#555">Triggers: initial registration, uplink data or signalling, paging, periodic or mobility update.</text>
  <text x="480" y="302" font-size="10.5" text-anchor="middle" fill="#555">Steps 2 to 5 are repeated in the background for cell reselection while the UE is idle.</text>
</svg>
