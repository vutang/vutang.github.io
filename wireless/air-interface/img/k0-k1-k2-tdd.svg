<rect x="680" y="348" width="14" height="14" rx="3" fill="#555" fill-opacity="0.35" stroke="#555"/>
<text x="700" y="359" font-size="9.5" fill="#555">Special slot (S)</text>
<text x="30" y="380" font-size="9.5" fill="#666">Mũi tên xanh: thời điểm gửi HARQ-ACK. HARQ-ACK của ba slot PDSCH được gộp vào slot uplink gần nhất, nên K1 khác nhau cho từng PDSCH.</text>
