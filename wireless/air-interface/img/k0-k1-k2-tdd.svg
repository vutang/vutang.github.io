<text x="30" y="36" font-size="14" font-weight="700" fill="#1d4278">K0, K1, K2 trên mẫu TDD DDDSU (SCS 30 kHz, slot 0,5 ms)</text>
<text x="30" y="54" font-size="10.5" fill="#666">Ví dụ minh họa; giá trị K thực tế do cấu hình TDRA, khả năng xử lý của UE và mẫu TDD quyết định</text>
