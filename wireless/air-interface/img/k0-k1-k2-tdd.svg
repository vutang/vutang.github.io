<svg role="img" viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
<title>Quan hệ thời gian K0, K1, K2 trên mẫu TDD DDDSU ở subcarrier spacing 30 kHz: PDSCH ở slot 0 đến 2 với K0 bằng 0, HARQ-ACK gộp ở slot uplink 4, DCI cấp phát đường lên ở slot 1 cho PUSCH ở slot 4</title>
