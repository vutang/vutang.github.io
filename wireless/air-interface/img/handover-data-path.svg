<svg role="img" viewBox="0 0 960 330" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>User plane path before, during and after an X2/Xn handover</title>
  <rect x="0" y="0" width="960" height="330" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="mb7791f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker>
  </defs>
  <text x="20" y="28" font-size="14" font-weight="700" text-anchor="start" fill="#1d4278">User plane path during an X2 / Xn handover</text>
  <text x="168" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">1. Before (preparation)</text>
  <rect x="110" y="76" width="116" height="40" rx="8" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="168" y="99.575" font-size="11" font-weight="700" text-anchor="middle" fill="#1f5a37">S-GW / UPF</text>
  <rect x="30" y="160" width="110" height="44" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="85" y="185.575" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4278">Source</text>
  <rect x="196" y="160" width="110" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="251" y="185.575" font-size="11" font-weight="700" text-anchor="middle" fill="#334155">Target</text>
  <rect x="130" y="252" width="76" height="36" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="168" y="273.575" font-size="11" font-weight="700" text-anchor="middle" fill="#334155">UE</text>
  <line x1="140" y1="116" x2="85" y2="158" stroke="#2f5d9e" stroke-width="3"/>
  <line x1="196" y1="116" x2="251" y2="158" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="85" y1="206" x2="146" y2="250" stroke="#2f5d9e" stroke-width="3"/>
  <line x1="251" y1="206" x2="190" y2="250" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="168" y="306" font-size="10" text-anchor="middle" fill="#555">UE still served by source,</text>
  <text x="168" y="319.5" font-size="10" text-anchor="middle" fill="#555">target admits the UE over X2/Xn</text>
  <text x="483" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">2. Execution</text>
  <rect x="425" y="76" width="116" height="40" rx="8" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="483" y="99.575" font-size="11" font-weight="700" text-anchor="middle" fill="#1f5a37">S-GW / UPF</text>
  <rect x="345" y="160" width="110" height="44" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="400" y="185.575" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4278">Source</text>
  <rect x="511" y="160" width="110" height="44" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="566" y="185.575" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4278">Target</text>
  <rect x="445" y="252" width="76" height="36" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="483" y="273.575" font-size="11" font-weight="700" text-anchor="middle" fill="#334155">UE</text>
  <line x1="455" y1="116" x2="400" y2="158" stroke="#2f5d9e" stroke-width="3"/>
  <line x1="511" y1="116" x2="566" y2="158" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="400" y1="206" x2="461" y2="250" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="566" y1="206" x2="505" y2="250" stroke="#2f5d9e" stroke-width="3"/>
  <line x1="457" y1="182" x2="507" y2="182" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#mb7791f)"/>
  <text x="483" y="222" font-size="10" font-weight="700" text-anchor="middle" fill="#7b4f10">forwarding</text>
  <text x="483" y="306" font-size="10" text-anchor="middle" fill="#555">UE detached, then RACH on target;</text>
  <text x="483" y="319.5" font-size="10" text-anchor="middle" fill="#555">source forwards DL data to target</text>
  <line x1="327" y1="50" x2="327" y2="320" stroke="#cbd5e1" stroke-width="1"/>
  <text x="798" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">3. After path switch</text>
  <rect x="740" y="76" width="116" height="40" rx="8" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="798" y="99.575" font-size="11" font-weight="700" text-anchor="middle" fill="#1f5a37">S-GW / UPF</text>
  <rect x="660" y="160" width="110" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="715" y="185.575" font-size="11" font-weight="700" text-anchor="middle" fill="#334155">Source</text>
  <rect x="826" y="160" width="110" height="44" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="881" y="185.575" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4278">Target</text>
  <rect x="760" y="252" width="76" height="36" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="798" y="273.575" font-size="11" font-weight="700" text-anchor="middle" fill="#334155">UE</text>
  <line x1="770" y1="116" x2="715" y2="158" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="826" y1="116" x2="881" y2="158" stroke="#2f5d9e" stroke-width="3"/>
  <line x1="715" y1="206" x2="776" y2="250" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="881" y1="206" x2="820" y2="250" stroke="#2f5d9e" stroke-width="3"/>
  <text x="798" y="306" font-size="10" text-anchor="middle" fill="#555">core moves the tunnel to target,</text>
  <text x="798" y="319.5" font-size="10" text-anchor="middle" fill="#555">end marker on the old path</text>
  <line x1="642" y1="50" x2="642" y2="320" stroke="#cbd5e1" stroke-width="1"/>
</svg>
