  <line x1="300" y1="206.5" x2="566" y2="92" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="570" y="70" width="370" height="64" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="755" y="91.725" font-size="12" font-weight="700" text-anchor="middle" fill="#922b21">Resource element (RE)</text>
  <text x="755" y="105.3" font-size="10.5" text-anchor="middle" fill="#555">1 subcarrier × 1 OFDM symbol, carries one</text>
  <text x="755" y="119.475" font-size="10.5" text-anchor="middle" fill="#555">modulation symbol (QPSK … 256QAM)</text>
  <line x1="542" y1="210.8" x2="566" y2="190" stroke="#2f5d9e" stroke-width="1.2"/>
  <rect x="570" y="152" width="370" height="80" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="755" y="174.638" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">Resource block (RB)</text>
  <text x="755" y="188.213" font-size="10.5" text-anchor="middle" fill="#555">12 consecutive subcarriers.</text>
  <text x="755" y="202.388" font-size="10.5" text-anchor="middle" fill="#555">NR: defined in frequency only, time is counted in symbols.</text>
  <text x="755" y="216.563" font-size="10.5" text-anchor="middle" fill="#555">LTE: 12 subcarriers × 1 slot (7 symbols) = 84 RE</text>
  <rect x="570" y="250" width="370" height="80" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="755" y="272.637" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">Bandwidth in RB</text>
  <text x="755" y="286.213" font-size="10.5" text-anchor="middle" fill="#555">LTE 20 MHz = 100 RB (1200 subcarriers)</text>
  <text x="755" y="300.388" font-size="10.5" text-anchor="middle" fill="#555">NR 100 MHz @ 30 kHz = 273 RB (3276 subcarriers)</text>
  <text x="755" y="314.563" font-size="10.5" text-anchor="middle" fill="#555">NR maximum: 275 RB per carrier</text>
