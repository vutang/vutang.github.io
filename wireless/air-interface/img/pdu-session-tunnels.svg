<svg role="img" viewBox="0 0 960 390" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>How the N3 GTP-U tunnel endpoints are exchanged during PDU session establishment</title>
  <rect x="0" y="0" width="960" height="390" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="mc0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="m2e7d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker>
  </defs>
  <text x="20" y="28" font-size="14" font-weight="700" text-anchor="start" fill="#1d4278">PDU session: who learns which tunnel endpoint (TEID), and from which message</text>
  <rect x="270" y="52" width="150" height="46" rx="8" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="345" y="78.9" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5a37">AMF</text>
  <rect x="610" y="52" width="150" height="46" rx="8" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="685" y="78.9" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5a37">SMF</text>
  <rect x="30" y="200" width="100" height="80" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="80" y="243.9" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">UE</text>
  <rect x="270" y="200" width="150" height="80" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="345" y="237.15" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">gNB</text>
  <text x="345" y="250.25" font-size="10" text-anchor="middle" fill="#555">CU-UP: SDAP, PDCP</text>
  <rect x="610" y="200" width="150" height="80" rx="8" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="685" y="237.15" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5a37">UPF</text>
  <text x="685" y="250.25" font-size="10" text-anchor="middle" fill="#555">PDU session anchor</text>
  <rect x="850" y="200" width="90" height="80" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="895" y="237.15" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">Data</text>
  <text x="895" y="250.25" font-size="10" text-anchor="middle" fill="#555">network (DNN)</text>
  <rect x="420" y="222" width="190" height="36" rx="18" fill="#eef2f7" stroke="#475569" stroke-width="1.5"/>
  <text x="515" y="245" font-size="11" font-weight="700" text-anchor="middle" fill="#333">N3 GTP-U</text>
  <line x1="130" y1="240" x2="270" y2="240" stroke="#2f5d9e" stroke-width="3"/>
  <text x="200" y="232" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1d4278">DRBs</text>
  <line x1="760" y1="240" x2="850" y2="240" stroke="#475569" stroke-width="3"/>
  <text x="805" y="232" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">N6</text>
  <rect x="392" y="290" width="92" height="24" rx="4" fill="#fff4e0" stroke="#b7791f" stroke-width="1.2"/>
  <text x="438" y="306" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7b4f10">TEID<tspan baseline-shift="sub" font-size="75%">gNB</tspan></text>
  <rect x="560" y="290" width="92" height="24" rx="4" fill="#fff4e0" stroke="#b7791f" stroke-width="1.2"/>
  <text x="606" y="306" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7b4f10">TEID<tspan baseline-shift="sub" font-size="75%">UPF</tspan></text>
  <text x="438" y="330" font-size="10" text-anchor="middle" fill="#555">DL packets go here</text>
  <text x="606" y="330" font-size="10" text-anchor="middle" fill="#555">UL packets go here</text>
  <line x1="670" y1="198" x2="670" y2="100" stroke="#c0392b" stroke-width="1.6" marker-end="url(#mc0392b)"/>
  <text x="664" y="150" font-size="10" text-anchor="end" fill="#333">① PFCP Session Establishment</text>
  <text x="664" y="164" font-size="10" text-anchor="end" fill="#333">Response: TEID<tspan baseline-shift="sub" font-size="75%">UPF</tspan></text>
  <line x1="608" y1="70" x2="422" y2="70" stroke="#c0392b" stroke-width="1.6" marker-end="url(#mc0392b)"/>
  <text x="515" y="62" font-size="10" text-anchor="middle" fill="#333">② N1N2MessageTransfer: TEID<tspan baseline-shift="sub" font-size="75%">UPF</tspan></text>
  <line x1="310" y1="100" x2="310" y2="198" stroke="#c0392b" stroke-width="1.6" marker-end="url(#mc0392b)"/>
  <text x="304" y="132" font-size="10" text-anchor="end" fill="#333">③ NGAP PDU Session</text>
  <text x="304" y="146" font-size="10" text-anchor="end" fill="#333">Resource Setup Request</text>
  <line x1="380" y1="198" x2="380" y2="100" stroke="#2e7d4f" stroke-width="1.6" marker-end="url(#m2e7d4f)"/>
  <text x="386" y="132" font-size="10" text-anchor="start" fill="#333">④ Setup Response:</text>
  <text x="386" y="146" font-size="10" text-anchor="start" fill="#333">TEID<tspan baseline-shift="sub" font-size="75%">gNB</tspan></text>
  <line x1="422" y1="88" x2="608" y2="88" stroke="#2e7d4f" stroke-width="1.6" marker-end="url(#m2e7d4f)"/>
  <text x="515" y="106" font-size="10" text-anchor="middle" fill="#333">⑤ UpdateSMContext: TEID<tspan baseline-shift="sub" font-size="75%">gNB</tspan></text>
  <line x1="720" y1="100" x2="720" y2="198" stroke="#2e7d4f" stroke-width="1.6" marker-end="url(#m2e7d4f)"/>
  <text x="726" y="186" font-size="10" text-anchor="start" fill="#333">⑥ PFCP Modification: TEID<tspan baseline-shift="sub" font-size="75%">gNB</tspan></text>
  <text x="480" y="356" font-size="10.5" text-anchor="middle" fill="#555">Uplink works after step ③, downlink after step ⑥.</text>
  <text x="480" y="370.175" font-size="10.5" text-anchor="middle" fill="#555">LTE follows the same pattern on S1-U: S-GW TEID in Initial Context Setup Request, eNB TEID back in the Response, then Modify Bearer.</text>
</svg>
