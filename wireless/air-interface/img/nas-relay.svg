<svg role="img" viewBox="0 0 960 270" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>A NAS message is wrapped in RRC on the radio side and in S1AP/NGAP towards the core</title>
  <rect x="0" y="0" width="960" height="270" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="m2f5d9e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9e"/></marker>
  </defs>
  <text x="20" y="28" font-size="14" font-weight="700" text-anchor="start" fill="#1d4278">Uplink NAS message: UE → eNB/gNB → MME/AMF (downlink is the mirror image)</text>
  <text x="40" y="245" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">UE</text>
  <rect x="20" y="52" width="370" height="166" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="32" y="72" font-size="11" font-weight="700" text-anchor="start" fill="#334155">PDCP / RLC / MAC / PHY  (SRB1 or SRB2)</text>
  <rect x="34" y="82" width="342" height="126" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="46" y="101" font-size="11" font-weight="700" text-anchor="start" fill="#1d4278">RRC: ULInformationTransfer</text>
  <rect x="48" y="112" width="314" height="86" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="60" y="131" font-size="11" font-weight="700" text-anchor="start" fill="#7b4f10">dedicatedInfoNAS</text>
  <rect x="80" y="142" width="250" height="44" rx="8" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="205" y="160.812" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5a37">NAS PDU</text>
  <text x="205" y="174.387" font-size="10.5" text-anchor="middle" fill="#555">e.g. Registration Request</text>
  <rect x="420" y="100" width="120" height="70" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="480" y="125.4" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">eNB / gNB</text>
  <text x="480" y="138.5" font-size="10" text-anchor="middle" fill="#555">unwrap RRC,</text>
  <text x="480" y="152" font-size="10" text-anchor="middle" fill="#555">wrap in S1AP/NGAP</text>
  <line x1="392" y1="135" x2="418" y2="135" stroke="#2f5d9e" stroke-width="2" marker-end="url(#m2f5d9e)"/>
  <line x1="542" y1="135" x2="568" y2="135" stroke="#2f5d9e" stroke-width="2" marker-end="url(#m2f5d9e)"/>
  <rect x="570" y="52" width="370" height="166" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="582" y="72" font-size="11" font-weight="700" text-anchor="start" fill="#334155">SCTP / IP  (S1-MME or N2)</text>
  <rect x="584" y="82" width="342" height="126" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="596" y="101" font-size="11" font-weight="700" text-anchor="start" fill="#1d4278">S1AP / NGAP: Uplink NAS Transport</text>
  <rect x="598" y="112" width="314" height="86" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="610" y="131" font-size="11" font-weight="700" text-anchor="start" fill="#7b4f10">NAS-PDU IE</text>
  <rect x="630" y="142" width="250" height="44" rx="8" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="755" y="160.812" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5a37">NAS PDU</text>
  <text x="755" y="174.387" font-size="10.5" text-anchor="middle" fill="#555">e.g. Registration Request</text>
  <text x="920" y="245" font-size="12" font-weight="700" text-anchor="end" fill="#1f5a37">MME / AMF</text>
  <text x="480" y="245" font-size="10.5" text-anchor="middle" fill="#555">The NAS PDU is ciphered and integrity-protected with NAS keys the RAN never holds.</text>
</svg>
