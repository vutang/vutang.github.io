<svg role="img" viewBox="0 0 960 414" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>LTE EPS bearers map one to one onto DRBs, NR QoS flows are grouped into DRBs by SDAP</title>
  <rect x="0" y="0" width="960" height="414" rx="8" fill="#ffffff"/>
  <text x="20" y="28" font-size="14" font-weight="700" text-anchor="start" fill="#1d4278">LTE: one EPS bearer = one DRB + one S1 bearer + one S5 bearer</text>
  <line x1="110" y1="96" x2="830" y2="96" stroke="#2f5d9e" stroke-width="3"/>
  <line x1="110" y1="116" x2="830" y2="116" stroke="#b7791f" stroke-width="3"/>
  <line x1="110" y1="136" x2="830" y2="136" stroke="#2e7d4f" stroke-width="3"/>
  <rect x="30" y="76" width="80" height="80" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="70" y="119.9" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">UE</text>
  <rect x="330" y="76" width="100" height="80" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="380" y="119.9" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">eNB</text>
  <rect x="600" y="76" width="100" height="80" rx="8" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="650" y="119.9" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5a37">S-GW</text>
  <rect x="830" y="76" width="110" height="80" rx="8" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="885" y="119.9" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5a37">P-GW</text>
  <text x="220" y="176" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">DRB</text>
  <text x="515" y="176" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">S1-U bearer (GTP-U)</text>
  <text x="765" y="176" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">S5 bearer</text>
  <text x="220" y="72" font-size="10.5" text-anchor="middle" fill="#555">EPS bearer 1, 2, 3</text>
  <text x="480" y="196" font-size="10.5" text-anchor="middle" fill="#555">QoS (QCI, ARP, GBR) is set per bearer by the core, each bearer has its own tunnel on S1-U.</text>
  <line x1="20" y1="212" x2="940" y2="212" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="240" font-size="14" font-weight="700" text-anchor="start" fill="#1d4278">NR: QoS flows (QFI) inside one PDU session, the gNB groups them into DRBs</text>
  <g transform="translate(0,14)">
  <rect x="110" y="262" width="220" height="36" rx="4" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1"/>
  <rect x="110" y="306" width="220" height="22" rx="4" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1"/>
  <rect x="470" y="250" width="310" height="84" rx="10" fill="#eef2f7" stroke="#475569" stroke-width="1.5"/>
  <line x1="110" y1="272" x2="330" y2="272" stroke="#2f5d9e" stroke-width="3"/>
  <line x1="470" y1="272" x2="780" y2="272" stroke="#2f5d9e" stroke-width="3"/>
  <line x1="110" y1="288" x2="330" y2="288" stroke="#b7791f" stroke-width="3"/>
  <line x1="470" y1="288" x2="780" y2="288" stroke="#b7791f" stroke-width="3"/>
  <line x1="110" y1="317" x2="330" y2="317" stroke="#2e7d4f" stroke-width="3"/>
  <line x1="470" y1="317" x2="780" y2="317" stroke="#2e7d4f" stroke-width="3"/>
  <rect x="30" y="250" width="80" height="90" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="70" y="298.9" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">UE</text>
  <rect x="330" y="250" width="140" height="90" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="400" y="292.15" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">gNB</text>
  <text x="400" y="305.25" font-size="10" text-anchor="middle" fill="#555">SDAP: QoS flow → DRB</text>
  <rect x="780" y="250" width="150" height="90" rx="8" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="855" y="285.4" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5a37">UPF</text>
  <text x="855" y="298.5" font-size="10" text-anchor="middle" fill="#555">classifies packets</text>
  <text x="855" y="312" font-size="10" text-anchor="middle" fill="#555">into QoS flows</text>
  <text x="140" y="254" font-size="10.5" font-weight="700" text-anchor="start" fill="#1d4278">DRB 1</text>
  <text x="140" y="343" font-size="10.5" font-weight="700" text-anchor="start" fill="#1d4278">DRB 2</text>
  <text x="770" y="266" font-size="10" font-weight="700" text-anchor="end" fill="#333">QFI 1</text>
  <text x="770" y="282" font-size="10" font-weight="700" text-anchor="end" fill="#333">QFI 2</text>
  <text x="770" y="311" font-size="10" font-weight="700" text-anchor="end" fill="#333">QFI 5</text>
  <text x="625" y="352" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">N3: one GTP-U tunnel per PDU session, QFI in the header</text>
  <text x="480" y="384" font-size="10.5" text-anchor="middle" fill="#555">The core sets QoS per flow (5QI), the gNB alone decides how many DRBs to create and which flows share one.</text>
  </g>
</svg>
