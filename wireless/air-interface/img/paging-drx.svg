<svg role="img" viewBox="0 0 960 270" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Paging DRX: the UE wakes only at its paging occasion, in NR once per SSB beam</title>
  <rect x="0" y="0" width="960" height="270" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="m333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="m475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <text x="20" y="28" font-size="14" font-weight="700" text-anchor="start" fill="#1d4278">Paging: the UE sleeps and wakes only at its own paging occasion</text>
  <line x1="40" y1="90" x2="930" y2="90" stroke="#333" stroke-width="1.2" marker-end="url(#m333)"/>
  <text x="930" y="108" font-size="10" text-anchor="end" fill="#555">time</text>
  <rect x="90" y="64" width="34" height="26" rx="3" fill="#2f5d9e" stroke="none" stroke-width="0"/>
  <text x="107" y="58" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">PO</text>
  <rect x="130" y="80" width="244" height="10" rx="2" fill="#e2e8f0" stroke="none" stroke-width="0"/>
  <text x="252" y="76" font-size="10" text-anchor="middle" fill="#555">sleep</text>
  <rect x="380" y="64" width="34" height="26" rx="3" fill="#2f5d9e" stroke="none" stroke-width="0"/>
  <text x="397" y="58" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">PO</text>
  <rect x="420" y="80" width="244" height="10" rx="2" fill="#e2e8f0" stroke="none" stroke-width="0"/>
  <text x="542" y="76" font-size="10" text-anchor="middle" fill="#555">sleep</text>
  <rect x="670" y="64" width="34" height="26" rx="3" fill="#c0392b" stroke="none" stroke-width="0"/>
  <text x="687" y="58" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">PO</text>
  <line x1="90" y1="104" x2="380" y2="104" stroke="#475569" stroke-width="1" marker-end="url(#m475569)" marker-start="url(#m475569)"/>
  <text x="235" y="120" font-size="10.5" text-anchor="middle" fill="#333">T = paging DRX cycle</text>
  <line x1="380" y1="104" x2="670" y2="104" stroke="#475569" stroke-width="1" marker-end="url(#m475569)" marker-start="url(#m475569)"/>
  <text x="525" y="120" font-size="10.5" text-anchor="middle" fill="#333">T = paging DRX cycle</text>
  <text x="720" y="54" font-size="10.5" text-anchor="start" fill="#922b21">paging for this UE:</text>
  <text x="720" y="68.175" font-size="10.5" text-anchor="start" fill="#922b21">P-RNTI DCI → Paging message</text>
  <text x="720" y="82.35" font-size="10.5" text-anchor="start" fill="#922b21">contains its (5G-)S-TMSI</text>
  <line x1="670" y1="92" x2="520" y2="160" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="704" y1="92" x2="930" y2="160" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="520" y="160" width="410" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="536" y="172" width="84" height="46" rx="4" fill="#2f5d9e" fill-opacity="0.85" stroke="none" stroke-width="0"/>
  <text x="578" y="191" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">PDCCH</text>
  <text x="578" y="206" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">beam SSB #0</text>
  <rect x="634" y="172" width="84" height="46" rx="4" fill="#2e7d4f" fill-opacity="0.85" stroke="none" stroke-width="0"/>
  <text x="676" y="191" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">PDCCH</text>
  <text x="676" y="206" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">beam SSB #1</text>
  <rect x="732" y="172" width="84" height="46" rx="4" fill="#b7791f" fill-opacity="0.85" stroke="none" stroke-width="0"/>
  <text x="774" y="191" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">PDCCH</text>
  <text x="774" y="206" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">beam SSB #2</text>
  <rect x="830" y="172" width="84" height="46" rx="4" fill="#c0392b" fill-opacity="0.85" stroke="none" stroke-width="0"/>
  <text x="872" y="191" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">PDCCH</text>
  <text x="872" y="206" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">beam SSB #3</text>
  <text x="725" y="248" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">NR: one PO = monitoring occasions on every SSB beam</text>
  <text x="40" y="170" font-size="10.5" text-anchor="start" fill="#333">LTE: UE_ID = IMSI mod 1024</text>
  <text x="40" y="188" font-size="10.5" text-anchor="start" fill="#333">NR:  UE_ID = 5G-S-TMSI mod 1024</text>
  <text x="40" y="206" font-size="10.5" text-anchor="start" fill="#333">PF: (SFN + PF_offset) mod T = (T div N)·(UE_ID mod N)</text>
  <text x="40" y="224" font-size="10.5" text-anchor="start" fill="#333">PO: which subframe / occasions inside the PF</text>
</svg>
