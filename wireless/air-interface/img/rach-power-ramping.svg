<svg role="img" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Preamble power ramping: retransmissions with increasing power until a RAR is received</title>
  <rect x="0" y="0" width="960" height="300" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="m333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="m475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="m2e7d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker>
  </defs>
  <text x="20" y="28" font-size="14" font-weight="700" text-anchor="start" fill="#1d4278">Msg1 retries: power ramping and the RAR window</text>
  <line x1="60" y1="240" x2="940" y2="240" stroke="#333" stroke-width="1.2" marker-end="url(#m333)"/>
  <line x1="60" y1="240" x2="60" y2="50" stroke="#333" stroke-width="1.2" marker-end="url(#m333)"/>
  <text x="66" y="58" font-size="10.5" text-anchor="start" fill="#555">preamble power</text>
  <text x="940" y="258" font-size="10.5" text-anchor="end" fill="#555">time</text>
  <rect x="120" y="170" width="26" height="70" rx="2" fill="#b7791f" stroke="none" stroke-width="0"/>
  <text x="133" y="162" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7b4f10">Msg1 #1</text>
  <rect x="166" y="206" width="160" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="246" y="225" font-size="10" font-weight="700" text-anchor="middle" fill="#922b21">RAR window: no RAR</text>
  <rect x="360" y="130" width="26" height="110" rx="2" fill="#b7791f" stroke="none" stroke-width="0"/>
  <text x="373" y="122" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7b4f10">Msg1 #2</text>
  <rect x="406" y="206" width="160" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="486" y="225" font-size="10" font-weight="700" text-anchor="middle" fill="#922b21">RAR window: no RAR</text>
  <line x1="146" y1="170" x2="356" y2="170" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="350" y1="170" x2="350" y2="130" stroke="#475569" stroke-width="1.2" marker-end="url(#m475569)" marker-start="url(#m475569)"/>
  <text x="344" y="154" font-size="10" text-anchor="end" fill="#333">powerRampingStep</text>
  <rect x="600" y="90" width="26" height="150" rx="2" fill="#b7791f" stroke="none" stroke-width="0"/>
  <text x="613" y="82" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7b4f10">Msg1 #3</text>
  <rect x="646" y="206" width="160" height="30" rx="4" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="726" y="225" font-size="10" font-weight="700" text-anchor="middle" fill="#1f5a37">RAR window: RAR received</text>
  <line x1="386" y1="130" x2="596" y2="130" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="590" y1="130" x2="590" y2="90" stroke="#475569" stroke-width="1.2" marker-end="url(#m475569)" marker-start="url(#m475569)"/>
  <text x="584" y="114" font-size="10" text-anchor="end" fill="#333">powerRampingStep</text>
  <text x="133" y="190" font-size="10" text-anchor="middle" fill="#333"></text>
  <text x="120" y="268" font-size="10.5" text-anchor="start" fill="#555">Start: preambleInitialReceivedTargetPower + measured path loss. RAR window = ra-ResponseWindow.</text>
  <text x="120" y="282.175" font-size="10.5" text-anchor="start" fill="#555">After preambleTransMax attempts without RAR, MAC reports a random access problem to RRC.</text>
  <line x1="810" y1="160" x2="900" y2="160" stroke="#2e7d4f" stroke-width="1.6" marker-end="url(#m2e7d4f)"/>
  <text x="855" y="150" font-size="11" font-weight="700" text-anchor="middle" fill="#1f5a37">Msg3</text>
