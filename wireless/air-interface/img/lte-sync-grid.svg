  <text x="122" y="318" font-size="10.5" text-anchor="end" fill="#333">subframe</text>
  <text x="520" y="340" font-size="10.5" text-anchor="middle" fill="#555">time →  1 radio frame = 10 subframes = 10 ms</text>
