<svg role="img" viewBox="0 0 960 330" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Mapping between SSB beams and RACH occasions tells the gNB which beam the UE is in</title>
  <rect x="0" y="0" width="960" height="330" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="mc0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="m333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <text x="20" y="28" font-size="14" font-weight="700" text-anchor="start" fill="#1d4278">SSB index ↔ RACH occasion: the preamble tells the gNB which beam to answer on</text>
  <text x="20" y="92" font-size="12" font-weight="700" text-anchor="start" fill="#1d4278">Downlink</text>
  <text x="20" y="108" font-size="10.5" text-anchor="start" fill="#555">gNB → UE</text>
  <text x="20" y="232" font-size="12" font-weight="700" text-anchor="start" fill="#7b4f10">Uplink</text>
  <text x="20" y="248" font-size="10.5" text-anchor="start" fill="#555">UE → gNB</text>
  <rect x="130" y="76" width="64" height="40" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="162" y="99.575" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4278">SSB #0</text>
  <rect x="520" y="216" width="76" height="40" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="558" y="239.575" font-size="11" font-weight="700" text-anchor="middle" fill="#7b4f10">RO #0</text>
  <line x1="162" y1="118" x2="558" y2="214" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#m94a3b8)"/>
  <rect x="220" y="76" width="64" height="40" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="252" y="99.575" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4278">SSB #1</text>
  <rect x="624" y="216" width="76" height="40" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="662" y="239.575" font-size="11" font-weight="700" text-anchor="middle" fill="#7b4f10">RO #1</text>
  <line x1="252" y1="118" x2="662" y2="214" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#m94a3b8)"/>
  <rect x="310" y="76" width="64" height="40" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
  <text x="342" y="99.575" font-size="11" font-weight="700" text-anchor="middle" fill="#922b21">SSB #2</text>
  <rect x="728" y="216" width="76" height="40" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
  <text x="766" y="239.575" font-size="11" font-weight="700" text-anchor="middle" fill="#922b21">RO #2</text>
  <line x1="342" y1="118" x2="766" y2="214" stroke="#c0392b" stroke-width="2" marker-end="url(#mc0392b)"/>
  <rect x="400" y="76" width="64" height="40" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="432" y="99.575" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4278">SSB #3</text>
  <rect x="832" y="216" width="76" height="40" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="870" y="239.575" font-size="11" font-weight="700" text-anchor="middle" fill="#7b4f10">RO #3</text>
  <line x1="432" y1="118" x2="870" y2="214" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#m94a3b8)"/>
  <text x="130" y="156" font-size="10.5" font-weight="700" text-anchor="start" fill="#922b21">UE measures all SSBs,</text>
  <text x="130" y="170" font-size="10.5" font-weight="700" text-anchor="start" fill="#922b21">SSB #2 is strongest</text>
  <text x="720" y="286" font-size="10.5" font-weight="700" text-anchor="middle" fill="#922b21">UE sends its preamble in RO #2</text>
  <rect x="620" y="64" width="310" height="64" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="775" y="92.65" font-size="11.5" font-weight="700" text-anchor="middle" fill="#334155">gNB: preamble seen in RO #2</text>
  <text x="775" y="106.075" font-size="10.5" text-anchor="middle" fill="#555">⇒ UE is in beam #2 ⇒ send RAR (Msg2) on beam #2</text>
  <line x1="130" y1="302" x2="940" y2="302" stroke="#333" stroke-width="1" marker-end="url(#m333)"/>
  <text x="940" y="318" font-size="10" text-anchor="end" fill="#555">time</text>
  <text x="130" y="318" font-size="10" text-anchor="start" fill="#555">Mapping set by ssb-perRACH-OccasionAndCB-PreamblesPerSSB in SIB1</text>
</svg>
