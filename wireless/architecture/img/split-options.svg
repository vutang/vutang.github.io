<svg role="img" viewBox="0 0 960 667.79" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Chồng giao thức gNB chiều downlink với tám điểm cắt functional split của 3GPP, cách chia CU, DU, RU thường gặp và giao diện tương ứng</title>
  <rect x="0" y="0" width="960" height="640" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="arrDown" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,0 L5,10 z" fill="#475569"/></marker>
  </defs>

  <!-- Column titles -->
  <text x="150" y="40" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">Triển khai phổ biến</text>
  <text x="150" y="56" font-size="10" text-anchor="middle" fill="#555">(split 2 + split 7.2x)</text>
  <text x="410" y="40" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">Chồng giao thức gNB</text>
  <text x="410" y="56" font-size="10" text-anchor="middle" fill="#555">(chiều downlink)</text>
  <text x="565" y="40" font-size="12" font-weight="700" text-anchor="start" fill="#334155">Giao diện và độ trễ tối đa một chiều</text>
  <text x="565" y="56" font-size="10" text-anchor="start" fill="#555">(độ trễ: giá trị ví dụ trong TR 38.801)</text>

  <!-- Deployment brackets -->
  <rect x="176" y="80" width="10" height="92" rx="3" fill="#b8860b"/>
  <text x="166" y="122" font-size="14" font-weight="700" text-anchor="end" fill="#7a5a00">CU</text>
  <text x="166" y="138" font-size="9.5" text-anchor="end" fill="#555">Centralized Unit</text>
  <rect x="176" y="192" width="10" height="220" rx="3" fill="#2f8a55"/>
  <text x="166" y="298" font-size="14" font-weight="700" text-anchor="end" fill="#1f5c38">DU</text>
  <text x="166" y="314" font-size="9.5" text-anchor="end" fill="#555">Distributed Unit</text>
  <rect x="176" y="432" width="10" height="148" rx="3" fill="#2f5d9e"/>
  <text x="166" y="502" font-size="14" font-weight="700" text-anchor="end" fill="#1d4278">RU</text>
  <text x="166" y="518" font-size="9.5" text-anchor="end" fill="#555">Radio Unit</text>

  <!-- Stack boxes -->
  <rect x="300" y="80" width="107" height="36" rx="5" fill="#fff3cf" stroke="#b8860b" stroke-width="1.5"/>
  <text x="353" y="103" font-size="12" font-weight="700" text-anchor="middle" fill="#111">RRC</text>
  <rect x="413" y="80" width="107" height="36" rx="5" fill="#fff3cf" stroke="#b8860b" stroke-width="1.5"/>
  <text x="466" y="103" font-size="12" font-weight="700" text-anchor="middle" fill="#111">SDAP</text>

  <rect x="300" y="136" width="220" height="36" rx="5" fill="#fff3cf" stroke="#b8860b" stroke-width="1.5"/>
  <text x="410" y="159" font-size="12" font-weight="700" text-anchor="middle" fill="#111">PDCP</text>

  <rect x="300" y="192" width="220" height="44" rx="5" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="410" y="208" font-size="11" text-anchor="middle" fill="#111">RLC (phần trên)</text>
  <text x="410" y="230" font-size="11" text-anchor="middle" fill="#111">RLC (phần dưới)</text>

  <rect x="300" y="256" width="220" height="44" rx="5" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="410" y="272" font-size="11" text-anchor="middle" fill="#111">MAC (phần trên)</text>
  <text x="410" y="294" font-size="11" text-anchor="middle" fill="#111">MAC (phần dưới)</text>

  <rect x="300" y="320" width="220" height="36" rx="5" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="410" y="343" font-size="11" text-anchor="middle" fill="#111">CRC, mã hóa kênh, rate matching</text>

  <rect x="300" y="376" width="220" height="36" rx="5" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="410" y="399" font-size="11" text-anchor="middle" fill="#111">Scrambling, điều chế, layer mapping</text>

  <rect x="300" y="432" width="220" height="36" rx="5" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="410" y="455" font-size="11" text-anchor="middle" fill="#111">Precoding, RE mapping</text>

  <rect x="300" y="488" width="220" height="36" rx="5" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="410" y="511" font-size="11" text-anchor="middle" fill="#111">iFFT, thêm cyclic prefix</text>

  <rect x="300" y="544" width="220" height="36" rx="5" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="410" y="567" font-size="11" text-anchor="middle" fill="#111">RF: DAC, khuếch đại, lọc</text>

  <!-- Cut lines between layers -->
  <g stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4">
    <line x1="280" y1="126" x2="540" y2="126"/>
    <line x1="280" y1="182" x2="540" y2="182"/>
    <line x1="280" y1="214" x2="540" y2="214"/>
    <line x1="280" y1="246" x2="540" y2="246"/>
    <line x1="280" y1="278" x2="540" y2="278"/>
    <line x1="280" y1="310" x2="540" y2="310"/>
    <line x1="280" y1="366" x2="540" y2="366"/>
    <line x1="280" y1="422" x2="540" y2="422"/>
    <line x1="280" y1="478" x2="540" y2="478"/>
    <line x1="280" y1="534" x2="540" y2="534"/>
  </g>
  <g font-size="10.5" font-weight="700" text-anchor="end" fill="#a3291d">
    <text x="276" y="130">Option 1</text>
    <text x="276" y="186">Option 2</text>
    <text x="276" y="218">Option 3</text>
    <text x="276" y="250">Option 4</text>
    <text x="276" y="282">Option 5</text>
    <text x="276" y="314">Option 6</text>
    <text x="276" y="370">Option 7-3</text>
    <text x="276" y="426">Option 7-2</text>
    <text x="276" y="482">Option 7-1</text>
    <text x="276" y="538">Option 8</text>
  </g>

  <!-- Interface labels -->
  <text x="565" y="130" font-size="10.5" fill="#333">RRC ở khối trung tâm, PDCP trở xuống ở DU</text>
  <text x="565" y="186" font-size="10.5" font-weight="700" fill="#1d4278">F1 (midhaul) · 1,5–10 ms</text>
  <text x="565" y="314" font-size="10.5" font-weight="700" fill="#1d4278">FAPI / nFAPI (L2 với L1)</text>
  <text x="565" y="370" font-size="10.5" fill="#333">Chỉ định nghĩa cho downlink</text>
  <text x="565" y="426" font-size="10.5" font-weight="700" fill="#1d4278">Open Fronthaul: O-RAN chọn 7.2x,</text>
  <text x="565" y="440" font-size="10" fill="#333">biến thể của 7-2 (chi tiết ở hình chuỗi xử lý 7.2x)</text>
  <text x="565" y="538" font-size="10.5" font-weight="700" fill="#1d4278">CPRI (IQ miền thời gian) · 250 µs</text>

  <!-- Trend arrow -->
  <line x1="900" y1="90" x2="900" y2="566" stroke="#475569" stroke-width="2.5" marker-end="url(#arrDown)"/>
  <text x="918" y="330" font-size="10.5" text-anchor="middle" fill="#333" transform="rotate(90 918 330)">Cắt càng thấp: băng thông lớn hơn, độ trễ cho phép nhỏ hơn</text>

  <!-- Footer -->
  <text x="480" y="612" font-size="10.5" text-anchor="middle" fill="#333">Option 3 và 5 cắt bên trong RLC và MAC. Ranh giới CU, DU, RU ở cột trái là cách chia thường gặp, không phải cách duy nhất.</text>
<text id="wm" x="948.88" y="659.45" text-anchor="end" font-size="13.89" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
