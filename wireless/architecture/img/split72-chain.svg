<svg role="img" viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Chuỗi xử lý downlink và uplink ở split 7.2x của O-RAN, với ranh giới DU và RU của Category A và Category B</title>
  <rect x="0" y="0" width="1000" height="430" rx="8" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <text x="304.0" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#1f5c38">O-DU</text>
  <text x="843.0" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#1d4278">O-RU</text>
  <text x="647.0" y="30" font-size="10" text-anchor="middle" fill="#5b21b6">tùy loại RU</text>
  <text x="17" y="78" font-size="12" font-weight="700" fill="#334155">Downlink (DU → RU)</text>
