  <text x="17" y="238" font-size="12" font-weight="700" fill="#334155">Uplink (RU → DU)</text>
  <rect x="17" y="250" width="84" height="50" rx="5" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="59.0" y="272" font-size="10" text-anchor="middle" fill="#111">Kiểm tra</text>
  <text x="59.0" y="286" font-size="10" text-anchor="middle" fill="#111">CRC</text>
