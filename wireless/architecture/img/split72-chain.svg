  <text x="59.0" y="136" font-size="10" text-anchor="middle" fill="#111">LDPC</text>
  <line x1="102" y1="125" x2="114" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="115" y="100" width="84" height="50" rx="5" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="157.0" y="122" font-size="10" text-anchor="middle" fill="#111">Rate</text>
  <text x="157.0" y="136" font-size="10" text-anchor="middle" fill="#111">matching</text>
  <line x1="200" y1="125" x2="212" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="213" y="100" width="84" height="50" rx="5" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="255.0" y="129" font-size="10" text-anchor="middle" fill="#111">Scrambling</text>
  <line x1="298" y1="125" x2="310" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="311" y="100" width="84" height="50" rx="5" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="353.0" y="129" font-size="10" text-anchor="middle" fill="#111">Điều chế</text>
  <line x1="396" y1="125" x2="408" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="409" y="100" width="84" height="50" rx="5" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="451.0" y="122" font-size="10" text-anchor="middle" fill="#111">Layer</text>
  <text x="451.0" y="136" font-size="10" text-anchor="middle" fill="#111">mapping</text>
  <line x1="494" y1="125" x2="506" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="507" y="100" width="84" height="50" rx="5" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="549.0" y="122" font-size="10" text-anchor="middle" fill="#111">RE</text>
  <text x="549.0" y="136" font-size="10" text-anchor="middle" fill="#111">mapping</text>
  <line x1="592" y1="125" x2="604" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="605" y="100" width="84" height="50" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
