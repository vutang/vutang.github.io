  <rect x="213" y="250" width="84" height="50" rx="5" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="255.0" y="272" font-size="10" text-anchor="middle" fill="#111">Rate</text>
  <text x="255.0" y="286" font-size="10" text-anchor="middle" fill="#111">dematching</text>
  <line x1="310" y1="275" x2="298" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="311" y="250" width="84" height="50" rx="5" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="353.0" y="279" font-size="10" text-anchor="middle" fill="#111">Descrambling</text>
  <line x1="408" y1="275" x2="396" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="409" y="250" width="84" height="50" rx="5" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="451.0" y="279" font-size="10" text-anchor="middle" fill="#111">Giải điều chế</text>
  <line x1="506" y1="275" x2="494" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="507" y="250" width="84" height="50" rx="5" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="549.0" y="272" font-size="10" text-anchor="middle" fill="#111">Ước lượng</text>
  <text x="549.0" y="286" font-size="10" text-anchor="middle" fill="#111">kênh, cân bằng</text>
  <line x1="604" y1="275" x2="592" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="605" y="250" width="84" height="50" rx="5" fill="#d4efdf" stroke="#2f8a55" stroke-width="1.5"/>
  <text x="647.0" y="272" font-size="10" text-anchor="middle" fill="#111">RE</text>
  <text x="647.0" y="286" font-size="10" text-anchor="middle" fill="#111">demapping</text>
  <line x1="702" y1="275" x2="690" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="703" y="250" width="84" height="50" rx="5" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="745.0" y="272" font-size="10" text-anchor="middle" fill="#111">Digital</text>
  <text x="745.0" y="286" font-size="10" text-anchor="middle" fill="#111">beamforming</text>
  <line x1="800" y1="275" x2="788" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="801" y="250" width="84" height="50" rx="5" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="843.0" y="272" font-size="10" text-anchor="middle" fill="#111">Bỏ CP,</text>
  <text x="843.0" y="286" font-size="10" text-anchor="middle" fill="#111">FFT</text>
  <line x1="898" y1="275" x2="886" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="899" y="250" width="84" height="50" rx="5" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="941.0" y="279" font-size="10" text-anchor="middle" fill="#111">RF, ADC</text>
  <line x1="696.0" y1="230" x2="696.0" y2="324" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="700.0" y="342" font-size="10.5" font-weight="700" text-anchor="start" fill="#a3291d">Ranh giới uplink</text>
  <text x="500" y="378" font-size="10.5" text-anchor="middle" fill="#333">Category A: precoding ở DU, fronthaul mang tín hiệu sau precoding. Category B: precoding ở RU, fronthaul mang các layer.</text>
  <text x="500" y="396" font-size="10.5" text-anchor="middle" fill="#333">Ở cả hai loại, digital beamforming (nếu có), iFFT/FFT và cyclic prefix nằm ở RU; nén IQ áp dụng trên đoạn fronthaul.</text>
</svg>
