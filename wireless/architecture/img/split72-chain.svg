  <rect x="703" y="100" width="84" height="50" rx="5" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="745.0" y="122" font-size="10" text-anchor="middle" fill="#111">Digital</text>
  <text x="745.0" y="136" font-size="10" text-anchor="middle" fill="#111">beamforming</text>
  <line x1="788" y1="125" x2="800" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="801" y="100" width="84" height="50" rx="5" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="843.0" y="122" font-size="10" text-anchor="middle" fill="#111">iFFT,</text>
  <text x="843.0" y="136" font-size="10" text-anchor="middle" fill="#111">thêm CP</text>
  <line x1="886" y1="125" x2="898" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="899" y="100" width="84" height="50" rx="5" fill="#d3e3f7" stroke="#2f5d9e" stroke-width="1.5"/>
