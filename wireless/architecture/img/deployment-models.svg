<svg role="img" viewBox="0 0 960 557.79" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
<title>Ba mô hình đặt baseband theo vị trí: Distributed RAN đặt RU, DU, CU tại cell site và nối backhaul về mạng lõi; Centralized RAN chỉ đặt RU tại site, DU và CU gom về hub qua fronthaul trong phạm vi khoảng 20 km; mô hình lai đặt RU và DU tại site, CU ở điểm tập trung qua midhaul F1</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs>
