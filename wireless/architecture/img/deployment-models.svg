<text x="30" y="38" font-size="15" font-weight="700" fill="#1d4278">Đặt RU, DU, CU ở đâu: ba mô hình triển khai</text>
<text x="30" y="57" font-size="10.5" fill="#666">Cột là vị trí trong mạng, hàng là mô hình. Khoảng cách là bậc độ lớn suy ra từ ngân sách độ trễ, giá trị thực phụ thuộc thiết bị truyền dẫn.</text>
