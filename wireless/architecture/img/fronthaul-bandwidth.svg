<svg role="img" viewBox="0 0 960 337.79" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Băng thông fronthaul ước tính cho 100 MHz, SCS 30 kHz, 64 anten, 16 layer, tải đầy: split 8 khoảng 252 Gbps, split 7.2x Category A khoảng 108 Gbps, Category B khoảng 27 Gbps</title>
  <rect x="0" y="0" width="960" height="310" rx="8" fill="#ffffff"/>
  <text x="20" y="30" font-size="13" font-weight="700" fill="#1d4278">Băng thông fronthaul ước tính (Gbps, một chiều downlink)</text>
  <text x="20" y="48" font-size="10" fill="#555">100 MHz, SCS 30 kHz, 64 anten, 16 layer, tải đầy; chưa tính header, C-plane và mã đường truyền</text>
  <line x1="300.0" y1="66" x2="300.0" y2="236" stroke="#e2e8f0" stroke-width="1"/>
  <text x="300.0" y="254" font-size="10" text-anchor="middle" fill="#555">0</text>
  <line x1="411.5" y1="66" x2="411.5" y2="236" stroke="#e2e8f0" stroke-width="1"/>
  <text x="411.5" y="254" font-size="10" text-anchor="middle" fill="#555">50</text>
  <line x1="523.1" y1="66" x2="523.1" y2="236" stroke="#e2e8f0" stroke-width="1"/>
  <text x="523.1" y="254" font-size="10" text-anchor="middle" fill="#555">100</text>
  <line x1="634.6" y1="66" x2="634.6" y2="236" stroke="#e2e8f0" stroke-width="1"/>
  <text x="634.6" y="254" font-size="10" text-anchor="middle" fill="#555">150</text>
  <line x1="746.2" y1="66" x2="746.2" y2="236" stroke="#e2e8f0" stroke-width="1"/>
  <text x="746.2" y="254" font-size="10" text-anchor="middle" fill="#555">200</text>
  <line x1="857.7" y1="66" x2="857.7" y2="236" stroke="#e2e8f0" stroke-width="1"/>
  <text x="857.7" y="254" font-size="10" text-anchor="middle" fill="#555">250</text>
  <text x="288" y="92" font-size="11" font-weight="700" text-anchor="end" fill="#111">Split 8 (CPRI)</text>
  <text x="288" y="106" font-size="9.5" text-anchor="end" fill="#555">64 anten, IQ miền thời gian</text>
  <path d="M300,80 H857.5 Q861.5,80 861.5,84 V104 Q861.5,108 857.5,108 H300 Z" fill="#2f5d9e"/>
  <text x="869.5" y="99" font-size="11" font-weight="700" fill="#111">≈ 252</text>
  <text x="288" y="146" font-size="11" font-weight="700" text-anchor="end" fill="#111">Split 7.2x, Category A</text>
  <text x="288" y="160" font-size="9.5" text-anchor="end" fill="#555">64 luồng sau precoding</text>
  <path d="M300,134 H536.0 Q540.0,134 540.0,138 V158 Q540.0,162 536.0,162 H300 Z" fill="#2f5d9e"/>
  <text x="548.0" y="153" font-size="11" font-weight="700" fill="#111">≈ 108</text>
  <text x="288" y="200" font-size="11" font-weight="700" text-anchor="end" fill="#111">Split 7.2x, Category B</text>
  <text x="288" y="214" font-size="9.5" text-anchor="end" fill="#555">16 layer</text>
  <path d="M300,188 H356.0 Q360.0,188 360.0,192 V212 Q360.0,216 356.0,216 H300 Z" fill="#2f5d9e"/>
  <text x="368.0" y="207" font-size="11" font-weight="700" fill="#111">≈ 27</text>
  <line x1="300" y1="66" x2="300" y2="236" stroke="#475569" stroke-width="1.5"/>
  <text x="590" y="274" font-size="10" text-anchor="middle" fill="#555">Gbps</text>
  <text x="480" y="298" font-size="10.5" text-anchor="middle" fill="#333">Split 8 phụ thuộc số anten và không phụ thuộc tải; split 7.2x chỉ gửi PRB có dữ liệu, Category B còn giảm theo số layer.</text>
<text id="wm" x="948.88" y="329.45" text-anchor="end" font-size="13.89" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
