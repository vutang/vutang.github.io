<svg role="img" viewBox="0 0 760 362" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Monostatic and bistatic sensing: where the transmitter, the receiver and the target are, and the trade-off of each mode</title>
  <rect x="0" y="0" width="760" height="340" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9e"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker>
  </defs>

  <!-- Monostatic -->
  <text x="16" y="30" font-size="14" font-weight="700" fill="#2f5d9e">Monostatic: TX and RX at one node</text>
  <rect x="16" y="118" width="136" height="70" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="84" y="147" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2d3d">gNB / TRP</text>
  <text x="84" y="167" font-size="12.5" text-anchor="middle" fill="#2c3a42">TX + RX together</text>
  <circle cx="300" cy="153" r="38" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="300" y="150" font-size="13" font-weight="700" text-anchor="middle" fill="#6e4508">Target</text>
  <text x="300" y="168" font-size="12.5" text-anchor="middle" fill="#2c3a42">RCS σ</text>
  <line x1="152" y1="140" x2="260" y2="144" stroke="#2f5d9e" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="262" y1="164" x2="154" y2="170" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="206" y="126" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f5d9e">Transmitted</text>
  <text x="206" y="194" font-size="12.5" font-weight="700" text-anchor="middle" fill="#6e4508">Echo</text>
  <path d="M84,188 C60,214 108,214 84,188" fill="none" stroke="#c0392b" stroke-width="1.8"/>
  <text x="84" y="232" font-size="12.5" text-anchor="middle" fill="#c0392b">Self-interference</text>
  <text x="84" y="249" font-size="12.5" text-anchor="middle" fill="#c0392b">(TX leaks into RX)</text>
  <text x="186" y="298" font-size="12.5" text-anchor="middle" fill="#1f2d3d">No sync between nodes needed,</text>
  <text x="186" y="316" font-size="12.5" text-anchor="middle" fill="#1f2d3d">but TX and RX run simultaneously</text>

  <line x1="376" y1="20" x2="376" y2="320" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Bistatic -->
  <text x="392" y="30" font-size="14" font-weight="700" fill="#2f5d9e">Bistatic: TX and RX at two nodes</text>
  <rect x="396" y="56" width="120" height="60" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="456" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2d3d">Transmitter</text>
  <text x="456" y="101" font-size="12.5" text-anchor="middle" fill="#2c3a42">gNB or UE</text>
  <circle cx="600" cy="160" r="38" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="600" y="157" font-size="13" font-weight="700" text-anchor="middle" fill="#6e4508">Target</text>
  <text x="600" y="175" font-size="12.5" text-anchor="middle" fill="#2c3a42">RCS σ</text>
  <rect x="624" y="228" width="120" height="60" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="684" y="254" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2d3d">Receiver</text>
  <text x="684" y="273" font-size="12.5" text-anchor="middle" fill="#2c3a42">gNB or UE</text>
  <line x1="516" y1="98" x2="566" y2="136" stroke="#2f5d9e" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="628" y1="188" x2="662" y2="224" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <line x1="430" y1="116" x2="624" y2="270" stroke="#475569" stroke-width="1.8" stroke-dasharray="2 5" stroke-linecap="round"/>
  <text x="540" y="228" font-size="12.5" text-anchor="end" fill="#2c3a42">Direct path (LoS)</text>
  <text x="568" y="304" font-size="12.5" text-anchor="middle" fill="#1f2d3d">No self-interference,</text>
  <text x="568" y="322" font-size="12.5" text-anchor="middle" fill="#1f2d3d">but needs time and phase sync</text>
<text id="wm" x="751.2" y="355.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
