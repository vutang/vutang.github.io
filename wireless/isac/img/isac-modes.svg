<svg role="img" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Sensing monostatic và bistatic: vị trí bộ phát, bộ thu và mục tiêu</title>
  <rect x="0" y="0" width="960" height="360" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9e"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker>
  </defs>

  <!-- Monostatic -->
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">Monostatic: phát và thu cùng một nút</text>
  <rect x="40" y="130" width="130" height="80" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="105" y="165" font-size="13" font-weight="700" text-anchor="middle" fill="#1d4278">gNB / TRP</text>
  <text x="105" y="185" font-size="10.5" text-anchor="middle" fill="#555">TX + RX cùng chỗ</text>
  <circle cx="400" cy="170" r="30" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="400" y="167" font-size="12" font-weight="700" text-anchor="middle" fill="#7b4f10">Mục tiêu</text>
  <text x="400" y="182" font-size="10.5" text-anchor="middle" fill="#555">RCS σ</text>
  <line x1="170" y1="155" x2="368" y2="162" stroke="#2f5d9e" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="370" y1="182" x2="172" y2="190" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="270" y="140" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1d4278">tín hiệu phát</text>
  <text x="270" y="216" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7b4f10">tín hiệu phản xạ (echo)</text>
  <text x="105" y="250" font-size="11" text-anchor="middle" fill="#c0392b">self-interference: TX rò sang RX</text>
  <path d="M105,210 C 75,235 135,235 105,210" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="225" y="320" font-size="11.5" text-anchor="middle" fill="#333">Không cần đồng bộ giữa hai nút, nhưng cần TX/RX đồng thời</text>

  <!-- Bistatic -->
  <text x="520" y="28" font-size="14" font-weight="700" fill="#1d4278">Bistatic: phát và thu ở hai nút khác nhau</text>
  <rect x="540" y="60" width="120" height="70" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="600" y="90" font-size="13" font-weight="700" text-anchor="middle" fill="#1d4278">Bộ phát</text>
  <text x="600" y="110" font-size="10.5" text-anchor="middle" fill="#555">gNB hoặc UE</text>
  <rect x="800" y="210" width="120" height="70" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="860" y="240" font-size="13" font-weight="700" text-anchor="middle" fill="#1d4278">Bộ thu</text>
  <text x="860" y="260" font-size="10.5" text-anchor="middle" fill="#555">gNB hoặc UE</text>
  <circle cx="740" cy="150" r="30" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="740" y="154" font-size="12" font-weight="700" text-anchor="middle" fill="#7b4f10">Mục tiêu</text>
  <line x1="660" y1="100" x2="716" y2="130" stroke="#2f5d9e" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="762" y1="172" x2="810" y2="208" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <line x1="660" y1="125" x2="800" y2="225" stroke="#888" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="640" y="190" font-size="10.5" text-anchor="middle" fill="#666">đường trực tiếp (LoS)</text>
  <text x="720" y="320" font-size="11.5" text-anchor="middle" fill="#333">Không có self-interference, nhưng cần đồng bộ thời gian và pha</text>
</svg>
