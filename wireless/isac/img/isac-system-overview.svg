<svg role="img" viewBox="0 0 760 588" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>ISAC in an urban scene: gNB A senses a drone by its own echo, gNB B receives the echo of gNB A's signal from a car, and a UE receives both downlink data and the echo from a pedestrian, while the sensing processing and its exposure through the 5G Core are still under study</title>
  <rect x="0" y="0" width="760" height="566" rx="8" fill="#ffffff"/>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2f5d9e"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b7791f"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <g id="tower">
      <line x1="-13" y1="0" x2="0" y2="-136" stroke="#2c3a42" stroke-width="2.5"/>
      <line x1="13" y1="0" x2="0" y2="-136" stroke="#2c3a42" stroke-width="2.5"/>
      <line x1="-9" y1="-40" x2="9" y2="-40" stroke="#2c3a42" stroke-width="1.5"/>
      <line x1="-6" y1="-75" x2="6" y2="-75" stroke="#2c3a42" stroke-width="1.5"/>
      <line x1="-9" y1="-40" x2="6" y2="-75" stroke="#2c3a42" stroke-width="1.2"/>
      <line x1="9" y1="-40" x2="-6" y2="-75" stroke="#2c3a42" stroke-width="1.2"/>
      <rect x="-12" y="-152" width="7" height="24" rx="1.5" fill="#2f5d9e"/>
      <rect x="5" y="-152" width="7" height="24" rx="1.5" fill="#2f5d9e"/>
      <rect x="-3.5" y="-156" width="7" height="24" rx="1.5" fill="#1f2d3d"/>
    </g>
  </defs>

  <!-- Ground -->
  <rect x="0" y="440" width="760" height="40" fill="#eaf3e6"/>
  <line x1="0" y1="440" x2="760" y2="440" stroke="#2e7d4f" stroke-width="1.5"/>

  <!-- Backhaul from both gNBs to the sensing processing box -->
  <polyline points="80,440 80,452 672,452 672,292" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round"/>
  <line x1="470" y1="440" x2="470" y2="452" stroke="#475569" stroke-width="4"/>

  <!-- Building (background / clutter) -->
  <rect x="132" y="374" width="56" height="66" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <g fill="#ffffff">
    <rect x="140" y="384" width="10" height="10"/><rect x="155" y="384" width="10" height="10"/><rect x="170" y="384" width="10" height="10"/>
    <rect x="140" y="402" width="10" height="10"/><rect x="155" y="402" width="10" height="10"/><rect x="170" y="402" width="10" height="10"/>
    <rect x="140" y="420" width="10" height="10"/><rect x="170" y="420" width="10" height="10"/>
  </g>

  <!-- Direct path (LoS) between gNB A and gNB B -->
  <line x1="96" y1="296" x2="452" y2="296" stroke="#475569" stroke-width="1.8" stroke-dasharray="2 5" stroke-linecap="round"/>
  <text x="300" y="288" font-size="12.5" text-anchor="middle" fill="#2c3a42">Direct path (LoS)</text>

  <!-- (1) BS monostatic: gNB A to drone and back -->
  <line x1="88" y1="294" x2="240" y2="156" stroke="#b7791f" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <line x1="258" y1="166" x2="104" y2="304" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr-orange)"/>

  <!-- (2) BS-BS bistatic: gNB A illuminates the car, gNB B receives the echo -->
  <line x1="92" y1="312" x2="284" y2="414" stroke="#b7791f" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <line x1="316" y1="414" x2="460" y2="314" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr-orange)"/>

  <!-- (3) BS-UE bistatic: gNB B serves the UE, the same signal reflects off a pedestrian to the UE -->
  <line x1="478" y1="312" x2="546" y2="404" stroke="#2f5d9e" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="465" y1="314" x2="428" y2="390" stroke="#b7791f" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <line x1="436" y1="408" x2="536" y2="418" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr-orange)"/>

  <!-- Mode badges -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="146" cy="226" r="11" fill="#ffffff" stroke="#6e4508" stroke-width="1.5"/>
    <text x="146" y="231" fill="#6e4508">1</text>
    <circle cx="300" cy="372" r="11" fill="#ffffff" stroke="#6e4508" stroke-width="1.5"/>
    <text x="300" y="377" fill="#6e4508">2</text>
    <circle cx="506" cy="386" r="11" fill="#ffffff" stroke="#6e4508" stroke-width="1.5"/>
    <text x="506" y="391" fill="#6e4508">3</text>
  </g>

  <!-- gNB towers -->
  <use href="#tower" x="80" y="440"/>
  <text x="80" y="272" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2d3d">gNB A</text>
  <use href="#tower" x="470" y="440"/>
  <text x="470" y="272" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2d3d">gNB B</text>

  <!-- Drone -->
  <g transform="translate(252,158)">
    <line x1="-18" y1="-6" x2="18" y2="-6" stroke="#2c3a42" stroke-width="2"/>
    <ellipse cx="-18" cy="-8" rx="9" ry="2.5" fill="#2c3a42"/>
    <ellipse cx="18" cy="-8" rx="9" ry="2.5" fill="#2c3a42"/>
    <rect x="-9" y="-6" width="18" height="9" rx="2" fill="#2c3a42"/>
    <line x1="-5" y1="3" x2="-8" y2="8" stroke="#2c3a42" stroke-width="1.5"/>
    <line x1="5" y1="3" x2="8" y2="8" stroke="#2c3a42" stroke-width="1.5"/>
  </g>
  <text x="252" y="134" font-size="12.5" text-anchor="middle" fill="#1f2d3d">Drone (UAV)</text>

  <!-- Car -->
  <g transform="translate(300,440)">
    <path d="M-12,-14 L9,-14 L15,-8 L-17,-8 Z" fill="#a23b72"/>
    <rect x="-21" y="-9" width="42" height="7" rx="2" fill="#a23b72"/>
    <circle cx="-12" cy="-2" r="3.6" fill="#1f2d3d"/>
    <circle cx="12" cy="-2" r="3.6" fill="#1f2d3d"/>
  </g>

  <!-- Pedestrian -->
  <g transform="translate(428,440)" stroke="#2c3a42" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="0" cy="-34" r="4.5" fill="#2c3a42" stroke="none"/>
    <line x1="0" y1="-28" x2="0" y2="-14"/>
    <line x1="0" y1="-14" x2="-6" y2="-1"/>
    <line x1="0" y1="-14" x2="6" y2="-1"/>
    <line x1="0" y1="-25" x2="-7" y2="-17"/>
    <line x1="0" y1="-25" x2="7" y2="-18"/>
  </g>

  <!-- UE (smartphone) -->
  <g transform="translate(552,440)">
    <rect x="-7" y="-22" width="14" height="22" rx="2.5" fill="#1f2d3d"/>
    <rect x="-5" y="-19" width="10" height="14" fill="#e8eef8"/>
  </g>

  <!-- Ground labels -->
  <g font-size="12.5" text-anchor="middle" fill="#1f2d3d">
    <text x="160" y="472">Building (clutter)</text>
    <text x="300" y="472">Car</text>
    <text x="428" y="472">Pedestrian</text>
    <text x="552" y="472">UE</text>
  </g>

  <!-- Core side: applications, 5GC exposure, sensing processing -->
  <rect x="592" y="24" width="160" height="58" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="672" y="48" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2d3d">Applications</text>
  <text x="672" y="67" font-size="12.5" text-anchor="middle" fill="#2c3a42">UAV, traffic, health</text>

  <line x1="672" y1="122" x2="672" y2="86" stroke="#475569" stroke-width="2.5" marker-end="url(#arr-gray)"/>
  <text x="680" y="108" font-size="12.5" fill="#2c3a42">results</text>

  <rect x="592" y="124" width="160" height="62" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="672" y="149" font-size="13" font-weight="700" text-anchor="middle" fill="#6e4508">5G Core (5GC)</text>
  <text x="672" y="168" font-size="12.5" text-anchor="middle" fill="#6e4508">sensing exposure</text>

  <line x1="672" y1="226" x2="672" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <rect x="592" y="228" width="160" height="62" rx="8" fill="#e3f1e8" stroke="#2e7d4f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="672" y="253" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2d3d">Sensing processing</text>
  <text x="672" y="272" font-size="12.5" text-anchor="middle" fill="#2c3a42">placement under study</text>

  <!-- Legend -->
  <rect x="16" y="494" width="728" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <g font-size="12.5" fill="#1f2d3d">
    <line x1="30" y1="514" x2="58" y2="514" stroke="#2f5d9e" stroke-width="2.5" marker-end="url(#arr-blue)"/>
    <text x="66" y="519">Communication (DL)</text>
    <line x1="222" y1="514" x2="250" y2="514" stroke="#b7791f" stroke-width="2.5" marker-end="url(#arr-orange)"/>
    <text x="258" y="519">Sensing signal</text>
    <line x1="380" y1="514" x2="408" y2="514" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr-orange)"/>
    <text x="416" y="519">Echo</text>
    <line x1="472" y1="514" x2="500" y2="514" stroke="#475569" stroke-width="1.8" stroke-dasharray="2 5" stroke-linecap="round"/>
    <text x="508" y="519">Direct path</text>
    <line x1="612" y1="514" x2="640" y2="514" stroke="#475569" stroke-width="4"/>
    <text x="648" y="519">Backhaul</text>

    <text x="30" y="544"><tspan font-weight="700" fill="#6e4508">1</tspan> BS monostatic</text>
    <text x="172" y="544"><tspan font-weight="700" fill="#6e4508">2</tspan> BS–BS bistatic</text>
    <text x="326" y="544"><tspan font-weight="700" fill="#6e4508">3</tspan> BS–UE bistatic</text>
    <rect x="482" y="533" width="26" height="14" rx="3" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="516" y="544">Dashed box: under study</text>
  </g>
<text id="wm" x="751.2" y="581.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
