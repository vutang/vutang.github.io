<svg role="img" viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>So sánh NTN transparent payload và regenerative payload: vị trí của gNB so với vệ tinh</title>
  <rect x="0" y="0" width="960" height="400" rx="8" fill="#ffffff"/>

  <!-- Row 1: transparent -->
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">Transparent payload (bent-pipe, Rel-17/18)</text>
  <rect x="30" y="60" width="110" height="60" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="85" y="95" font-size="13" font-weight="700" text-anchor="middle" fill="#1d4278">UE</text>
  <rect x="380" y="60" width="200" height="60" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="480" y="87" font-size="13" font-weight="700" text-anchor="middle" fill="#7b4f10">Vệ tinh</text>
  <text x="480" y="106" font-size="10.5" text-anchor="middle" fill="#555">khuếch đại + đổi tần</text>
  <rect x="820" y="60" width="120" height="60" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="880" y="85" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">NTN gateway</text>
  <text x="880" y="104" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">+ gNB</text>
  <line x1="140" y1="90" x2="380" y2="90" stroke="#2f5d9e" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="580" y1="90" x2="820" y2="90" stroke="#2f5d9e" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="260" y="80" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1d4278">service link (NR-Uu)</text>
  <text x="700" y="80" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1d4278">feeder link (NR-Uu)</text>
  <text x="480" y="150" font-size="11" text-anchor="middle" fill="#555">Toàn bộ gNB ở dưới đất. RTT gồm cả service link và feeder link.</text>

  <line x1="20" y1="185" x2="940" y2="185" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Row 2: regenerative -->
  <text x="20" y="215" font-size="14" font-weight="700" fill="#1d4278">Regenerative payload (Rel-19)</text>
  <rect x="30" y="250" width="110" height="60" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="85" y="285" font-size="13" font-weight="700" text-anchor="middle" fill="#1d4278">UE</text>
  <rect x="380" y="240" width="200" height="80" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="480" y="268" font-size="13" font-weight="700" text-anchor="middle" fill="#7b4f10">Vệ tinh + gNB</text>
  <text x="480" y="287" font-size="10.5" text-anchor="middle" fill="#555">xử lý on-board (gNB hoặc gNB-DU)</text>
  <text x="480" y="303" font-size="10.5" text-anchor="middle" fill="#555">inter-satellite link, store-and-forward</text>
  <rect x="820" y="250" width="120" height="60" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="880" y="275" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">NTN gateway</text>
  <text x="880" y="294" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">+ 5GC</text>
  <line x1="140" y1="280" x2="380" y2="280" stroke="#2f5d9e" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="580" y1="280" x2="820" y2="280" stroke="#475569" stroke-width="4"/>
  <text x="260" y="270" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1d4278">service link (NR-Uu)</text>
  <text x="700" y="270" font-size="10.5" font-weight="700" text-anchor="middle" fill="#475569">feeder link (NG, hoặc F1 nếu tách DU)</text>
  <text x="480" y="350" font-size="11" text-anchor="middle" fill="#555">NR-Uu kết thúc ngay trên vệ tinh, vòng HARQ và RRC chỉ qua service link.</text>
  <text x="480" y="368" font-size="11" text-anchor="middle" fill="#555">Feeder link trở thành backhaul (hoặc midhaul) qua không gian.</text>
</svg>
