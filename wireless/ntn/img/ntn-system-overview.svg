<svg role="img" viewBox="0 0 760 574" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>An NTN system with a LEO satellite: UEs on land, at sea and in the air reach the satellite over the service link, the satellite relays to an NTN gateway and gNB on the ground over the feeder link, and the gNB connects to the 5G Core</title>
  <rect x="0" y="0" width="760" height="552" rx="8" fill="#ffffff"/>

  <defs>
    <clipPath id="earth">
      <path d="M0,470 Q380,430 760,470 L760,552 L0,552 Z"/>
    </clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2c3a42"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <g id="sat">
      <rect x="-30" y="-6" width="20" height="12" fill="#2f5d9e" stroke="#1f2d3d" stroke-width="1"/>
      <line x1="-20" y1="-6" x2="-20" y2="6" stroke="#e8eef8" stroke-width="1"/>
      <rect x="10" y="-6" width="20" height="12" fill="#2f5d9e" stroke="#1f2d3d" stroke-width="1"/>
      <line x1="20" y1="-6" x2="20" y2="6" stroke="#e8eef8" stroke-width="1"/>
      <rect x="-9" y="-10" width="18" height="20" rx="2" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
      <path d="M-5,10 L5,10 L0,16 Z" fill="#b7791f"/>
    </g>
  </defs>

  <!-- Altitude axis (not to scale) -->
  <text x="14" y="24" font-size="12.5" font-weight="700" fill="#2c3a42">Altitude (not to scale)</text>
  <line x1="22" y1="448" x2="22" y2="40" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="17" y1="62" x2="27" y2="62" stroke="#475569" stroke-width="1.5"/>
  <text x="32" y="58" font-size="13" font-weight="700" fill="#1f2d3d">GEO</text>
  <text x="32" y="74" font-size="12.5" fill="#2c3a42">35,786 km</text>
  <line x1="17" y1="112" x2="27" y2="112" stroke="#475569" stroke-width="1.5"/>
  <text x="32" y="108" font-size="13" font-weight="700" fill="#1f2d3d">MEO</text>
  <text x="32" y="124" font-size="12.5" fill="#2c3a42">8,000–20,000 km</text>
  <line x1="17" y1="160" x2="27" y2="160" stroke="#475569" stroke-width="1.5"/>
  <text x="32" y="156" font-size="13" font-weight="700" fill="#1f2d3d">LEO</text>
  <text x="32" y="172" font-size="12.5" fill="#2c3a42">500–1,200 km</text>
  <line x1="17" y1="360" x2="27" y2="360" stroke="#475569" stroke-width="1.5"/>
  <text x="32" y="356" font-size="13" font-weight="700" fill="#1f2d3d">HAPS</text>
  <text x="32" y="372" font-size="12.5" fill="#2c3a42">~20 km</text>

  <!-- Earth: land and ocean -->
  <path d="M0,470 Q380,430 760,470 L760,552 L0,552 Z" fill="#eaf3e6"/>
  <rect x="0" y="420" width="238" height="140" fill="#dceaf7" clip-path="url(#earth)"/>
  <path d="M0,470 Q380,430 760,470" fill="none" stroke="#2e7d4f" stroke-width="1.5"/>

  <!-- LEO orbit with direction of motion -->
  <path d="M120,215 Q340,105 560,215" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
  <text x="560" y="242" font-size="12.5" text-anchor="middle" fill="#2c3a42">Satellite motion</text>

  <!-- Beam cone and footprints of the serving satellite -->
  <polygon points="340,172 140,462 525,458" fill="#2f5d9e" fill-opacity="0.07" stroke="#2f5d9e" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 4"/>
  <ellipse cx="190" cy="460" rx="46" ry="11" fill="#2f5d9e" fill-opacity="0.2" stroke="#2f5d9e" stroke-width="1.2"/>
  <ellipse cx="285" cy="456" rx="46" ry="11" fill="#2f5d9e" fill-opacity="0.2" stroke="#2f5d9e" stroke-width="1.2"/>
  <ellipse cx="380" cy="455" rx="46" ry="11" fill="#2f5d9e" fill-opacity="0.2" stroke="#2f5d9e" stroke-width="1.2"/>
  <ellipse cx="475" cy="456" rx="46" ry="11" fill="#2f5d9e" fill-opacity="0.2" stroke="#2f5d9e" stroke-width="1.2"/>

  <!-- Service links (serving satellite to UEs) -->
  <g stroke="#2f5d9e" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <line x1="340" y1="176" x2="192" y2="436"/>
    <line x1="340" y1="176" x2="285" y2="428"/>
    <line x1="340" y1="176" x2="380" y2="420"/>
    <line x1="340" y1="176" x2="472" y2="434"/>
    <line x1="340" y1="176" x2="424" y2="378"/>
  </g>
  <text x="256" y="304" font-size="13" font-weight="700" text-anchor="end" fill="#2f5d9e">Service link</text>

  <!-- Feeder link (serving satellite to NTN gateway) -->
  <line x1="352" y1="168" x2="652" y2="426" stroke="#2f5d9e" stroke-width="3"/>
  <text x="470" y="262" font-size="13" font-weight="700" fill="#2f5d9e">Feeder link</text>

  <!-- Satellites -->
  <g opacity="0.5"><use href="#sat" x="186" y="187"/></g>
  <text x="186" y="164" font-size="12.5" text-anchor="middle" fill="#2c3a42">Next satellite</text>
  <use href="#sat" x="340" y="160"/>
  <text x="340" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2d3d">Serving satellite</text>
  <text x="340" y="135" font-size="12.5" text-anchor="middle" fill="#2c3a42">(transparent payload)</text>

  <!-- UE: ship -->
  <g transform="translate(190,456)">
    <path d="M-22,-9 L22,-9 L15,0 L-15,0 Z" fill="#2c3a42"/>
    <rect x="-9" y="-18" width="15" height="9" fill="#ffffff" stroke="#2c3a42" stroke-width="1.5"/>
    <line x1="10" y1="-9" x2="10" y2="-22" stroke="#2c3a42" stroke-width="1.5"/>
  </g>
  <text x="190" y="486" font-size="12.5" text-anchor="middle" fill="#1f2d3d">Ship</text>

  <!-- UE: smartphone -->
  <g transform="translate(285,451)">
    <rect x="-7" y="-22" width="14" height="22" rx="2.5" fill="#1f2d3d"/>
    <rect x="-5" y="-19" width="10" height="14" fill="#e8eef8"/>
  </g>
  <text x="285" y="486" font-size="12.5" text-anchor="middle" fill="#1f2d3d">Smartphone</text>

  <!-- UE: IoT sensor -->
  <g transform="translate(380,450)">
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#2c3a42" stroke-width="2"/>
    <rect x="-9" y="-26" width="18" height="14" rx="2" fill="#2e7d4f"/>
    <line x1="5" y1="-26" x2="5" y2="-32" stroke="#2c3a42" stroke-width="1.5"/>
    <circle cx="-3" cy="-19" r="2.5" fill="#ffffff"/>
  </g>
  <text x="380" y="486" font-size="12.5" text-anchor="middle" fill="#1f2d3d">IoT sensor</text>

  <!-- UE: vehicle -->
  <g transform="translate(475,451)">
    <path d="M-10,-12 L8,-12 L13,-7 L-14,-7 Z" fill="#a23b72"/>
    <rect x="-18" y="-8" width="36" height="6" rx="2" fill="#a23b72"/>
    <circle cx="-10" cy="-2" r="3.2" fill="#1f2d3d"/>
    <circle cx="10" cy="-2" r="3.2" fill="#1f2d3d"/>
  </g>
  <text x="475" y="486" font-size="12.5" text-anchor="middle" fill="#1f2d3d">Vehicle</text>

  <!-- UE: aircraft -->
  <g transform="translate(428,388)">
    <ellipse cx="0" cy="0" rx="20" ry="4" fill="#2c3a42"/>
    <path d="M-2,0 L-10,10 L-5,10 L6,0 Z" fill="#2c3a42"/>
    <path d="M-2,0 L-8,-8 L-4,-8 L5,0 Z" fill="#2c3a42"/>
    <path d="M-14,-1 L-20,-9 L-17,-9 L-10,-1 Z" fill="#2c3a42"/>
  </g>
  <text x="454" y="392" font-size="12.5" fill="#1f2d3d">Aircraft</text>

  <!-- Ground segment and core network -->
  <rect x="575" y="24" width="175" height="60" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="662" y="49" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2d3d">Data network (DN)</text>
  <text x="662" y="68" font-size="12.5" text-anchor="middle" fill="#2c3a42">Internet</text>

  <line x1="662" y1="86" x2="662" y2="118" stroke="#475569" stroke-width="4"/>
  <text x="672" y="107" font-size="12.5" font-weight="700" fill="#2c3a42">N6</text>

  <rect x="575" y="120" width="175" height="90" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="662" y="144" font-size="14" font-weight="700" text-anchor="middle" fill="#6e4508">5G Core (5GC)</text>
  <rect x="586" y="164" width="46" height="26" rx="5" fill="#ffffff" stroke="#b7791f" stroke-width="1.2"/>
  <text x="609" y="182" font-size="12.5" font-weight="700" text-anchor="middle" fill="#6e4508">AMF</text>
  <rect x="639" y="164" width="46" height="26" rx="5" fill="#ffffff" stroke="#b7791f" stroke-width="1.2"/>
  <text x="662" y="182" font-size="12.5" font-weight="700" text-anchor="middle" fill="#6e4508">SMF</text>
  <rect x="692" y="164" width="46" height="26" rx="5" fill="#ffffff" stroke="#b7791f" stroke-width="1.2"/>
  <text x="715" y="182" font-size="12.5" font-weight="700" text-anchor="middle" fill="#6e4508">UPF</text>

  <line x1="662" y1="212" x2="662" y2="282" stroke="#475569" stroke-width="4"/>
  <text x="672" y="252" font-size="12.5" font-weight="700" fill="#2c3a42">NG</text>

  <rect x="595" y="284" width="135" height="52" rx="8" fill="#e3f1e8" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="662" y="306" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">gNB</text>
  <text x="662" y="325" font-size="12.5" text-anchor="middle" fill="#2c3a42">(ground site)</text>

  <line x1="662" y1="338" x2="662" y2="420" stroke="#475569" stroke-width="4"/>

  <!-- NTN gateway dish -->
  <g transform="translate(662,0)">
    <path d="M-11,464 L11,464 L6,454 L-6,454 Z" fill="#2c3a42"/>
    <line x1="0" y1="454" x2="0" y2="436" stroke="#2c3a42" stroke-width="3"/>
    <g transform="translate(0,434) rotate(-40)">
      <path d="M-22,0 A22,11 0 0 0 22,0 Z" fill="#e8eef8" stroke="#2c3a42" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="-15" stroke="#2c3a42" stroke-width="1.5"/>
      <circle cx="0" cy="-16" r="2.5" fill="#2c3a42"/>
    </g>
  </g>
  <text x="662" y="486" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2d3d">NTN gateway</text>

  <!-- Legend -->
  <rect x="16" y="500" width="728" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="32" y1="520" x2="60" y2="520" stroke="#2f5d9e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="68" y="525" font-size="12.5" fill="#1f2d3d">Service link (NR-Uu)</text>
  <line x1="240" y1="520" x2="268" y2="520" stroke="#2f5d9e" stroke-width="3"/>
  <text x="276" y="525" font-size="12.5" fill="#1f2d3d">Feeder link</text>
  <line x1="382" y1="520" x2="410" y2="520" stroke="#475569" stroke-width="4"/>
  <text x="418" y="525" font-size="12.5" fill="#1f2d3d">NG, N6 (terrestrial)</text>
  <ellipse cx="604" cy="520" rx="14" ry="6" fill="#2f5d9e" fill-opacity="0.2" stroke="#2f5d9e" stroke-width="1.2"/>
  <text x="626" y="525" font-size="12.5" fill="#1f2d3d">Beam footprint</text>
<text id="wm" x="751.2" y="567.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
