<svg role="img" viewBox="0 0 760 282" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Kiến trúc IPMI: ipmitool trên máy quản lý nói chuyện với BMC qua RMCP+ trên UDP 623; BMC chứa SDR, SEL, FRU, watchdog, PEF, chassis control; BMC giao tiếp với host OS qua KCS, BT, SSIF và với controller vệ tinh qua IPMB</title>
  <rect x="0" y="0" width="760" height="260" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect x="20" y="100" width="130" height="60" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="85.0" y="126.5" font-size="12" font-weight="700" text-anchor="middle" fill="#333333">ipmitool</text>
  <text x="85.0" y="142.5" font-size="11" text-anchor="middle" fill="#222">Máy quản lý</text>
  <rect x="250" y="8" width="260" height="244" rx="10" fill="#f1eafb" fill-opacity="0.45" stroke="#6a3fb0" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="260" y="24" font-size="11" font-weight="700" fill="#44287a">BMC</text>
  <rect x="265" y="36" width="230" height="42" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="380.0" y="61.3" font-size="10.5" text-anchor="middle" fill="#222">SDR (danh sách sensor)</text>
  <rect x="265" y="88" width="230" height="42" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="380.0" y="113.3" font-size="10.5" text-anchor="middle" fill="#222">SEL (log sự kiện)</text>
  <rect x="265" y="140" width="230" height="42" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="380.0" y="165.3" font-size="10.5" text-anchor="middle" fill="#222">FRU (inventory)</text>
  <rect x="265" y="192" width="230" height="42" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="380.0" y="217.3" font-size="10.5" text-anchor="middle" fill="#222">Watchdog, PEF, chassis control</text>
  <line x1="150" y1="130" x2="250" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="200" y="120" font-size="10" text-anchor="middle" fill="#444">RMCP+ (UDP 623)</text>
  <rect x="600" y="50" width="150" height="60" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="675.0" y="76.5" font-size="12" font-weight="700" text-anchor="middle" fill="#1b5e20">Host OS</text>
  <text x="675.0" y="92.5" font-size="11" text-anchor="middle" fill="#222">ipmi_si</text>
  <rect x="600" y="150" width="150" height="60" rx="8" fill="#fdf0e2" stroke="#c46a12" stroke-width="1.5"/>
  <text x="675.0" y="184.5" font-size="11" font-weight="700" text-anchor="middle" fill="#7a3f06">Controller vệ tinh</text>
  <line x1="510" y1="80" x2="600" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="555" y="70" font-size="10" text-anchor="middle" fill="#444">KCS / BT / SSIF</text>
  <line x1="510" y1="180" x2="600" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="555" y="170" font-size="10" text-anchor="middle" fill="#444">IPMB (I2C)</text>
<text id="wm" x="751.2" y="275.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
