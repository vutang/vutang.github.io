<svg role="img" viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Accumulated time error during holdover for a constant frequency offset</title>
  <rect x="0" y="0" width="960" height="400" rx="8" fill="#ffffff"/>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">Holdover: time error = frequency offset × elapsed time (log-log)</text>
  <text x="24" y="200" font-size="10.5" fill="#555" transform="rotate(-90 24 200)" text-anchor="middle">Accumulated time error</text>
    <line x1="100.0" y1="60" x2="100.0" y2="330" stroke="#eef2f6"/>
  <line x1="230.0" y1="60" x2="230.0" y2="330" stroke="#eef2f6"/>
  <line x1="360.0" y1="60" x2="360.0" y2="330" stroke="#eef2f6"/>
  <line x1="490.0" y1="60" x2="490.0" y2="330" stroke="#eef2f6"/>
  <line x1="620.0" y1="60" x2="620.0" y2="330" stroke="#eef2f6"/>
  <line x1="750.0" y1="60" x2="750.0" y2="330" stroke="#eef2f6"/>
  <line x1="880.0" y1="60" x2="880.0" y2="330" stroke="#eef2f6"/>
  <text x="100.0" y="348" font-size="10" text-anchor="middle" fill="#555">1 s</text>
  <text x="230.0" y="348" font-size="10" text-anchor="middle" fill="#555">10 s</text>
  <text x="360.0" y="348" font-size="10" text-anchor="middle" fill="#555">100 s</text>
  <text x="490.0" y="348" font-size="10" text-anchor="middle" fill="#555">17 min</text>
  <text x="620.0" y="348" font-size="10" text-anchor="middle" fill="#555">2.8 h</text>
  <text x="750.0" y="348" font-size="10" text-anchor="middle" fill="#555">28 h</text>
  <text x="880.0" y="348" font-size="10" text-anchor="middle" fill="#555">11.6 d</text>
  <line x1="100" y1="330.0" x2="880" y2="330.0" stroke="#eef2f6"/>
  <text x="92" y="334.0" font-size="10" text-anchor="end" fill="#555">1 ns</text>
  <line x1="100" y1="300.0" x2="880" y2="300.0" stroke="#eef2f6"/>
  <line x1="100" y1="270.0" x2="880" y2="270.0" stroke="#eef2f6"/>
  <line x1="100" y1="240.0" x2="880" y2="240.0" stroke="#eef2f6"/>
  <text x="92" y="244.0" font-size="10" text-anchor="end" fill="#555">1 µs</text>
  <line x1="100" y1="210.0" x2="880" y2="210.0" stroke="#eef2f6"/>
  <line x1="100" y1="180.0" x2="880" y2="180.0" stroke="#eef2f6"/>
  <line x1="100" y1="150.0" x2="880" y2="150.0" stroke="#eef2f6"/>
  <text x="92" y="154.0" font-size="10" text-anchor="end" fill="#555">1 ms</text>
  <line x1="100" y1="120.0" x2="880" y2="120.0" stroke="#eef2f6"/>
  <line x1="100" y1="90.0" x2="880" y2="90.0" stroke="#eef2f6"/>
  <line x1="100" y1="60.0" x2="880" y2="60.0" stroke="#eef2f6"/>
  <text x="92" y="64.0" font-size="10" text-anchor="end" fill="#555">1 s</text>
  <clipPath id="c"><rect x="100" y="60" width="780" height="270"/></clipPath>
  <line x1="100.0" y1="240.0" x2="880.0" y2="60.0" stroke="#c0392b" stroke-width="2.2" clip-path="url(#c)"/>
  <line x1="100.0" y1="270.0" x2="880.0" y2="90.0" stroke="#b9770e" stroke-width="2.2" clip-path="url(#c)"/>
  <line x1="100.0" y1="330.0" x2="880.0" y2="150.0" stroke="#2f5d9e" stroke-width="2.2" clip-path="url(#c)"/>
  <line x1="100.0" y1="390.0" x2="880.0" y2="210.0" stroke="#1b7f5c" stroke-width="2.2" clip-path="url(#c)"/>
  <line x1="100" y1="234.7" x2="880" y2="234.7" stroke="#333" stroke-dasharray="6 4"/>
  <text x="640" y="228.7" font-size="10.5" fill="#333">±1.5 µs (TDD budget)</text>
  <circle cx="122.9" cy="234.7" r="4" fill="#c0392b"/>
  <circle cx="252.9" cy="234.7" r="4" fill="#b9770e"/>
  <circle cx="512.9" cy="234.7" r="4" fill="#2f5d9e"/>
  <circle cx="772.9" cy="234.7" r="4" fill="#1b7f5c"/>
  <text x="490.0" y="368" font-size="10.5" text-anchor="middle" fill="#555">Time since reference lost. Constant offset only; aging and temperature make real error grow faster.</text>
  <rect x="112" y="70" width="190" height="88" rx="4" fill="#ffffff" stroke="#cbd5e1"/><line x1="122" y1="84" x2="146" y2="84" stroke="#c0392b" stroke-width="2.2"/><text x="154" y="88" font-size="11" fill="#333">XO, offset 1 ppm</text><line x1="122" y1="102" x2="146" y2="102" stroke="#b9770e" stroke-width="2.2"/><text x="154" y="106" font-size="11" fill="#333">TCXO, 0.1 ppm</text><line x1="122" y1="120" x2="146" y2="120" stroke="#2f5d9e" stroke-width="2.2"/><text x="154" y="124" font-size="11" fill="#333">OCXO, 1 ppb</text><line x1="122" y1="138" x2="146" y2="138" stroke="#1b7f5c" stroke-width="2.2"/><text x="154" y="142" font-size="11" fill="#333">Rubidium, 0.01 ppb</text>
</svg>
