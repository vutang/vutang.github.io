<svg role="img" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Quartz crystal equivalent circuit and Pierce oscillator with load capacitors</title>
  <rect x="0" y="0" width="960" height="360" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">Crystal model (left) and Pierce oscillator in an MCU/SoC (right)</text>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="40" y1="180" x2="80" y2="180"/><line x1="380" y1="180" x2="420" y2="180"/>
    <line x1="80" y1="120" x2="80" y2="240"/><line x1="380" y1="120" x2="380" y2="240"/>
    <line x1="80" y1="120" x2="140" y2="120"/>
    <rect x="140" y="110" width="44" height="20" fill="#ffffff"/>
    <line x1="184" y1="120" x2="206" y2="120"/>
    <path d="M206,120 c5,-14 12,-14 14,0 c5,-14 12,-14 14,0 c5,-14 12,-14 14,0 c5,-14 12,-14 14,0"/>
    <line x1="262" y1="120" x2="300" y2="120"/>
    <line x1="300" y1="106" x2="300" y2="134"/><line x1="310" y1="106" x2="310" y2="134"/>
    <line x1="310" y1="120" x2="380" y2="120"/>
    <line x1="80" y1="240" x2="225" y2="240"/><line x1="225" y1="226" x2="225" y2="254"/><line x1="235" y1="226" x2="235" y2="254"/><line x1="235" y1="240" x2="380" y2="240"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="162" y="100">R1</text><text x="234" y="100">L1</text><text x="305" y="100">C1</text><text x="230" y="276">C0</text>
  </g>
  <text x="230" y="150" font-size="10.5" text-anchor="middle" fill="#555">motional arm: mechanical resonance</text>
  <text x="230" y="300" font-size="10.5" text-anchor="middle" fill="#555">C0: electrode and holder capacitance</text>
  <text x="230" y="326" font-size="10.5" text-anchor="middle" fill="#555">Very high Q, so the frequency is set by the crystal</text>
  <line x1="480" y1="50" x2="480" y2="340" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M640,90 L640,140 L690,115 Z" fill="#e2e8f0"/><circle cx="694" cy="115" r="4" fill="#ffffff"/>
    <line x1="560" y1="115" x2="640" y2="115"/><line x1="698" y1="115" x2="800" y2="115"/>
    <line x1="560" y1="115" x2="560" y2="60"/><line x1="800" y1="115" x2="800" y2="60"/>
    <line x1="560" y1="60" x2="650" y2="60"/><rect x="650" y="52" width="40" height="16" fill="#ffffff"/><line x1="690" y1="60" x2="800" y2="60"/>
    <line x1="560" y1="115" x2="560" y2="210"/><line x1="800" y1="115" x2="800" y2="210"/>
    <line x1="560" y1="210" x2="652" y2="210"/>
    <rect x="652" y="196" width="36" height="28" rx="3" fill="#2f5d9e" stroke="#2f5d9e"/>
    <line x1="646" y1="196" x2="646" y2="224"/><line x1="694" y1="196" x2="694" y2="224"/>
    <line x1="688" y1="210" x2="800" y2="210"/>
    <line x1="560" y1="210" x2="560" y2="250"/><line x1="546" y1="250" x2="574" y2="250"/><line x1="546" y1="260" x2="574" y2="260"/><line x1="560" y1="260" x2="560" y2="290"/>
    <line x1="800" y1="210" x2="800" y2="250"/><line x1="786" y1="250" x2="814" y2="250"/><line x1="786" y1="260" x2="814" y2="260"/><line x1="800" y1="260" x2="800" y2="290"/>
    <line x1="545" y1="290" x2="815" y2="290"/>
  </g>
  <g font-size="12" fill="#333">
    <text x="670" y="46" text-anchor="middle">Rf</text><text x="670" y="248" text-anchor="middle" font-weight="700" fill="#2f5d9e">XTAL</text>
    <text x="530" y="260" text-anchor="end">CL1</text><text x="830" y="260">CL2</text>
    <text x="548" y="132" text-anchor="end">OSC_IN</text><text x="812" y="132">OSC_OUT</text>
  </g>
  <rect x="610" y="78" width="120" height="78" rx="6" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="670" y="172" font-size="10" text-anchor="middle" fill="#555">inside the MCU/SoC</text>
  <text x="680" y="318" font-size="10.5" text-anchor="middle" fill="#555">CL = CL1·CL2 / (CL1 + CL2) + Cstray must match the CL in the crystal datasheet</text>
</svg>
