<svg role="img" viewBox="0 0 960 330" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>PLL block diagram: phase frequency detector, charge pump, loop filter, VCO, feedback divider and output dividers</title>
  <rect x="0" y="0" width="960" height="330" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">PLL in a clock synthesizer: f_VCO = f_REF / R × N, f_OUTk = f_VCO / Mk</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <g fill="#e8f0fb" stroke="#1d4278" stroke-width="1.5">
      <rect x="110" y="80" width="80" height="50" rx="6"/>
      <rect x="230" y="80" width="90" height="50" rx="6"/>
      <rect x="360" y="80" width="90" height="50" rx="6"/>
      <rect x="490" y="80" width="90" height="50" rx="6"/>
      <rect x="620" y="80" width="90" height="50" rx="6"/>
      <rect x="360" y="190" width="160" height="50" rx="6"/>
      <rect x="780" y="60" width="90" height="36" rx="6"/>
      <rect x="780" y="110" width="90" height="36" rx="6"/>
      <rect x="780" y="170" width="90" height="36" rx="6"/>
    </g>
    <text x="150" y="102">÷R</text><text x="150" y="118" font-size="10">input divider</text>
    <text x="275" y="102">PFD</text><text x="275" y="118" font-size="10">phase/freq det.</text>
    <text x="405" y="102">Charge</text><text x="405" y="118">pump</text>
    <text x="535" y="102">Loop</text><text x="535" y="118">filter</text>
    <text x="665" y="102">VCO</text><text x="665" y="118" font-size="10">GHz range</text>
    <text x="440" y="212">÷N (feedback)</text><text x="440" y="228" font-size="10">integer-N or fractional-N</text>
    <text x="825" y="83">÷M0</text><text x="825" y="133">÷M1</text><text x="825" y="193">÷Mk</text>
    <text x="825" y="160" font-size="14">⋮</text>
    <text x="55" y="100">f_REF</text><text x="55" y="116" font-size="10">XO/TCXO/OCXO</text>
    <text x="915" y="83">OUT0</text><text x="915" y="133">OUT1</text><text x="915" y="193">OUTk</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="90" y1="105" x2="108" y2="105"/>
    <line x1="190" y1="105" x2="228" y2="105"/>
    <line x1="320" y1="105" x2="358" y2="105"/>
    <line x1="450" y1="105" x2="488" y2="105"/>
    <line x1="580" y1="105" x2="618" y2="105"/>
    <polyline points="710,105 740,105 740,215 522,215"/>
    <polyline points="360,215 275,215 275,132"/>
    <polyline points="740,78 778,78"/>
    <polyline points="740,128 778,128"/>
    <polyline points="740,188 778,188"/>
    <line x1="870" y1="78" x2="890" y2="78"/><line x1="870" y1="128" x2="890" y2="128"/><line x1="870" y1="188" x2="890" y2="188"/>
  </g>
  <line x1="740" y1="78" x2="740" y2="188" stroke="#333" stroke-width="1.5"/>
  <text x="480" y="290" font-size="11.5" fill="#555" text-anchor="middle">Loop bandwidth (set mainly by the loop filter) decides which noise wins: below it the output follows the reference, above it the output follows the VCO.</text>
</svg>
