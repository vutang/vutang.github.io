<svg role="img" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Example board clock tree: reference oscillator, network synchronizer, jitter cleaner and fanout buffer feeding SoC, FPGA, PHY and data converters</title>
  <rect x="0" y="0" width="960" height="360" rx="8" fill="#ffffff"/>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">Example clock tree on a radio / timing board</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <g stroke-width="1.5">
      <rect x="30" y="70" width="140" height="50" rx="6" fill="#fff4e5" stroke="#b26a00"/>
      <rect x="30" y="200" width="140" height="50" rx="6" fill="#fff4e5" stroke="#b26a00"/>
      <rect x="230" y="120" width="170" height="80" rx="6" fill="#e8f0fb" stroke="#1d4278"/>
      <rect x="460" y="60" width="160" height="60" rx="6" fill="#e8f0fb" stroke="#1d4278"/>
      <rect x="460" y="200" width="160" height="60" rx="6" fill="#e8f0fb" stroke="#1d4278"/>
      <rect x="700" y="45" width="220" height="34" rx="6" fill="#eef7ee" stroke="#2e7d32"/>
      <rect x="700" y="95" width="220" height="34" rx="6" fill="#eef7ee" stroke="#2e7d32"/>
      <rect x="700" y="185" width="220" height="34" rx="6" fill="#eef7ee" stroke="#2e7d32"/>
      <rect x="700" y="235" width="220" height="34" rx="6" fill="#eef7ee" stroke="#2e7d32"/>
      <rect x="700" y="285" width="220" height="34" rx="6" fill="#eef7ee" stroke="#2e7d32"/>
    </g>
    <text x="100" y="92">OCXO / TCXO</text><text x="100" y="108" font-size="10">local oscillator</text>
    <text x="100" y="222">SyncE / 1PPS / GNSS</text><text x="100" y="238" font-size="10">external references</text>
    <text x="315" y="150">Network synchronizer</text><text x="315" y="168" font-size="10">DPLL, holdover, PTP DCO</text><text x="315" y="184" font-size="10">(AD9545, LMK05318, ZL3073x)</text>
    <text x="540" y="85">Clock generator</text><text x="540" y="102" font-size="10">or fanout buffer</text>
    <text x="540" y="225">Jitter cleaner</text><text x="540" y="242" font-size="10">device clock + SYSREF</text>
    <text x="810" y="67">SoC, DDR, PCIe (HCSL)</text>
    <text x="810" y="117">Ethernet PHY / SerDes</text>
    <text x="810" y="207">FPGA transceiver ref clock</text>
    <text x="810" y="257">ADC / DAC (JESD204B/C)</text>
    <text x="810" y="307">FPGA JESD core (SYSREF)</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#b)">
    <polyline points="170,95 200,95 200,145 228,145"/>
    <polyline points="170,225 200,225 200,175 228,175"/>
    <polyline points="400,145 430,145 430,90 458,90"/>
    <polyline points="400,175 430,175 430,230 458,230"/>
    <polyline points="620,80 660,80 660,62 698,62"/>
    <polyline points="620,100 660,100 660,112 698,112"/>
    <polyline points="620,215 660,215 660,202 698,202"/>
    <polyline points="620,235 660,235 660,252 698,252"/>
    <polyline points="620,250 650,250 650,302 698,302"/>
  </g>
  <text x="480" y="345" font-size="11.5" fill="#555" text-anchor="middle">Part numbers are examples of each class; a real board may merge or omit stages.</text>
</svg>
