<svg role="img" viewBox="0 0 810 124" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Luồng xử lý request PHP: trình trình duyệt gửi HTTP tới web server, file tĩnh được web server trả về, file .php được chuyển qua CGI hoặc FastCGI tới PHP</title>
  <rect x="0" y="0" width="810" height="124" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect x="20" y="20" width="170" height="84" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="105.0" y="66.2" font-size="11.5" font-weight="700" text-anchor="middle" fill="#333333">Trình duyệt</text>
  <rect x="320" y="20" width="170" height="84" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="405.0" y="51.2" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1d4278">Web server</text>
  <text x="405.0" y="66.2" font-size="10" text-anchor="middle" fill="#222">lighttpd, Nginx</text>
  <text x="405.0" y="81.2" font-size="10" text-anchor="middle" fill="#222">File tĩnh: tự trả về</text>
  <line x1="190" y1="62.0" x2="320" y2="62.0" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="255.0" y="54.0" font-size="10" text-anchor="middle" fill="#444">HTTP</text>
  <rect x="620" y="20" width="170" height="84" rx="8" fill="#fdf0e2" stroke="#c46a12" stroke-width="1.5"/>
  <text x="705.0" y="51.2" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7a3f06">PHP</text>
  <text x="705.0" y="66.2" font-size="10" text-anchor="middle" fill="#222">php-cgi, PHP-FPM</text>
  <text x="705.0" y="81.2" font-size="10" text-anchor="middle" fill="#222">Chạy script</text>
  <line x1="490" y1="62.0" x2="620" y2="62.0" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="555.0" y="54.0" font-size="10" text-anchor="middle" fill="#444">File .php: CGI / FastCGI</text>
