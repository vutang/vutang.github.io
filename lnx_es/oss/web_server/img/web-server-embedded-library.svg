<svg role="img" viewBox="0 0 780 440" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Mô hình thư viện web server nhúng vào ứng dụng (Mongoose / CivetWeb): web server và code ứng dụng chạy chung một tiến trình, đánh số theo các bước xử lý một request</title>
  <rect x="0" y="0" width="780" height="440" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <!-- Client -->
  <rect x="16" y="112" width="120" height="68" rx="8" fill="#f1f1f1" stroke="#777" stroke-width="1.5"/>
  <text x="76" y="134" font-size="12" font-weight="700" text-anchor="middle" fill="#333">CLIENT</text>
  <text x="76" y="150" font-size="9.5" text-anchor="middle" fill="#333">trình duyệt, NMS,</text>
  <text x="76" y="163" font-size="9.5" text-anchor="middle" fill="#333">script (curl)</text>
  <text x="76" y="196" font-size="9" text-anchor="middle" fill="#666">HTTP/HTTPS</text>

  <!-- Device -->
  <rect x="184" y="16" width="580" height="408" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="198" y="36" font-size="11" font-weight="700" fill="#666">THIẾT BỊ LINUX NHÚNG</text>

  <!-- Application process -->
  <rect x="200" y="50" width="548" height="290" rx="8" fill="#f3eefa" stroke="#6a4c9c" stroke-width="1.5"/>
  <text x="474" y="70" font-size="13" font-weight="700" text-anchor="middle" fill="#4a3370">ỨNG DỤNG (một tiến trình)</text>
  <text x="474" y="84" font-size="9.5" text-anchor="middle" fill="#4a3370">link thư viện web server: mongoose.c / civetweb.c</text>

  <!-- Web server library -->
  <rect x="216" y="94" width="240" height="232" rx="6" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.3"/>
  <text x="336" y="111" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4278">THƯ VIỆN WEB SERVER</text>
  <text x="336" y="124" font-size="9" text-anchor="middle" fill="#1d4278">Mongoose / CivetWeb</text>

  <rect x="228" y="134" width="216" height="32" rx="5" fill="#d3e3f7" stroke="#2f5d9e"/>
  <text x="336" y="147" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111">Listener + event loop / thread</text>
  <text x="336" y="160" font-size="9" text-anchor="middle" fill="#111">socket :80 / :443</text>

  <rect x="228" y="172" width="216" height="32" rx="5" fill="#d3e3f7" stroke="#2f5d9e"/>
  <text x="336" y="185" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111">TLS</text>
  <text x="336" y="198" font-size="9" text-anchor="middle" fill="#111">built-in, mbedTLS, OpenSSL</text>

  <rect x="228" y="210" width="216" height="32" rx="5" fill="#d3e3f7" stroke="#2f5d9e"/>
  <text x="336" y="223" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111">HTTP parser</text>
  <text x="336" y="236" font-size="9" text-anchor="middle" fill="#111">method, URL, header, body</text>

  <rect x="228" y="248" width="216" height="32" rx="5" fill="#d3e3f7" stroke="#2f5d9e"/>
  <text x="336" y="261" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111">Router</text>
  <text x="336" y="274" font-size="9" text-anchor="middle" fill="#111">mg_set_request_handler(), URL match</text>

  <rect x="228" y="286" width="216" height="32" rx="5" fill="#c3d7f2" stroke="#2f5d9e" stroke-dasharray="4 3"/>
  <text x="336" y="299" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111">Static file (tùy chọn)</text>
  <text x="336" y="312" font-size="9" text-anchor="middle" fill="#111">document_root</text>

  <!-- Application code -->
  <rect x="476" y="94" width="256" height="232" rx="6" fill="#fdf1e4" stroke="#c46a1b" stroke-width="1.3"/>
  <text x="604" y="111" font-size="11" font-weight="700" text-anchor="middle" fill="#8a4510">CODE ỨNG DỤNG</text>
  <text x="604" y="124" font-size="9" text-anchor="middle" fill="#8a4510">hàm C do bạn viết</text>

  <rect x="490" y="134" width="228" height="38" rx="5" fill="#f9dfc2" stroke="#c46a1b"/>
  <text x="604" y="150" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111">Handler REST: /api/...</text>
  <text x="604" y="164" font-size="9" text-anchor="middle" fill="#111">callback C, sinh JSON</text>

  <rect x="490" y="180" width="228" height="38" rx="5" fill="#f9dfc2" stroke="#c46a1b"/>
  <text x="604" y="196" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111">Handler WebSocket</text>
  <text x="604" y="210" font-size="9" text-anchor="middle" fill="#111">đẩy dữ liệu realtime</text>

  <line x1="604" y1="218" x2="604" y2="240" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="610" y="233" font-size="8.5" fill="#8a4510">gọi hàm</text>

  <rect x="490" y="242" width="228" height="76" rx="5" fill="#f9dfc2" stroke="#c46a1b"/>
  <text x="604" y="262" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111">Logic ứng dụng</text>
  <text x="604" y="278" font-size="9" text-anchor="middle" fill="#111">trạng thái thiết bị trong RAM,</text>
  <text x="604" y="291" font-size="9" text-anchor="middle" fill="#111">điều khiển phần cứng</text>
  <text x="604" y="308" font-size="9" font-style="italic" text-anchor="middle" fill="#8a4510">truy cập trực tiếp, không cần IPC</text>

  <!-- Router -> handlers (callback) -->
  <polyline points="444,264 466,264 466,153 488,153" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="466" y1="199" x2="488" y2="199" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Request / response -->
  <line x1="136" y1="142" x2="226" y2="142" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="160" y="136" font-size="9" text-anchor="middle" fill="#333">request</text>
  <line x1="226" y1="158" x2="138" y2="158" stroke="#555" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="160" y="172" font-size="9" text-anchor="middle" fill="#333">response</text>

  <!-- Below application -->
  <line x1="283" y1="318" x2="283" y2="354" stroke="#777" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <rect x="228" y="356" width="110" height="56" rx="6" fill="#eaf5ee" stroke="#2e7d4f" stroke-width="1.3"/>
  <text x="283" y="376" font-size="11" font-weight="700" text-anchor="middle" fill="#1f5c38">/www</text>
  <text x="283" y="391" font-size="9" text-anchor="middle" fill="#111">HTML, CSS, JS</text>
  <text x="283" y="404" font-size="9" text-anchor="middle" fill="#111">(nếu có web UI)</text>

  <rect x="350" y="356" width="126" height="56" rx="6" fill="#f1f1f1" stroke="#777" stroke-width="1.3"/>
  <text x="413" y="376" font-size="10" font-weight="700" text-anchor="middle" fill="#333">Không có backend</text>
  <text x="413" y="391" font-size="9" text-anchor="middle" fill="#111">web server và logic</text>
  <text x="413" y="404" font-size="9" text-anchor="middle" fill="#111">chung một tiến trình</text>

  <line x1="604" y1="318" x2="604" y2="354" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="490" y="356" width="228" height="56" rx="6" fill="#eaf5ee" stroke="#2e7d4f" stroke-width="1.3"/>
  <text x="604" y="376" font-size="11" font-weight="700" text-anchor="middle" fill="#1f5c38">Tài nguyên hệ thống</text>
  <text x="604" y="391" font-size="9" text-anchor="middle" fill="#111">driver, /sys, /proc,</text>
  <text x="604" y="404" font-size="9" text-anchor="middle" fill="#111">file cấu hình thiết bị</text>

  <!-- Step numbers -->
  <circle cx="228" cy="134" r="8" fill="#333" stroke="#fff" stroke-width="1.2"/>
  <text x="228" y="137.2" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">1</text>
  <circle cx="228" cy="172" r="8" fill="#333" stroke="#fff" stroke-width="1.2"/>
  <text x="228" y="175.2" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">2</text>
  <circle cx="228" cy="210" r="8" fill="#333" stroke="#fff" stroke-width="1.2"/>
  <text x="228" y="213.2" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">3</text>
  <circle cx="228" cy="248" r="8" fill="#333" stroke="#fff" stroke-width="1.2"/>
  <text x="228" y="251.2" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">4</text>
  <circle cx="490" cy="134" r="8" fill="#333" stroke="#fff" stroke-width="1.2"/>
  <text x="490" y="137.2" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">5</text>
  <circle cx="490" cy="242" r="8" fill="#333" stroke="#fff" stroke-width="1.2"/>
  <text x="490" y="245.2" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">6</text>
  <circle cx="150" cy="158" r="8" fill="#333" stroke="#fff" stroke-width="1.2"/>
  <text x="150" y="161.2" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">7</text>
</svg>
