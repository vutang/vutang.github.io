<svg role="img" viewBox="0 0 780 440" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Kiến trúc web server trên thiết bị Linux nhúng: client, các lớp xử lý trong web server, backend và tài nguyên hệ thống, đánh số theo các bước xử lý một request</title>
  <rect x="0" y="0" width="780" height="440" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <!-- Client -->
  <rect x="16" y="76" width="120" height="68" rx="8" fill="#f1f1f1" stroke="#777" stroke-width="1.5"/>
  <text x="76" y="98" font-size="12" font-weight="700" text-anchor="middle" fill="#333">CLIENT</text>
  <text x="76" y="114" font-size="9.5" text-anchor="middle" fill="#333">trình duyệt, NMS,</text>
  <text x="76" y="127" font-size="9.5" text-anchor="middle" fill="#333">script (curl)</text>

  <!-- Device -->
  <rect x="184" y="16" width="580" height="408" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="198" y="36" font-size="11" font-weight="700" fill="#666">THIẾT BỊ LINUX NHÚNG</text>

  <!-- Web server -->
  <rect x="200" y="50" width="260" height="270" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="330" y="70" font-size="13" font-weight="700" text-anchor="middle" fill="#1d4278">WEB SERVER</text>
  <text x="330" y="84" font-size="9.5" text-anchor="middle" fill="#1d4278">lighttpd / Nginx / BusyBox httpd</text>

  <rect x="216" y="94" width="228" height="34" rx="5" fill="#d3e3f7" stroke="#2f5d9e"/>
  <text x="330" y="108" font-size="11" font-weight="700" text-anchor="middle" fill="#111">Listener + event loop</text>
  <text x="330" y="121" font-size="9" text-anchor="middle" fill="#111">socket :80 / :443, epoll</text>

  <rect x="216" y="136" width="228" height="34" rx="5" fill="#d3e3f7" stroke="#2f5d9e"/>
  <text x="330" y="150" font-size="11" font-weight="700" text-anchor="middle" fill="#111">TLS</text>
  <text x="330" y="163" font-size="9" text-anchor="middle" fill="#111">OpenSSL, mbedTLS, wolfSSL</text>

  <rect x="216" y="178" width="228" height="34" rx="5" fill="#d3e3f7" stroke="#2f5d9e"/>
  <text x="330" y="192" font-size="11" font-weight="700" text-anchor="middle" fill="#111">HTTP parser</text>
  <text x="330" y="205" font-size="9" text-anchor="middle" fill="#111">method, URL, header, body</text>

  <rect x="216" y="220" width="228" height="34" rx="5" fill="#d3e3f7" stroke="#2f5d9e"/>
  <text x="330" y="234" font-size="11" font-weight="700" text-anchor="middle" fill="#111">Router</text>
  <text x="330" y="247" font-size="9" text-anchor="middle" fill="#111">chọn handler theo URL, đuôi file</text>

  <rect x="216" y="270" width="110" height="38" rx="5" fill="#c3d7f2" stroke="#2f5d9e"/>
  <text x="271" y="286" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111">Static handler</text>
  <text x="271" y="300" font-size="9" text-anchor="middle" fill="#111">trả file tĩnh</text>

  <rect x="334" y="270" width="110" height="38" rx="5" fill="#c3d7f2" stroke="#2f5d9e"/>
  <text x="389" y="286" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111">Dynamic handler</text>
  <text x="389" y="300" font-size="9" text-anchor="middle" fill="#111">CGI, FastCGI, proxy</text>

  <!-- Request / response -->
  <line x1="136" y1="104" x2="214" y2="104" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="160" y="98" font-size="9" text-anchor="middle" fill="#333">request</text>
  <line x1="214" y1="122" x2="138" y2="122" stroke="#555" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="160" y="136" font-size="9" text-anchor="middle" fill="#333">response</text>
  <text x="76" y="160" font-size="9" text-anchor="middle" fill="#666">HTTP/HTTPS</text>

  <!-- Below web server -->
  <line x1="271" y1="308" x2="271" y2="348" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="216" y="350" width="110" height="56" rx="6" fill="#eaf5ee" stroke="#2e7d4f" stroke-width="1.3"/>
  <text x="271" y="370" font-size="11" font-weight="700" text-anchor="middle" fill="#1f5c38">/www</text>
  <text x="271" y="385" font-size="9" text-anchor="middle" fill="#111">HTML, CSS, JS,</text>
  <text x="271" y="398" font-size="9" text-anchor="middle" fill="#111">ảnh</text>

  <line x1="389" y1="350" x2="389" y2="322" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <rect x="334" y="350" width="110" height="56" rx="6" fill="#f1f1f1" stroke="#777" stroke-width="1.3"/>
  <text x="389" y="370" font-size="11" font-weight="700" text-anchor="middle" fill="#333">Cấu hình</text>
  <text x="389" y="385" font-size="9" text-anchor="middle" fill="#111">lighttpd.conf,</text>
  <text x="389" y="398" font-size="9" text-anchor="middle" fill="#111">nginx.conf</text>

  <!-- Web server -> backend -->
  <line x1="444" y1="289" x2="498" y2="289" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="472" y="283" font-size="9" text-anchor="middle" fill="#333">IPC</text>

  <!-- Backend -->
  <rect x="500" y="50" width="248" height="270" rx="8" fill="#fdf1e4" stroke="#c46a1b" stroke-width="1.5"/>
  <text x="624" y="70" font-size="13" font-weight="700" text-anchor="middle" fill="#8a4510">BACKEND</text>
  <text x="624" y="84" font-size="9.5" text-anchor="middle" fill="#8a4510">tiến trình riêng, sinh nội dung động</text>

  <rect x="516" y="100" width="216" height="46" rx="5" fill="#f9dfc2" stroke="#c46a1b"/>
  <text x="624" y="119" font-size="11" font-weight="700" text-anchor="middle" fill="#111">CGI: shell script, binary C</text>
  <text x="624" y="135" font-size="9" text-anchor="middle" fill="#111">mỗi request một tiến trình mới</text>

  <rect x="516" y="172" width="216" height="46" rx="5" fill="#f9dfc2" stroke="#c46a1b"/>
  <text x="624" y="191" font-size="11" font-weight="700" text-anchor="middle" fill="#111">PHP-FPM / php-cgi</text>
  <text x="624" y="207" font-size="9" text-anchor="middle" fill="#111">chạy liên tục, nhận request qua FastCGI</text>

  <rect x="516" y="244" width="216" height="46" rx="5" fill="#f9dfc2" stroke="#c46a1b"/>
  <text x="624" y="263" font-size="11" font-weight="700" text-anchor="middle" fill="#111">Ứng dụng REST API</text>
  <text x="624" y="279" font-size="9" text-anchor="middle" fill="#111">C, Python, Go... qua reverse proxy</text>

  <!-- Backend -> system -->
  <line x1="624" y1="320" x2="624" y2="348" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="516" y="350" width="216" height="56" rx="6" fill="#eaf5ee" stroke="#2e7d4f" stroke-width="1.3"/>
  <text x="624" y="370" font-size="11" font-weight="700" text-anchor="middle" fill="#1f5c38">Tài nguyên hệ thống</text>
  <text x="624" y="385" font-size="9" text-anchor="middle" fill="#111">file cấu hình thiết bị, /sys, /proc,</text>
  <text x="624" y="398" font-size="9" text-anchor="middle" fill="#111">lệnh hệ thống, driver</text>
  <!-- Step numbers -->
  <circle cx="216" cy="94" r="8" fill="#333" stroke="#fff" stroke-width="1.2"/>
  <text x="216" y="97.2" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">1</text>
  <circle cx="216" cy="136" r="8" fill="#333" stroke="#fff" stroke-width="1.2"/>
  <text x="216" y="139.2" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">2</text>
  <circle cx="216" cy="178" r="8" fill="#333" stroke="#fff" stroke-width="1.2"/>
  <text x="216" y="181.2" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">3</text>
  <circle cx="216" cy="220" r="8" fill="#333" stroke="#fff" stroke-width="1.2"/>
  <text x="216" y="223.2" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">4</text>
  <circle cx="216" cy="270" r="8" fill="#333" stroke="#fff" stroke-width="1.2"/>
  <text x="216" y="273.2" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">5</text>
  <circle cx="334" cy="270" r="8" fill="#333" stroke="#fff" stroke-width="1.2"/>
  <text x="334" y="273.2" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">6</text>
  <circle cx="500" cy="50" r="8" fill="#333" stroke="#fff" stroke-width="1.2"/>
  <text x="500" y="53.2" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">7</text>
  <circle cx="150" cy="122" r="8" fill="#333" stroke="#fff" stroke-width="1.2"/>
  <text x="150" y="125.2" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">8</text>
</svg>
