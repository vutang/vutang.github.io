<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" font-size="13">
  <rect width="760" height="330" fill="none"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="currentColor">Phân loại bộ nhớ không mất dữ liệu trong embedded</text>
  <rect x="270" y="40" width="220" height="34" rx="6" fill="#455a64"/>
  <text x="380" y="62" text-anchor="middle" fill="#fff">Non-volatile memory</text>
  <path d="M380 74V92M130 92H620M130 92V110M380 92V110M620 92V110" stroke="currentColor" fill="none"/>
  <rect x="30" y="110" width="200" height="34" rx="6" fill="#607d8b"/>
  <text x="130" y="132" text-anchor="middle" fill="#fff">EEPROM (byte)</text>
  <rect x="280" y="110" width="200" height="34" rx="6" fill="#607d8b"/>
  <text x="380" y="132" text-anchor="middle" fill="#fff">NOR Flash (random access)</text>
  <rect x="520" y="110" width="200" height="34" rx="6" fill="#607d8b"/>
  <text x="620" y="132" text-anchor="middle" fill="#fff">NAND Flash (page/block)</text>
  <text x="130" y="170" text-anchor="middle" fill="currentColor">I2C / SPI, vài Kb–Mb</text>
  <text x="130" y="188" text-anchor="middle" fill="currentColor">cấu hình, MAC, serial</text>
  <text x="380" y="170" text-anchor="middle" fill="currentColor">Parallel / SPI (QSPI)</text>
  <text x="380" y="188" text-anchor="middle" fill="currentColor">XIP, bootloader, vài MB–GB</text>
  <text x="620" y="170" text-anchor="middle" fill="currentColor">Raw NAND: cần ECC, bad block</text>
  <text x="620" y="188" text-anchor="middle" fill="currentColor">vài trăm MB–TB</text>
  <path d="M620 200V222" stroke="currentColor"/>
  <rect x="470" y="222" width="150" height="34" rx="6" fill="#78909c"/>
  <text x="545" y="244" text-anchor="middle" fill="#fff">Raw NAND (MTD)</text>
  <rect x="640" y="222" width="100" height="34" rx="6" fill="#78909c"/>
  <text x="690" y="244" text-anchor="middle" fill="#fff">Managed</text>
  <path d="M690 256V276" stroke="currentColor"/>
  <rect x="450" y="276" width="290" height="40" rx="6" fill="#37474f"/>
  <text x="595" y="293" text-anchor="middle" fill="#fff">eMMC / SD / UFS / SSD</text>
  <text x="595" y="309" text-anchor="middle" fill="#fff">NAND + controller (FTL) → block device</text>
</svg>
