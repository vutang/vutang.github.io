<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="sans-serif" font-size="13">
  <!-- Erased -->
  <g transform="translate(20,0)">
    <text x="165" y="22" text-anchor="middle" font-weight="bold" fill="currentColor">Erased (đọc = 1) — Vth thấp</text>
    <rect x="95" y="50" width="140" height="26" fill="#455a64"/><text x="165" y="68" text-anchor="middle" fill="#fff">Control gate</text>
    <rect x="95" y="80" width="140" height="8" fill="#b0bec5"/><text x="250" y="88" fill="currentColor" font-size="11">oxide</text>
    <rect x="115" y="92" width="100" height="26" fill="#78909c" stroke="currentColor"/><text x="165" y="110" text-anchor="middle" fill="#fff">Floating gate</text>
    <rect x="95" y="122" width="140" height="8" fill="#b0bec5"/><text x="250" y="130" fill="currentColor" font-size="11">tunnel oxide</text>
    <rect x="20" y="134" width="290" height="50" fill="#8d6e63" opacity=".75"/>
    <text x="165" y="165" text-anchor="middle" fill="#fff">Substrate (p)</text>
    <rect x="20" y="134" width="60" height="22" fill="#26a69a"/><text x="50" y="150" text-anchor="middle" fill="#fff" font-size="11">Source</text>
    <rect x="250" y="134" width="60" height="22" fill="#26a69a"/><text x="280" y="150" text-anchor="middle" fill="#fff" font-size="11">Drain</text>
    <path d="M80 145H250" stroke="#fdd835" stroke-width="3" stroke-dasharray="6 3"/>
    <text x="165" y="212" text-anchor="middle" fill="currentColor">Kênh dẫn mở → cell dẫn dòng</text>
  </g>
  <!-- Programmed -->
  <g transform="translate(390,0)">
    <text x="165" y="22" text-anchor="middle" font-weight="bold" fill="currentColor">Programmed (đọc = 0) — Vth cao</text>
    <rect x="95" y="50" width="140" height="26" fill="#455a64"/><text x="165" y="68" text-anchor="middle" fill="#fff">Control gate</text>
    <rect x="95" y="80" width="140" height="8" fill="#b0bec5"/>
    <rect x="115" y="92" width="100" height="26" fill="#78909c" stroke="currentColor"/>
    <text x="135" y="110" fill="#fff" font-size="14">− − − −</text>
    <rect x="95" y="122" width="140" height="8" fill="#b0bec5"/>
    <rect x="20" y="134" width="290" height="50" fill="#8d6e63" opacity=".75"/>
    <text x="165" y="165" text-anchor="middle" fill="#fff">Substrate (p)</text>
    <rect x="20" y="134" width="60" height="22" fill="#26a69a"/><text x="50" y="150" text-anchor="middle" fill="#fff" font-size="11">Source</text>
    <rect x="250" y="134" width="60" height="22" fill="#26a69a"/><text x="280" y="150" text-anchor="middle" fill="#fff" font-size="11">Drain</text>
    <text x="165" y="212" text-anchor="middle" fill="currentColor">Electron bị nhốt → kênh bị chặn → không dẫn</text>
  </g>
  <text x="380" y="250" text-anchor="middle" fill="currentColor">Program: electron đi xuyên tunnel oxide vào floating gate (CHE ở NOR, FN tunneling ở NAND)</text>
  <text x="380" y="272" text-anchor="middle" fill="currentColor">Erase: điện áp ngược chiều kéo electron ra khỏi floating gate (FN tunneling)</text>
</svg>
