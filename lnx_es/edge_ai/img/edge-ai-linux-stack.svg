<svg role="img" viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Các lớp phần mềm khi chạy inference trên Linux SoC có NPU</title>
  <rect x="0" y="0" width="960" height="400" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">Các lớp phần mềm inference trên Linux SoC có NPU</text>
  <text x="20" y="62" font-size="11" fill="#475569">User space</text>
  <rect x="120" y="45" width="560" height="40" rx="5" fill="#e2e8f0" stroke="#475569"/>
  <text x="400" y="70" font-size="12" font-weight="700" text-anchor="middle" fill="#333">Ứng dụng (C/C++, Python, GStreamer pipeline)</text>
  <line x1="400" y1="85" x2="400" y2="100" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="120" y="100" width="560" height="40" rx="5" fill="#e2e8f0" stroke="#475569"/>
  <text x="400" y="125" font-size="12" font-weight="700" text-anchor="middle" fill="#333">Runtime: LiteRT, ONNX Runtime, ExecuTorch, runtime riêng của hãng</text>
  <line x1="400" y1="140" x2="400" y2="155" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="120" y="155" width="560" height="40" rx="5" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="400" y="180" font-size="12" font-weight="700" text-anchor="middle" fill="#333">Delegate (LiteRT) / Execution Provider (ONNX Runtime)</text>
  <line x1="400" y1="195" x2="400" y2="210" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="120" y="210" width="560" height="40" rx="5" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="400" y="235" font-size="12" font-weight="700" text-anchor="middle" fill="#333">Thư viện NPU của hãng hoặc Mesa (Teflon)</text>
  <line x1="20" y1="268" x2="940" y2="268" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="20" y="262" font-size="11" fill="#475569">ioctl</text>
  <line x1="400" y1="250" x2="400" y2="280" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="20" y="297" font-size="11" fill="#475569">Kernel</text>
  <rect x="120" y="280" width="560" height="40" rx="5" fill="#fef3c7" stroke="#b45309"/>
  <text x="400" y="305" font-size="12" font-weight="700" text-anchor="middle" fill="#333">Driver NPU: accel subsystem (/dev/accel/accel*) hoặc driver của hãng</text>
  <line x1="400" y1="320" x2="400" y2="335" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="20" y="352" font-size="11" fill="#475569">Phần cứng</text>
  <rect x="120" y="335" width="560" height="40" rx="5" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="400" y="360" font-size="12" font-weight="700" text-anchor="middle" fill="#333">NPU</text>
  <rect x="740" y="155" width="200" height="40" rx="5" fill="#e2e8f0" stroke="#475569"/>
  <text x="840" y="173" font-size="11" font-weight="700" text-anchor="middle" fill="#333">Kernel CPU</text>
  <text x="840" y="187" font-size="10" text-anchor="middle" fill="#555">(ví dụ XNNPACK)</text>
  <line x1="680" y1="120" x2="740" y2="170" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="700" y="110" font-size="10" fill="#555">op không được</text>
  <text x="700" y="123" font-size="10" fill="#555">offload</text>
  <rect x="740" y="335" width="200" height="40" rx="5" fill="#e2e8f0" stroke="#475569"/>
  <text x="840" y="360" font-size="12" font-weight="700" text-anchor="middle" fill="#333">CPU (Cortex-A)</text>
  <line x1="840" y1="195" x2="840" y2="335" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
</svg>
