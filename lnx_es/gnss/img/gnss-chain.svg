<svg role="img" viewBox="0 0 960 230" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>GNSS receiver hardware chain from antenna to host</title>
  <rect x="0" y="0" width="960" height="230" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">Hardware chain: antenna, GNSS module, host</text>
  <rect x="30" y="70" width="150" height="80" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="105" y="104" font-size="12" font-weight="700" text-anchor="middle" fill="#333">Active antenna</text>
  <text x="105" y="124" font-size="10.5" text-anchor="middle" fill="#555">patch + LNA</text>
  <line x1="180" y1="110" x2="270" y2="110" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="225" y="98" font-size="10.5" text-anchor="middle" fill="#555">coax</text>
  <text x="225" y="134" font-size="10" text-anchor="middle" fill="#555">RF + bias V</text>
  <rect x="270" y="50" width="330" height="120" rx="6" fill="#2f5d9e"/>
  <text x="435" y="76" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">GNSS module</text>
  <g fill="#ffffff" stroke="none"><rect x="285" y="90" width="90" height="56" rx="4"/><rect x="385" y="90" width="90" height="56" rx="4"/><rect x="485" y="90" width="100" height="56" rx="4"/></g>
  <g font-size="10.5" text-anchor="middle" fill="#333"><text x="330" y="115">RF</text><text x="330" y="130">front-end</text><text x="430" y="115">Baseband</text><text x="430" y="130">tracking</text><text x="535" y="115">PVT engine</text><text x="535" y="130">+ TCXO</text></g>
  <line x1="600" y1="85" x2="700" y2="85" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="600" y1="135" x2="700" y2="135" stroke="#c0392b" stroke-width="2" marker-end="url(#a)"/>
  <text x="650" y="76" font-size="10.5" text-anchor="middle" fill="#333">UART / I²C / USB</text><text x="650" y="62" font-size="10" text-anchor="middle" fill="#555">NMEA / UBX</text>
  <text x="650" y="124" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c0392b">1PPS</text>
  
  <rect x="700" y="60" width="230" height="100" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="815" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#333">Host (Linux SoC)</text>
  <text x="815" y="120" font-size="10.5" text-anchor="middle" fill="#555">UART + GPIO / PHC pin</text>
  <text x="480" y="205" font-size="10.5" text-anchor="middle" fill="#555">Timing-grade modules also compensate antenna cable delay and support time-only mode</text>
</svg>
