<svg role="img" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>GNSS data flow on Linux: UART to gpsd, PPS to chrony and ts2phc</title>
  <rect x="0" y="0" width="960" height="380" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">Linux data flow: UART tells which second, PPS tells exactly when</text>
  <rect x="20" y="140" width="130" height="90" rx="6" fill="#2f5d9e"/>
  <text x="85" y="180" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">GNSS</text>
  <text x="85" y="198" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">module</text>
  <g stroke="#333" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="150" y1="160" x2="230" y2="90"/><line x1="150" y1="210" x2="230" y2="210"/><line x1="150" y1="230" x2="230" y2="320"/>
  </g>
  <text x="170" y="112" font-size="10.5" fill="#555">UART</text><text x="172" y="204" font-size="10.5" font-weight="700" fill="#c0392b">1PPS</text><text x="160" y="305" font-size="10.5" font-weight="700" fill="#c0392b">1PPS</text>
  <rect x="230" y="65" width="150" height="50" rx="5" fill="#e2e8f0" stroke="#475569"/><text x="305" y="95" font-size="12" text-anchor="middle" fill="#333">gpsd</text>
  <rect x="230" y="185" width="150" height="50" rx="5" fill="#e2e8f0" stroke="#475569"/><text x="305" y="207" font-size="12" text-anchor="middle" fill="#333">/dev/pps0</text><text x="305" y="224" font-size="10" text-anchor="middle" fill="#555">kernel PPS</text>
  <rect x="230" y="295" width="150" height="50" rx="5" fill="#e2e8f0" stroke="#475569"/><text x="305" y="325" font-size="12" text-anchor="middle" fill="#333">ts2phc</text>
  <g stroke="#333" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="380" y1="90" x2="480" y2="140"/><line x1="380" y1="210" x2="480" y2="170"/><line x1="380" y1="320" x2="560" y2="320"/>
  </g>
  <text x="400" y="86" font-size="10" fill="#555">SHM (second)</text>
  <rect x="480" y="125" width="130" height="60" rx="5" fill="#2f5d9e"/><text x="545" y="160" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">chrony</text>
  <line x1="610" y1="155" x2="700" y2="155" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="700" y="130" width="230" height="50" rx="5" fill="#e2e8f0" stroke="#475569"/><text x="815" y="160" font-size="12" text-anchor="middle" fill="#333">CLOCK_REALTIME</text>
  <rect x="560" y="295" width="130" height="50" rx="5" fill="#e2e8f0" stroke="#475569"/><text x="625" y="325" font-size="12" text-anchor="middle" fill="#333">PHC (NIC)</text>
  <line x1="690" y1="320" x2="740" y2="320" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="740" y="295" width="190" height="50" rx="5" fill="#2f5d9e"/><text x="835" y="325" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">ptp4l → PTP network</text>
  <text x="480" y="368" font-size="10.5" text-anchor="middle" fill="#555">Upper path sets the system clock; lower path makes this host a PTP grandmaster</text>
</svg>
