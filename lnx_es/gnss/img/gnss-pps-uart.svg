<svg role="img" viewBox="0 0 960 250" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>1PPS edge marks the exact second; the NMEA sentence that follows names it</title>
  <rect x="0" y="0" width="960" height="250" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">PPS gives the exact instant, UART gives the label of that second</text>
  <text x="30" y="82" font-size="11" font-weight="700" fill="#c0392b">1PPS</text>
  <polyline points="90,100 160,100 160,70 180,70 180,100 440,100 440,70 460,70 460,100 720,100 720,70 740,70 740,100 930,100" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="30" y="162" font-size="11" font-weight="700" fill="#2f5d9e">UART</text>
  <g fill="#2f5d9e"><rect x="240" y="150" width="140" height="22" rx="3"/><rect x="520" y="150" width="140" height="22" rx="3"/></g>
  <g font-size="10" text-anchor="middle" fill="#ffffff"><text x="310" y="165">$GxRMC 12:00:00</text><text x="590" y="165">$GxRMC 12:00:01</text></g>
  <g stroke="#999" stroke-dasharray="3 3"><line x1="160" y1="60" x2="160" y2="200"/><line x1="440" y1="60" x2="440" y2="200"/><line x1="720" y1="60" x2="720" y2="200"/></g>
  <line x1="160" y1="196" x2="240" y2="196" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="200" y="214" font-size="10.5" text-anchor="middle" fill="#555">typically hundreds of ms later</text>
  <line x1="160" y1="60" x2="440" y2="60" stroke="#475569" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="300" y="52" font-size="10.5" text-anchor="middle" fill="#333">1 s</text>
  <text x="480" y="230" font-size="10.5" text-anchor="middle" fill="#333">Rising edge at 12:00:00.000 UTC (µs-level); the sentence after it says which second the edge belongs to</text>
</svg>
