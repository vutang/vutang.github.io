<svg role="img" viewBox="0 0 960 270" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Anatomy of an NMEA 0183 sentence, broken down field by field</title>
  <rect x="0" y="0" width="960" height="270" rx="8" fill="#ffffff"/>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">NMEA 0183 sentence: address, comma-separated data fields, checksum</text>
    <rect x="20" y="60" width="90" height="34" rx="4" fill="#c0392b"/><text x="65.0" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">$GPGGA</text>
  <rect x="116" y="60" width="80" height="34" rx="4" fill="#2f5d9e"/><text x="156.0" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">123519</text>
  <rect x="202" y="60" width="86" height="34" rx="4" fill="#2f5d9e"/><text x="245.0" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">4807.038</text>
  <rect x="294" y="60" width="30" height="34" rx="4" fill="#2f5d9e"/><text x="309.0" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">N</text>
  <rect x="330" y="60" width="92" height="34" rx="4" fill="#2f5d9e"/><text x="376.0" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">01131.000</text>
  <rect x="428" y="60" width="30" height="34" rx="4" fill="#2f5d9e"/><text x="443.0" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">E</text>
  <rect x="464" y="60" width="30" height="34" rx="4" fill="#2f5d9e"/><text x="479.0" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">1</text>
  <rect x="500" y="60" width="36" height="34" rx="4" fill="#2f5d9e"/><text x="518.0" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">08</text>
  <rect x="542" y="60" width="40" height="34" rx="4" fill="#2f5d9e"/><text x="562.0" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">0.9</text>
  <rect x="588" y="60" width="66" height="34" rx="4" fill="#2f5d9e"/><text x="621.0" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">545.4</text>
  <rect x="660" y="60" width="30" height="34" rx="4" fill="#2f5d9e"/><text x="675.0" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">M</text>
  <rect x="696" y="60" width="44" height="34" rx="4" fill="#94a3b8"/><text x="718.0" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">...</text>
  <rect x="746" y="60" width="50" height="34" rx="4" fill="#475569"/><text x="771.0" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">*47</text>
    <line x1="65.0" y1="94" x2="65.0" y2="104" stroke="#94a3b8" stroke-width="1"/><text x="65.0" y="116" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">Address</text><text x="65.0" y="129" font-size="10" text-anchor="middle" fill="#555">talker GP + GGA</text>
  <line x1="156.0" y1="94" x2="156.0" y2="138" stroke="#94a3b8" stroke-width="1"/><text x="156.0" y="150" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">UTC time</text><text x="156.0" y="163" font-size="10" text-anchor="middle" fill="#555">12:35:19</text>
  <line x1="245.0" y1="94" x2="245.0" y2="172" stroke="#94a3b8" stroke-width="1"/><text x="245.0" y="184" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">Latitude</text><text x="245.0" y="197" font-size="10" text-anchor="middle" fill="#555">48°07.038'</text>
  <line x1="309.0" y1="94" x2="309.0" y2="104" stroke="#94a3b8" stroke-width="1"/><text x="309.0" y="116" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">N/S</text>
  <line x1="376.0" y1="94" x2="376.0" y2="138" stroke="#94a3b8" stroke-width="1"/><text x="376.0" y="150" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">Longitude</text><text x="376.0" y="163" font-size="10" text-anchor="middle" fill="#555">11°31.000'</text>
  <line x1="443.0" y1="94" x2="443.0" y2="172" stroke="#94a3b8" stroke-width="1"/><text x="443.0" y="184" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">E/W</text>
  <line x1="479.0" y1="94" x2="479.0" y2="104" stroke="#94a3b8" stroke-width="1"/><text x="479.0" y="116" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">Fix</text><text x="479.0" y="129" font-size="10" text-anchor="middle" fill="#555">1 = GPS fix</text>
  <line x1="518.0" y1="94" x2="518.0" y2="138" stroke="#94a3b8" stroke-width="1"/><text x="518.0" y="150" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">SVs</text><text x="518.0" y="163" font-size="10" text-anchor="middle" fill="#555">used</text>
  <line x1="562.0" y1="94" x2="562.0" y2="172" stroke="#94a3b8" stroke-width="1"/><text x="562.0" y="184" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">HDOP</text>
  <line x1="621.0" y1="94" x2="621.0" y2="104" stroke="#94a3b8" stroke-width="1"/><text x="621.0" y="116" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">Altitude</text><text x="621.0" y="129" font-size="10" text-anchor="middle" fill="#555">metres</text>
  <line x1="675.0" y1="94" x2="675.0" y2="138" stroke="#94a3b8" stroke-width="1"/><text x="675.0" y="150" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">Unit</text>
  <line x1="718.0" y1="94" x2="718.0" y2="172" stroke="#94a3b8" stroke-width="1"/><text x="718.0" y="184" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">More fields</text><text x="718.0" y="197" font-size="10" text-anchor="middle" fill="#555">geoid, DGPS age</text>
  <line x1="771.0" y1="94" x2="771.0" y2="104" stroke="#94a3b8" stroke-width="1"/><text x="771.0" y="116" font-size="10.5" font-weight="700" text-anchor="middle" fill="#333">Checksum</text><text x="771.0" y="129" font-size="10" text-anchor="middle" fill="#555">XOR</text>
  <text x="20" y="240" font-size="10.5" fill="#555">Fields are separated by commas (omitted here). An empty field keeps its comma. Checksum = XOR of every character between $ and *.</text>
  <text x="20" y="256" font-size="10.5" fill="#555">A sentence is at most 82 characters including $ and CR LF.</text>
</svg>
