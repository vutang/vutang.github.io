<svg role="img" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Passive antenna versus active antenna with LNA and bias supply</title>
  <rect x="0" y="0" width="960" height="340" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">Passive vs active GNSS antenna</text>
  <text x="20" y="62" font-size="12" font-weight="700" fill="#333">Passive</text>
  <rect x="30" y="76" width="140" height="64" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="100" y="104" font-size="12" font-weight="700" text-anchor="middle" fill="#333">Patch element</text>
  <text x="100" y="122" font-size="10.5" text-anchor="middle" fill="#555">no amplifier</text>
  <line x1="170" y1="108" x2="360" y2="108" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="265" y="98" font-size="10.5" text-anchor="middle" fill="#555">short RF trace</text>
  <text x="265" y="128" font-size="10" text-anchor="middle" fill="#c0392b">every dB of loss adds to noise figure</text>
  <rect x="360" y="68" width="260" height="80" rx="6" fill="#2f5d9e"/>
  <text x="490" y="92" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">GNSS module</text>
  <rect x="376" y="102" width="106" height="34" rx="4" fill="#ffffff"/><text x="429" y="124" font-size="10.5" text-anchor="middle" fill="#333">SAW + LNA</text>
  <rect x="492" y="102" width="112" height="34" rx="4" fill="#ffffff"/><text x="548" y="124" font-size="10.5" text-anchor="middle" fill="#333">RF front-end</text>
  <text x="650" y="104" font-size="10.5" fill="#555">Antenna placed next to the module,</text>
  <text x="650" y="120" font-size="10.5" fill="#555">on a ground plane</text>
  <line x1="20" y1="170" x2="940" y2="170" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <text x="20" y="198" font-size="12" font-weight="700" fill="#333">Active</text>
  <rect x="30" y="212" width="170" height="80" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="115" y="238" font-size="12" font-weight="700" text-anchor="middle" fill="#333">Patch + filter + LNA</text>
  <text x="115" y="258" font-size="10.5" text-anchor="middle" fill="#555">needs DC bias</text>
  <text x="115" y="274" font-size="10.5" text-anchor="middle" fill="#555">gain typically 15–30 dB</text>
  <line x1="200" y1="252" x2="360" y2="252" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="360" y1="252" x2="200" y2="252" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a)" transform="translate(0,12)"/>
  <text x="280" y="242" font-size="10.5" text-anchor="middle" fill="#555">coax: RF signal</text>
  <text x="280" y="284" font-size="10.5" text-anchor="middle" fill="#c0392b">DC bias on same cable</text>
  <rect x="360" y="212" width="260" height="80" rx="6" fill="#2f5d9e"/>
  <text x="490" y="236" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">GNSS module</text>
  <rect x="376" y="246" width="106" height="34" rx="4" fill="#ffffff"/><text x="429" y="268" font-size="10.5" text-anchor="middle" fill="#333">Bias tee / supply</text>
  <rect x="492" y="246" width="112" height="34" rx="4" fill="#ffffff"/><text x="548" y="268" font-size="10.5" text-anchor="middle" fill="#333">RF front-end</text>
  <text x="650" y="248" font-size="10.5" fill="#555">LNA before the cable sets the noise figure,</text>
  <text x="650" y="264" font-size="10.5" fill="#555">so the cable can be several metres long</text>
</svg>
