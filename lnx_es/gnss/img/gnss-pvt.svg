<svg role="img" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>GNSS positioning: four pseudoranges solve x, y, z and the receiver clock bias</title>
  <rect x="0" y="0" width="960" height="360" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">PVT: each satellite gives one pseudorange, four unknowns need four satellites</text>
  <g fill="#2f5d9e"><circle cx="110" cy="90" r="16"/><circle cx="270" cy="70" r="16"/><circle cx="430" cy="95" r="16"/><circle cx="560" cy="65" r="16"/></g>
  <g font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff"><text x="110" y="94">SV1</text><text x="270" y="74">SV2</text><text x="430" y="99">SV3</text><text x="560" y="69">SV4</text></g>
  <g stroke="#475569" stroke-width="1.2" stroke-dasharray="5 4" fill="none">
    <line x1="120" y1="104" x2="300" y2="270"/><line x1="272" y1="86" x2="310" y2="262"/>
    <line x1="420" y1="109" x2="325" y2="262"/><line x1="552" y1="80" x2="338" y2="268"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle"><text x="175" y="186">ρ1</text><text x="268" y="170">ρ2</text><text x="392" y="190">ρ3</text><text x="470" y="170">ρ4</text></g>
  <rect x="270" y="268" width="90" height="34" rx="4" fill="#c0392b"/>
  <text x="315" y="290" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Receiver</text>
  <line x1="40" y1="320" x2="600" y2="320" stroke="#999" stroke-width="1"/>
  <text x="320" y="340" font-size="10.5" text-anchor="middle" fill="#555">Earth surface</text>
  <rect x="640" y="60" width="300" height="250" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="656" y="86" font-size="12" font-weight="700" fill="#1d4278">Pseudorange per satellite</text>
  <text x="656" y="110" font-size="12" fill="#333">ρi = c · (t_rx − t_tx,i)</text>
  <text x="656" y="132" font-size="10.5" fill="#555">t_tx,i is carried in the signal, t_rx is the</text>
  <text x="656" y="147" font-size="10.5" fill="#555">receiver's own (inaccurate) clock</text>
  <text x="656" y="180" font-size="12" font-weight="700" fill="#1d4278">Four unknowns</text>
  <text x="656" y="204" font-size="12" fill="#333">x, y, z and clock bias δt</text>
  <text x="656" y="236" font-size="12" font-weight="700" fill="#1d4278">Result</text>
  <text x="656" y="260" font-size="12" fill="#333">Position, Velocity, Time (PVT)</text>
  <text x="656" y="288" font-size="10.5" fill="#555">Fixed position known: 1 satellite is enough</text>
  <text x="656" y="302" font-size="10.5" fill="#555">to recover time (timing mode)</text>
</svg>
