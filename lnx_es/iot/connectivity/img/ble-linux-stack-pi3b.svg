<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 582" role="img" font-family="DejaVu Sans, sans-serif" font-size="13">
  <rect x="0" y="0" width="760" height="560" rx="8" fill="#ffffff"/>
  <title>Bluetooth stack on a Raspberry Pi 3B: clients talk to bluetoothd over D-Bus, bluetoothd uses the kernel Bluetooth core, which reaches the BCM43430A1 chip through hci_uart and the PL011 UART; btmon and Home Assistant also open sockets that bypass bluetoothd, and rfkill can block hci0.</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3a42"/>
    </marker>
  </defs>

  <!-- Bands -->
  <rect x="10" y="10" width="740" height="220" rx="6" fill="#f4f6f8"/>
  <rect x="10" y="240" width="740" height="180" rx="6" fill="#eef3fa"/>
  <rect x="10" y="430" width="740" height="120" rx="6" fill="#fbf5ea"/>
  <text x="24" y="34" font-size="14" font-weight="bold" fill="#1f2d3d">User space</text>
  <text x="24" y="264" font-size="14" font-weight="bold" fill="#1f2d3d">Kernel</text>
  <text x="24" y="454" font-size="14" font-weight="bold" fill="#1f2d3d">Hardware</text>

  <g fill="#ffffff" stroke="#2f5d9e" stroke-width="1.5">
    <!-- user space -->
    <rect x="200" y="48" width="170" height="40" rx="5"/>
    <rect x="390" y="48" width="170" height="40" rx="5"/>
    <rect x="590" y="48" width="150" height="40" rx="5"/>
    <rect x="200" y="110" width="360" height="36" rx="5"/>
    <rect x="200" y="170" width="360" height="40" rx="5"/>
    <rect x="24" y="170" width="150" height="40" rx="5"/>
    <!-- kernel -->
    <rect x="200" y="280" width="360" height="40" rx="5"/>
    <rect x="590" y="280" width="150" height="40" rx="5"/>
    <rect x="200" y="350" width="360" height="44" rx="5"/>
    <!-- hardware -->
    <rect x="200" y="470" width="160" height="44" rx="5"/>
    <rect x="400" y="470" width="160" height="44" rx="5"/>
  </g>

  <g fill="#1f2d3d" text-anchor="middle">
    <text x="285" y="73" font-family="DejaVu Sans Mono, monospace">bluetoothctl</text>
    <text x="475" y="65">Home Assistant</text>
    <text x="475" y="81" fill="#2c3a42">(container)</text>
    <text x="665" y="65" font-family="DejaVu Sans Mono, monospace">rfkill</text>
    <text x="665" y="81" font-family="DejaVu Sans Mono, monospace">systemd-rfkill</text>
    <text x="380" y="133">D-Bus system bus: <tspan font-family="DejaVu Sans Mono, monospace">org.bluez</tspan></text>
    <text x="380" y="195"><tspan font-family="DejaVu Sans Mono, monospace">bluetoothd</tspan> (BlueZ daemon)</text>
    <text x="99" y="195" font-family="DejaVu Sans Mono, monospace">btmon</text>
    <text x="380" y="305">Bluetooth core: HCI + mgmt API</text>
    <text x="665" y="305">rfkill switch <tspan font-family="DejaVu Sans Mono, monospace">hci0</tspan></text>
    <text x="380" y="368" font-family="DejaVu Sans Mono, monospace">hci_uart + btbcm</text>
    <text x="380" y="386" fill="#2c3a42">loads the BCM43430A1 firmware patch (.hcd)</text>
    <text x="280" y="488">PL011 UART</text>
    <text x="280" y="505" fill="#2c3a42">(BCM2837 SoC)</text>
    <text x="480" y="488">BCM43430A1</text>
    <text x="480" y="505" fill="#2c3a42">Wi-Fi + Bluetooth</text>
  </g>

  <g stroke="#2c3a42" stroke-width="1.5" fill="none">
    <!-- solid paths -->
    <line x1="285" y1="88" x2="285" y2="108" marker-end="url(#arr)"/>
    <line x1="475" y1="88" x2="475" y2="108" marker-end="url(#arr)"/>
    <line x1="380" y1="146" x2="380" y2="168" marker-end="url(#arr)"/>
    <line x1="380" y1="210" x2="380" y2="278" marker-end="url(#arr)"/>
    <line x1="380" y1="320" x2="380" y2="348" marker-end="url(#arr)"/>
    <line x1="280" y1="394" x2="280" y2="468" marker-end="url(#arr)"/>
    <line x1="360" y1="492" x2="398" y2="492" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <line x1="665" y1="88" x2="665" y2="278" marker-end="url(#arr)"/>
    <line x1="590" y1="310" x2="562" y2="310" marker-end="url(#arr)"/>
    <!-- dashed: sockets that bypass bluetoothd -->
    <path d="M99,210 V300 H198" stroke-dasharray="6 4" marker-end="url(#arr)"/>
    <path d="M560,68 H575 V290 H562" stroke-dasharray="6 4" marker-end="url(#arr)"/>
    <line x1="590" y1="468" x2="640" y2="468" stroke-dasharray="6 4"/>
  </g>

  <g fill="#2c3a42">
    <text x="388" y="252">mgmt socket</text>
    <text x="107" y="262">monitor channel</text>
    <text x="673" y="248">block /</text>
    <text x="673" y="264">unblock</text>
    <text x="380" y="482" text-anchor="middle" font-size="12.5">UART</text>
    <text x="590" y="490">direct socket that</text>
    <text x="590" y="506">bypasses bluetoothd</text>
  </g>
<text id="wm" x="751.2" y="575.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
