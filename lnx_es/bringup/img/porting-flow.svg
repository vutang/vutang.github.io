<svg role="img" viewBox="0 0 818 290" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Các bước porting Linux lên board tùy biến theo thứ tự boot, mỗi bước có một mốc kiểm tra</title>
  <rect x="0" y="0" width="818" height="290" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <rect x="20" y="20" width="230" height="100" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="135" y="44" font-size="11.5" font-weight="700" text-anchor="middle" fill="#333333">1. Thu thập phần cứng</text>
  <text x="135" y="64" font-size="10" text-anchor="middle" fill="#222">Schematic, reference board,</text>
  <text x="135" y="79" font-size="10" text-anchor="middle" fill="#222">bảng khác biệt</text>
  <text x="135" y="104" font-size="10" font-style="italic" text-anchor="middle" fill="#555">Mốc: danh sách thay đổi</text>

  <rect x="294" y="20" width="230" height="100" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="409" y="44" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1d4278">2. Khởi tạo tối thiểu</text>
  <text x="409" y="64" font-size="10" text-anchor="middle" fill="#222">Clock, DDR, pin mux, UART</text>
  <text x="409" y="79" font-size="10" text-anchor="middle" fill="#222">(FSBL hoặc SPL)</text>
  <text x="409" y="104" font-size="10" font-style="italic" text-anchor="middle" fill="#555">Mốc: log stage 1, DDR ổn định</text>

  <rect x="568" y="20" width="230" height="100" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="683" y="44" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1d4278">3. Bootloader</text>
  <text x="683" y="64" font-size="10" text-anchor="middle" fill="#222">U-Boot: defconfig, device tree,</text>
  <text x="683" y="79" font-size="10" text-anchor="middle" fill="#222">boot media, mạng</text>
  <text x="683" y="104" font-size="10" font-style="italic" text-anchor="middle" fill="#555">Mốc: prompt U-Boot</text>

  <rect x="20" y="170" width="230" height="100" rx="8" fill="#eef7ee" stroke="#3d8b3d" stroke-width="1.5"/>
  <text x="135" y="194" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2b6a2b">4. Kernel và Device Tree</text>
  <text x="135" y="214" font-size="10" text-anchor="middle" fill="#222">Kernel config, DTS của board,</text>
  <text x="135" y="229" font-size="10" text-anchor="middle" fill="#222">command line</text>
  <text x="135" y="254" font-size="10" font-style="italic" text-anchor="middle" fill="#555">Mốc: log kernel trên console</text>

  <rect x="294" y="170" width="230" height="100" rx="8" fill="#eef7ee" stroke="#3d8b3d" stroke-width="1.5"/>
  <text x="409" y="194" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2b6a2b">5. Root filesystem</text>
  <text x="409" y="214" font-size="10" text-anchor="middle" fill="#222">Initramfs BusyBox, sau đó</text>
  <text x="409" y="229" font-size="10" text-anchor="middle" fill="#222">rootfs từ Buildroot hoặc Yocto</text>
  <text x="409" y="254" font-size="10" font-style="italic" text-anchor="middle" fill="#555">Mốc: shell sau khi init chạy</text>

  <rect x="568" y="170" width="230" height="100" rx="8" fill="#fbf3e6" stroke="#b07a1f" stroke-width="1.5"/>
  <text x="683" y="194" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7a5210">6. Ngoại vi</text>
  <text x="683" y="214" font-size="10" text-anchor="middle" fill="#222">Storage, Ethernet, I2C, SPI,</text>
  <text x="683" y="229" font-size="10" text-anchor="middle" fill="#222">IP trong PL</text>
  <text x="683" y="254" font-size="10" font-style="italic" text-anchor="middle" fill="#555">Mốc: mọi thiết bị probe được</text>

  <line x1="250" y1="70" x2="294" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="524" y1="70" x2="568" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="683,120 683,145 135,145 135,170" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="250" y1="220" x2="294" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="524" y1="220" x2="568" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
