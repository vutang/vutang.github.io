<svg role="img" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Luồng build của Buildroot: cấu hình .config, toolchain, các package đi qua các bước source, extract, patch, configure, build, install vào host, staging, target, sau đó post-build, fakeroot, tạo image và post-image</title>
  <rect x="0" y="0" width="800" height="400" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <!-- Configuration -->
  <rect x="16" y="20" width="160" height="96" rx="8" fill="#f1f1f1" stroke="#777" stroke-width="1.5"/>
  <text x="96" y="42" font-size="12" font-weight="700" text-anchor="middle" fill="#333">CẤU HÌNH</text>
  <text x="96" y="62" font-size="10" text-anchor="middle" fill="#333">configs/*_defconfig</text>
  <text x="96" y="78" font-size="10" text-anchor="middle" fill="#333">make menuconfig</text>
  <text x="96" y="100" font-size="11" font-weight="700" text-anchor="middle" fill="#111">.config</text>

  <!-- Toolchain -->
  <rect x="216" y="20" width="170" height="96" rx="8" fill="#fdf0e2" stroke="#c46a12" stroke-width="1.5"/>
  <text x="301" y="42" font-size="12" font-weight="700" text-anchor="middle" fill="#7a3f06">TOOLCHAIN</text>
  <text x="301" y="62" font-size="10" text-anchor="middle" fill="#333">internal: build gcc,</text>
  <text x="301" y="76" font-size="10" text-anchor="middle" fill="#333">binutils, libc</text>
  <text x="301" y="96" font-size="10" text-anchor="middle" fill="#333">external: kiểm tra, import</text>

  <!-- Packages -->
  <rect x="426" y="20" width="358" height="96" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="605" y="42" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">PACKAGE (TARGETS)</text>
  <text x="605" y="58" font-size="9.5" text-anchor="middle" fill="#1d4278">mỗi package, theo thứ tự dependency</text>
  <g font-size="9.5" text-anchor="middle" fill="#111">
    <rect x="438" y="70" width="50" height="30" rx="4" fill="#d3e3f7" stroke="#2f5d9e"/><text x="463" y="89">source</text>
    <rect x="496" y="70" width="50" height="30" rx="4" fill="#d3e3f7" stroke="#2f5d9e"/><text x="521" y="89">extract</text>
    <rect x="554" y="70" width="44" height="30" rx="4" fill="#d3e3f7" stroke="#2f5d9e"/><text x="576" y="89">patch</text>
    <rect x="606" y="70" width="58" height="30" rx="4" fill="#d3e3f7" stroke="#2f5d9e"/><text x="635" y="89">configure</text>
    <rect x="672" y="70" width="40" height="30" rx="4" fill="#d3e3f7" stroke="#2f5d9e"/><text x="692" y="89">build</text>
    <rect x="720" y="70" width="52" height="30" rx="4" fill="#d3e3f7" stroke="#2f5d9e"/><text x="746" y="89">install</text>
  </g>

  <line x1="176" y1="68" x2="214" y2="68" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="386" y1="68" x2="424" y2="68" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Output trees -->
  <text x="40" y="156" font-size="11" font-weight="700" fill="#666">THƯ MỤC output/</text>
  <g font-size="10" text-anchor="middle">
    <rect x="40" y="172" width="170" height="60" rx="6" fill="#fafafa" stroke="#999"/>
    <text x="125" y="192" font-weight="700" fill="#111">host/</text>
    <text x="125" y="208" fill="#333">công cụ chạy trên máy build,</text>
    <text x="125" y="222" fill="#333">cross compiler</text>

    <rect x="230" y="172" width="170" height="60" rx="6" fill="#fafafa" stroke="#999"/>
    <text x="315" y="192" font-weight="700" fill="#111">staging/</text>
    <text x="315" y="208" fill="#333">sysroot: header, thư viện</text>
    <text x="315" y="222" fill="#333">để link package khác</text>

    <rect x="420" y="172" width="170" height="60" rx="6" fill="#fafafa" stroke="#999"/>
    <text x="505" y="192" font-weight="700" fill="#111">target/</text>
    <text x="505" y="208" fill="#333">rootfs chưa đóng gói,</text>
    <text x="505" y="222" fill="#333">binary đã strip</text>

    <rect x="610" y="172" width="150" height="60" rx="6" fill="#fafafa" stroke="#999"/>
    <text x="685" y="192" font-weight="700" fill="#111">build/</text>
    <text x="685" y="208" fill="#333">source và kết quả build</text>
    <text x="685" y="222" fill="#333">của từng package</text>
  </g>
  <line x1="605" y1="116" x2="505" y2="170" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="605" y1="116" x2="315" y2="170" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="605" y1="116" x2="125" y2="170" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="605" y1="116" x2="685" y2="170" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- Finalize -->
  <g font-size="10" text-anchor="middle">
    <rect x="40" y="290" width="150" height="70" rx="8" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
    <text x="115" y="312" font-weight="700" fill="#1f5a1f">rootfs overlay</text>
    <text x="115" y="328" fill="#333">post-build script</text>
    <text x="115" y="344" fill="#333">(sửa target/)</text>

    <rect x="230" y="290" width="150" height="70" rx="8" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
    <text x="305" y="312" font-weight="700" fill="#1f5a1f">fakeroot</text>
    <text x="305" y="328" fill="#333">user, quyền, /dev,</text>
    <text x="305" y="344" fill="#333">post-fakeroot script</text>

    <rect x="420" y="290" width="150" height="70" rx="8" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
    <text x="495" y="312" font-weight="700" fill="#1f5a1f">tạo image rootfs</text>
    <text x="495" y="328" fill="#333">ext4, squashfs, ubifs,</text>
    <text x="495" y="344" fill="#333">cpio, tar</text>

    <rect x="610" y="290" width="150" height="70" rx="8" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
    <text x="685" y="312" font-weight="700" fill="#1f5a1f">post-image script</text>
    <text x="685" y="328" fill="#333">genimage, sdcard.img</text>
    <text x="685" y="344" fill="#333">→ output/images/</text>
  </g>
  <line x1="505" y1="232" x2="115" y2="288" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="190" y1="325" x2="228" y2="325" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="380" y1="325" x2="418" y2="325" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="570" y1="325" x2="608" y2="325" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="400" y="385" font-size="9.5" text-anchor="middle" fill="#666">kernel và bootloader là package như mọi package khác; kết quả của chúng nằm trong output/images/</text>
</svg>
