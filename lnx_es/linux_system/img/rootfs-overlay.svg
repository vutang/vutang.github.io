<svg role="img" viewBox="0 0 860 436.89" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Rootfs chỉ đọc và vùng dữ liệu ghi được: các phân vùng trên eMMC, các điểm mount sau khi boot, và overlayfs hợp nhất thư mục /etc từ lowerdir chỉ đọc và upperdir ghi được</title>
  <rect x="0" y="0" width="860" height="412" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect x="16" y="14" width="828" height="118" rx="10" fill="#f1f1f1" fill-opacity="0.45" stroke="#777777" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="26" y="30" font-size="11" font-weight="700" fill="#333333">Phân vùng trên eMMC</text>
  <rect x="36" y="44" width="240" height="76" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="156.0" y="70.5" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4278">boot</text>
  <text x="156.0" y="86.5" font-size="11" text-anchor="middle" fill="#222">FAT hoặc ext4</text>
  <text x="156.0" y="102.5" font-size="11" text-anchor="middle" fill="#222">U-Boot, kernel, DTB</text>
  <rect x="310" y="44" width="240" height="76" rx="8" fill="#fdf0e2" stroke="#c46a12" stroke-width="1.5"/>
  <text x="430.0" y="70.5" font-size="12" font-weight="700" text-anchor="middle" fill="#7a3f06">rootfs (squashfs)</text>
  <text x="430.0" y="86.5" font-size="11" text-anchor="middle" fill="#222">nén, chỉ đọc, có thể ký</text>
  <text x="430.0" y="102.5" font-size="11" text-anchor="middle" fill="#222">ghi bằng công cụ cập nhật</text>
  <rect x="584" y="44" width="240" height="76" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="704.0" y="70.5" font-size="12" font-weight="700" text-anchor="middle" fill="#1b5e20">data (ext4)</text>
  <text x="704.0" y="86.5" font-size="11" text-anchor="middle" fill="#222">cấu hình, log, dữ liệu ứng dụng</text>
  <text x="704.0" y="102.5" font-size="11" text-anchor="middle" fill="#222">xóa để factory reset</text>
  <rect x="16" y="160" width="828" height="240" rx="10" fill="#f1f1f1" fill-opacity="0.45" stroke="#777777" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="26" y="176" font-size="11" font-weight="700" fill="#333333">Sau khi boot</text>
  <rect x="36" y="190" width="240" height="64" rx="8" fill="#fdf0e2" stroke="#c46a12" stroke-width="1.5"/>
  <text x="156.0" y="218.5" font-size="12" font-weight="700" text-anchor="middle" fill="#7a3f06">/</text>
  <text x="156.0" y="234.5" font-size="11" text-anchor="middle" fill="#222">mount ro tại /</text>
  <rect x="584" y="190" width="240" height="64" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="704.0" y="218.5" font-size="12" font-weight="700" text-anchor="middle" fill="#1b5e20">/data</text>
  <text x="704.0" y="234.5" font-size="11" text-anchor="middle" fill="#222">mount rw tại /data</text>
  <rect x="236" y="300" width="380" height="70" rx="8" fill="#f1eafb" stroke="#6a3fb0" stroke-width="1.5"/>
  <text x="426.0" y="323.5" font-size="12" font-weight="700" text-anchor="middle" fill="#44287a">/etc (overlayfs)</text>
  <text x="426.0" y="339.5" font-size="11" text-anchor="middle" fill="#222">lowerdir=/etc (chỉ đọc)</text>
  <text x="426.0" y="355.5" font-size="11" text-anchor="middle" fill="#222">upperdir=/data/overlay/etc/upper</text>
  <line x1="430" y1="120" x2="156" y2="190" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="330" y="148" font-size="10" text-anchor="middle" fill="#444">mount</text>
  <line x1="704" y1="120" x2="704" y2="190" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="734" y="150" font-size="10" text-anchor="middle" fill="#444">mount</text>
  <line x1="156" y1="254" x2="300" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="190" y="288" font-size="10" text-anchor="middle" fill="#444">lowerdir</text>
  <line x1="704" y1="254" x2="560" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="660" y="288" font-size="10" text-anchor="middle" fill="#444">upperdir</text>
  <text x="430" y="392" font-size="10" font-weight="400" text-anchor="middle" fill="#555" font-style="italic">Ghi vào /etc: copy-up sang upperdir, lowerdir không đổi</text>
<text id="wm" x="850.04" y="429.43" text-anchor="end" font-size="12.45" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
