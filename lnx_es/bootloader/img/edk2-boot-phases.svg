<svg role="img" viewBox="0 0 772 250" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Các pha boot theo PI và UEFI trong EDK2</title>
  <rect x="0" y="0" width="772" height="250" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <!-- group labels -->
  <rect x="14" y="14" width="312" height="22" rx="4" fill="#dbe7f7" stroke="#3b6fb6"/>
  <text x="170" y="29" font-size="10" font-weight="700" text-anchor="middle" fill="#1d3f73">PI: khởi tạo nền tảng</text>
  <rect x="338" y="14" width="204" height="22" rx="4" fill="#d4ecdc" stroke="#2e7d4f"/>
  <text x="440" y="29" font-size="10" font-weight="700" text-anchor="middle" fill="#1d5a36">Boot services còn hoạt động</text>
  <rect x="554" y="14" width="204" height="22" rx="4" fill="#fbe7c8" stroke="#b8741a"/>
  <text x="656" y="29" font-size="10" font-weight="700" text-anchor="middle" fill="#7a4a00">Hệ điều hành nắm quyền</text>

  <!-- boxes: x = 14,122,230,338,446,554,662 ; w=96 -->
  <rect x="14" y="50" width="96" height="70" rx="6" fill="#ececec" stroke="#777"/>
  <text x="62" y="74" font-size="12" font-weight="700" text-anchor="middle" fill="#111">SEC</text>
  <text x="62" y="92" font-size="9" text-anchor="middle" fill="#111">reset vector,</text>
  <text x="62" y="105" font-size="9" text-anchor="middle" fill="#111">cache-as-RAM</text>

  <rect x="122" y="50" width="96" height="70" rx="6" fill="#ececec" stroke="#777"/>
  <text x="170" y="74" font-size="12" font-weight="700" text-anchor="middle" fill="#111">PEI</text>
  <text x="170" y="92" font-size="9" text-anchor="middle" fill="#111">PEIM, khởi tạo</text>
  <text x="170" y="105" font-size="9" text-anchor="middle" fill="#111">DRAM, HOB</text>

  <rect x="230" y="50" width="96" height="70" rx="6" fill="#ececec" stroke="#777"/>
  <text x="278" y="74" font-size="12" font-weight="700" text-anchor="middle" fill="#111">DXE</text>
  <text x="278" y="92" font-size="9" text-anchor="middle" fill="#111">DXE core, driver,</text>
  <text x="278" y="105" font-size="9" text-anchor="middle" fill="#111">protocol, ACPI</text>

  <rect x="338" y="50" width="96" height="70" rx="6" fill="#ececec" stroke="#777"/>
  <text x="386" y="74" font-size="12" font-weight="700" text-anchor="middle" fill="#111">BDS</text>
  <text x="386" y="92" font-size="9" text-anchor="middle" fill="#111">đọc Boot####,</text>
  <text x="386" y="105" font-size="9" text-anchor="middle" fill="#111">chọn boot option</text>

  <rect x="446" y="50" width="96" height="70" rx="6" fill="#ececec" stroke="#777"/>
  <text x="494" y="74" font-size="12" font-weight="700" text-anchor="middle" fill="#111">TSL</text>
  <text x="494" y="92" font-size="9" text-anchor="middle" fill="#111">OS loader, GRUB,</text>
  <text x="494" y="105" font-size="9" text-anchor="middle" fill="#111">EFI stub, Shell</text>

  <rect x="554" y="50" width="96" height="70" rx="6" fill="#ececec" stroke="#777"/>
  <text x="602" y="74" font-size="12" font-weight="700" text-anchor="middle" fill="#111">RT</text>
  <text x="602" y="92" font-size="9" text-anchor="middle" fill="#111">chỉ còn runtime</text>
  <text x="602" y="105" font-size="9" text-anchor="middle" fill="#111">services</text>

  <rect x="662" y="50" width="96" height="70" rx="6" fill="#ececec" stroke="#777"/>
  <text x="710" y="74" font-size="12" font-weight="700" text-anchor="middle" fill="#111">AL</text>
  <text x="710" y="92" font-size="9" text-anchor="middle" fill="#111">shutdown, reset,</text>
  <text x="710" y="105" font-size="9" text-anchor="middle" fill="#111">capsule update</text>

  <!-- arrows -->
  <line x1="110" y1="85" x2="121" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="218" y1="85" x2="229" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="326" y1="85" x2="337" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="434" y1="85" x2="445" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="542" y1="85" x2="553" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="650" y1="85" x2="661" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ExitBootServices marker -->
  <line x1="548" y1="44" x2="548" y2="150" stroke="#b02a2a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="548" y="164" font-size="10" font-weight="700" text-anchor="middle" fill="#b02a2a">ExitBootServices()</text>

  <!-- handoff notes -->
  <text x="116" y="140" font-size="9" text-anchor="middle" fill="#444">nạp PEI core</text>
  <text x="224" y="140" font-size="9" text-anchor="middle" fill="#444">HOB list</text>
  <text x="332" y="140" font-size="9" text-anchor="middle" fill="#444">mọi driver</text>
  <text x="332" y="151" font-size="9" text-anchor="middle" fill="#444">đã dispatch</text>
  <text x="440" y="140" font-size="9" text-anchor="middle" fill="#444">LoadImage,</text>
  <text x="440" y="151" font-size="9" text-anchor="middle" fill="#444">StartImage</text>

  <!-- bottom: memory/code location -->
  <rect x="14" y="184" width="204" height="48" rx="6" fill="#f5f5f5" stroke="#999" stroke-dasharray="3 2"/>
  <text x="116" y="204" font-size="9" text-anchor="middle" fill="#333">Chạy từ flash (XIP) hoặc RAM tạm,</text>
  <text x="116" y="217" font-size="9" text-anchor="middle" fill="#333">DRAM sẵn sàng ở cuối PEI</text>
  <rect x="230" y="184" width="312" height="48" rx="6" fill="#f5f5f5" stroke="#999" stroke-dasharray="3 2"/>
  <text x="386" y="204" font-size="9" text-anchor="middle" fill="#333">Chạy trong DRAM, có boot services:</text>
  <text x="386" y="217" font-size="9" text-anchor="middle" fill="#333">cấp phát bộ nhớ, protocol, event, timer</text>
  <rect x="554" y="184" width="204" height="48" rx="6" fill="#f5f5f5" stroke="#999" stroke-dasharray="3 2"/>
  <text x="656" y="204" font-size="9" text-anchor="middle" fill="#333">Kernel gọi GetVariable,</text>
  <text x="656" y="217" font-size="9" text-anchor="middle" fill="#333">SetVariable, ResetSystem...</text>
</svg>
