<svg role="img" viewBox="0 0 818 124" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Chuỗi boot GRUB trên BIOS: BIOS đọc boot.img trong MBR, boot.img nạp core.img, core.img nạp module và grub.cfg, cuối cùng GRUB nạp kernel</title>
  <rect x="0" y="0" width="818" height="124" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect x="20" y="20" width="130" height="84" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="85.0" y="58.7" font-size="11.5" font-weight="700" text-anchor="middle" fill="#333333">BIOS</text>
  <text x="85.0" y="73.7" font-size="10" text-anchor="middle" fill="#222">Đọc sector đầu</text>
  <rect x="182" y="20" width="130" height="84" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="247.0" y="58.7" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1d4278">boot.img</text>
  <text x="247.0" y="73.7" font-size="10" text-anchor="middle" fill="#222">MBR, 446 byte</text>
  <line x1="150" y1="62.0" x2="182" y2="62.0" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="344" y="20" width="130" height="84" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="409.0" y="58.7" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1d4278">core.img</text>
  <text x="409.0" y="73.7" font-size="10" text-anchor="middle" fill="#222">Kernel của GRUB</text>
  <line x1="312" y1="62.0" x2="344" y2="62.0" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="506" y="20" width="130" height="84" rx="8" fill="#fdf0e2" stroke="#c46a12" stroke-width="1.5"/>
  <text x="571.0" y="58.7" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7a3f06">module + grub.cfg</text>
  <text x="571.0" y="73.7" font-size="10" text-anchor="middle" fill="#222">Hiện menu</text>
  <line x1="474" y1="62.0" x2="506" y2="62.0" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="668" y="20" width="130" height="84" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="733.0" y="66.2" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b5e20">Kernel</text>
  <line x1="636" y1="62.0" x2="668" y2="62.0" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
