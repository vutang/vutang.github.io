<svg role="img" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Chuỗi boot nhiều stage: Boot ROM đọc boot mode và eFuse rồi nạp SPL hoặc FSBL vào SRAM, SPL khởi tạo clock và DDR, tùy chọn TF-A và TEE, sau đó U-Boot trong DRAM nạp kernel, DTB, initramfs, cuối cùng kernel mount rootfs và chạy init</title>
  <rect x="0" y="0" width="560" height="560" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect x="20" y="20" width="250" height="70" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="145.0" y="51.6" font-size="12.5" font-weight="700" text-anchor="middle" fill="#333333">Boot ROM</text>
  <text x="145.0" y="67.1" font-size="10.5" text-anchor="middle" fill="#222">Code cố định trong chip</text>
  <text x="300" y="43.0" font-size="11" font-weight="400" text-anchor="start" fill="#333">Đọc chân boot mode và eFuse,</text>
  <text x="300" y="59.0" font-size="11" font-weight="400" text-anchor="start" fill="#333">tìm boot media, nạp stage</text>
  <text x="300" y="75.0" font-size="11" font-weight="400" text-anchor="start" fill="#333">tiếp theo vào SRAM nội</text>
  <rect x="20" y="130" width="250" height="70" rx="8" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="145.0" y="161.6" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d4278">SPL / FSBL</text>
  <text x="145.0" y="177.1" font-size="10.5" text-anchor="middle" fill="#222">Chạy trong SRAM</text>
  <text x="300" y="153.0" font-size="11" font-weight="400" text-anchor="start" fill="#333">Nhỏ (vài chục đến vài trăm KB).</text>
  <text x="300" y="169.0" font-size="11" font-weight="400" text-anchor="start" fill="#333">Khởi tạo clock, DDR, nạp</text>
  <text x="300" y="185.0" font-size="11" font-weight="400" text-anchor="start" fill="#333">stage tiếp theo vào DRAM</text>
  <rect x="20" y="240" width="250" height="70" rx="8" fill="#f1eafb" stroke="#6a3fb0" stroke-width="1.5"/>
  <text x="145.0" y="271.6" font-size="12.5" font-weight="700" text-anchor="middle" fill="#44287a">TF-A / TEE (tùy chọn)</text>
  <text x="145.0" y="287.1" font-size="10.5" text-anchor="middle" fill="#222">ARMv8</text>
  <text x="300" y="271.0" font-size="11" font-weight="400" text-anchor="start" fill="#333">TF-A BL31 chạy ở EL3,</text>
  <text x="300" y="287.0" font-size="11" font-weight="400" text-anchor="start" fill="#333">OP-TEE chạy ở S-EL1</text>
  <rect x="20" y="350" width="250" height="70" rx="8" fill="#fdf0e2" stroke="#c46a12" stroke-width="1.5"/>
  <text x="145.0" y="381.6" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7a3f06">U-Boot</text>
  <text x="145.0" y="397.1" font-size="10.5" text-anchor="middle" fill="#222">Chạy trong DRAM</text>
  <text x="300" y="373.0" font-size="11" font-weight="400" text-anchor="start" fill="#333">Bootloader đầy đủ: driver, shell,</text>
  <text x="300" y="389.0" font-size="11" font-weight="400" text-anchor="start" fill="#333">network, filesystem. Nạp kernel,</text>
  <text x="300" y="405.0" font-size="11" font-weight="400" text-anchor="start" fill="#333">DTB và initramfs</text>
  <rect x="20" y="460" width="250" height="70" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="145.0" y="491.6" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1b5e20">Linux kernel</text>
  <text x="145.0" y="507.1" font-size="10.5" text-anchor="middle" fill="#222">Chạy trong DRAM</text>
  <text x="300" y="491.0" font-size="11" font-weight="400" text-anchor="start" fill="#333">Mount rootfs, chạy init</text>
  <text x="300" y="507.0" font-size="11" font-weight="400" text-anchor="start" fill="#333">(systemd, BusyBox init)</text>
  <line x1="145.0" y1="90" x2="145.0" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="145.0" y1="200" x2="145.0" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="145.0" y1="310" x2="145.0" y2="350" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="145.0" y1="420" x2="145.0" y2="460" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
