<svg role="img" viewBox="0 0 960 367.79" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>DPLL operating states and Linux lock-status values</title>
  <rect x="0" y="0" width="960" height="340" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1d4278">DPLL states (Linux lock-status names in monospace)</text>
  <rect x="40" y="130" width="190" height="60" rx="8" fill="#e2e8f0" stroke="#475569"/>
  <text x="135" y="156" font-size="12" text-anchor="middle" fill="#333" font-weight="700">Free-run</text>
  <text x="135" y="174" font-size="10.5" text-anchor="middle" fill="#333" font-family="DejaVu Sans Mono, monospace">UNLOCKED</text>
  <rect x="300" y="130" width="190" height="60" rx="8" fill="#2f5d9e" stroke="#475569"/>
  <text x="395" y="156" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">Locked</text>
  <text x="395" y="174" font-size="10.5" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">LOCKED</text>
  <rect x="560" y="130" width="190" height="60" rx="8" fill="#2f5d9e" stroke="#475569"/>
  <text x="655" y="156" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">Locked, history ready</text>
  <text x="655" y="174" font-size="10.5" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">LOCKED_HO_ACQ</text>
  <rect x="560" y="250" width="190" height="60" rx="8" fill="#e2e8f0" stroke="#475569"/>
  <text x="655" y="276" font-size="12" text-anchor="middle" fill="#333" font-weight="700">Holdover</text>
  <text x="655" y="294" font-size="10.5" text-anchor="middle" fill="#333" font-family="DejaVu Sans Mono, monospace">HOLDOVER</text>
  <line x1="230" y1="150" x2="300" y2="150" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="265" y="142" font-size="10" text-anchor="middle" fill="#555">valid input</text>
  <line x1="300" y1="175" x2="230" y2="175" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="265" y="192" font-size="10" text-anchor="middle" fill="#555">input lost</text>
  <line x1="490" y1="160" x2="560" y2="160" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="525" y="152" font-size="10" text-anchor="middle" fill="#555">enough</text>
  <text x="525" y="176" font-size="10" text-anchor="middle" fill="#555">history</text>
  <line x1="655" y1="190" x2="655" y2="250" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="662" y="224" font-size="10" text-anchor="start" fill="#555">input lost</text>
  <path d="M560,280 L395,280 L395,190" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="478" y="298" font-size="10" text-anchor="middle" fill="#555">valid input returns</text>
  <text x="480" y="72" font-size="10.5" text-anchor="middle" fill="#333">Free-run: output follows the local oscillator only. Holdover: output keeps the last learned frequency.</text>
  <text x="480" y="90" font-size="10.5" text-anchor="middle" fill="#333">Losing the input before history is ready falls back to free-run, not holdover.</text>
<text id="wm" x="948.88" y="359.45" text-anchor="end" font-size="13.89" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
