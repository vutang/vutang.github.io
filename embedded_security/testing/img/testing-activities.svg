<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="410" fill="#ffffff"/>
<text x="600.0" y="38" font-size="24" font-weight="700" fill="#1c1c1a" text-anchor="middle">Các loại hoạt động kiểm thử bảo mật</text>
<rect x="30" y="80" width="210" height="250" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
<text x="135.0" y="171.0" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="middle">Quét lỗ hổng</text>
<text x="135.0" y="194.0" font-size="13" fill="#5F5E5A" text-anchor="middle">Thiết bị có lỗ hổng</text>
<text x="135.0" y="213.0" font-size="13" fill="#5F5E5A" text-anchor="middle">đã biết nào?</text>
<text x="135.0" y="232.0" font-size="13" fill="#5F5E5A" text-anchor="middle"></text>
<text x="135.0" y="251.0" font-size="13" fill="#5F5E5A" text-anchor="middle">Tự động, định kỳ</text>
<rect x="262" y="80" width="210" height="250" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="367.0" y="171.0" font-size="16" font-weight="700" fill="#0C447C" text-anchor="middle">Review mã nguồn</text>
<text x="367.0" y="194.0" font-size="13" fill="#185FA5" text-anchor="middle">Mã có điểm yếu</text>
<text x="367.0" y="213.0" font-size="13" fill="#185FA5" text-anchor="middle">nào?</text>
<text x="367.0" y="232.0" font-size="13" fill="#185FA5" text-anchor="middle"></text>
<text x="367.0" y="251.0" font-size="13" fill="#185FA5" text-anchor="middle">White-box</text>
<rect x="494" y="80" width="210" height="250" rx="12" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
<text x="599.0" y="171.0" font-size="16" font-weight="700" fill="#3C3489" text-anchor="middle">Penetration test</text>
<text x="599.0" y="194.0" font-size="13" fill="#534AB7" text-anchor="middle">Kẻ tấn công khai thác</text>
<text x="599.0" y="213.0" font-size="13" fill="#534AB7" text-anchor="middle">được gì trong phạm vi</text>
<text x="599.0" y="232.0" font-size="13" fill="#534AB7" text-anchor="middle">đã thỏa thuận?</text>
<text x="599.0" y="251.0" font-size="13" fill="#534AB7" text-anchor="middle">Thủ công, có thời hạn</text>
<rect x="726" y="80" width="210" height="250" rx="12" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<text x="831.0" y="171.0" font-size="16" font-weight="700" fill="#712B13" text-anchor="middle">Red team</text>
<text x="831.0" y="194.0" font-size="13" fill="#993C1D" text-anchor="middle">Tổ chức có phát hiện</text>
<text x="831.0" y="213.0" font-size="13" fill="#993C1D" text-anchor="middle">và phản ứng được với</text>
<text x="831.0" y="232.0" font-size="13" fill="#993C1D" text-anchor="middle">tấn công thật không?</text>
<text x="831.0" y="251.0" font-size="13" fill="#993C1D" text-anchor="middle">Theo kịch bản mối đe dọa</text>
<rect x="958" y="80" width="210" height="250" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<text x="1063.0" y="171.0" font-size="16" font-weight="700" fill="#633806" text-anchor="middle">Audit tuân thủ</text>
<text x="1063.0" y="194.0" font-size="13" fill="#854F0B" text-anchor="middle">Sản phẩm có đáp ứng</text>
<text x="1063.0" y="213.0" font-size="13" fill="#854F0B" text-anchor="middle">yêu cầu của tiêu chuẩn</text>
<text x="1063.0" y="232.0" font-size="13" fill="#854F0B" text-anchor="middle">không?</text>
<text x="1063.0" y="251.0" font-size="13" fill="#854F0B" text-anchor="middle">Theo test case của khung</text>
<text x="600" y="380" font-size="14" font-style="italic" fill="#5F5E5A" text-anchor="middle">Mỗi hoạt động trả lời một câu hỏi khác nhau; một sản phẩm thường cần kết hợp nhiều hoạt động.</text>
</svg>
