<svg xmlns="http://www.w3.org/2000/svg" width="900" height="730" viewBox="0 0 900 730">
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="900" height="730" fill="#ffffff"/>
<text x="450" y="40" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1c1c1a" text-anchor="middle">Cơ chế chấm điểm rủi ro (Active Risk Score)</text>
<text x="450" y="65" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F5E5A" text-anchor="middle">(diễn ra tại Security Console, sau khi nhận kết quả phát hiện lỗ hổng)</text>

<!-- Box 1 -->
<rect x="200" y="100" width="500" height="90" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
<text x="450" y="137" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#04342C" text-anchor="middle">1. Tính điểm ảnh hưởng (CVSS Impact)</text>
<text x="450" y="163" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F6E56" text-anchor="middle">Confidentiality, Integrity, Availability</text>

<line x1="450" y1="190" x2="450" y2="230" stroke="#888780" stroke-width="1.8" marker-end="url(#arrow3)"/>

<!-- Box 2 -->
<rect x="200" y="230" width="500" height="90" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
<text x="450" y="267" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#04342C" text-anchor="middle">2. Cộng thêm threat intelligence</text>
<text x="450" y="293" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F6E56" text-anchor="middle">AttackerKB, Metasploit, CISA KEV...</text>

<line x1="450" y1="320" x2="450" y2="360" stroke="#888780" stroke-width="1.8" marker-end="url(#arrow3)"/>

<!-- Box 3 (highlight) -->
<rect x="200" y="360" width="500" height="90" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="2.5"/>
<text x="450" y="397" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#412402" text-anchor="middle">3. Điểm rủi ro từng lỗ hổng</text>
<text x="450" y="423" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#854F0B" text-anchor="middle">Active Risk Score (0–1000)</text>

<line x1="450" y1="450" x2="450" y2="490" stroke="#888780" stroke-width="1.8" marker-end="url(#arrow3)"/>

<!-- Box 4 -->
<rect x="200" y="490" width="500" height="90" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="450" y="527" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#26215C" text-anchor="middle">4. Tổng hợp theo tài sản</text>
<text x="450" y="553" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#3C3489" text-anchor="middle">Ưu tiên lỗ hổng nặng nhất</text>

<line x1="450" y1="580" x2="450" y2="620" stroke="#888780" stroke-width="1.8" marker-end="url(#arrow3)"/>

<!-- Box 5 -->
<rect x="200" y="620" width="500" height="90" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="450" y="657" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#26215C" text-anchor="middle">5. Điều chỉnh &amp; tổng hợp lên cấp cao hơn</text>
<text x="450" y="683" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#3C3489" text-anchor="middle">Criticality · Asset Group · Site Risk Score</text>
</svg>
