<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
<defs>
<marker id="arrowL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="1000" height="460" fill="#ffffff"/>
<text x="500" y="26" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1c1c1a" text-anchor="middle">Hai mô hình chạy InsightVM trên laptop</text>

<line x1="500" y1="55" x2="500" y2="420" stroke="#D3D1C7" stroke-width="1.5"/>

<!-- LEFT PANEL -->
<text x="230" y="60" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1c1c1a" text-anchor="middle">Mô hình 1: All-in-one</text>

<rect x="40" y="85" width="380" height="175" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="60" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5F5E5A">Laptop</text>

<rect x="70" y="125" width="320" height="105" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="230" y="153" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26215C" text-anchor="middle">Security Console</text>
<text x="230" y="175" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26215C" text-anchor="middle">+ Scan Engine + DB</text>
<text x="230" y="197" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3C3489" text-anchor="middle">(cùng 1 máy – localhost)</text>

<rect x="130" y="340" width="200" height="70" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<text x="230" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#412402" text-anchor="middle">Mạng tại chỗ</text>
<text x="230" y="389" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#854F0B" text-anchor="middle">(target)</text>

<line x1="230" y1="230" x2="230" y2="338" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrowL)"/>
<text x="260" y="285" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="start">All TCP &amp; UDP</text>

<!-- RIGHT PANEL -->
<text x="770" y="60" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1c1c1a" text-anchor="middle">Mô hình 2: Engine-only (Docker)</text>

<rect x="580" y="85" width="380" height="100" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="600" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5F5E5A">Trụ sở công ty</text>
<rect x="610" y="120" width="320" height="55" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="770" y="152" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#26215C" text-anchor="middle">Security Console (cố định)</text>

<rect x="580" y="205" width="380" height="100" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="600" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5F5E5A">Laptop mang đến hiện trường</text>
<rect x="610" y="240" width="320" height="55" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
<text x="770" y="272" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#04342C" text-anchor="middle">Scan Engine (Docker container)</text>

<rect x="670" y="340" width="200" height="70" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<text x="770" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#412402" text-anchor="middle">Mạng khách hàng</text>
<text x="770" y="389" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#854F0B" text-anchor="middle">(target)</text>

<line x1="750" y1="238" x2="750" y2="177" stroke="#5F5E5A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowL)"/>
<text x="790" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="start">reverse pairing</text>
<text x="790" y="216" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="start">TCP 40815</text>

<line x1="770" y1="295" x2="770" y2="338" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrowL)"/>
<text x="800" y="322" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="start">All TCP &amp; UDP</text>
</svg>
