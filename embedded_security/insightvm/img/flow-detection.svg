<!-- Box 2 -->
<rect x="200" y="235" width="500" height="90" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
<text x="450" y="272" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#04342C" text-anchor="middle">2. Fingerprinting (Recog)</text>
<text x="450" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F6E56" text-anchor="middle">Khớp banner theo regex</text>

<line x1="450" y1="325" x2="450" y2="370" stroke="#888780" stroke-width="1.8" marker-end="url(#arrow2)"/>

