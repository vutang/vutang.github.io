<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="900" height="640" fill="#ffffff"/>
<text x="450" y="40" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1c1c1a" text-anchor="middle">Cơ chế phát hiện lỗ hổng</text>
<text x="450" y="65" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F5E5A" text-anchor="middle">(diễn ra bên trong Scan Engine / Insight Agent)</text>

<!-- Box 1 -->
<rect x="200" y="95" width="500" height="90" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
<text x="450" y="132" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#04342C" text-anchor="middle">1. Quét cổng &amp; dịch vụ</text>
<text x="450" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F6E56" text-anchor="middle">Port scan, banner grabbing</text>

