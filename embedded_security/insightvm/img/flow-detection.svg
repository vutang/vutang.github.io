<rect x="200" y="375" width="500" height="90" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/>
<text x="450" y="412" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#412402" text-anchor="middle">3. So khớp lỗ hổng</text>
<text x="450" y="438" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#854F0B" text-anchor="middle">Đối chiếu CSDL CVE</text>

<line x1="450" y1="465" x2="450" y2="510" stroke="#888780" stroke-width="1.8" marker-end="url(#arrow2)"/>

