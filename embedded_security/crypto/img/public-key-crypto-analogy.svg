<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 662" role="img" font-family="DejaVu Sans">
  <title>Everyday analogies for a key pair: an open padlock and its key for encryption, a seal and its public sample for signatures, and paint mixing for key agreement.</title>
  <rect x="0" y="0" width="760" height="640" rx="8" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1f2d3d">Encryption <tspan font-weight="normal" font-size="13" fill="#2c3a42">open padlock = Bob's public key, key = Bob's private key</tspan></text>
  <rect x="20" y="40" width="216" height="150" rx="8" fill="#f4f6f8" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="272" y="40" width="216" height="150" rx="8" fill="#f4f6f8" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="524" y="40" width="216" height="150" rx="8" fill="#f4f6f8" stroke="#cfd8dc" stroke-width="1.2"/>
  <line x1="238" y1="115" x2="268" y2="115" stroke="#78909c" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="490" y1="115" x2="520" y2="115" stroke="#78909c" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="48" y="74" width="76" height="48" rx="3" fill="#ffffff" stroke="#2c3a42" stroke-width="1.8"/>
  <polyline points="48,74 86.0,100.4 124,74" fill="none" stroke="#2c3a42" stroke-width="1.8"/>
  <path d="M160,90 v-18 a10,10 0 0 1 20,0 v4" fill="none" stroke="#2e7d4f" stroke-width="4" stroke-linecap="round"/>
  <rect x="154" y="90" width="32" height="26" rx="4" fill="#2e7d4f"/>
  <circle cx="170" cy="101" r="3.5" fill="#ffffff"/><rect x="168.5" y="102" width="3" height="8" fill="#ffffff"/>
  <text x="168" y="138" text-anchor="middle" font-size="13" fill="#2e7d4f">Bob's public key</text>
  <text x="128" y="160" text-anchor="middle" font-size="13" fill="#2c3a42">Alice snaps Bob's open</text>
  <text x="128" y="177" text-anchor="middle" font-size="13" fill="#2c3a42">padlock shut on the box</text>
  <rect x="342" y="66" width="76" height="48" rx="3" fill="#ffffff" stroke="#2c3a42" stroke-width="1.8"/>
  <polyline points="342,66 380.0,92.4 418,66" fill="none" stroke="#2c3a42" stroke-width="1.8"/>
  <path d="M370,96 v-8 a10,10 0 0 1 20,0 v8" fill="none" stroke="#2e7d4f" stroke-width="4"/>
  <rect x="364" y="96" width="32" height="26" rx="4" fill="#2e7d4f"/>
  <circle cx="380" cy="107" r="3.5" fill="#ffffff"/><rect x="378.5" y="108" width="3" height="8" fill="#ffffff"/>
  <text x="380" y="160" text-anchor="middle" font-size="13" fill="#2c3a42">Nobody can open it in</text>
  <text x="380" y="177" text-anchor="middle" font-size="13" fill="#2c3a42">transit, not even Alice</text>
  <rect x="546" y="74" width="76" height="48" rx="3" fill="#ffffff" stroke="#2c3a42" stroke-width="1.8"/>
  <polyline points="546,74 584.0,100.4 622,74" fill="none" stroke="#2c3a42" stroke-width="1.8"/>
  <path d="M636,90 v-18 a10,10 0 0 1 20,0 v4" fill="none" stroke="#2e7d4f" stroke-width="4" stroke-linecap="round"/>
  <rect x="630" y="90" width="32" height="26" rx="4" fill="#2e7d4f"/>
  <circle cx="646" cy="101" r="3.5" fill="#ffffff"/><rect x="644.5" y="102" width="3" height="8" fill="#ffffff"/>
  <circle cx="676" cy="80" r="8" fill="none" stroke="#c0392b" stroke-width="3.5"/>
  <path d="M684,80 h30 M707,80 v7 M713,80 v7" fill="none" stroke="#c0392b" stroke-width="3.5"/>
  <text x="664" y="138" text-anchor="middle" font-size="13" fill="#c0392b">Bob's private key</text>
  <text x="632" y="160" text-anchor="middle" font-size="13" fill="#2c3a42">Only Bob's private key</text>
  <text x="632" y="177" text-anchor="middle" font-size="13" fill="#2c3a42">opens the padlock</text>
  <text x="20" y="228" font-size="15" font-weight="bold" fill="#1f2d3d">Digital signature <tspan font-weight="normal" font-size="13" fill="#2c3a42">seal = Alice's private key, seal sample = Alice's public key</tspan></text>
  <rect x="20" y="240" width="216" height="150" rx="8" fill="#f4f6f8" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="272" y="240" width="216" height="150" rx="8" fill="#f4f6f8" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="524" y="240" width="216" height="150" rx="8" fill="#f4f6f8" stroke="#cfd8dc" stroke-width="1.2"/>
  <line x1="238" y1="315" x2="268" y2="315" stroke="#78909c" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="490" y1="315" x2="520" y2="315" stroke="#78909c" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="50" y="252" width="58" height="72" rx="3" fill="#ffffff" stroke="#2c3a42" stroke-width="1.8"/>
  <line x1="59" y1="265" x2="99" y2="265" stroke="#90a4ae" stroke-width="2"/>
  <line x1="59" y1="274" x2="99" y2="274" stroke="#90a4ae" stroke-width="2"/>
  <line x1="59" y1="283" x2="99" y2="283" stroke="#90a4ae" stroke-width="2"/>
  <line x1="59" y1="292" x2="87" y2="292" stroke="#90a4ae" stroke-width="2"/>
  <circle cx="79" cy="306" r="13" fill="#ffffff" stroke="#a23b72" stroke-width="2.5"/>
  <text x="79" y="311" text-anchor="middle" font-size="14" font-weight="bold" fill="#a23b72">A</text>
  <circle cx="170" cy="266" r="8" fill="#c0392b"/>
  <rect x="166" y="272" width="8" height="20" fill="#c0392b"/>
  <rect x="152" y="291" width="36" height="11" rx="3" fill="#c0392b"/>
  <text x="156" y="338" text-anchor="middle" font-size="13" fill="#c0392b">Alice's private key</text>
  <text x="128" y="360" text-anchor="middle" font-size="13" fill="#2c3a42">Alice stamps the document</text>
  <text x="128" y="377" text-anchor="middle" font-size="13" fill="#2c3a42">with a seal only Alice owns</text>
  <rect x="290" y="252" width="58" height="72" rx="3" fill="#ffffff" stroke="#2c3a42" stroke-width="1.8"/>
  <line x1="299" y1="265" x2="339" y2="265" stroke="#90a4ae" stroke-width="2"/>
  <line x1="299" y1="274" x2="339" y2="274" stroke="#90a4ae" stroke-width="2"/>
  <line x1="299" y1="283" x2="339" y2="283" stroke="#90a4ae" stroke-width="2"/>
  <line x1="299" y1="292" x2="327" y2="292" stroke="#90a4ae" stroke-width="2"/>
  <circle cx="319" cy="306" r="13" fill="#ffffff" stroke="#a23b72" stroke-width="2.5"/>
  <text x="319" y="311" text-anchor="middle" font-size="14" font-weight="bold" fill="#a23b72">A</text>
  <text x="372" y="302" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">=</text>
  <circle cx="412" cy="296" r="13" fill="#ffffff" stroke="#2e7d4f" stroke-width="2.5"/>
  <text x="412" y="301" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d4f">A</text>
  <text x="412" y="332" text-anchor="middle" font-size="13" fill="#2e7d4f">public sample</text>
  <path d="M442,270 l8,9 l16,-18" fill="none" stroke="#2e7d4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="380" y="360" text-anchor="middle" font-size="13" fill="#2c3a42">Anyone compares the imprint</text>
  <text x="380" y="377" text-anchor="middle" font-size="13" fill="#2c3a42">with Alice's public sample</text>
  <rect x="564" y="252" width="58" height="72" rx="3" fill="#ffffff" stroke="#2c3a42" stroke-width="1.8"/>
  <line x1="573" y1="265" x2="613" y2="265" stroke="#90a4ae" stroke-width="2"/>
  <line x1="573" y1="274" x2="613" y2="274" stroke="#c0392b" stroke-width="3"/>
  <line x1="573" y1="283" x2="613" y2="283" stroke="#90a4ae" stroke-width="2"/>
  <line x1="573" y1="292" x2="601" y2="292" stroke="#90a4ae" stroke-width="2"/>
  <circle cx="593" cy="306" r="13" fill="#ffffff" stroke="#a23b72" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="593" y="311" text-anchor="middle" font-size="14" font-weight="bold" fill="#a23b72">A</text>
  <path d="M674,278 l18,18 M692,278 l-18,18" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <text x="632" y="360" text-anchor="middle" font-size="13" fill="#2c3a42">Content changed:</text>
  <text x="632" y="377" text-anchor="middle" font-size="13" fill="#2c3a42">signature check fails</text>
  <text x="20" y="428" font-size="15" font-weight="bold" fill="#1f2d3d">Key agreement <tspan font-weight="normal" font-size="13" fill="#2c3a42">secret colors never leave Alice or Bob</tspan></text>
  <rect x="20" y="440" width="216" height="150" rx="8" fill="#f4f6f8" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="524" y="440" width="216" height="150" rx="8" fill="#f4f6f8" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="272" y="440" width="216" height="150" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
  <text x="128" y="460" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2d3d">Alice</text>
  <circle cx="50" cy="490" r="13" fill="#f2c94c" stroke="#2c3a42" stroke-width="1"/>
  <circle cx="115" cy="490" r="13" fill="#d9534f" stroke="#2c3a42" stroke-width="1"/>
  <circle cx="180" cy="490" r="13" fill="#e8833a" stroke="#2c3a42" stroke-width="1"/>
  <text x="82" y="496" text-anchor="middle" font-size="18" fill="#1f2d3d">+</text>
  <text x="147" y="496" text-anchor="middle" font-size="18" fill="#1f2d3d">=</text>
  <text x="115" y="520" text-anchor="middle" font-size="13" fill="#c0392b">secret</text>
  <circle cx="50" cy="540" r="13" fill="#6aa84f" stroke="#2c3a42" stroke-width="1"/>
  <circle cx="115" cy="540" r="13" fill="#d9534f" stroke="#2c3a42" stroke-width="1"/>
  <circle cx="180" cy="540" r="13" fill="#8b5a2b" stroke="#2c3a42" stroke-width="1"/>
  <text x="82" y="546" text-anchor="middle" font-size="18" fill="#1f2d3d">+</text>
  <text x="147" y="546" text-anchor="middle" font-size="18" fill="#1f2d3d">=</text>
  <text x="180" y="572" text-anchor="middle" font-size="13" fill="#2f5d9e">shared secret</text>
  <text x="632" y="460" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2d3d">Bob</text>
  <circle cx="580" cy="490" r="13" fill="#6aa84f" stroke="#2c3a42" stroke-width="1"/>
  <circle cx="645" cy="490" r="13" fill="#f2c94c" stroke="#2c3a42" stroke-width="1"/>
  <circle cx="710" cy="490" r="13" fill="#3b7dd8" stroke="#2c3a42" stroke-width="1"/>
  <text x="613" y="496" text-anchor="middle" font-size="18" fill="#1f2d3d">=</text>
  <text x="678" y="496" text-anchor="middle" font-size="18" fill="#1f2d3d">+</text>
  <text x="710" y="520" text-anchor="middle" font-size="13" fill="#c0392b">secret</text>
  <circle cx="580" cy="540" r="13" fill="#8b5a2b" stroke="#2c3a42" stroke-width="1"/>
  <circle cx="645" cy="540" r="13" fill="#e8833a" stroke="#2c3a42" stroke-width="1"/>
  <circle cx="710" cy="540" r="13" fill="#3b7dd8" stroke="#2c3a42" stroke-width="1"/>
  <text x="613" y="546" text-anchor="middle" font-size="18" fill="#1f2d3d">=</text>
  <text x="678" y="546" text-anchor="middle" font-size="18" fill="#1f2d3d">+</text>
  <text x="580" y="572" text-anchor="middle" font-size="13" fill="#2f5d9e">shared secret</text>
  <text x="380" y="460" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2d3d">Public channel</text>
  <line x1="276" y1="490" x2="484" y2="534" stroke="#78909c" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="484" y1="490" x2="276" y2="534" stroke="#78909c" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="324" cy="501" r="9" fill="#e8833a" stroke="#2c3a42" stroke-width="1"/>
  <circle cx="436" cy="501" r="9" fill="#6aa84f" stroke="#2c3a42" stroke-width="1"/>
  <text x="380" y="564" text-anchor="middle" font-size="13" fill="#2c3a42">Eavesdropper sees</text>
  <circle cx="350" cy="578" r="8" fill="#f2c94c" stroke="#2c3a42" stroke-width="1"/>
  <circle cx="380" cy="578" r="8" fill="#e8833a" stroke="#2c3a42" stroke-width="1"/>
  <circle cx="410" cy="578" r="8" fill="#6aa84f" stroke="#2c3a42" stroke-width="1"/>
  <text x="380" y="620" text-anchor="middle" font-size="13" fill="#2c3a42">Mixing paint is easy, unmixing is not: the eavesdropper cannot make the brown shared secret.</text>
<text id="wm" x="751.2" y="655.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
