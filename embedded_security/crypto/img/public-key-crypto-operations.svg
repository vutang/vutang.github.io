<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" role="img" font-family="DejaVu Sans">
  <title>Three uses of a public-key pair: encryption with the recipient public key, digital signature with the signer private key, and key agreement producing the same shared secret on both sides.</title>
  <rect x="0" y="0" width="760" height="380" rx="8" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs>
  <text x="20" y="30" font-size="15" font-weight="bold" fill="#1f2d3d">Encryption <tspan font-weight="normal" font-size="13" fill="#2c3a42">(confidentiality)</tspan></text>
  <rect x="20" y="42" width="162" height="60" rx="6" fill="#f4f6f8" stroke="#78909c" stroke-width="1.5"/>
  <text x="101.0" y="77.0" text-anchor="middle" font-size="14" fill="#1f2d3d">Plaintext</text>
  <line x1="184" y1="72.0" x2="203" y2="72.0" stroke="#78909c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="206" y="42" width="162" height="60" rx="6" fill="#e8f5ec" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="287.0" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2d3d">Encrypt</text>
  <text x="287.0" y="88.0" text-anchor="middle" font-size="13" fill="#2e7d4f">Bob's public key</text>
  <line x1="370" y1="72.0" x2="389" y2="72.0" stroke="#78909c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="392" y="42" width="162" height="60" rx="6" fill="#f4f6f8" stroke="#78909c" stroke-width="1.5"/>
  <text x="473.0" y="77.0" text-anchor="middle" font-size="14" fill="#1f2d3d">Ciphertext</text>
  <line x1="556" y1="72.0" x2="575" y2="72.0" stroke="#78909c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="578" y="42" width="162" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="659.0" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2d3d">Decrypt</text>
  <text x="659.0" y="88.0" text-anchor="middle" font-size="13" fill="#c0392b">Bob's private key</text>
  <text x="20" y="150" font-size="15" font-weight="bold" fill="#1f2d3d">Digital signature <tspan font-weight="normal" font-size="13" fill="#2c3a42">(authenticity, integrity)</tspan></text>
  <rect x="20" y="162" width="162" height="60" rx="6" fill="#f4f6f8" stroke="#78909c" stroke-width="1.5"/>
  <text x="101.0" y="197.0" text-anchor="middle" font-size="14" fill="#1f2d3d">Message</text>
  <line x1="184" y1="192.0" x2="203" y2="192.0" stroke="#78909c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="206" y="162" width="162" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="287.0" y="187.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2d3d">Sign</text>
  <text x="287.0" y="208.0" text-anchor="middle" font-size="13" fill="#c0392b">Alice's private key</text>
  <line x1="370" y1="192.0" x2="389" y2="192.0" stroke="#78909c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="392" y="162" width="162" height="60" rx="6" fill="#f4f6f8" stroke="#78909c" stroke-width="1.5"/>
  <text x="473.0" y="197.0" text-anchor="middle" font-size="13" fill="#1f2d3d">Message + signature</text>
  <line x1="556" y1="192.0" x2="575" y2="192.0" stroke="#78909c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="578" y="162" width="162" height="60" rx="6" fill="#e8f5ec" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="659.0" y="187.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2d3d">Verify</text>
  <text x="659.0" y="208.0" text-anchor="middle" font-size="13" fill="#2e7d4f">Alice's public key</text>
  <text x="20" y="270" font-size="15" font-weight="bold" fill="#1f2d3d">Key agreement <tspan font-weight="normal" font-size="13" fill="#2c3a42">(shared secret for symmetric encryption)</tspan></text>
  <rect x="20" y="282" width="240" height="70" rx="6" fill="#f4f6f8" stroke="#78909c" stroke-width="1.5"/>
  <text x="140.0" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2d3d">Alice</text>
  <text x="140.0" y="324" text-anchor="middle" font-size="13" fill="#2c3a42">own private key</text>
  <text x="140.0" y="342" text-anchor="middle" font-size="13" fill="#2c3a42">+ Bob's public key</text>
  <rect x="500" y="282" width="240" height="70" rx="6" fill="#f4f6f8" stroke="#78909c" stroke-width="1.5"/>
  <text x="620.0" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2d3d">Bob</text>
  <text x="620.0" y="324" text-anchor="middle" font-size="13" fill="#2c3a42">own private key</text>
  <text x="620.0" y="342" text-anchor="middle" font-size="13" fill="#2c3a42">+ Alice's public key</text>
  <rect x="300" y="282" width="160" height="70" rx="6" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="380.0" y="312.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2d3d">Shared secret</text>
  <text x="380.0" y="333.0" text-anchor="middle" font-size="13" fill="#2f5d9e">same on both sides</text>
  <line x1="262" y1="317" x2="297" y2="317" stroke="#78909c" stroke-width="2" marker-end="url(#a)"/>
  <line x1="498" y1="317" x2="463" y2="317" stroke="#78909c" stroke-width="2" marker-end="url(#a)"/>
<text id="wm" x="751.2" y="395.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
