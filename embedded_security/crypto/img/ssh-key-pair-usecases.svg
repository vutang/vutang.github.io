<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" role="img" font-family="DejaVu Sans">
  <title>One SSH key pair: the private key stays on the laptop, the public key is registered on a server, as a GitHub authentication key and as a GitHub signing key.</title>
  <rect x="0" y="0" width="760" height="360" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#78909c"/>
    </marker>
  </defs>

  <!-- Laptop -->
  <rect x="20" y="40" width="250" height="280" rx="8" fill="#f4f6f8" stroke="#78909c" stroke-width="1.5"/>
  <text x="145" y="68" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2d3d">Developer laptop</text>

  <rect x="40" y="90" width="210" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="145" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Private key</text>
  <text x="145" y="138" text-anchor="middle" font-size="13" font-family="DejaVu Sans Mono" fill="#1f2d3d">~/.ssh/id_ed25519</text>
  <text x="145" y="160" text-anchor="middle" font-size="13" fill="#2c3a42">never leaves this machine</text>

  <rect x="40" y="200" width="210" height="90" rx="6" fill="#e8f5ec" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="145" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d4f">Public key</text>
  <text x="145" y="248" text-anchor="middle" font-size="13" font-family="DejaVu Sans Mono" fill="#1f2d3d">id_ed25519.pub</text>
  <text x="145" y="270" text-anchor="middle" font-size="13" fill="#2c3a42">copied to verifiers</text>

  <!-- Targets -->
  <rect x="400" y="30" width="340" height="88" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="570" y="56" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d3d">Server / board</text>
  <text x="570" y="80" text-anchor="middle" font-size="13" font-family="DejaVu Sans Mono" fill="#1f2d3d">~/.ssh/authorized_keys</text>
  <text x="570" y="103" text-anchor="middle" font-size="13" fill="#2f5d9e">use case: SSH login</text>

  <rect x="400" y="136" width="340" height="88" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="570" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d3d">GitHub account</text>
  <text x="570" y="186" text-anchor="middle" font-size="13" fill="#1f2d3d">SSH key, type Authentication</text>
  <text x="570" y="209" text-anchor="middle" font-size="13" fill="#2f5d9e">use case: git clone / push over SSH</text>

  <rect x="400" y="242" width="340" height="88" rx="8" fill="#f7eaf1" stroke="#a23b72" stroke-width="1.5"/>
  <text x="570" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d3d">GitHub account</text>
  <text x="570" y="292" text-anchor="middle" font-size="13" fill="#1f2d3d">SSH key, type Signing</text>
  <text x="570" y="315" text-anchor="middle" font-size="13" fill="#a23b72">use case: verify signed commits</text>

  <!-- Arrows -->
  <path d="M250,245 C320,245 330,74 398,74" fill="none" stroke="#78909c" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M250,245 C320,245 330,180 398,180" fill="none" stroke="#78909c" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M250,245 C320,245 330,286 398,286" fill="none" stroke="#78909c" stroke-width="2" marker-end="url(#arr)"/>

  <text x="145" y="345" text-anchor="middle" font-size="13" fill="#2c3a42">Private key signs, public key verifies</text>
<text id="wm" x="751.2" y="375.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
