<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="600.0" y="38" font-size="24" font-weight="700" fill="#1c1c1a" text-anchor="middle">Lộ trình đánh giá sự phù hợp tại EU</text>
