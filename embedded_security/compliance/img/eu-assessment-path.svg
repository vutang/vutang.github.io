<text x="1007.0" y="411.0" font-size="13" fill="#5F5E5A" text-anchor="middle">Chứng nhận theo chương trình của EU</text>
<text x="1007.0" y="430.0" font-size="13" fill="#5F5E5A" text-anchor="middle">(mức tối thiểu substantial) khi được yêu cầu</text>
