<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="480" fill="#ffffff"/>
<text x="600.0" y="38" font-size="24" font-weight="700" fill="#1c1c1a" text-anchor="middle">Bốn cơ chế đánh giá sự phù hợp</text>
<rect x="30" y="80" width="265" height="300" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
<text x="162.5" y="164.5" font-size="17" font-weight="700" fill="#04342C" text-anchor="middle">1. Tự công bố</text>
<text x="162.5" y="188.5" font-size="14" fill="#0F6E56" text-anchor="middle">Nhà sản xuất tự đánh giá</text>
<text x="162.5" y="208.5" font-size="14" fill="#0F6E56" text-anchor="middle"></text>
<text x="162.5" y="228.5" font-size="14" fill="#0F6E56" text-anchor="middle">Kết quả: DoC hoặc</text>
<text x="162.5" y="248.5" font-size="14" fill="#0F6E56" text-anchor="middle">statement of compliance,</text>
<text x="162.5" y="268.5" font-size="14" fill="#0F6E56" text-anchor="middle">hồ sơ kỹ thuật</text>
<text x="162.5" y="288.5" font-size="14" fill="#0F6E56" text-anchor="middle"></text>
<text x="162.5" y="308.5" font-size="14" fill="#0F6E56" text-anchor="middle">CE Module A, UK PSTI</text>
<line x1="295" y1="230" x2="320" y2="230" stroke="#888780" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="325" y="80" width="265" height="300" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="457.5" y="164.5" font-size="17" font-weight="700" fill="#0C447C" text-anchor="middle">2. Bên thứ ba theo luật</text>
<text x="457.5" y="188.5" font-size="14" fill="#185FA5" text-anchor="middle">Notified Body do nhà nước</text>
<text x="457.5" y="208.5" font-size="14" fill="#185FA5" text-anchor="middle">chỉ định</text>
<text x="457.5" y="228.5" font-size="14" fill="#185FA5" text-anchor="middle">Kết quả: EU-type</text>
<text x="457.5" y="248.5" font-size="14" fill="#185FA5" text-anchor="middle">examination certificate</text>
<text x="457.5" y="268.5" font-size="14" fill="#185FA5" text-anchor="middle">hoặc phê duyệt hệ thống</text>
<text x="457.5" y="288.5" font-size="14" fill="#185FA5" text-anchor="middle"></text>
<text x="457.5" y="308.5" font-size="14" fill="#185FA5" text-anchor="middle">RED, CRA: Module B+C, H</text>
<line x1="590" y1="230" x2="615" y2="230" stroke="#888780" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620" y="80" width="265" height="300" rx="12" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
<text x="752.5" y="154.5" font-size="17" font-weight="700" fill="#3C3489" text-anchor="middle">3. Chương trình chứng nhận</text>
<text x="752.5" y="178.5" font-size="14" fill="#534AB7" text-anchor="middle">Lab được công nhận</text>
<text x="752.5" y="198.5" font-size="14" fill="#534AB7" text-anchor="middle">ISO/IEC 17025 và</text>
<text x="752.5" y="218.5" font-size="14" fill="#534AB7" text-anchor="middle">tổ chức chứng nhận</text>
<text x="752.5" y="238.5" font-size="14" fill="#534AB7" text-anchor="middle">Kết quả: chứng nhận</text>
<text x="752.5" y="258.5" font-size="14" fill="#534AB7" text-anchor="middle">hoặc báo cáo đánh giá</text>
<text x="752.5" y="278.5" font-size="14" fill="#534AB7" text-anchor="middle"></text>
<text x="752.5" y="298.5" font-size="14" fill="#534AB7" text-anchor="middle">NESAS, Common Criteria,</text>
<text x="752.5" y="318.5" font-size="14" fill="#534AB7" text-anchor="middle">FIPS 140-3, IEC 62443</text>
<line x1="885" y1="230" x2="910" y2="230" stroke="#888780" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="915" y="80" width="265" height="300" rx="12" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<text x="1047.5" y="164.5" font-size="17" font-weight="700" fill="#712B13" text-anchor="middle">4. Phê duyệt kiểu loại</text>
<text x="1047.5" y="188.5" font-size="14" fill="#993C1D" text-anchor="middle">Cơ quan phê duyệt</text>
<text x="1047.5" y="208.5" font-size="14" fill="#993C1D" text-anchor="middle">và technical service</text>
<text x="1047.5" y="228.5" font-size="14" fill="#993C1D" text-anchor="middle">Kết quả: type approval</text>
<text x="1047.5" y="248.5" font-size="14" fill="#993C1D" text-anchor="middle">cho một kiểu sản phẩm</text>
<text x="1047.5" y="268.5" font-size="14" fill="#993C1D" text-anchor="middle"></text>
<text x="1047.5" y="288.5" font-size="14" fill="#993C1D" text-anchor="middle"></text>
<text x="1047.5" y="308.5" font-size="14" fill="#993C1D" text-anchor="middle">UN R155, UN R156 (ô tô)</text>
<line x1="40" y1="420" x2="1160" y2="420" stroke="#5F5E5A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="450" font-size="14" font-weight="700" fill="#5F5E5A" text-anchor="middle">Mức độ độc lập của bên đánh giá và chi phí tăng dần</text>
</svg>
