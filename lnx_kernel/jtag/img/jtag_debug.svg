<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 404.89" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="860" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Host -->
  <rect x="20" y="20" width="230" height="340" rx="8" fill="#f3f6f3" stroke="#5b8a5b" stroke-width="1.5"/>
  <text x="135" y="46" text-anchor="middle" font-weight="bold" fill="#2d4f2d">Máy host</text>
  <rect x="40" y="66" width="190" height="60" rx="5" fill="#ffffff" stroke="#5b8a5b"/>
  <text x="135" y="92" text-anchor="middle" fill="#1f2d3d">gdb vmlinux</text>
  <text x="135" y="112" text-anchor="middle" fill="#555" font-size="12">+ lx-* helper script</text>
  <rect x="40" y="166" width="190" height="84" rx="5" fill="#ffffff" stroke="#5b8a5b"/>
  <text x="135" y="190" text-anchor="middle" fill="#1f2d3d">OpenOCD</text>
  <text x="135" y="210" text-anchor="middle" fill="#555" font-size="12">gdb server :3333</text>
  <text x="135" y="228" text-anchor="middle" fill="#555" font-size="12">telnet :4444</text>
  <rect x="40" y="290" width="190" height="50" rx="5" fill="#ffffff" stroke="#5b8a5b" stroke-dasharray="5,3"/>
  <text x="135" y="320" text-anchor="middle" fill="#1f2d3d">telnet (lệnh OpenOCD)</text>
  <line x1="135" y1="128" x2="135" y2="164" stroke="#555" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="145" y="150" fill="#333" font-size="12">TCP</text>
  <line x1="135" y1="252" x2="135" y2="288" stroke="#555" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Probe -->
  <rect x="290" y="166" width="140" height="84" rx="8" fill="#fff6e5" stroke="#c08a2b" stroke-width="1.5"/>
  <text x="360" y="192" text-anchor="middle" font-weight="bold" fill="#6b4a12">Debug probe</text>
  <text x="360" y="212" text-anchor="middle" fill="#6b4a12" font-size="12">J-Link, CMSIS-DAP,</text>
  <text x="360" y="230" text-anchor="middle" fill="#6b4a12" font-size="12">FTDI, ST-LINK</text>
  <line x1="232" y1="208" x2="288" y2="208" stroke="#555" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="260" y="198" text-anchor="middle" fill="#333" font-size="12">USB</text>
  <line x1="432" y1="208" x2="478" y2="208" stroke="#555" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="455" y="190" text-anchor="middle" fill="#333" font-size="12">JTAG</text>
  <text x="455" y="204" text-anchor="middle" fill="#333" font-size="12">/SWD</text>

  <!-- SoC -->
  <rect x="480" y="20" width="360" height="340" rx="8" fill="#eef4fb" stroke="#4a78b5" stroke-width="1.5"/>
  <text x="660" y="46" text-anchor="middle" font-weight="bold" fill="#1f3f6b">SoC trên board</text>

  <rect x="500" y="170" width="110" height="76" rx="5" fill="#dde9f7" stroke="#4a78b5"/>
  <text x="555" y="196" text-anchor="middle" font-weight="bold" fill="#1f3f6b">DAP</text>
  <text x="555" y="216" text-anchor="middle" fill="#1f2d3d" font-size="12">Debug Access</text>
  <text x="555" y="232" text-anchor="middle" fill="#1f2d3d" font-size="12">Port</text>

  <rect x="650" y="66" width="170" height="160" rx="6" fill="#ffffff" stroke="#4a78b5"/>
  <text x="735" y="88" text-anchor="middle" fill="#1f3f6b" font-weight="bold">Cluster CPU</text>
  <g fill="#eef4fb" stroke="#4a78b5">
    <rect x="665" y="100" width="65" height="50" rx="4"/>
    <rect x="740" y="100" width="65" height="50" rx="4"/>
    <rect x="665" y="160" width="65" height="50" rx="4"/>
    <rect x="740" y="160" width="65" height="50" rx="4"/>
  </g>
  <g fill="#1f2d3d" text-anchor="middle" font-size="12">
    <text x="697" y="122">Core 0</text><text x="697" y="139" fill="#555">debug, CTI</text>
    <text x="772" y="122">Core 1</text><text x="772" y="139" fill="#555">debug, CTI</text>
    <text x="697" y="182">Core 2</text><text x="697" y="199" fill="#555">debug, CTI</text>
    <text x="772" y="182">Core 3</text><text x="772" y="199" fill="#555">debug, CTI</text>
  </g>

  <rect x="650" y="262" width="170" height="70" rx="6" fill="#ffffff" stroke="#4a78b5"/>
  <text x="735" y="290" text-anchor="middle" fill="#1f2d3d">Bộ nhớ hệ thống</text>
  <text x="735" y="310" text-anchor="middle" fill="#555" font-size="12">DRAM, thanh ghi ngoại vi</text>

  <line x1="612" y1="196" x2="648" y2="160" stroke="#555" marker-end="url(#arr)"/>
  <text x="586" y="160" text-anchor="middle" fill="#333" font-size="11">APB-AP</text>
  <line x1="612" y1="226" x2="648" y2="290" stroke="#555" marker-end="url(#arr)"/>
  <text x="586" y="266" text-anchor="middle" fill="#333" font-size="11">MEM-AP</text>
<text id="wm" x="850.04" y="397.43" text-anchor="end" font-size="12.45" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
