<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 422" role="img" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect x="0" y="0" width="760" height="400" rx="8" fill="#ffffff"/>
<title>VFS objects: two processes hold file descriptors pointing to struct file objects, each file points to a dentry, dentries point to one inode, the inode points to its superblock and to its address_space holding cached pages.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker></defs>
<text x="380" y="28" text-anchor="middle" font-weight="bold" fill="#1f2d3d" font-size="15">VFS objects for an open file</text>
<rect x="20" y="60" width="130" height="56" rx="6" fill="#eceff1" stroke="#78909c" stroke-width="1.4"/>
<text x="85.0" y="85.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold" font-size="14">process A</text>
<text x="85.0" y="104.0" text-anchor="middle" fill="#2c3a42" font-size="13">fd 3</text>
