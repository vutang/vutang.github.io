<text x="260.0" y="104.0" text-anchor="middle" fill="#2c3a42" font-size="13">offset, mode</text>
<rect x="195" y="150" width="130" height="56" rx="6" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="260.0" y="175.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold" font-size="14">file</text>
<text x="260.0" y="194.0" text-anchor="middle" fill="#2c3a42" font-size="13">offset, mode</text>
<line x1="150" y1="88" x2="193" y2="88" stroke="#455a64" stroke-width="1.5" marker-end="url(#a)"/>
