<text x="500" y="338" fill="#2c3a42" font-size="13">folios</text>
<text x="435" y="190" text-anchor="middle" fill="#2c3a42" font-size="13">kept in dentry cache</text>
<text x="380" y="378" text-anchor="middle" fill="#2c3a42" font-size="13">Two opens of the same path: separate file objects (own offset), shared dentry, inode and page cache.</text>
<text id="wm" x="751.2" y="415.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
