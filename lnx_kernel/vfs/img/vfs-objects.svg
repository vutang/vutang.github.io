<line x1="325" y1="88" x2="368" y2="125" stroke="#455a64" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="325" y1="178" x2="368" y2="142" stroke="#455a64" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="545" y="105" width="130" height="56" rx="6" fill="#e9f5ee" stroke="#2e7d4f" stroke-width="1.4"/>
