<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 860 314.89" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Task real-time được đánh thức khi task ưu tiên thấp đang giữ spinlock trong kernel: ở kernel thường, task real-time phải chờ tới khi khóa được trả và preemption bật lại; ở PREEMPT_RT, spinlock không tắt preemption nên task real-time chạy gần như ngay lập tức</title>
  <rect width="860" height="290" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <text x="20" y="40" text-anchor="start" fill="#1f2d3d" font-size="12.5" font-weight="bold">Kernel thường (CONFIG_PREEMPT)</text>
  <text x="20" y="72" text-anchor="start" fill="#1f2d3d" font-size="11">Task thấp</text>
  <text x="20" y="110" text-anchor="start" fill="#1f2d3d" font-size="11">Task RT</text>
  <line x1="110" y1="126" x2="840" y2="126" stroke="#bbb" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="300" y1="50" x2="300" y2="130" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="300" y="142" text-anchor="middle" fill="#c0392b" font-size="10.5">task RT sẵn sàng</text>
  <text x="20" y="160" text-anchor="start" fill="#1f2d3d" font-size="12.5" font-weight="bold">PREEMPT_RT</text>
  <text x="20" y="192" text-anchor="start" fill="#1f2d3d" font-size="11">Task thấp</text>
  <text x="20" y="230" text-anchor="start" fill="#1f2d3d" font-size="11">Task RT</text>
  <line x1="110" y1="246" x2="840" y2="246" stroke="#bbb" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="300" y1="170" x2="300" y2="250" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="300" y="262" text-anchor="middle" fill="#c0392b" font-size="10.5">task RT sẵn sàng</text>
  <rect x="120" y="54" width="100" height="26" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.2"/>
  <text x="170.0" y="71.0" text-anchor="middle" fill="#1f2d3d" font-size="10.5">user space</text>
  <rect x="220" y="54" width="260" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="350.0" y="71.0" text-anchor="middle" fill="#1f2d3d" font-size="10.5">giữ spinlock_t, preempt tắt</text>
  <rect x="480" y="92" width="200" height="26" rx="4" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="580.0" y="109.0" text-anchor="middle" fill="#1f2d3d" font-size="10.5">task RT chạy</text>
  <rect x="680" y="54" width="100" height="26" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.2"/>
  <text x="730.0" y="71.0" text-anchor="middle" fill="#1f2d3d" font-size="10.5">tiếp tục</text>
  <path d="M300,100 H476" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="390.0" y="96" text-anchor="middle" fill="#c0392b" font-size="10.5" font-weight="bold">độ trễ</text>
  <rect x="120" y="174" width="100" height="26" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.2"/>
  <text x="170.0" y="191.0" text-anchor="middle" fill="#1f2d3d" font-size="10.5">user space</text>
  <rect x="220" y="174" width="82" height="26" rx="4" fill="#fbf1e8" stroke="#c0712b" stroke-width="1.2"/>
  <text x="261.0" y="191.0" text-anchor="middle" fill="#1f2d3d" font-size="10.5">giữ khóa</text>
  <rect x="308" y="212" width="200" height="26" rx="4" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="408.0" y="229.0" text-anchor="middle" fill="#1f2d3d" font-size="10.5">task RT chạy</text>
  <rect x="508" y="174" width="178" height="26" rx="4" fill="#fbf1e8" stroke="#c0712b" stroke-width="1.2"/>
  <text x="597.0" y="191.0" text-anchor="middle" fill="#1f2d3d" font-size="10.5">giữ khóa (tiếp)</text>
  <text x="470" y="170" text-anchor="middle" fill="#555" font-size="1"></text>
  <text x="520" y="230" text-anchor="start" fill="#555" font-size="10.5">task thấp bị preempt dù giữ spinlock_t</text>
  <text x="430" y="284" text-anchor="middle" fill="#1f2d3d" font-size="10.5">Nếu task RT cần chính khóa đó, nó ngủ chờ và task thấp được kế thừa ưu tiên (hình tiếp theo)</text>
<text id="wm" x="850.04" y="307.43" text-anchor="end" font-size="12.45" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
