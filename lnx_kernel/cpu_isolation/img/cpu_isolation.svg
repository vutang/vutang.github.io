<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Housekeeping -->
  <rect x="20" y="20" width="300" height="340" rx="8" fill="#eef4fb" stroke="#4a78b5" stroke-width="1.5"/>
  <text x="170" y="46" text-anchor="middle" font-weight="bold" fill="#1f3f6b">Core housekeeping (CPU 0-1)</text>
  <g fill="#ffffff" stroke="#4a78b5">
    <rect x="40" y="66" width="260" height="40" rx="5"/>
    <rect x="40" y="116" width="260" height="40" rx="5"/>
    <rect x="40" y="166" width="260" height="40" rx="5"/>
    <rect x="40" y="216" width="260" height="40" rx="5"/>
    <rect x="40" y="266" width="260" height="40" rx="5"/>
  </g>
  <g fill="#1f2d3d" text-anchor="middle">
    <text x="170" y="91">Tiến trình hệ thống, daemon</text>
    <text x="170" y="141">Unbound workqueue, kthread, timer</text>
    <text x="170" y="191">Timekeeping, tick 1 Hz thay core cô lập</text>
    <text x="170" y="241">RCU callback (kthread rcuo)</text>
    <text x="170" y="291">Ngắt thiết bị (IRQ)</text>
  </g>
  <text x="170" y="338" text-anchor="middle" fill="#1f3f6b">Tick định kỳ và cân bằng tải bình thường</text>

  <!-- Isolated -->
  <rect x="440" y="20" width="300" height="340" rx="8" fill="#fbf1e8" stroke="#c0712b" stroke-width="1.5"/>
  <text x="590" y="46" text-anchor="middle" font-weight="bold" fill="#6b3a12">Core cô lập (CPU 2-7)</text>
  <rect x="460" y="66" width="260" height="40" rx="5" fill="#ffe2c4" stroke="#c0712b"/>
  <text x="590" y="91" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Một task workload mỗi core</text>
  <g fill="#1f2d3d">
    <text x="462" y="141">Không cân bằng tải</text>
    <text x="462" y="159" fill="#6b3a12" font-size="12">isolcpus=domain hoặc cpuset isolated</text>
    <text x="462" y="191">Không tick định kỳ</text>
    <text x="462" y="209" fill="#6b3a12" font-size="12">nohz_full</text>
    <text x="462" y="241">Không xử lý RCU callback</text>
    <text x="462" y="259" fill="#6b3a12" font-size="12">rcu_nocbs (nohz_full tự bật)</text>
    <text x="462" y="291">Không nhận ngắt thiết bị</text>
    <text x="462" y="309" fill="#6b3a12" font-size="12">irqaffinity, smp_affinity, managed_irq</text>
  </g>

  <!-- arrows -->
  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="436" y1="146" x2="324" y2="146"/>
    <line x1="436" y1="196" x2="324" y2="196"/>
    <line x1="436" y1="246" x2="324" y2="246"/>
    <line x1="436" y1="296" x2="324" y2="296"/>
  </g>
  <text x="380" y="128" text-anchor="middle" font-size="12" fill="#555">đẩy sang</text>
<text id="wm" x="751.2" y="395.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
