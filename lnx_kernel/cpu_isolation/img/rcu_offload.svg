<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="330" height="290" rx="8" fill="#eef4fb" stroke="#4a78b5" stroke-width="1.5"/>
  <text x="185" y="46" text-anchor="middle" fill="#1f3f6b" font-weight="bold">Core housekeeping (CPU 0)</text>
  <rect x="410" y="20" width="330" height="290" rx="8" fill="#fbf1e8" stroke="#c0712b" stroke-width="1.5"/>
  <text x="575" y="46" text-anchor="middle" fill="#6b3a12" font-weight="bold">Core nohz_full (CPU 2)</text>
  <rect x="430" y="66" width="290" height="40" rx="5" fill="#ffe2c4" stroke="#c0712b" stroke-width="1.2"/>
  <text x="575" y="91" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Task user space (không tick)</text>
  <rect x="430" y="136" width="290" height="52" rx="5" fill="#fff" stroke="#c0712b" stroke-width="1.2"/>
  <text x="575" y="158" text-anchor="middle" fill="#1f2d3d">Hàng đợi callback no-CB của CPU 2</text>
  <text x="575" y="177" text-anchor="middle" fill="#6b3a12" font-size="12">call_rcu() chỉ xếp hàng, không xử lý</text>
  <line x1="575" y1="106" x2="575" y2="134" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="583" y="124" text-anchor="start" fill="#555" font-size="11">khi vào kernel</text>
  <rect x="430" y="226" width="290" height="52" rx="5" fill="#fff" stroke="#c0712b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="575" y="248" text-anchor="middle" fill="#1f2d3d">Thống kê scheduler của CPU 2</text>
  <text x="575" y="267" text-anchor="middle" fill="#6b3a12" font-size="12">được cập nhật từ xa</text>
  <rect x="40" y="66" width="290" height="52" rx="5" fill="#fff" stroke="#4a78b5" stroke-width="1.2"/>
  <text x="185" y="88" text-anchor="middle" fill="#1f2d3d" font-weight="bold">rcuog/0</text>
  <text x="185" y="107" text-anchor="middle" fill="#1f3f6b" font-size="12">chờ grace period, đánh thức rcuop</text>
  <rect x="40" y="136" width="290" height="52" rx="5" fill="#fff" stroke="#4a78b5" stroke-width="1.2"/>
  <text x="185" y="158" text-anchor="middle" fill="#1f2d3d" font-weight="bold">rcuop/2</text>
  <text x="185" y="177" text-anchor="middle" fill="#1f3f6b" font-size="12">chạy callback của CPU 2</text>
  <line x1="185" y1="118" x2="185" y2="134" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="226" width="290" height="52" rx="5" fill="#fff" stroke="#4a78b5" stroke-width="1.2"/>
  <text x="185" y="248" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Unbound workqueue</text>
  <text x="185" y="267" text-anchor="middle" fill="#1f3f6b" font-size="12">tick dư 1 Hz thay cho CPU 2</text>
  <line x1="428" y1="162" x2="332" y2="162" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="380" y="154" text-anchor="middle" fill="#555" font-size="11">lấy callback</text>
  <line x1="332" y1="252" x2="428" y2="252" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5 3"/>
  <text x="380" y="244" text-anchor="middle" fill="#555" font-size="11">~1 lần/giây</text>

<text id="wm" x="751.2" y="345.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
