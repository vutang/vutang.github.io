<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 342" role="img" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect x="0" y="0" width="760" height="320" rx="8" fill="#ffffff"/>
<title>Free memory of a zone against three watermarks: below low the kswapd thread starts background reclaim until free memory reaches high; below min the allocating task performs direct reclaim itself.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker></defs>
<text x="380" y="28" text-anchor="middle" font-weight="bold" fill="#1f2d3d" font-size="15">Zone watermarks and reclaim</text>
<line x1="90" y1="260" x2="700" y2="260" stroke="#455a64" stroke-width="1.4"/>
<line x1="90" y1="260" x2="90" y2="50" stroke="#455a64" stroke-width="1.4"/>
<text x="80" y="60" text-anchor="end" fill="#2c3a42" font-size="13">free</text>
<text x="700" y="282" text-anchor="end" fill="#2c3a42" font-size="13">time</text>
<line x1="90" y1="110" x2="700" y2="110" stroke="#2e7d4f" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="80" y="115" text-anchor="end" fill="#2e7d4f" font-size="13" font-weight="bold">high</text>
<line x1="90" y1="160" x2="700" y2="160" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="80" y="165" text-anchor="end" fill="#6e4508" font-size="13" font-weight="bold">low</text>
<line x1="90" y1="210" x2="700" y2="210" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="80" y="215" text-anchor="end" fill="#c0392b" font-size="13" font-weight="bold">min</text>
<polyline points="90,80 200,120 280,165 330,150 380,112 430,130 500,195 530,222 560,200 620,140 700,110" fill="none" stroke="#2f5d9e" stroke-width="2.5"/>
<rect x="268" y="66" width="130" height="24" rx="4" fill="#ffffff"/>
<text x="330" y="83" text-anchor="middle" fill="#6e4508" font-size="13">kswapd wakes</text>
<line x1="285" y1="90" x2="285" y2="160" stroke="#b7791f" stroke-width="1.2" marker-end="url(#a)"/>
<text x="425" y="100" text-anchor="middle" fill="#2e7d4f" font-size="13">kswapd sleeps</text>
<line x1="385" y1="104" x2="381" y2="108" stroke="#2e7d4f" stroke-width="1.2"/>
<text x="560" y="250" text-anchor="middle" fill="#c0392b" font-size="13">direct reclaim</text>
<text x="380" y="292" text-anchor="middle" fill="#2c3a42" font-size="13">Below low: background reclaim by kswapd. Below min: allocations stall and reclaim directly.</text>
<text x="380" y="311" text-anchor="middle" fill="#2c3a42" font-size="13">If reclaim cannot free enough memory, the OOM killer selects a task to kill.</text>
<text id="wm" x="751.2" y="335.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
