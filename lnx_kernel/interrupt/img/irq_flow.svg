<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 840 234.32" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Đường đi của một ngắt: thiết bị phát ngắt, interrupt controller chọn core, code kiến trúc vào exception vector và đọc hwirq, lớp generic IRQ đổi sang virq và gọi handler của driver</title>
  <rect width="840" height="210" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect x="10" y="30" width="330" height="150" rx="5" fill="#fbf1e8" stroke="#c0712b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="20" y="48" text-anchor="start" fill="#6b3a12" font-size="12" font-weight="bold">Phần cứng</text>
  <rect x="355" y="30" width="475" height="150" rx="5" fill="#eef4fb" stroke="#4a78b5" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="365" y="48" text-anchor="start" fill="#1f3f6b" font-size="12" font-weight="bold">CPU và kernel</text>
  <rect x="20" y="70" width="145" height="80" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="92.5" y="97.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Thiết bị</text>
  <text x="92.5" y="114.0" text-anchor="middle" fill="#555" font-size="11.5">kéo đường ngắt</text>
  <text x="92.5" y="131.0" text-anchor="middle" fill="#555" font-size="11.5">hoặc gửi MSI</text>
  <text x="92.5" y="168" text-anchor="middle" fill="#888" font-size="11">bước 1</text>
  <line x1="165" y1="110" x2="183" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="185" y="70" width="145" height="80" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="257.5" y="97.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Interrupt controller</text>
  <text x="257.5" y="114.0" text-anchor="middle" fill="#555" font-size="11.5">GIC, APIC</text>
  <text x="257.5" y="131.0" text-anchor="middle" fill="#555" font-size="11.5">chọn core, mask</text>
  <text x="257.5" y="168" text-anchor="middle" fill="#888" font-size="11">bước 2</text>
  <line x1="330" y1="110" x2="363" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="365" y="70" width="145" height="80" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="437.5" y="97.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Code kiến trúc</text>
  <text x="437.5" y="114.0" text-anchor="middle" fill="#555" font-size="11.5">exception vector</text>
  <text x="437.5" y="131.0" text-anchor="middle" fill="#555" font-size="11.5">lưu ngữ cảnh, đọc hwirq</text>
  <text x="437.5" y="168" text-anchor="middle" fill="#888" font-size="11">bước 3</text>
  <line x1="510" y1="110" x2="518" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="520" y="70" width="145" height="80" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="592.5" y="97.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Generic IRQ</text>
  <text x="592.5" y="114.0" text-anchor="middle" fill="#555" font-size="11.5">hwirq → virq</text>
  <text x="592.5" y="131.0" text-anchor="middle" fill="#555" font-size="11.5">irq_desc, flow handler</text>
  <text x="592.5" y="168" text-anchor="middle" fill="#888" font-size="11">bước 4</text>
  <line x1="665" y1="110" x2="673" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="675" y="70" width="145" height="80" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="747.5" y="97.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Handler của driver</text>
  <text x="747.5" y="114.0" text-anchor="middle" fill="#555" font-size="11.5">IRQ_HANDLED</text>
  <text x="747.5" y="131.0" text-anchor="middle" fill="#555" font-size="11.5">hoặc IRQ_NONE</text>
  <text x="747.5" y="168" text-anchor="middle" fill="#888" font-size="11">bước 5</text>
<text id="wm" x="830.27" y="227.02" text-anchor="end" font-size="12.16" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
