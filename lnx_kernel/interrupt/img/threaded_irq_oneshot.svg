<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 860 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Threaded IRQ với IRQF_ONESHOT trên ngắt level: khi ngắt tới, handler mặc định giữ đường ngắt ở trạng thái mask và đánh thức thread; thread xóa nguồn ngắt trong thiết bị qua bus I2C hoặc SPI, khi thread trở về kernel mới unmask</title>
  <rect width="860" height="300" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <text x="20" y="62" text-anchor="start" fill="#1f2d3d" font-size="12" font-weight="bold">Đường ngắt (level)</text>
  <line x1="170" y1="76" x2="840" y2="76" stroke="#ddd" stroke-width="1"/>
  <text x="20" y="117" text-anchor="start" fill="#1f2d3d" font-size="12" font-weight="bold">Mask tại irqchip</text>
  <line x1="170" y1="131" x2="840" y2="131" stroke="#ddd" stroke-width="1"/>
  <text x="20" y="172" text-anchor="start" fill="#1f2d3d" font-size="12" font-weight="bold">Handler chính</text>
  <line x1="170" y1="186" x2="840" y2="186" stroke="#ddd" stroke-width="1"/>
  <text x="20" y="227" text-anchor="start" fill="#1f2d3d" font-size="12" font-weight="bold">Thread irq/N</text>
  <line x1="170" y1="241" x2="840" y2="241" stroke="#ddd" stroke-width="1"/>
  <path d="M170,76 H220 V48 H560 V76 H840" fill="none" stroke="#c0392b" stroke-width="2"/>
  <rect x="224" y="103" width="416" height="24" rx="3" fill="#f3d9d5" stroke="#c0392b" stroke-width="1"/>
  <text x="430.0" y="120" text-anchor="middle" fill="#6b1d14" font-size="11">đường ngắt bị mask, không kích lại</text>
  <rect x="224" y="158" width="66" height="24" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="257" y="175" text-anchor="middle" fill="#1f2d3d" font-size="11">wake</text>
  <rect x="300" y="213" width="340" height="24" rx="3" fill="#eef4fb" stroke="#4a78b5" stroke-width="1.2"/>
  <text x="430.0" y="230" text-anchor="middle" fill="#1f2d3d" font-size="11">thread_fn: đọc trạng thái qua I2C/SPI (được ngủ)</text>
  <line x1="220" y1="36" x2="220" y2="252" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="300" y1="36" x2="300" y2="252" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="560" y1="36" x2="560" y2="252" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="640" y1="36" x2="640" y2="252" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="220" y="268" text-anchor="middle" fill="#1f2d3d" font-size="11">1. ngắt tới</text>
  <text x="310" y="284" text-anchor="start" fill="#1f2d3d" font-size="11">2. handler mặc định trả IRQ_WAKE_THREAD</text>
  <text x="560" y="268" text-anchor="middle" fill="#1f2d3d" font-size="11">3. xóa nguồn ngắt</text>
  <text x="646" y="284" text-anchor="start" fill="#1f2d3d" font-size="11">4. thread trả về, unmask</text>
</svg>
