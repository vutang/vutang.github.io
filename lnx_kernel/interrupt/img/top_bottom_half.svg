<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 860 314.89" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Top half chạy ngay trong ngữ cảnh ngắt rồi lên lịch phần còn lại: softirq, tasklet hoặc workqueue BH chạy ở ngữ cảnh softirq và không được ngủ; thread handler của threaded IRQ và work item của workqueue chạy trong kernel thread và được ngủ</title>
  <rect width="860" height="290" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect x="10" y="40" width="840" height="64" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="20" y="68" text-anchor="start" fill="#1f2d3d" font-size="12.5" font-weight="bold">Ngữ cảnh ngắt</text>
  <text x="20" y="86" text-anchor="start" fill="#555" font-size="11">hardirq, không ngủ</text>
  <rect x="10" y="115" width="840" height="64" rx="5" fill="#fffbe6" stroke="#b59a2a" stroke-width="1"/>
  <text x="20" y="143" text-anchor="start" fill="#1f2d3d" font-size="12.5" font-weight="bold">Ngữ cảnh softirq</text>
  <text x="20" y="161" text-anchor="start" fill="#555" font-size="11">không ngủ</text>
  <rect x="10" y="190" width="840" height="64" rx="5" fill="#eef4fb" stroke="#4a78b5" stroke-width="1"/>
  <text x="20" y="218" text-anchor="start" fill="#1f2d3d" font-size="12.5" font-weight="bold">Kernel thread</text>
  <text x="20" y="236" text-anchor="start" fill="#555" font-size="11">process context, được ngủ</text>
  <line x1="225" y1="12" x2="225" y2="46" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="232" y="24" text-anchor="start" fill="#c0392b" font-size="11">ngắt tới</text>
  <rect x="225" y="50" width="150" height="44" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="300.0" y="67.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Top half</text>
  <text x="300.0" y="84.5" text-anchor="middle" fill="#555" font-size="11.5">ack, đọc dữ liệu, lên lịch</text>
  <rect x="420" y="125" width="200" height="44" rx="5" fill="#ffffff" stroke="#b59a2a" stroke-width="1.2"/>
  <text x="520.0" y="142.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">softirq, tasklet</text>
  <text x="520.0" y="159.5" text-anchor="middle" fill="#555" font-size="11.5">hoặc workqueue BH</text>
  <rect x="420" y="200" width="180" height="44" rx="5" fill="#ffffff" stroke="#4a78b5" stroke-width="1.2"/>
  <text x="510.0" y="217.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Thread handler</text>
  <text x="510.0" y="234.5" text-anchor="middle" fill="#555" font-size="11.5">kernel thread irq/N</text>
  <rect x="650" y="200" width="190" height="44" rx="5" fill="#ffffff" stroke="#4a78b5" stroke-width="1.2"/>
  <text x="745.0" y="217.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Work item</text>
  <text x="745.0" y="234.5" text-anchor="middle" fill="#555" font-size="11.5">kworker của workqueue</text>
  <path d="M375,80 H398 V147 H418" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M375,80 H398 V222 H418" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M375,72 H635 V222 H648" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="640" y="64" text-anchor="start" fill="#555" font-size="11" font-style="italic">schedule_work()</text>
  <text x="300" y="278" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">Top half</text>
  <text x="630" y="278" text-anchor="middle" fill="#1f2d3d" font-size="11" font-weight="bold">Bottom half: chạy sau, khi ngắt đã được mở lại</text>
  <line x1="10" y1="266" x2="850" y2="266" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
  <text x="845" y="284" text-anchor="end" fill="#888" font-size="10.5">thời gian</text>
<text id="wm" x="850.04" y="307.43" text-anchor="end" font-size="12.45" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
