<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 860 320" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>CPU dùng địa chỉ ảo do MMU dịch sang địa chỉ vật lý; thiết bị dùng địa chỉ DMA, đi thẳng tới RAM hoặc qua IOMMU; DMA API trả về dma_addr_t để driver ghi vào thanh ghi của thiết bị</title>
  <rect width="860" height="320" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect x="20" y="30" width="170" height="64" rx="5" fill="#eef4fb" stroke="#4a78b5" stroke-width="1.2"/>
  <text x="105.0" y="57.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">CPU</text>
  <text x="105.0" y="74.5" text-anchor="middle" fill="#555" font-size="11.5">con trỏ ảo: buf</text>
  <rect x="20" y="196" width="170" height="64" rx="5" fill="#fbf1e8" stroke="#c0712b" stroke-width="1.2"/>
  <text x="105.0" y="223.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Thiết bị</text>
  <text x="105.0" y="240.5" text-anchor="middle" fill="#555" font-size="11.5">địa chỉ DMA: dma_addr_t</text>
  <rect x="260" y="30" width="130" height="64" rx="5" fill="#ffffff" stroke="#4a78b5" stroke-width="1.2"/>
  <text x="325.0" y="57.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">MMU</text>
  <text x="325.0" y="74.5" text-anchor="middle" fill="#555" font-size="11.5">page table của CPU</text>
  <rect x="260" y="196" width="130" height="64" rx="5" fill="#ffffff" stroke="#c0712b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="325.0" y="223.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">IOMMU (nếu có)</text>
  <text x="325.0" y="240.5" text-anchor="middle" fill="#555" font-size="11.5">page table của thiết bị</text>
  <rect x="470" y="90" width="150" height="110" rx="5" fill="#f7f7f7" stroke="#555" stroke-width="1.2"/>
  <text x="545.0" y="140.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Địa chỉ vật lý</text>
  <text x="545.0" y="157.5" text-anchor="middle" fill="#555" font-size="11.5">RAM</text>
  <line x1="190" y1="62" x2="258" y2="62" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="62" x2="468" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="228" x2="258" y2="228" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="228" x2="468" y2="172" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="680" y="70" width="165" height="150" rx="5" fill="#ffffff" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="762" y="92" text-anchor="middle" fill="#1f2d3d" font-size="12.5" font-weight="bold">DMA API</text>
  <text x="762" y="116" text-anchor="middle" fill="#555" font-size="11">nhận con trỏ ảo buf</text>
  <text x="762" y="136" text-anchor="middle" fill="#555" font-size="11">tạo ánh xạ IOMMU nếu cần</text>
  <text x="762" y="156" text-anchor="middle" fill="#555" font-size="11">đồng bộ cache nếu cần</text>
  <text x="762" y="176" text-anchor="middle" fill="#555" font-size="11">trả về dma_addr_t</text>
  <text x="762" y="196" text-anchor="middle" fill="#555" font-size="11">driver ghi vào thanh ghi</text>
  <path d="M762,220 V282 H105 V262" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="430" y="276" text-anchor="middle" fill="#555" font-size="10.5">driver ghi dma_addr_t vào thanh ghi của thiết bị</text>
  <text x="430" y="310" text-anchor="middle" fill="#1f2d3d" font-size="11.5">Con trỏ ảo, địa chỉ vật lý và địa chỉ DMA có thể khác nhau: driver chỉ đưa cho thiết bị giá trị do DMA API trả về</text>
</svg>
