<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 860 354.89" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Streaming DMA trên hệ không coherent: với DMA_TO_DEVICE, dma_map ghi dữ liệu bẩn trong cache xuống RAM trước khi thiết bị đọc; với DMA_FROM_DEVICE, thiết bị ghi vào RAM rồi dma_unmap hủy các dòng cache cũ để CPU đọc dữ liệu mới</title>
  <rect width="860" height="330" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect x="10" y="10" width="410" height="310" rx="5" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="215" y="32" text-anchor="middle" fill="#1f2d3d" font-size="12.5" font-weight="bold">DMA_TO_DEVICE: CPU ghi, thiết bị đọc</text>
  <rect x="440" y="10" width="410" height="310" rx="5" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="645" y="32" text-anchor="middle" fill="#1f2d3d" font-size="12.5" font-weight="bold">DMA_FROM_DEVICE: thiết bị ghi, CPU đọc</text>
  <rect x="25" y="50" width="110" height="46" rx="5" fill="#fffbe6" stroke="#b59a2a" stroke-width="1.2"/>
  <text x="80.0" y="77.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">CPU cache</text>
  <rect x="160" y="50" width="110" height="46" rx="5" fill="#f7f7f7" stroke="#555" stroke-width="1.2"/>
  <text x="215.0" y="77.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">RAM</text>
  <rect x="295" y="50" width="110" height="46" rx="5" fill="#fbf1e8" stroke="#c0712b" stroke-width="1.2"/>
  <text x="350.0" y="77.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Thiết bị</text>
  <line x1="135" y1="73" x2="160" y2="73" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="147.5" y="114" text-anchor="middle" fill="#555" font-size="10.5">clean</text>
  <line x1="270" y1="73" x2="295" y2="73" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="282.5" y="114" text-anchor="middle" fill="#555" font-size="10.5">đọc</text>
  <rect x="25" y="184" width="64" height="24" rx="5" fill="#eef4fb" stroke="#4a78b5" stroke-width="1"/>
  <text x="57" y="200" text-anchor="middle" fill="#1f2d3d" font-size="10.5">CPU</text>
  <text x="98" y="200" text-anchor="start" fill="#1f2d3d" font-size="11">1. CPU ghi buffer, dữ liệu còn trong cache</text>
  <rect x="25" y="220" width="64" height="24" rx="5" fill="#eef4fb" stroke="#4a78b5" stroke-width="1"/>
  <text x="57" y="236" text-anchor="middle" fill="#1f2d3d" font-size="10.5">CPU</text>
  <text x="98" y="236" text-anchor="start" fill="#1f2d3d" font-size="11">2. dma_map_single(): clean cache xuống RAM</text>
  <rect x="25" y="256" width="64" height="24" rx="5" fill="#fbf1e8" stroke="#c0712b" stroke-width="1"/>
  <text x="57" y="272" text-anchor="middle" fill="#1f2d3d" font-size="10.5">Thiết bị</text>
  <text x="98" y="272" text-anchor="start" fill="#1f2d3d" font-size="11">3. thiết bị đọc RAM qua DMA</text>
  <rect x="25" y="292" width="64" height="24" rx="5" fill="#eef4fb" stroke="#4a78b5" stroke-width="1"/>
  <text x="57" y="308" text-anchor="middle" fill="#1f2d3d" font-size="10.5">CPU</text>
  <text x="98" y="308" text-anchor="start" fill="#1f2d3d" font-size="11">4. dma_unmap_single(): CPU lấy lại buffer</text>
  <rect x="455" y="50" width="110" height="46" rx="5" fill="#fffbe6" stroke="#b59a2a" stroke-width="1.2"/>
  <text x="510.0" y="77.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">CPU cache</text>
  <rect x="590" y="50" width="110" height="46" rx="5" fill="#f7f7f7" stroke="#555" stroke-width="1.2"/>
  <text x="645.0" y="77.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">RAM</text>
  <rect x="725" y="50" width="110" height="46" rx="5" fill="#fbf1e8" stroke="#c0712b" stroke-width="1.2"/>
  <text x="780.0" y="77.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Thiết bị</text>
  <line x1="725" y1="73" x2="700" y2="73" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="712.5" y="114" text-anchor="middle" fill="#555" font-size="10.5">ghi</text>
  <line x1="590" y1="73" x2="565" y2="73" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="577.5" y="114" text-anchor="middle" fill="#555" font-size="10.5">nạp lại</text>
  <rect x="455" y="184" width="64" height="24" rx="5" fill="#eef4fb" stroke="#4a78b5" stroke-width="1"/>
  <text x="487" y="200" text-anchor="middle" fill="#1f2d3d" font-size="10.5">CPU</text>
  <text x="528" y="200" text-anchor="start" fill="#1f2d3d" font-size="11">1. dma_map_single(): invalidate cache của buffer</text>
  <rect x="455" y="220" width="64" height="24" rx="5" fill="#fbf1e8" stroke="#c0712b" stroke-width="1"/>
  <text x="487" y="236" text-anchor="middle" fill="#1f2d3d" font-size="10.5">Thiết bị</text>
  <text x="528" y="236" text-anchor="start" fill="#1f2d3d" font-size="11">2. thiết bị ghi RAM qua DMA</text>
  <rect x="455" y="256" width="64" height="24" rx="5" fill="#eef4fb" stroke="#4a78b5" stroke-width="1"/>
  <text x="487" y="272" text-anchor="middle" fill="#1f2d3d" font-size="10.5">CPU</text>
  <text x="528" y="272" text-anchor="start" fill="#1f2d3d" font-size="11">3. dma_unmap_single(): invalidate cache</text>
  <rect x="455" y="292" width="64" height="24" rx="5" fill="#eef4fb" stroke="#4a78b5" stroke-width="1"/>
  <text x="487" y="308" text-anchor="middle" fill="#1f2d3d" font-size="10.5">CPU</text>
  <text x="528" y="308" text-anchor="start" fill="#1f2d3d" font-size="11">4. CPU đọc dữ liệu mới từ RAM</text>
  <text x="215" y="150" text-anchor="middle" fill="#1f2d3d" font-size="11">Dữ liệu đi: cache → RAM → thiết bị</text>
  <text x="645" y="150" text-anchor="middle" fill="#1f2d3d" font-size="11">Dữ liệu đi: thiết bị → RAM → cache</text>
<text id="wm" x="850.04" y="347.43" text-anchor="end" font-size="12.45" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
