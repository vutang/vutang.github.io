<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 760 506" font-family="DejaVu Sans, sans-serif" font-size="13">
  <rect x="0" y="0" width="760" height="484" rx="8" fill="#ffffff"/>
  <title>Linux system layers: user space programs reach the kernel through system calls, device files, pseudo filesystems and netlink; the kernel holds core subsystems, core mechanisms, device drivers and architecture code on top of the hardware.</title>
  <defs>
    <marker id="kal-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3a42"/>
    </marker>
  </defs>

  <!-- User space -->
  <rect x="16" y="16" width="728" height="90" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="32" y="40" fill="#6e4508" font-size="14" font-weight="bold">User space</text>
  <rect x="32" y="52" width="221" height="40" rx="4" fill="#ffffff" stroke="#b7791f"/>
  <text x="142.5" y="77" text-anchor="middle" fill="#1f2d3d">Applications</text>
  <rect x="269" y="52" width="221" height="40" rx="4" fill="#ffffff" stroke="#b7791f"/>
  <text x="379.5" y="77" text-anchor="middle" fill="#1f2d3d">C library (glibc)</text>
  <rect x="506" y="52" width="222" height="40" rx="4" fill="#ffffff" stroke="#b7791f"/>
  <text x="617" y="77" text-anchor="middle" fill="#1f2d3d">Tools (ip, udev, ...)</text>

  <!-- Kernel space -->
  <rect x="16" y="122" width="728" height="250" rx="8" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="132" y="143" fill="#2f5d9e" font-size="14" font-weight="bold">Kernel space</text>
  <rect x="32" y="156" width="165" height="40" rx="4" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="114.5" y="181" text-anchor="middle" fill="#1f2d3d">System calls</text>
  <rect x="209" y="156" width="165" height="40" rx="4" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="291.5" y="181" text-anchor="middle" fill="#1f2d3d">Device files (/dev)</text>
  <rect x="386" y="156" width="165" height="40" rx="4" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="468.5" y="181" text-anchor="middle" fill="#1f2d3d">/proc, /sys, debugfs</text>
  <rect x="563" y="156" width="165" height="40" rx="4" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="645.5" y="181" text-anchor="middle" fill="#1f2d3d">Netlink</text>

  <rect x="32" y="212" width="131" height="40" rx="4" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="97.5" y="237" text-anchor="middle" fill="#1f2d3d">Scheduler</text>
  <rect x="173" y="212" width="132" height="40" rx="4" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="239" y="237" text-anchor="middle" fill="#1f2d3d">Memory</text>
  <rect x="315" y="212" width="131" height="40" rx="4" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="380.5" y="237" text-anchor="middle" fill="#1f2d3d">VFS</text>
  <rect x="456" y="212" width="131" height="40" rx="4" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="521.5" y="237" text-anchor="middle" fill="#1f2d3d">Networking</text>
  <rect x="597" y="212" width="131" height="40" rx="4" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="662.5" y="237" text-anchor="middle" fill="#1f2d3d">IPC</text>

  <rect x="32" y="262" width="696" height="36" rx="4" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="380" y="285" text-anchor="middle" fill="#1f2d3d">Core mechanisms: interrupts, locking, timers, workqueues</text>

  <rect x="32" y="312" width="460" height="44" rx="4" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="262" y="339" text-anchor="middle" fill="#1f2d3d">Device drivers and driver model (drivers/)</text>
  <rect x="504" y="312" width="224" height="44" rx="4" fill="#ffffff" stroke="#2f5d9e"/>
  <text x="616" y="339" text-anchor="middle" fill="#1f2d3d">Architecture code (arch/)</text>

  <!-- Hardware -->
  <rect x="16" y="388" width="728" height="80" rx="8" fill="#eef2f4" stroke="#78909c" stroke-width="1.5"/>
  <text x="160" y="409" fill="#2c3a42" font-size="14" font-weight="bold">Hardware</text>
  <rect x="32" y="418" width="221" height="36" rx="4" fill="#ffffff" stroke="#78909c"/>
  <text x="142.5" y="441" text-anchor="middle" fill="#1f2d3d">Peripherals (I2C, SPI, PCIe)</text>
  <rect x="269" y="418" width="221" height="36" rx="4" fill="#ffffff" stroke="#78909c"/>
  <text x="379.5" y="441" text-anchor="middle" fill="#1f2d3d">RAM</text>
  <rect x="506" y="418" width="222" height="36" rx="4" fill="#ffffff" stroke="#78909c"/>
  <text x="617" y="441" text-anchor="middle" fill="#1f2d3d">CPU, MMU, IRQ controller</text>

  <!-- Arrows across the user/kernel boundary -->
  <line x1="114.5" y1="108" x2="114.5" y2="154" stroke="#2c3a42" stroke-width="1.5" marker-start="url(#kal-arr)" marker-end="url(#kal-arr)"/>
  <line x1="291.5" y1="108" x2="291.5" y2="154" stroke="#2c3a42" stroke-width="1.5" marker-start="url(#kal-arr)" marker-end="url(#kal-arr)"/>
  <line x1="468.5" y1="108" x2="468.5" y2="154" stroke="#2c3a42" stroke-width="1.5" marker-start="url(#kal-arr)" marker-end="url(#kal-arr)"/>
  <line x1="645.5" y1="108" x2="645.5" y2="154" stroke="#2c3a42" stroke-width="1.5" marker-start="url(#kal-arr)" marker-end="url(#kal-arr)"/>

  <!-- Arrows to hardware -->
  <line x1="142.5" y1="358" x2="142.5" y2="416" stroke="#2c3a42" stroke-width="1.5" marker-start="url(#kal-arr)" marker-end="url(#kal-arr)"/>
  <line x1="617" y1="358" x2="617" y2="416" stroke="#2c3a42" stroke-width="1.5" marker-start="url(#kal-arr)" marker-end="url(#kal-arr)"/>
<text id="wm" x="751.2" y="499.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
