<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" role="img" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect x="0" y="0" width="760" height="300" rx="8" fill="#ffffff"/>
<title>Example topology of an Arm64 SoC with two clusters: four efficiency cores with capacity 446 and four performance cores with capacity 1024, grouped by cluster.</title>
<text x="380" y="28" text-anchor="middle" font-weight="bold" fill="#1f2d3d" font-size="15">Example: one package, two clusters (big.LITTLE)</text>
<rect x="15" y="44" width="730" height="200" rx="8" fill="none" stroke="#455a64" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="30" y="64" fill="#2c3a42" font-size="13">package (socket0)</text>
<rect x="30" y="76" width="340" height="156" rx="6" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.5"/>
<text x="200" y="98" text-anchor="middle" font-weight="bold" fill="#1f2d3d" font-size="14">cluster0: efficiency cores</text>
<rect x="44" y="110" width="70" height="56" rx="5" fill="#ffffff" stroke="#2f5d9e" stroke-width="1.2"/>
<text x="79" y="133" text-anchor="middle" fill="#1f2d3d" font-size="14">CPU0</text>
<text x="79" y="154" text-anchor="middle" fill="#2c3a42" font-size="13">cap 446</text>
<rect x="125" y="110" width="70" height="56" rx="5" fill="#ffffff" stroke="#2f5d9e" stroke-width="1.2"/>
<text x="160" y="133" text-anchor="middle" fill="#1f2d3d" font-size="14">CPU1</text>
<text x="160" y="154" text-anchor="middle" fill="#2c3a42" font-size="13">cap 446</text>
<rect x="206" y="110" width="70" height="56" rx="5" fill="#ffffff" stroke="#2f5d9e" stroke-width="1.2"/>
<text x="241" y="133" text-anchor="middle" fill="#1f2d3d" font-size="14">CPU2</text>
<text x="241" y="154" text-anchor="middle" fill="#2c3a42" font-size="13">cap 446</text>
<rect x="287" y="110" width="70" height="56" rx="5" fill="#ffffff" stroke="#2f5d9e" stroke-width="1.2"/>
<text x="322" y="133" text-anchor="middle" fill="#1f2d3d" font-size="14">CPU3</text>
<text x="322" y="154" text-anchor="middle" fill="#2c3a42" font-size="13">cap 446</text>
<text x="200" y="200" text-anchor="middle" fill="#2c3a42" font-size="13">one core type, usually one frequency domain</text>
<rect x="390" y="76" width="340" height="156" rx="6" fill="#fdf3e3" stroke="#b7791f" stroke-width="1.5"/>
<text x="560" y="98" text-anchor="middle" font-weight="bold" fill="#1f2d3d" font-size="14">cluster1: performance cores</text>
<rect x="404" y="110" width="70" height="56" rx="5" fill="#ffffff" stroke="#b7791f" stroke-width="1.2"/>
<text x="439" y="133" text-anchor="middle" fill="#1f2d3d" font-size="14">CPU4</text>
<text x="439" y="154" text-anchor="middle" fill="#2c3a42" font-size="13">cap 1024</text>
<rect x="485" y="110" width="70" height="56" rx="5" fill="#ffffff" stroke="#b7791f" stroke-width="1.2"/>
<text x="520" y="133" text-anchor="middle" fill="#1f2d3d" font-size="14">CPU5</text>
<text x="520" y="154" text-anchor="middle" fill="#2c3a42" font-size="13">cap 1024</text>
<rect x="566" y="110" width="70" height="56" rx="5" fill="#ffffff" stroke="#b7791f" stroke-width="1.2"/>
<text x="601" y="133" text-anchor="middle" fill="#1f2d3d" font-size="14">CPU6</text>
<text x="601" y="154" text-anchor="middle" fill="#2c3a42" font-size="13">cap 1024</text>
<rect x="647" y="110" width="70" height="56" rx="5" fill="#ffffff" stroke="#b7791f" stroke-width="1.2"/>
<text x="682" y="133" text-anchor="middle" fill="#1f2d3d" font-size="14">CPU7</text>
<text x="682" y="154" text-anchor="middle" fill="#2c3a42" font-size="13">cap 1024</text>
<text x="560" y="200" text-anchor="middle" fill="#2c3a42" font-size="13">one core type, usually one frequency domain</text>
<text x="380" y="268" text-anchor="middle" fill="#2c3a42" font-size="13">cpu-map in Device Tree describes clusters and cores; capacity comes from capacity-dmips-mhz and max frequency</text>
<text x="380" y="288" text-anchor="middle" fill="#2c3a42" font-size="13">Capacity values are illustrative.</text>
<text id="wm" x="751.2" y="315.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
