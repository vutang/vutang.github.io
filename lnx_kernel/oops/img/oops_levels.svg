<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 860 294.89" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Các mức báo lỗi: WARN in cảnh báo và chạy tiếp, nếu panic_on_warn thì thành panic; BUG và truy cập không hợp lệ gây oops, giết task hiện tại, nếu panic_on_oops hoặc lỗi trong ngắt hay task init thì thành panic; panic dừng hệ thống, có thể tự khởi động lại theo tham số panic hoặc chuyển sang kdump</title>
  <rect width="860" height="270" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect x="20" y="40" width="200" height="70" rx="5" fill="#fffbe6" stroke="#b59a2a" stroke-width="1.2"/>
  <text x="120.0" y="62.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">WARN_ON()</text>
  <text x="120.0" y="79.0" text-anchor="middle" fill="#555" font-size="11.5">in call trace, taint W</text>
  <text x="120.0" y="96.0" text-anchor="middle" fill="#555" font-size="11.5">hệ thống chạy tiếp</text>
  <rect x="320" y="40" width="220" height="70" rx="5" fill="#fbf1e8" stroke="#c0712b" stroke-width="1.2"/>
  <text x="430.0" y="62.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Oops</text>
  <text x="430.0" y="79.0" text-anchor="middle" fill="#555" font-size="11.5">BUG(), truy cập sai địa chỉ</text>
  <text x="430.0" y="96.0" text-anchor="middle" fill="#555" font-size="11.5">giết task hiện tại, taint D</text>
  <rect x="640" y="40" width="200" height="70" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="740.0" y="62.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Panic</text>
  <text x="740.0" y="79.0" text-anchor="middle" fill="#555" font-size="11.5">dừng toàn hệ thống</text>
  <text x="740.0" y="96.0" text-anchor="middle" fill="#555" font-size="11.5">Kernel panic - not syncing</text>
  <path d="M120,40 V22 H740 V38" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="430" y="16" text-anchor="middle" fill="#555" font-size="10.5" font-style="italic">panic_on_warn</text>
  <line x1="540" y1="75" x2="638" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="589" y="60" text-anchor="middle" fill="#555" font-size="10.5" font-style="italic">panic_on_oops,</text>
  <text x="589" y="98" text-anchor="middle" fill="#555" font-size="10.5">lỗi trong ngắt, init</text>
  <rect x="640" y="170" width="95" height="56" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="687.5" y="193.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">panic=N</text>
  <text x="687.5" y="210.5" text-anchor="middle" fill="#555" font-size="11.5">reboot sau N s</text>
  <rect x="745" y="170" width="95" height="56" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="792.5" y="193.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">kdump</text>
  <text x="792.5" y="210.5" text-anchor="middle" fill="#555" font-size="11.5">capture kernel</text>
  <line x1="690" y1="110" x2="688" y2="168" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="790" y1="110" x2="792" y2="168" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="320" y="170" width="220" height="56" rx="5" fill="#ffffff" stroke="#c0712b" stroke-width="1.2"/>
  <text x="430.0" y="193.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Kernel chạy tiếp</text>
  <text x="430.0" y="210.5" text-anchor="middle" fill="#555" font-size="11.5">có thể không nhất quán</text>
  <line x1="430" y1="110" x2="430" y2="168" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="170" width="200" height="56" rx="5" fill="#ffffff" stroke="#b59a2a" stroke-width="1.2"/>
  <text x="120.0" y="202.0" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Chạy tiếp bình thường</text>
  <line x1="120" y1="110" x2="120" y2="168" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="430" y="258" text-anchor="middle" fill="#1f2d3d" font-size="11">Mặc định: WARN và oops không dừng hệ thống; các sysctl panic_on_* nâng mức xử lý</text>
<text id="wm" x="850.04" y="287.43" text-anchor="end" font-size="12.45" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
