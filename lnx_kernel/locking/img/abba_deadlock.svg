<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Deadlock ABBA: CPU0 giữ lock A và chờ lock B, CPU1 giữ lock B và chờ lock A, tạo thành vòng chờ không bao giờ kết thúc</title>
  <rect width="760" height="300" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a78b5"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#e2e2e2" stroke-width="2"/></pattern></defs>
  <rect x="30" y="105" width="170" height="70" rx="5" fill="#eef4fb" stroke="#4a78b5" stroke-width="1.2"/>
  <text x="115" y="133" text-anchor="middle" fill="#1f2d3d" font-weight="bold">CPU0</text>
  <text x="115" y="153" text-anchor="middle" fill="#555" font-size="11.5" font-family="Menlo, Consolas, monospace">lock(A); lock(B);</text>
  <rect x="560" y="105" width="170" height="70" rx="5" fill="#eef4fb" stroke="#4a78b5" stroke-width="1.2"/>
  <text x="645" y="133" text-anchor="middle" fill="#1f2d3d" font-weight="bold">CPU1</text>
  <text x="645" y="153" text-anchor="middle" fill="#555" font-size="11.5" font-family="Menlo, Consolas, monospace">lock(B); lock(A);</text>
  <rect x="320" y="30" width="120" height="50" rx="5" fill="#fffbe6" stroke="#b59a2a" stroke-width="1.2"/>
  <text x="380" y="60" text-anchor="middle" fill="#1f2d3d" font-weight="bold">lock A</text>
  <rect x="320" y="200" width="120" height="50" rx="5" fill="#fffbe6" stroke="#b59a2a" stroke-width="1.2"/>
  <text x="380" y="230" text-anchor="middle" fill="#1f2d3d" font-weight="bold">lock B</text>
  <line x1="200" y1="120" x2="318" y2="62" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="222" y="80" text-anchor="start" fill="#2e7d32" font-size="11.5" font-weight="bold">đang giữ</text>
  <line x1="200" y1="160" x2="318" y2="218" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR)" stroke-dasharray="6 4"/>
  <text x="222" y="212" text-anchor="start" fill="#c0392b" font-size="11.5" font-weight="bold">chờ</text>
  <line x1="560" y1="160" x2="442" y2="218" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="538" y="212" text-anchor="end" fill="#2e7d32" font-size="11.5" font-weight="bold">đang giữ</text>
  <line x1="560" y1="120" x2="442" y2="62" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR)" stroke-dasharray="6 4"/>
  <text x="538" y="80" text-anchor="end" fill="#c0392b" font-size="11.5" font-weight="bold">chờ</text>
  <text x="380" y="140" text-anchor="middle" fill="#555" font-size="11.5">vòng chờ:</text>
  <text x="380" y="157" text-anchor="middle" fill="#555" font-size="11.5">không CPU nào nhả lock</text>
  <text x="380" y="285" text-anchor="middle" fill="#1f2d3d" font-size="12" font-weight="bold">Cách tránh: mọi đường code lấy A rồi mới lấy B</text>
</svg>
