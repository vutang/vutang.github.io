<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 880 355.47" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Grace period của RCU: sau khi writer công bố con trỏ mới, synchronize_rcu chờ mọi reader đã bắt đầu trước thời điểm đó kết thúc rồi mới giải phóng bản cũ; reader bắt đầu sau chỉ thấy bản mới nên không cần chờ</title>
  <rect width="880" height="330" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a78b5"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#e2e2e2" stroke-width="2"/></pattern></defs>
  <rect x="330" y="30" width="310" height="235" fill="#fff4e5" stroke="none"/>
  <text x="485.0" y="24" text-anchor="middle" fill="#d35400" font-size="12" font-weight="bold">grace period</text>
  <line x1="330" y1="30" x2="330" y2="268" stroke="#d35400" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="640" y1="30" x2="640" y2="268" stroke="#d35400" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="20" y="80" text-anchor="start" fill="#1f2d3d" font-size="12" font-weight="bold">Reader 1</text>
  <line x1="110" y1="74" x2="860" y2="74" stroke="#e0e0e0" stroke-width="1"/>
  <text x="20" y="130" text-anchor="start" fill="#1f2d3d" font-size="12" font-weight="bold">Reader 2</text>
  <line x1="110" y1="124" x2="860" y2="124" stroke="#e0e0e0" stroke-width="1"/>
  <text x="20" y="180" text-anchor="start" fill="#1f2d3d" font-size="12" font-weight="bold">Reader 3</text>
  <line x1="110" y1="174" x2="860" y2="174" stroke="#e0e0e0" stroke-width="1"/>
  <text x="20" y="245" text-anchor="start" fill="#1f2d3d" font-size="12" font-weight="bold">Writer</text>
  <line x1="110" y1="239" x2="860" y2="239" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="140" y="60" width="280" height="28" rx="5" fill="#fde7d3" stroke="#d35400" stroke-width="1.2"/>
  <text x="280.0" y="78" text-anchor="middle" fill="#d35400" font-size="11">đọc bản cũ</text>
  <rect x="250" y="110" width="390" height="28" rx="5" fill="#fde7d3" stroke="#d35400" stroke-width="1.2"/>
  <text x="445.0" y="128" text-anchor="middle" fill="#d35400" font-size="11">đọc bản cũ</text>
  <rect x="450" y="160" width="140" height="28" rx="5" fill="#eef4fb" stroke="#4a78b5" stroke-width="1.2"/>
  <text x="520.0" y="178" text-anchor="middle" fill="#4a78b5" font-size="11">đọc bản mới</text>
  <text x="140" y="55" text-anchor="start" fill="#555" font-size="10.5" font-family="Menlo, Consolas, monospace">rcu_read_lock()</text>
  <text x="640" y="105" text-anchor="end" fill="#555" font-size="10.5" font-family="Menlo, Consolas, monospace">rcu_read_unlock()</text>
  <rect x="150" y="225" width="175" height="28" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="237" y="243" text-anchor="middle" fill="#2e7d32" font-size="11">tạo bản mới, sửa</text>
  <line x1="330" y1="215" x2="330" y2="262" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="336" y="290" text-anchor="start" fill="#2e7d32" font-size="11" font-family="Menlo, Consolas, monospace">rcu_assign_pointer()</text>
  <rect x="334" y="225" width="302" height="28" rx="5" fill="url(#hatch)" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="485.0" y="243" text-anchor="middle" fill="#1f2d3d" font-size="11.5">synchronize_rcu(): chờ</text>
  <rect x="644" y="225" width="120" height="28" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="704" y="243" text-anchor="middle" fill="#c0392b" font-size="11" font-family="Menlo, Consolas, monospace">kfree(bản cũ)</text>
  <line x1="110" y1="300" x2="860" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="860" y="318" text-anchor="end" fill="#555" font-size="11">thời gian</text>
  <text x="650" y="176" text-anchor="start" fill="#4a78b5" font-size="11">bắt đầu sau khi công bố: không cần chờ</text>
<text id="wm" x="869.81" y="347.83" text-anchor="end" font-size="12.74" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
