<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 422" role="img" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect x="0" y="0" width="760" height="400" rx="8" fill="#ffffff"/>
<title>After fork the parent and child task_struct point to separate copies of mm_struct, files_struct and sighand_struct; after pthread_create both task_structs point to the same shared structures.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker></defs>
<text x="190" y="30" text-anchor="middle" font-weight="bold" fill="#1f2d3d" font-size="15">fork(): new process</text>
<rect x="30" y="50" width="140" height="52" rx="5" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="100.0" y="76.0" text-anchor="middle" fill="#1f2d3d" font-size="14" font-weight="bold">task_struct</text>
<text x="100.0" y="94.0" text-anchor="middle" fill="#2c3a42" font-size="13">parent (PID 100)</text>
<rect x="210" y="50" width="140" height="52" rx="5" fill="#e8eef8" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="280.0" y="76.0" text-anchor="middle" fill="#1f2d3d" font-size="14" font-weight="bold">task_struct</text>
<text x="280.0" y="94.0" text-anchor="middle" fill="#2c3a42" font-size="13">child (PID 101)</text>
<rect x="60" y="150" width="125" height="40" rx="5" fill="#ffffff" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="122.5" y="175.0" text-anchor="middle" fill="#1f2d3d" font-size="14">mm_struct</text>
<polyline points="42,102 42,170 58,170" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="60" y="212" width="125" height="40" rx="5" fill="#ffffff" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="122.5" y="237.0" text-anchor="middle" fill="#1f2d3d" font-size="14">files_struct</text>
<polyline points="42,102 42,232 58,232" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="60" y="274" width="125" height="40" rx="5" fill="#ffffff" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="122.5" y="299.0" text-anchor="middle" fill="#1f2d3d" font-size="14">sighand_struct</text>
<polyline points="42,102 42,294 58,294" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="240" y="150" width="125" height="40" rx="5" fill="#ffffff" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="302.5" y="175.0" text-anchor="middle" fill="#1f2d3d" font-size="14">mm_struct</text>
<polyline points="222,102 222,170 238,170" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="240" y="212" width="125" height="40" rx="5" fill="#ffffff" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="302.5" y="237.0" text-anchor="middle" fill="#1f2d3d" font-size="14">files_struct</text>
<polyline points="222,102 222,232 238,232" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="240" y="274" width="125" height="40" rx="5" fill="#ffffff" stroke="#2f5d9e" stroke-width="1.4"/>
<text x="302.5" y="299.0" text-anchor="middle" fill="#1f2d3d" font-size="14">sighand_struct</text>
<polyline points="222,102 222,294 238,294" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#a)"/>
<text x="190" y="355" text-anchor="middle" fill="#2c3a42" font-size="13">each task gets its own copy;</text>
<text x="190" y="373" text-anchor="middle" fill="#2c3a42" font-size="13">memory pages shared copy-on-write</text>
<line x1="380" y1="45" x2="380" y2="380" stroke="#90a4ae" stroke-width="1" stroke-dasharray="5 4"/>
<text x="570" y="30" text-anchor="middle" font-weight="bold" fill="#1f2d3d" font-size="15">pthread_create(): new thread</text>
<rect x="410" y="50" width="140" height="52" rx="5" fill="#e9f5ee" stroke="#2e7d4f" stroke-width="1.4"/>
<text x="480.0" y="76.0" text-anchor="middle" fill="#1f2d3d" font-size="14" font-weight="bold">task_struct</text>
<text x="480.0" y="94.0" text-anchor="middle" fill="#2c3a42" font-size="13">thread 1 (TID 200)</text>
<rect x="590" y="50" width="140" height="52" rx="5" fill="#e9f5ee" stroke="#2e7d4f" stroke-width="1.4"/>
<text x="660.0" y="76.0" text-anchor="middle" fill="#1f2d3d" font-size="14" font-weight="bold">task_struct</text>
<text x="660.0" y="94.0" text-anchor="middle" fill="#2c3a42" font-size="13">thread 2 (TID 201)</text>
<rect x="500" y="150" width="140" height="40" rx="5" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.4"/>
<text x="570.0" y="175.0" text-anchor="middle" fill="#1f2d3d" font-size="14">mm_struct</text>
<rect x="500" y="212" width="140" height="40" rx="5" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.4"/>
<text x="570.0" y="237.0" text-anchor="middle" fill="#1f2d3d" font-size="14">files_struct</text>
<rect x="500" y="274" width="140" height="40" rx="5" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.4"/>
<text x="570.0" y="299.0" text-anchor="middle" fill="#1f2d3d" font-size="14">sighand_struct</text>
<polyline points="430,102 430,170 498,170" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="710,102 710,170 642,170" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="430,102 430,232 498,232" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="710,102 710,232 642,232" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="430,102 430,294 498,294" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="710,102 710,294 642,294" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#a)"/>
<text x="570" y="355" text-anchor="middle" fill="#2c3a42" font-size="13">both tasks point to the same structures;</text>
<text x="570" y="373" text-anchor="middle" fill="#2c3a42" font-size="13">same TGID 200, different TID</text>
<text id="wm" x="751.2" y="415.4" text-anchor="end" font-size="11" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
