<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 860 314.89" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Runtime PM: ở trạng thái ACTIVE, khi usage count về 0 và hết thời gian autosuspend, kernel gọi runtime_suspend và chuyển qua SUSPENDING sang SUSPENDED; khi driver gọi pm_runtime_resume_and_get, kernel gọi runtime_resume qua RESUMING trở lại ACTIVE</title>
  <rect width="860" height="290" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect x="60" y="110" width="160" height="64" rx="5" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="140.0" y="137.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">ACTIVE</text>
  <text x="140.0" y="154.5" text-anchor="middle" fill="#555" font-size="11.5">usage count > 0</text>
  <rect x="360" y="30" width="140" height="64" rx="5" fill="#fffbe6" stroke="#b59a2a" stroke-width="1.2"/>
  <text x="430.0" y="57.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">SUSPENDING</text>
  <text x="430.0" y="74.5" text-anchor="middle" fill="#555" font-size="11.5">runtime_suspend()</text>
  <rect x="660" y="110" width="160" height="64" rx="5" fill="#f7f7f7" stroke="#555" stroke-width="1.2"/>
  <text x="740.0" y="137.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">SUSPENDED</text>
  <text x="740.0" y="154.5" text-anchor="middle" fill="#555" font-size="11.5">tắt clock, nguồn</text>
  <rect x="360" y="190" width="140" height="64" rx="5" fill="#fffbe6" stroke="#b59a2a" stroke-width="1.2"/>
  <text x="430.0" y="217.5" text-anchor="middle" fill="#1f2d3d" font-weight="bold">RESUMING</text>
  <text x="430.0" y="234.5" text-anchor="middle" fill="#555" font-size="11.5">runtime_resume()</text>
  <path d="M220,124 C280,70 300,62 358,62" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="200" y="40" text-anchor="start" fill="#555" font-size="10.5">usage count = 0,</text>
  <text x="200" y="54" text-anchor="start" fill="#555" font-size="10.5">hết autosuspend delay</text>
  <path d="M500,62 C580,62 610,80 668,110" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M700,174 C640,222 560,222 502,222" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="610" y="240" text-anchor="middle" fill="#555" font-size="10.5">pm_runtime_resume_and_get()</text>
  <path d="M360,222 C280,222 230,200 180,176" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="430" y="280" text-anchor="middle" fill="#1f2d3d" font-size="11">Thiết bị cha chỉ suspend khi mọi thiết bị con đã suspend; thiết bị con resume thì thiết bị cha resume trước</text>
<text id="wm" x="850.04" y="307.43" text-anchor="end" font-size="12.45" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
