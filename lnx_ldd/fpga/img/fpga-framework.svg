<svg role="img" viewBox="0 0 860 354.89" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Ba thành phần của framework FPGA trong kernel: FPGA Region gom FPGA Manager và các FPGA Bridge, được điều khiển khi áp device tree overlay; FPGA Manager nạp bitstream vào FPGA, FPGA Bridge chặn hoặc mở bus giữa CPU và FPGA</title>
  <rect x="0" y="0" width="860" height="330" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect x="24" y="20" width="812" height="62" rx="8" fill="#f1eafb" stroke="#6a3fb0" stroke-width="1.5"/>
  <text x="430.0" y="47.5" font-size="12" font-weight="700" text-anchor="middle" fill="#44287a">Device tree overlay</text>
  <text x="430.0" y="63.5" font-size="11" text-anchor="middle" fill="#222">áp device tree overlay có firmware-name vào node fpga-region (of-fpga-region.c)</text>
  <rect x="24" y="110" width="520" height="190" rx="10" fill="#eaf1fb" fill-opacity="0.45" stroke="#2f5d9e" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="34" y="126" font-size="11" font-weight="700" fill="#1d4278">FPGA Region</text>
  <rect x="44" y="142" width="230" height="100" rx="8" fill="#fdf0e2" stroke="#c46a12" stroke-width="1.5"/>
  <text x="159.0" y="172.5" font-size="12" font-weight="700" text-anchor="middle" fill="#7a3f06">FPGA Manager</text>
  <text x="159.0" y="188.5" font-size="11" text-anchor="middle" fill="#222">nạp bitstream vào FPGA</text>
  <text x="159.0" y="204.5" font-size="11" text-anchor="middle" fill="#222">driver cấp thấp biết cách</text>
  <text x="159.0" y="220.5" font-size="11" text-anchor="middle" fill="#222">lập trình từng loại chip</text>
  <rect x="294" y="142" width="230" height="100" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="409.0" y="172.5" font-size="12" font-weight="700" text-anchor="middle" fill="#1b5e20">FPGA Bridge</text>
  <text x="409.0" y="188.5" font-size="11" text-anchor="middle" fill="#222">chặn hoặc mở bus giữa</text>
  <text x="409.0" y="204.5" font-size="11" text-anchor="middle" fill="#222">CPU và FPGA, phần cứng</text>
  <text x="409.0" y="220.5" font-size="11" text-anchor="middle" fill="#222">hoặc 'freeze' trong fabric</text>
  <text x="284" y="276" font-size="10" font-weight="400" text-anchor="middle" fill="#555" font-style="italic">với PR: mỗi vùng PR có một FPGA Region</text>
  <rect x="590" y="142" width="246" height="100" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="713.0" y="172.5" font-size="12" font-weight="700" text-anchor="middle" fill="#333333">Thiết bị con</text>
  <text x="713.0" y="188.5" font-size="11" text-anchor="middle" fill="#222">sau khi nạp xong: child node</text>
  <text x="713.0" y="204.5" font-size="11" text-anchor="middle" fill="#222">của overlay được thêm vào,</text>
  <text x="713.0" y="220.5" font-size="11" text-anchor="middle" fill="#222">driver của IP được probe</text>
  <line x1="284" y1="82" x2="284" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="296" y="100" font-size="10" text-anchor="start" fill="#444">áp overlay</text>
  <line x1="544" y1="192" x2="590" y2="192" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text id="wm" x="850.04" y="347.43" text-anchor="end" font-size="12.45" font-family="DejaVu Sans, sans-serif" style="fill:#888;fill-opacity:0.55">note.vutang.dev</text>
</svg>
