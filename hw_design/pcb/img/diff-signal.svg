<svg role="img" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Tín hiệu vi sai: nhiễu đồng pha xuất hiện như nhau trên dây P và dây N, bị triệt tiêu khi bộ thu lấy hiệu V_P trừ V_N</title>
  <rect x="0" y="0" width="760" height="300" rx="8" fill="#ffffff"/>
  <g stroke="#d6d6d6" stroke-width="1" stroke-dasharray="3 4">
    <line x1="236" y1="20" x2="236" y2="262"/>
    <line x1="428" y1="20" x2="428" y2="262"/>
    <line x1="524" y1="20" x2="524" y2="262"/>
    <line x1="620" y1="20" x2="620" y2="262"/>
  </g>
  <text x="24" y="60" font-size="13" font-weight="700" fill="#2f5d9e">V_P</text>
  <polyline fill="none" stroke="#2f5d9e" stroke-width="2.2" points="140,70 236,70 236,40 300,40 310,28 320,46 330,34 340,40 428,40 428,70 524,70 524,40 620,40 620,70 716,70"/>
  <text x="24" y="140" font-size="13" font-weight="700" fill="#b5483a">V_N</text>
  <polyline fill="none" stroke="#b5483a" stroke-width="2.2" points="140,120 236,120 236,150 300,150 310,138 320,156 330,144 340,150 428,150 428,120 524,120 524,150 620,150 620,120 716,120"/>
  <ellipse cx="320" cy="95" rx="38" ry="78" fill="none" stroke="#b9770e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="366" y="92" font-size="11" fill="#8a5a0a">nhiễu đồng pha (common-mode):</text>
  <text x="366" y="106" font-size="11" fill="#8a5a0a">cùng biên độ, cùng chiều trên P và N</text>
  <line x1="40" y1="182" x2="720" y2="182" stroke="#999" stroke-width="1"/>
  <text x="24" y="226" font-size="13" font-weight="700" fill="#2e7d4f">V_P − V_N</text>
  <polyline fill="none" stroke="#2e7d4f" stroke-width="2.2" points="140,250 236,250 236,210 428,210 428,250 524,250 524,210 620,210 620,250 716,250"/>
  <text x="250" y="200" font-size="11" fill="#2e7d4f">bộ thu lấy hiệu: nhiễu đồng pha bị triệt tiêu</text>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="188" y="282">0</text>
    <text x="284" y="282">1</text>
    <text x="380" y="282">1</text>
    <text x="476" y="282">0</text>
    <text x="572" y="282">1</text>
    <text x="668" y="282">0</text>
  </g>
  <text x="24" y="282" font-size="11" fill="#777">Bit truyền</text>
</svg>
