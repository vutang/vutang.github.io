<svg role="img" viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Mặt cắt chuyển lớp của một trace trong cặp vi sai: via tín hiệu đi từ L1 xuống L3, phần via thừa bên dưới là stub; via đất đặt cạnh via tín hiệu để dòng hồi về chuyển giữa các mặt phẳng đất</title>
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b9770e"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="310" rx="8" fill="#ffffff"/>

  <!-- board body -->
  <rect x="60" y="60" width="560" height="190" fill="#f3efe2" stroke="#c9bf9f"/>
  <!-- L2 GND plane with antipad gap around signal via -->
  <rect x="60" y="104" width="232" height="10" fill="#d9a441"/>
  <rect x="348" y="104" width="272" height="10" fill="#d9a441"/>
  <!-- L4 GND plane -->
  <rect x="60" y="196" width="232" height="10" fill="#d9a441"/>
  <rect x="348" y="196" width="272" height="10" fill="#d9a441"/>

  <!-- ground via (beside the signal via, behind the section plane) -->
  <rect x="396" y="60" width="20" height="190" fill="#b9770e" fill-opacity="0.45" stroke="#b9770e" stroke-dasharray="4 3"/>
  <!-- signal traces -->
  <rect x="80" y="52" width="232" height="8" fill="#2f5d9e"/>
  <rect x="308" y="148" width="292" height="8" fill="#2f5d9e"/>
  <!-- signal via -->
  <rect x="308" y="52" width="24" height="198" fill="#2f5d9e" fill-opacity="0.85"/>
  <rect x="308" y="156" width="24" height="94" fill="#b5483a" fill-opacity="0.75"/>

  <!-- layer labels -->
  <g font-size="11" fill="#333">
    <text x="630" y="60">L1: tín hiệu</text>
    <text x="630" y="113">L2: GND</text>
    <text x="630" y="156">L3: tín hiệu</text>
    <text x="630" y="205">L4: GND</text>
  </g>

  <!-- return current path -->
  <polyline fill="none" stroke="#b9770e" stroke-width="2" stroke-dasharray="6 4" points="100,99 380,99 380,190 590,190" marker-end="url(#o)"/>
  <text x="84" y="92" font-size="11" fill="#8a5a0a">dòng hồi về (return current) trên L2</text>
  <text x="430" y="182" font-size="11" fill="#8a5a0a">chuyển sang L4 qua via GND</text>

  <!-- annotations -->
  <line x1="250" y1="228" x2="304" y2="214" stroke="#555" stroke-width="1.2" marker-end="url(#g)"/>
  <text x="246" y="232" font-size="11" text-anchor="end" fill="#b5483a">stub: phần via thừa dưới L3</text>
  <text x="246" y="246" font-size="11" text-anchor="end" fill="#555">(loại bỏ bằng backdrill hoặc via mù)</text>
  <line x1="300" y1="130" x2="300" y2="112" stroke="#555" stroke-width="1" marker-end="url(#g)"/>
  <text x="290" y="140" font-size="10" text-anchor="end" fill="#555">antipad (khoảng hở trên mặt phẳng)</text>
  <line x1="470" y1="268" x2="418" y2="250" stroke="#555" stroke-width="1.2" marker-end="url(#g)"/>
  <text x="476" y="272" font-size="11" fill="#555">via GND đặt sát via tín hiệu</text>
  <text x="476" y="286" font-size="10" fill="#777">(nằm cạnh, lệch khỏi mặt cắt)</text>
  <text x="60" y="302" font-size="10" fill="#777">Hình chỉ vẽ một trace của cặp; trace còn lại chuyển lớp đối xứng ở phía sau mặt cắt.</text>
</svg>
