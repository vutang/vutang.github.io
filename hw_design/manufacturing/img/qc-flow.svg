  <rect x="400" y="176" width="150" height="54" rx="6" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="475.0" y="199" font-size="12" text-anchor="middle" fill="#111" font-weight="700">OQC</text>
  <text x="475.0" y="216" font-size="10.5" text-anchor="middle" fill="#333">kiểm tra lô xuất</text>
  <line x1="550" y1="203.0" x2="589" y2="203.0" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="590" y="176" width="150" height="54" rx="6" fill="#f3f3f3" stroke="#7a7a7a" stroke-width="1.5"/>
  <text x="665.0" y="207" font-size="12" text-anchor="middle" fill="#111">Khách hàng</text>
  <path d="M 740 67.0 L 754 67.0 L 754 142 L 95.0 142 L 95.0 175" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
