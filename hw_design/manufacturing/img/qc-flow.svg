<svg role="img" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <title>Các điểm kiểm soát chất lượng trên dòng sản xuất: IQC khi nhận vật tư từ nhà cung cấp, IPQC tại các công đoạn sản xuất, FQC với thành phẩm, OQC với lô hàng trước khi giao cho khách hàng; hàng không đạt ở mỗi điểm được cách ly và chuyển MRB xử lý</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
