  <text x="95.0" y="216" font-size="10.5" text-anchor="middle" fill="#333">kiểm tra thành phẩm</text>
  <line x1="170" y1="203.0" x2="209" y2="203.0" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="210" y="176" width="150" height="54" rx="6" fill="#f3f3f3" stroke="#7a7a7a" stroke-width="1.5"/>
  <text x="285.0" y="207" font-size="12" text-anchor="middle" fill="#111">Kho thành phẩm</text>
