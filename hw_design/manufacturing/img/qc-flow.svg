  <rect x="0" y="0" width="760" height="330" rx="8" fill="#ffffff"/>
  <rect x="20" y="40" width="150" height="54" rx="6" fill="#f3f3f3" stroke="#7a7a7a" stroke-width="1.5"/>
  <text x="95.0" y="71" font-size="12" text-anchor="middle" fill="#111">Nhà cung cấp</text>
  <line x1="170" y1="67.0" x2="209" y2="67.0" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="210" y="40" width="150" height="54" rx="6" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="285.0" y="63" font-size="12" text-anchor="middle" fill="#111" font-weight="700">IQC</text>
  <text x="285.0" y="80" font-size="10.5" text-anchor="middle" fill="#333">kiểm tra vật tư</text>
  <line x1="360" y1="67.0" x2="399" y2="67.0" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="400" y="40" width="150" height="54" rx="6" fill="#f3f3f3" stroke="#7a7a7a" stroke-width="1.5"/>
  <text x="475.0" y="71" font-size="12" text-anchor="middle" fill="#111">Kho vật tư</text>
  <line x1="550" y1="67.0" x2="589" y2="67.0" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="590" y="40" width="150" height="54" rx="6" fill="#eaf1fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="665.0" y="63" font-size="12" text-anchor="middle" fill="#111" font-weight="700">Sản xuất</text>
